    const val = ans || "";
    let cls = "spr-input";
    if (corrected && hasAnswer(q)) cls += isCorrect(q, val) ? " correct" : " wrong";
    body = `<input class="${cls}" id="sprInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
              maxlength="${val.startsWith("-") ? 6 : 5}" value="${esc(val)}" ${locked ? "disabled" : ""} aria-label="Your answer">
            <div class="preview" id="sprPreview"></div>`;
  }

  // hints
  let hintHtml = "";
  if (hintOpen) {
    hintHtml = `<div class="hint-box">`;
    if (hintLevel === 0) hintHtml += `<div class="hint" style="color:var(--muted)">Hints are revealed one at a time.</div>`;
    for (let i = 0; i < hintLevel; i++) hintHtml += `<div class="hint"><b>Hint ${i + 1}:</b> ${q.hints[i]}</div>`;
    if (hintLevel < q.hints.length) hintHtml += `<button class="small-btn" id="nextHintBtn">${hintLevel === 0 ? "Reveal Hint 1" : "Reveal Hint 2"}</button>`;
    else hintHtml += `<div style="font-size:13px;color:var(--muted)">All hints revealed.</div>`;
    hintHtml += `</div>`;
  }

  // review (after correction)
  let reviewHtml = "";
  if (corrected) {
    const st = statusOf(q);
    reviewHtml = `<div class="review-box"><span class="status-badge ${st}">${st === "correct" ? "✓ Correct" : st === "wrong" ? "✗ Incorrect" : "Not answered"}</span>`;
    if (q.type === "spr") {
      reviewHtml += `<div>Your answer: ${hasAnswer(q) ? `<span class="${st === "correct" ? "ans-g" : "ans-r"}">${esc(ans)}</span>` : "<i>none</i>"}
        &nbsp;|&nbsp; Accepted answer(s): <span class="ans-g">${esc(q.acceptedAnswers.join(", "))}</span></div>`;
    } else if (st === "unanswered") {
      reviewHtml += `<div>Correct answer: <span class="ans-g">${q.correctAnswer}</span></div>`;
    }
    reviewHtml += `<div style="margin-top:8px"><b>Step-by-step solution:</b> ${q.solution}</div>
      <div style="margin-top:6px;font-size:13px;color:var(--muted)">${esc(q.domain)} · ${esc(q.skill)} · Time: ${fmt(qElapsed(q.id))} · Hints used: ${hintLevel}${hasAnswer(q) && state.lateAnswers[q.id] ? " · ⏰ Answered after time" : ""}</div></div>`;
  }

  area.innerHTML = (corrected ? reviewNavHtml(q) : "") + `
    <div class="q-wrap ${q.type === "spr" || q.passage ? "spr" : ""}">
      ${q.passage ? `<aside class="spr-dir passage">${q.passage}</aside>` : q.type === "spr" ? sprDirections() : ""}
      <section class="q-main">
        <div class="q-head">
          <span class="q-num">${q.number}</span>
          <button class="flag-btn ${state.marked[q.id] ? "on" : ""}" id="flagBtn">${flagSvg(!!state.marked[q.id])} Mark for Review</button>
          <span class="late-badge" id="lateBadge" title="This answer was given after the module time ran out" ${hasAnswer(q) && state.lateAnswers[q.id] ? "" : "hidden"}>⏰ Answered after time</span>
          <span class="spacer"></span>
          ${q.type === "mcq" && !locked ? `<button class="abc-btn ${elimOn ? "on" : ""}" id="abcBtn" title="Cross out answer choices">ABC</button>` : ""}
        </div>
        <div class="q-text">${q.question}</div>
        ${body}
        ${hintHtml}
        ${reviewHtml}
      </section>
    </div>`;

  if (q.type === "spr") updatePreview();
  typeset(area);
  bindQuestionEvents(q);
  if (corrected) bindReviewNav();
}

/* ---------- Review navigation (after correction) ---------- */
const ORDER = () => [...byModule(1), ...byModule(2)];
function reviewNavHtml(q) {
  const cls = { correct: "c", wrong: "w", unanswered: "u" };
  const row = (m) => `<div class="rv-row"><span class="rv-m">M${m}</span>${byModule(m).map(x => {
    const st = statusOf(x), late = hasAnswer(x) && state.lateAnswers[x.id];
    return `<button class="rv-chip ${cls[st]} ${x.id === q.id ? "cur" : ""} ${late ? "late" : ""}" data-rv="${x.id}"
      title="Module ${m} Q${x.number}: ${statusLabel(st)}${late ? " (answered after time)" : ""}">${x.number}</button>`;
  }).join("")}</div>`;
  const st = statusOf(q);
  const mistakes = ORDER().filter(x => statusOf(x) !== "correct").length;
  return `<div class="review-nav" id="reviewNav">${row(1)}${row(2)}
    <div class="rv-actions">
      <button class="small-btn" id="prevMistake" ${mistakes ? "" : "disabled"}>← Previous mistake</button>
      <span class="res-${st}">Module ${q.module} · Q${q.number} · ${statusLabel(st)}</span>
      <button class="small-btn" id="nextMistake" ${mistakes ? "" : "disabled"}>Next mistake →</button>
      <label><input type="checkbox" id="onlyMistakes" ${state.reviewOnlyMistakes ? "checked" : ""}> Back / Next skip correct answers</label>
    </div>
    <div class="rv-tip">Click any number to jump to it · use the ← → arrow keys to move · a yellow dot means answered after time</div>
  </div>`;
}
function stepTo(dir, onlyMistakes) {
  const list = ORDER(), cur = currentQ();
  let i = list.findIndex(x => x.id === cur.id);
  while (true) {
    i += dir;
    if (i < 0 || i >= list.length) break;
    if (!onlyMistakes || statusOf(list[i]) !== "correct") { goTo(list[i].module, list[i].number - 1); return true; }
  }
  toast(onlyMistakes ? (dir > 0 ? "No more mistakes after this question." : "No mistakes before this question.")
                     : (dir > 0 ? "This is the last question." : "This is the first question."), 2500);
  return false;
}
function bindReviewNav() {
  document.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { const x = findQ(b.dataset.rv); goTo(x.module, x.number - 1); });
  const p = $("prevMistake"), n = $("nextMistake"), o = $("onlyMistakes");
  if (p) p.onclick = () => stepTo(-1, true);
  if (n) n.onclick = () => stepTo(1, true);
  if (o) o.onchange = () => { state.reviewOnlyMistakes = o.checked; saveState(); };
}

function updatePreview() {
  const inp = $("sprInput"), pv = $("sprPreview");
  if (!inp || !pv) return;
  const v = inp.value.trim();
  if (!v) { pv.innerHTML = ""; return; }
  let tex = v.replace(/-/g, "-");
  const m = v.match(/^(-?)(.+)\/(.+)$/);
  if (m) tex = `${m[1]}\\dfrac{${m[2]}}{${m[3]}}`;
  let html = esc(v);
  if (window.katex) { try { html = katex.renderToString(tex, { throwOnError: false }); } catch (e) {} }
  const valid = !isNaN(parseNum(v));
  pv.innerHTML = `<b>Answer Preview:</b><span class="pv">${html}</span>${valid ? "" : ` <span style="color:var(--red);font-size:13px;margin-left:8px">Not a valid number yet</span>`}`;
}

function renderResults() {
  const box = $("results");
  if (!state.corrected) { box.innerHTML = ""; return; }
  const s = buildStats();
  const pct = Math.round(s.total / s.count * 100);
  const rowsHtml = s.rows.map(r => `<tr class="clickable" data-goto="${r.q.id}">
      <td>M${r.q.module} Q${r.q.number}</td><td>${esc(r.q.domain)}</td><td>${r.q.type.toUpperCase()}</td>
      <td class="res-${r.status}">${statusLabel(r.status)}</td><td>${esc(r.answer)}</td><td>${esc(correctDisplay(r.q))}</td>
      <td>${fmt(r.time)}</td><td>${r.hints}</td><td>${r.late ? "⏰ After time" : (r.status === "unanswered" ? "—" : "On time")}</td></tr>`).join("");
  box.innerHTML = `<div class="results">
    <div class="results-head"><h2>Your Results</h2><span class="big-score">${s.total} / ${s.count}</span>
      <span style="color:var(--muted)">(${pct}%)</span><span class="spacer"></span>
      <button class="small-btn" id="toggleResults">${state.resultsOpen ? "Hide details" : "Show details"}</button></div>
    ${state.resultsOpen ? `
    <div class="stat-grid">
      ${s.perModule.map(pm => `<div class="stat"><div class="k">Module ${pm.m}</div><div class="v">${pm.correct} / ${pm.total}</div><div style="font-size:12px;color:var(--muted)">Module time used: ${fmt(pm.time)}</div></div>`).join("")}
      <div class="stat"><div class="k">Score within time</div><div class="v">${s.onTime} / ${s.count}</div><div style="font-size:12px;color:var(--muted)">Answered after time: ${s.lateCount}</div></div>
      <div class="stat"><div class="k">Time on questions</div><div class="v">${fmt(s.totalTime)}</div></div>
      <div class="stat"><div class="k">Hints used</div><div class="v">${s.hintsUsed}</div><div style="font-size:12px;color:var(--muted)">Correct without hints: ${s.correctNoHint}</div></div>
    </div>
    <div class="table-scroll"><table class="rtable"><thead><tr><th>Domain</th><th>Correct</th><th>%</th><th>Avg time / question</th><th>Hints</th></tr></thead><tbody>
      ${s.perDomain.map(d => `<tr><td>${esc(d.d)}</td><td>${d.correct} / ${d.total}</td><td>${d.pct}%</td><td>${fmt(d.avg)}</td><td>${d.hints}</td></tr>`).join("")}
    </tbody></table></div>
    <details><summary>Per-question breakdown (click a row to open that question)</summary>
      <div class="table-scroll"><table class="rtable"><thead><tr><th>Q</th><th>Domain</th><th>Type</th><th>Result</th><th>Your answer</th><th>Correct</th><th>Time</th><th>Hints</th><th>Timing</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div></details>` : ""}
  </div>`;
  const tg = $("toggleResults");
  if (tg) tg.onclick = () => { state.resultsOpen = !state.resultsOpen; saveState(); renderResults(); };
  box.querySelectorAll("[data-goto]").forEach(tr => tr.onclick = () => {
    const q = findQ(tr.dataset.goto); goTo(q.module, q.number - 1);
  });
}

/* =========================================================
   8. QUESTION EVENTS
   ========================================================= */
function bindQuestionEvents(q) {
  $("flagBtn").onclick = () => { state.marked[q.id] = !state.marked[q.id]; saveState(); renderQuestion(); };
  if ($("hintBtn")) $("hintBtn").onclick = () => {
    state.hintOpen[q.id] = !state.hintOpen[q.id];
    if (state.hintOpen[q.id] && !state.hintLevel[q.id]) state.hintLevel[q.id] = 1; // first open reveals Hint 1
    saveState(); renderQuestion();
  };
  const nh = $("nextHintBtn");
  if (nh) nh.onclick = () => { state.hintLevel[q.id] = Math.min(2, (state.hintLevel[q.id] || 0) + 1); saveState(); renderQuestion(); };

  const abc = $("abcBtn");
  if (abc) abc.onclick = () => { state.eliminatorOn[q.id] = !state.eliminatorOn[q.id]; saveState(); renderQuestion(); };

  if ($("timerBtn")) $("timerBtn").onclick = () => {
    if (isLocked()) return;
    if (qt(q.id).start) stopQ(q.id); else startQ(q.id);
    saveState(); renderQuestion();
  };

  document.querySelectorAll("[data-choice]").forEach(btn => btn.onclick = () => {
    if (isLocked()) return;
    const L = btn.dataset.choice;
    if ((state.eliminated[q.id] || []).includes(L)) return;
    state.answers[q.id] = L;
    markTiming(q);               // flag answers given after the module time ran out
    stopQ(q.id);                 // answering stops the stopwatch
    saveState(); renderQuestion();
  });
  document.querySelectorAll("[data-elim]").forEach(btn => btn.onclick = () => {
    const L = btn.dataset.elim;
    const arr = state.eliminated[q.id] || (state.eliminated[q.id] = []);
    if (!arr.includes(L)) arr.push(L);
    if (state.answers[q.id] === L) { delete state.answers[q.id]; markTiming(q); } // crossing out the selected choice clears it
    saveState(); renderQuestion();
  });
  document.querySelectorAll("[data-undo]").forEach(btn => btn.onclick = () => {
    state.eliminated[q.id] = (state.eliminated[q.id] || []).filter(x => x !== btn.dataset.undo);
    saveState(); renderQuestion();
  });

  const inp = $("sprInput");
  if (inp) {
    inp.oninput = () => {
      let v = inp.value.replace(/[^0-9.\/-]/g, "");
      v = v.replace(/(?!^)-/g, "");                 // minus only at the start
      const parts = v.split("/"); if (parts.length > 2) v = parts[0] + "/" + parts.slice(1).join("");
      const max = v.startsWith("-") ? 6 : 5;
      v = v.slice(0, max);
      inp.maxLength = max;
      if (inp.value !== v) inp.value = v;
      state.answers[q.id] = v;
      markTiming(q);
      const lb = $("lateBadge"); if (lb) lb.hidden = !(hasAnswer(q) && state.lateAnswers[q.id]);
      if (v.length) stopQ(q.id);                    // typing an answer stops the stopwatch
      saveState(); updatePreview(); refreshTimerUi(q);
    };
  }
}
function timerClass(q) {
  const running = !!qt(q.id).start;
  return running ? "running" : (qElapsed(q.id) === 0 && !isLocked() && !state.frozen && !hasAnswer(q) ? "idle" : "");
}
function timerInner(q) {
  const running = !!qt(q.id).start, el = qElapsed(q.id);
  const icon = running ? '<span class="qt-dot"></span>' : "⏱";
  const label = running ? "Stop" : (el > 0 ? "Resume" : "Start timer");
  return `${icon}<span>${label}</span>${running ? "" : "<kbd>T</kbd>"}<span class="qt-clock" id="qClock">${fmt(el)}</span>`;
}
function refreshTimerUi(q) {
  const b = $("timerBtn"); if (!b) return;
  b.className = "qtimer " + timerClass(q);
  b.innerHTML = timerInner(q);
}

/* =========================================================
   9. NAVIGATION
   ========================================================= */
function goTo(m, idx) {
  if (m !== state.stage) return;             // a finished module can't be reopened
  const n = byModule(m).length;
  idx = Math.max(0, Math.min(n - 1, idx));
  stopAllQ();                                  // leaving a question pauses its stopwatch
  if (m !== state.currentModule) { pauseModule(state.currentModule); state.currentModule = m; startModule(m); }
  state.currentIndex[m] = idx;
  saveState(); render();
  const main = $("main");
  if (state.corrected) {
    // keep the review bar in view instead of jumping back to the results panel
    const top = $("questionArea").getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - 8;
    main.scrollTop = Math.max(0, top);
  } else main.scrollTop = 0;
}
function next() {
  if (state.corrected) { stepTo(1, state.reviewOnlyMistakes); return; }
  const m = state.currentModule, i = state.currentIndex[m], n = byModule(m).length;
  if (i < n - 1) goTo(m, i + 1);
  else openNavigator();                       // end of module: review page, like Bluebook
}
function back() {
  if (state.corrected) { stepTo(-1, state.reviewOnlyMistakes); return; }
  const m = state.currentModule, i = state.currentIndex[m];
  if (i > 0) goTo(m, i - 1);

}

function openModal(html, wide = false, dismissable = true) {

  typeset($("modal"));
}
function closeModal() { $("overlay").classList.remove("open", "lock"); $("modal").innerHTML = ""; }

/* ---------- Password gate (only a SHA-256 hash is stored) ---------- */
const PASSWORD_HASH = "806d3d5697b651f31bc592e5fa0fffb8e936cbc99f13242025e383bdc0474519";
function sha256Hex(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const mp = Math.pow, maxWord = mp(2, 32); let result = "", i, j;
  const words = [], bitLen = ascii.length * 8, k = [], isComposite = {};
  let hash = [], primeCounter = 0;
  for (let c = 2; primeCounter < 64; c++) {
    if (!isComposite[c]) { for (i = 0; i < 313; i += c) isComposite[i] = c; hash[primeCounter] = (mp(c, .5) * maxWord) | 0; k[primeCounter++] = (mp(c, 1 / 3) * maxWord) | 0; }
  }
  hash = hash.slice(0, 8);
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return ""; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = (bitLen / maxWord) | 0; words[words.length] = bitLen;
  for (j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += (b < 16 ? "0" : "") + b.toString(16); }
  return result;
}
function openPasswordModal() {
  openModal(head("🔒 Password required", false) + `<div class="modal-body">
    <p>This test is protected. Enter the password your teacher gave you to begin.</p>
    <input class="name-input" id="pwInput" type="password" placeholder="Password" autocomplete="off" spellcheck="false">
    <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)"><input type="checkbox" id="pwShow"> Show password</label>

  $("overlay").classList.add("lock");

}

function openNavigator() {
  const m = state.currentModule;
  const cells = byModule(m).map((q, i) => {
    let cls = "nav-cell";
    if (state.corrected) cls += " " + ({ correct: "c", wrong: "w", unanswered: "u" }[statusOf(q)]);

  }).join("");

function openReference() {
  const items = [
    ["Circle", String.raw`\(A=\pi r^2\) &nbsp; \(C=2\pi r\)`],
    ["Rectangle", String.raw`\(A=\ell w\)`],
    ["Triangle", String.raw`\(A=\tfrac12 bh\)`],
    ["Pythagorean theorem", String.raw`\(c^2=a^2+b^2\)`],
    ["Special right triangles", String.raw`30°-60°-90°: \(x,\ x\sqrt3,\ 2x\)<br>45°-45°-90°: \(s,\ s,\ s\sqrt2\)`],
    ["Rectangular prism", String.raw`\(V=\ell wh\)`],
    ["Cylinder", String.raw`\(V=\pi r^2h\)`],

    ["Pyramid", String.raw`\(V=\tfrac13\ell wh\)`]
  ];
  openModal(head("Reference Sheet") + `<div class="modal-body"><div class="ref-grid">
    ${items.map(([t, f]) => `<div class="ref-item"><b>${t}</b>${f}</div>`).join("")}</div>
    <ul style="margin-top:14px">
      <li>The number of degrees of arc in a circle is 360.</li>
      <li>The number of radians of arc in a circle is \(2\pi\).</li>
      <li>The sum of the measures in degrees of the angles of a triangle is 180.</li>
    </ul></div>`, true);
}

function openDirections() {
  openModal(head("Directions") + `<div class="modal-body">
    ${isRW(state.currentModule) ? `<p>The questions in this section address a number of important reading and writing skills. Each question includes one or more passages, which may include a table.
    Read each passage and question carefully, and then choose the best answer to the question based on the passage(s).</p>
    <p>All questions in this section are multiple-choice with four answer choices. Each question has a single best answer.</p>` : `<p>The questions in this section address a number of important math skills.</p>
    <p>Use of a calculator is permitted for all questions. A reference sheet is available by selecting <b>Reference</b>.</p>`}
    <p>Unless otherwise indicated: all variables and expressions represent real numbers; figures are drawn to scale; figures lie in a plane;
    and the domain of a given function \(f\) is the set of all real numbers \(x\) for which \(f(x)\) is a real number.</p>
    <p>For <b>multiple-choice questions</b>, choose the single best answer. Use the <b>ABC</b> tool to cross out choices.</p>
    <p>For <b>student-produced response questions</b>, type your answer in the box and check the Answer Preview.</p>
    <p><b>Test-day rules:</b> Reading and Writing modules have 32 minutes each and Math modules have 35 minutes each, with a 10-minute break between the sections. Use <i>Next Module</i> when you finish a module; you can't return to it. When the last module's time runs out, your test is submitted automatically.</p></div>`);
}

function confirmModal(title, text, okLabel, onOk, danger = false) {
  openModal(head(title) + `<div class="modal-body"><p>${text}</p></div>
    <div class="modal-foot"><button class="tool-btn" data-close>Cancel</button>
    <button class="tool-btn ${danger ? "danger" : "primary"}" id="okBtn">${okLabel}</button></div>`);
  $("okBtn").onclick = () => { closeModal(); onOk(); };
}

/* =========================================================
   11. RESET
   ========================================================= */
/* =========================================================
   FREEZE TIME
   ========================================================= */
function toggleFreeze() {
  if (isLocked()) return;
  if (state.frozen) { state.frozen = false; startModule(state.currentModule); toast("Time resumed.", 2500); }
  else { stopAllTimers(); state.frozen = true; toast("Time frozen. The module timer and question stopwatch are paused.", 3500); }
  saveState(); render();
}

/* =========================================================
   TEST-DAY FLOW
   ========================================================= */
function openFinishModule() {
  const m = state.stage, un = byModule(m).filter(q => !hasAnswer(q)).length;
  const nextText = m === 2 ? "Next is a <b>10-minute break</b>, then the Math section."
    : `Module ${MODULE_INFO[m + 1].sub} of ${MODULE_INFO[m + 1].name} and its ${MODULE_INFO[m + 1].min}-minute timer will start right away.`;
  confirmModal("Finish this module",
    (un ? `You have <b>${un} unanswered question${un > 1 ? "s" : ""}</b> in this module. There is no penalty for guessing.<br><br>` : "") +
    `Once you move on, <b>you can't return to this module</b>. ${nextText}`,
    m === 2 ? "Start the break" : "Next module", () => finishModule(false));
}
function finishModule(auto) {
  const m = state.stage;
  if (m >= 4 || isLocked()) return;
  stopAllQ(); pauseModule(m);
  if (m === 2) {                                   // break between the two sections
    state.stage = 3; state.currentModule = 3; state.currentIndex[3] = 0;
    state.onBreak = true; state.breakStart = Date.now();
    saveState(); render(); $("main").scrollTop = 0;
    toast(auto ? "Time is up for Reading and Writing. Your 10-minute break has started." : "Your 10-minute break has started.", 5000);
    return;
  }
  startModuleNow(m + 1, auto ? `Time is up. ${modLabel(m + 1)} has started.` : `${modLabel(m + 1)} has started.`);
}
function startModuleNow(m, msg) {
  state.onBreak = false; state.stage = m; state.currentModule = m; state.currentIndex[m] = 0;
  startModule(m); saveState(); render(); $("main").scrollTop = 0;
  toast(msg + ` You have ${MODULE_INFO[m].min} minutes.`, 5000);
}
function endBreak() { if (state.onBreak) startModuleNow(3, "The Math section has started."); }
function tickBreak() {
  const left = BREAK_MS - (Date.now() - state.breakStart);
  const el = $("moduleTimer"); el.textContent = fmt(Math.max(0, left)); el.classList.remove("low", "over");
  const bt = $("breakClock"); if (bt) bt.textContent = fmt(Math.max(0, left));
  if (left <= 0) endBreak();
}
function breakHtml() {
  return `<div style="max-width:640px;margin:50px auto;text-align:center;padding:0 16px">
    <div style="font-size:15px;font-weight:700;color:var(--sky-deep);letter-spacing:.06em;text-transform:uppercase">Scheduled break</div>
    <div id="breakClock" style="font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0">${fmt(Math.max(0, BREAK_MS - (Date.now() - state.breakStart)))}</div>
    <p style="font-size:16px;color:var(--muted)">You've finished the Reading and Writing section. Stand up, stretch, drink some water.
      The Math section (2 modules, 35 minutes each) starts automatically when the break ends.</p>
    <button class="tool-btn primary" id="resumeBtn" style="font-size:15px;padding:10px 22px">Resume Testing Now →</button>
  </div>`;
}
function submittedHtml() {
  return `<div style="max-width:620px;margin:60px auto;text-align:center;padding:0 16px">
    <div style="font-size:52px;line-height:1">✓</div>
    <h2 style="margin:10px 0 6px">Your test has been submitted</h2>
    <p style="color:var(--muted);font-size:16px">${state.autoSubmitted ? "Time ran out in the last module, so your answers were submitted automatically. " : ""}
      Thank you, ${esc(state.studentName)}. Your teacher will receive your answers and score.</p>
    ${state.emailSent ? `<div class="msg ok" style="display:inline-block">Report sent ✓</div>`
      : `<div class="msg err" style="display:inline-block">The report has not been sent yet.</div>
         <div style="margin-top:12px"><button class="tool-btn primary" id="resendBtn">Send report</button></div>`}
  </div>`;
}

function resetExam() {
  confirmModal("Reset Exam", "Are you sure? All answers and times will be erased.", "Yes, reset everything", () => {
    localStorage.removeItem(STORAGE_KEY);
    state = freshState();
    sending = false;
    saveState(); render(); openPasswordModal();
  }, true);
}

/* =========================================================
   12. CORRECTION
   ========================================================= */
function correctExam() {
  if (state.corrected) { state.resultsOpen = true; saveState(); renderResults(); $("main").scrollTop = 0; return; }
  confirmModal("Correct Exam", "This will calculate your score, show correct answers in green and wrong answers in red, and <b>lock your answers</b>. Continue?", "Correct now", () => {
    stopAllTimers();
    state.corrected = true; state.correctedAt = new Date().toISOString(); state.resultsOpen = true;
    saveState(); render(); $("main").scrollTop = 0;
    const s = buildStats();
    toast("Score: " + s.total + " / " + s.count);
  });
}

/* =========================================================
   13. REPORT + EMAILJS
   ========================================================= */
function buildReport() {
  const s = buildStats();
  const date = new Date().toLocaleString();
  const pct = (x, y) => y ? Math.round(x / y * 100) : 0;
  const used = (m) => fmt(Math.min(moduleElapsed(m), modTime(m))) + " of " + MODULE_INFO[m].min + ":00";
  const right = (q) => q.type === "mcq" ? q.correctAnswer : q.acceptedAnswers.join(" or ");
  const ans = (r) => r.status === "unanswered" ? "(blank)" : r.answer;
  const sec = (rw) => { const rs = s.rows.filter(r => isRW(r.q.module) === rw); return { c: rs.filter(r => r.status === "correct").length, n: rs.length }; };
  const RWs = sec(true), MAs = sec(false);
  const mistakes = s.rows.filter(r => r.status !== "correct");
  const how = state.autoSubmitted ? "automatically (time ran out in the last module)" : "by the student";

  let t = "AMRO ACADEMY – FULL SAT PRACTICE TEST REPORT\n========================================\n";
  t += "Student: " + state.studentName + "\nDate: " + date + "\nSubmitted: " + how + "\n\n";
  t += "Reading and Writing: " + RWs.c + "/" + RWs.n + " (" + pct(RWs.c, RWs.n) + "%)\n";
  t += "Math: " + MAs.c + "/" + MAs.n + " (" + pct(MAs.c, MAs.n) + "%)\n";
  t += "TOTAL: " + s.total + "/" + s.count + " (" + pct(s.total, s.count) + "%)\n\n";
  s.perModule.forEach(pm => { t += modLabel(pm.m) + ": " + pm.correct + "/" + pm.total + " | time used " + used(pm.m) + "\n"; });
  t += "\nSCORE BY DOMAIN\n";
  s.perDomain.forEach(d => { t += "- " + d.d + ": " + d.correct + "/" + d.total + " (" + d.pct + "%)\n"; });
  t += "\nMISTAKES & BLANKS (" + mistakes.length + ")\n";
  if (!mistakes.length) t += "None — perfect score!\n";
  mistakes.forEach(r => { t += "- " + qLabel(r.q) + " | " + r.q.domain + " – " + r.q.skill + " | Student: " + ans(r) + " | Correct: " + right(r.q) + "\n"; });
  t += "\nALL ANSWERS\n";
  s.rows.forEach(r => { t += qLabel(r.q) + " | " + ans(r) + " | correct " + right(r.q) + " | " + statusLabel(r.status) + "\n"; });

  const color = { correct: "#1e8e3e", wrong: "#c5221f", unanswered: "#b06000" };
  const res = (st) => `<font color="${color[st]}"><b>${statusLabel(st)}</b></font>`;
  const tbl = (heads, rows) => `<table border="1" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font:13px Arial;margin:6px 0 16px"><tr bgcolor="#e8f6fc"><th>${heads.join("</th><th>")}</th></tr>${rows.join("")}</table>`;
  const tr = (cells) => `<tr><td>${cells.join("</td><td>")}</td></tr>`;
  let h = `<div style="font:14px Arial"><h2 style="color:#1d6a96">Amro Academy – Full SAT Practice Test Report</h2>`;
  h += `<p><b>Student:</b> ${esc(state.studentName)}<br><b>Date:</b> ${esc(date)}<br><b>Submitted:</b> ${how}</p>`;
  h += tbl(["Section", "Correct", "%"], [tr(["Reading and Writing", RWs.c + "/" + RWs.n, pct(RWs.c, RWs.n) + "%"]), tr(["Math", MAs.c + "/" + MAs.n, pct(MAs.c, MAs.n) + "%"]), tr(["<b>Total</b>", "<b>" + s.total + "/" + s.count + "</b>", "<b>" + pct(s.total, s.count) + "%</b>"])]);
  h += `<h3>By module</h3>` + tbl(["Module", "Correct", "Time used"], s.perModule.map(pm => tr([modLabel(pm.m), pm.correct + "/" + pm.total, used(pm.m)])));
  h += `<h3>By domain</h3>` + tbl(["Domain", "Correct", "%"], s.perDomain.map(d => tr([d.d, d.correct + "/" + d.total, d.pct + "%"])));
  h += `<h3>Mistakes &amp; blanks (${mistakes.length})</h3>` + (mistakes.length ? tbl(["Q", "Domain", "Skill", "Student", "Correct"],
    mistakes.map(r => tr([qLabel(r.q), r.q.domain, esc(r.q.skill), r.status === "unanswered" ? res("unanswered") : `<font color="#c5221f"><b>${esc(r.answer)}</b></font>`, esc(right(r.q))]))) : "<p>None — perfect score!</p>");
  h += `<h3>All answers</h3>` + tbl(["Q", "Student", "Correct", "Result"], s.rows.map(r => tr([qLabel(r.q), esc(ans(r)), esc(right(r.q)), res(r.status)])));
  h += `</div>`;
  return { text: t, html: h, stats: s, date };
}

function openSubmitReview() {
  if (state.emailSent) { toast("This exam has already been submitted."); return; }
  const un = byModule(state.currentModule).filter(q => !hasAnswer(q));
  const mk = byModule(state.currentModule).filter(q => state.marked[q.id]);
  const chips = (list) => list.length
    ? `<div class="list-q">${list.map(q => `<button class="chip" data-go="${q.id}">${qLabel(q)}</button>`).join("")}</div>`
    : `<p style="color:var(--green);font-weight:600">None</p>`;
  openModal(head("Check Your Work") + `<div class="modal-body">
    <p>Once you submit, your answers are locked and sent to your teacher. You won't see your score here.</p>
    <b>Unanswered questions (${un.length})</b>${chips(un)}
    <b>Marked for review (${mk.length})</b>${chips(mk)}
    <div id="sendStatus"></div></div>
    <div class="modal-foot"><button class="tool-btn" data-close>Back to exam</button>
    <button class="tool-btn primary" id="confirmSubmit">Confirm Submit</button></div>`);
  $("modal").querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const q = findQ(b.dataset.go); closeModal(); goTo(q.module, q.number - 1); });
  $("confirmSubmit").onclick = sendReport;
}

async function sendReport() {
  if (sending || state.emailSent) return;            // prevent double sending
  const btn = $("confirmSubmit"), status = $("sendStatus");
  sending = true;
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  if (status) status.innerHTML = `<div class="msg info">Sending your report…</div>`;

  stopAllTimers();
  state.submitted = true; state.submittedAt = state.submittedAt || new Date().toISOString();
  saveState(); render();

  const rep = buildReport();
  const sizeOf = (o) => new Blob([JSON.stringify(o)]).size;
  const params = {
    to_email: RECIPIENT_EMAIL,
    student_name: state.studentName,
    submit_date: rep.date,
    score: rep.stats.total + "/" + rep.stats.count + " (R&W " + rep.stats.rows.filter(r => isRW(r.q.module) && r.status === "correct").length + "/54 · Math " + rep.stats.rows.filter(r => !isRW(r.q.module) && r.status === "correct").length + "/44)",
    total_time: MODULES.map(m => MODULE_INFO[m].tab + " " + fmt(Math.min(moduleElapsed(m), modTime(m)))).join(" · "),
    report: rep.text,
    report_html: rep.html
  };
  // EmailJS limit is 50 KB: trim the plain-text copy first if needed
  if (sizeOf(params) > 48000) params.report = rep.text.split("\nPER-QUESTION TABLE")[0] + "\n(Per-question table: see HTML version.)";
  if (sizeOf(params) > 48000) params.report = "See the HTML report.";
  try {
    if (!window.emailjs) throw new Error("EmailJS could not be loaded. Check your internet connection.");
    await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params);
    state.emailSent = true; saveState(); render();
    if (status) status.innerHTML = `<div class="msg ok">✓ Your exam was submitted and the report was sent successfully.</div>`;
    if (btn) { btn.textContent = "Submitted ✓"; }
    const foot = $("modal").querySelector(".modal-foot");
    if (foot) foot.innerHTML = `<button class="tool-btn primary" data-close>Close</button>`, foot.querySelector("[data-close]").onclick = closeModal;
  } catch (err) {
    const reason = (err && (err.text || err.message)) || "Unknown error";
    if (status) status.innerHTML = `<div class="msg err">✗ The report could not be sent: ${esc(reason)}. Your answers are saved.
      <div style="margin-top:8px"><button class="small-btn" id="retryBtn">Retry</button></div></div>`;
    if (btn) { btn.disabled = false; btn.textContent = "Confirm Submit"; }
    const r = $("retryBtn"); if (r) r.onclick = sendReport;
  } finally {
    sending = false;
  }
}

/* =========================================================
   14. INIT
   ========================================================= */
function init() {
  try { if (window.emailjs) emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey }); } catch (e) {}

  document.querySelectorAll(".module-tabs .tab").forEach(b => b.onclick = () => { const m = Number(b.dataset.module); goTo(m, state.currentIndex[m]); });
  $("hideTimerBtn").onclick = () => { state.timerHidden = !state.timerHidden; saveState(); renderTop(); tick(); };
  $("refBtn").onclick = openReference;
  $("directionsBtn").onclick = openDirections;
  $("navBtn").onclick = openNavigator;
  $("nextBtn").onclick = next;
  $("backBtn").onclick = back;
  $("resetBtn").onclick = resetExam;
  $("submitBtn").onclick = () => { if (state.emailSent) return; if (state.onBreak) { endBreak(); return; } if (state.submitted || state.stage === 4) { openSubmitReview(); return; } openFinishModule(); };
  $("overlay").onclick = (e) => { if (e.target.id === "overlay" && $("overlay").dataset.dismiss === "1") closeModal(); };
  document.addEventListener("keydown", (e) => {
    const modalOpen = $("overlay").classList.contains("open");
    if (e.key === "Escape" && modalOpen && $("overlay").dataset.dismiss === "1") closeModal();
    // T toggles the question timer
    if (!modalOpen && (e.key === "t" || e.key === "T") && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
      const b = $("timerBtn"); if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
    // Arrow keys move between questions in review mode
    if (!modalOpen && state.corrected && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
      if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
    }
  });

  // Persist running timers when leaving (timestamps already make them refresh-safe)
  window.addEventListener("beforeunload", saveState);

  if (state.studentName) startModule(state.currentModule);
  saveState();
  render();
  if (!state.unlocked) openPasswordModal();
  else if (!state.studentName) openNameModal();
  setInterval(tick, 250);
}

// KaTeX scripts are deferred; wait for them so math renders on first paint.
if (document.readyState === "complete") init();
else window.addEventListener("load", init);
</script>
</body>
