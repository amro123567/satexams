<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amro Academy – Full SAT Practice Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* =========================================================
   THEME
   ========================================================= */
:root{
  --sky:#87CEEB; --sky-light:#e8f6fc; --sky-soft:#cdebf7; --sky-dark:#3a9fd1; --sky-deep:#1d6a96;
  --ink:#1b1b1b; --muted:#5f6b75; --line:#d5dde3; --bg:#ffffff;
  --green:#1e8e3e; --green-bg:#e6f4ea; --red:#c5221f; --red-bg:#fce8e6; --amber:#b06000;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}

/* ---------- Top bar ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 20px;background:var(--sky-light);border-bottom:1px solid var(--sky-soft)}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.tb-left img{height:44px;width:auto;border-radius:6px}
.brand{font-weight:700;font-size:15px;color:var(--sky-deep);white-space:nowrap}
.sec-label{font-size:14px;color:var(--ink);margin-top:2px}
.tb-center{display:flex;flex-direction:column;align-items:center}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.low{color:var(--red)}
.link-btn{background:none;border:1px solid var(--line);border-radius:14px;font-size:12px;padding:2px 12px;margin-top:3px;color:var(--ink)}
.link-btn:hover{border-color:var(--sky-dark)}
.tb-right{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tool-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.tool-btn:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.tool-btn.primary{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.tool-btn.primary:hover:not(:disabled){background:var(--sky-deep)}
.tool-btn.danger{color:var(--red)}
.tool-btn.success{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Module tabs ---------- */
.module-tabs{display:flex;align-items:center;gap:6px;padding:8px 20px 0}
.module-tabs .tab{border:1px solid var(--line);border-bottom:none;background:#f6f8fa;padding:8px 18px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px;color:var(--muted)}
.module-tabs .tab:disabled{opacity:1;cursor:default}
.module-tabs .tab.active{background:var(--sky);color:#0c3a52;border-color:var(--sky)}
.status-pill{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#f1f3f4;color:var(--muted)}
.status-pill.ok{background:var(--green-bg);color:var(--green)}
.dash-line{height:0;border-top:3px dashed var(--sky);margin:0 0 0}

/* ---------- Main ---------- */
main{flex:1;overflow:auto;padding:0 0 24px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.q-wrap{display:grid;grid-template-columns:1fr;gap:0;margin-top:20px}
.q-wrap.spr{grid-template-columns:minmax(260px,1fr) 1.3fr}
.spr-dir{padding:4px 28px 20px 4px;border-right:3px solid var(--sky-soft);font-size:14.5px;line-height:1.6}
.spr-dir h3{margin:4px 0 10px;font-size:16px}
.spr-dir ul{padding-left:18px;margin:0 0 12px}
.spr-dir li{margin-bottom:6px}
.ex-table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
.ex-table th,.ex-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ex-table th{background:var(--sky-light)}
.q-main{max-width:760px;width:100%;margin:0 auto;padding:0 4px}
.q-wrap.spr .q-main{padding-left:28px;margin:0}
.q-head{display:flex;align-items:center;gap:10px;background:#eef1f4;border-bottom:2px dashed #9aa5ad;padding:0 8px 0 0;margin-bottom:18px;min-height:40px}
.q-num{background:#111;color:#fff;font-weight:700;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:17px}
.flag-btn,.hint-btn{background:none;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;color:var(--ink)}
.flag-btn:hover,.hint-btn:hover{background:#e1e6ea}
.flag-btn.on{color:#b3261e}
.flag-icon{display:inline-block;width:14px;height:16px}
.hint-btn{color:var(--sky-deep);border:1px solid var(--sky);background:#fff}
.hint-btn:hover{background:var(--sky-light)}
.hint-btn.on{background:var(--sky);color:#0c3a52}
.spacer{flex:1}
.abc-btn{border:1px solid #444;background:#fff;border-radius:5px;padding:3px 6px;font-size:13px;font-weight:700;text-decoration:line-through}
.abc-btn.on{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
.q-text{font-size:17px;line-height:1.7;margin-bottom:20px}
.q-text .katex-display{margin:.6em 0}
.data-table{border-collapse:collapse;margin:12px auto;font-size:15px}
.data-table th,.data-table td{border:1px solid #8b959c;padding:6px 14px;text-align:center}
.data-table thead th{background:var(--sky-light)}

/* ---------- Choices ---------- */
.choices{display:flex;flex-direction:column;gap:12px}
.choice-row{display:flex;align-items:center;gap:10px}
.choice{flex:1;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid #5f6b75;border-radius:var(--radius);padding:12px 14px;font-size:16px;color:var(--ink);transition:background .12s,border-color .12s;position:relative}
.choice:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.choice .letter{flex:none;width:28px;height:28px;border:1.5px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.choice.selected{border:3px solid var(--sky-dark);background:var(--sky-light);padding:10.5px 12.5px}
.choice.selected .letter{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.choice:disabled{opacity:1;cursor:default}
.choice.eliminated,.choice.eliminated:disabled{opacity:.45}
.choice.eliminated::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:2px solid #222}
.choice.correct{border:3px solid var(--green);background:var(--green-bg);padding:10.5px 12.5px}
.choice.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong{border:3px solid var(--red);background:var(--red-bg);padding:10.5px 12.5px}
.choice.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag.g{background:var(--green);color:#fff}.tag.r{background:var(--red);color:#fff}
.elim-btn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #333;background:#fff;font-weight:700;font-size:13px;text-decoration:line-through;position:relative}
.elim-btn:hover{background:#f1f1f1}
.elim-undo{flex:none;background:none;border:none;text-decoration:underline;font-weight:700;font-size:13px;width:44px}

/* ---------- SPR ---------- */
.spr-input{width:200px;font-size:20px;padding:10px 12px;border:1.5px solid #5f6b75;border-radius:8px;border-bottom:3px solid #222;font-family:inherit}
.spr-input:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px var(--sky-soft)}
.spr-input:disabled{background:#f6f8fa}
.spr-input.correct{border-color:var(--green);background:var(--green-bg)}
.spr-input.wrong{border-color:var(--red);background:var(--red-bg)}
.preview{margin-top:12px;font-size:15px;color:var(--muted);min-height:34px}
.preview b{color:var(--ink)}
.preview .pv{font-size:20px;color:var(--ink);margin-left:6px}

/* ---------- Tools under question ---------- */
.q-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.timer-btn{background:#fff;border:1.5px solid var(--sky-dark);color:var(--sky-deep);border-radius:20px;padding:6px 16px;font-weight:600;font-size:14px}
.timer-btn.running{background:var(--sky-dark);color:#fff}
.q-clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.q-clock-label{font-size:13px;color:var(--muted)}
.hint-box{margin-top:16px;background:var(--sky-light);border:1px solid var(--sky);border-left:5px solid var(--sky-dark);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6}
.hint-box .hint{margin-bottom:8px}
.hint-box .hint b{color:var(--sky-deep)}
.small-btn{background:#fff;border:1px solid var(--sky-dark);color:var(--sky-deep);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.review-box{margin-top:16px;border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6;border:1px solid var(--line);background:#fafbfc}
.status-badge{display:inline-block;font-weight:700;padding:4px 12px;border-radius:14px;margin-bottom:8px}
.status-badge.correct{background:var(--green-bg);color:var(--green)}
.status-badge.wrong{background:var(--red-bg);color:var(--red)}
.status-badge.unanswered{background:#fef7e0;color:var(--amber)}
.ans-g{color:var(--green);font-weight:700}.ans-r{color:var(--red);font-weight:700}

/* ---------- Results panel ---------- */
.results{margin-top:18px;border:1px solid var(--sky);border-radius:12px;background:linear-gradient(180deg,var(--sky-light),#fff 120px);padding:16px 20px}
.results-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:20px;color:var(--sky-deep)}
.big-score{font-size:30px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.rtable th,.rtable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.rtable th{background:var(--sky-light)}
.rtable tr.clickable{cursor:pointer}
.rtable tr.clickable:hover td{background:var(--sky-light)}
.res-correct{color:var(--green);font-weight:700}.res-wrong{color:var(--red);font-weight:700}.res-unanswered{color:var(--amber);font-weight:700}
details summary{cursor:pointer;font-weight:600;margin:10px 0 8px;color:var(--sky-deep)}
.table-scroll{overflow-x:auto}

/* ---------- Bottom bar ---------- */
.bottombar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 20px;border-top:3px dashed var(--sky);background:var(--sky-light)}
.student{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-pill{background:#111;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:14px}
.nav-pill:hover{background:#333}
.bb-right{display:flex;gap:10px;justify-content:flex-end}
.nav-btn{background:var(--sky-dark);color:#fff;border:none;border-radius:22px;padding:10px 26px;font-weight:700;font-size:15px}
.nav-btn:hover:not(:disabled){background:var(--sky-deep)}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.overlay.lock{background:var(--sky-light)}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sky-light);position:sticky;top:0}
.modal-head h3{margin:0;font-size:18px}
.x-btn{background:none;border:none;font-size:24px;line-height:1;color:var(--muted)}
.modal-body{padding:18px 20px;font-size:15px;line-height:1.6}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.name-input{width:100%;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-top:8px}
.name-input:focus{outline:none;border-color:var(--sky-dark)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin:14px 0}
.nav-cell{position:relative;height:44px;border:2px dashed #555;background:#fff;font-weight:700;font-size:15px;border-radius:4px;color:var(--sky-deep)}
.nav-cell.answered{border:2px solid var(--sky-dark);background:var(--sky-dark);color:#fff}
.nav-cell.current{outline:3px solid #111;outline-offset:2px}
.nav-cell.flagged::after{content:"";position:absolute;top:-7px;right:-7px;width:14px;height:14px;background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)}
.nav-cell.c{background:var(--green);border:2px solid var(--green);color:#fff}
.nav-cell.w{background:var(--red);border:2px solid var(--red);color:#fff}
.nav-cell.u{background:#fef7e0;border:2px solid var(--amber);color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:3px;display:inline-block}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ref-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdfe}
.ref-item b{display:block;margin-bottom:4px;color:var(--sky-deep)}
.list-q{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px;font-weight:600}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.err{background:var(--red-bg);color:var(--red)}
.msg.info{background:var(--sky-light);color:var(--sky-deep)}
.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:10px;z-index:60;font-weight:600;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}

/* ---------- Reading and Writing passages ---------- */
.passage{font-size:16.5px;line-height:1.75}
.passage p{margin:0 0 12px}
.passage ul{margin:6px 0 0;padding-left:20px}
.passage li{margin-bottom:6px}
.passage .data-table{margin:4px 0 12px}
.passage caption{font-weight:700;font-size:14px;margin-bottom:6px;text-align:left}
.blank{letter-spacing:1px;font-weight:600}
.module-tabs{flex-wrap:wrap}

/* ---------- Question timer (top bar) ---------- */
.q-head{flex-wrap:wrap;row-gap:6px}
.qtimer{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:18px;padding:5px 12px;font-weight:700;font-size:13.5px;line-height:1}
.qtimer:hover:not(:disabled){background:var(--sky-light)}
.qtimer .qt-clock{font-variant-numeric:tabular-nums;font-size:14px;padding-left:7px;border-left:1.5px solid currentColor;opacity:.9}
.qtimer.running{background:var(--sky-dark);color:#fff}
.qtimer.running:hover{background:var(--sky-deep)}
.qtimer.running .qt-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:qtblink 1s steps(2) infinite}
.qtimer.idle{animation:qtpulse 1.8s ease-in-out infinite}
@keyframes qtpulse{0%,100%{box-shadow:0 0 0 0 rgba(58,159,209,.5)}50%{box-shadow:0 0 0 7px rgba(58,159,209,0)}}
@keyframes qtblink{50%{opacity:.2}}
.qtimer kbd{font:600 11px inherit;border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.7}
.qtimer.running kbd{display:none}

/* ---------- Freeze / overtime / review navigation ---------- */
.tool-btn.frozen{background:#dff3fb;border-color:var(--sky-dark);color:var(--sky-deep)}
.timer.frozen{color:var(--sky-dark)}
.timer.over{color:var(--red)}
.timer-sub{font-size:11px;font-weight:700;color:var(--sky-deep);letter-spacing:.4px;text-transform:uppercase;min-height:14px}
.late-badge{font-size:12px;font-weight:700;color:var(--amber);background:#fef7e0;border:1px solid #f3d27a;border-radius:12px;padding:2px 9px;white-space:nowrap}
.late-badge[hidden]{display:none}
.nav-cell.late::before{content:"⏰";position:absolute;bottom:-10px;left:-8px;font-size:12px}
.review-nav{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--sky);border-radius:12px;padding:10px 12px;margin-top:16px;box-shadow:0 4px 14px rgba(29,106,150,.10)}
.rv-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.rv-m{font-size:12px;font-weight:700;color:var(--muted);width:26px}
.rv-chip{width:30px;height:28px;border-radius:6px;border:none;font-size:12px;font-weight:700;color:#fff;position:relative;padding:0}
.rv-chip.c{background:var(--green)}.rv-chip.w{background:var(--red)}
.rv-chip.u{background:#fef7e0;color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber)}
.rv-chip.cur{outline:3px solid #111;outline-offset:1px}
.rv-chip.late::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 1px #8a5a00}
.rv-chip:hover{filter:brightness(1.1)}
.rv-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:14px}
.rv-actions label{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted);cursor:pointer}
.rv-tip{font-size:12px;color:var(--muted);margin-top:4px}
.q-wrap{animation:qfade .18s ease}
@keyframes qfade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .topbar{grid-template-columns:1fr auto;grid-template-areas:"l c" "r r"}
  .tb-left{grid-area:l}.tb-center{grid-area:c}.tb-right{grid-area:r;justify-content:flex-start}
  .q-wrap.spr{grid-template-columns:1fr}
  .spr-dir{order:2;border-right:none;border-top:3px solid var(--sky-soft);padding:14px 0 0;margin-top:20px;font-size:13.5px}
  .q-wrap.spr .q-main{padding-left:4px}
}
@media (max-width:560px){
  .topbar,.bottombar,.module-tabs{padding-left:12px;padding-right:12px}
  .wrap{padding:0 12px}
  .brand{font-size:13px;white-space:normal}
  .tb-left img{height:36px}
  .timer{font-size:18px}
  .tool-btn{padding:6px 9px;font-size:12px}
  .bottombar{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "s r"}
  .student{grid-area:s}.nav-pill{grid-area:n;justify-self:center}.bb-right{grid-area:r}
  .nav-btn{padding:8px 18px}
  .q-text{font-size:16px}
  .choice{font-size:15px}
}
</style>
</head>
<body>

<!-- ============================ TOP BAR ============================ -->
<header class="topbar">
  <div class="tb-left">
    <img src="image.png" alt="Amro Academy logo" onerror="this.style.display='none'">
    <div>
      <div class="brand">Amro Academy – Full SAT Practice Test</div>
      <div class="sec-label" id="secLabel">Section 2, Module 1: Math</div>
    </div>
  </div>
  <div class="tb-center">
    <div class="timer" id="moduleTimer">35:00</div>
    <div class="timer-sub" id="timerSub"></div>
    <button class="link-btn" id="hideTimerBtn">Hide</button>
  </div>
  <div class="tb-right">
    <button class="tool-btn" id="directionsBtn">Directions</button>
    <button class="tool-btn" id="refBtn">Reference</button>
    <button class="tool-btn primary" id="submitBtn">Submit Exam</button>
    <button class="tool-btn danger" id="resetBtn">Reset Exam</button>
  </div>
</header>

<nav class="module-tabs">
  <button class="tab" data-module="1">Reading &amp; Writing 1</button>
  <button class="tab" data-module="2">Reading &amp; Writing 2</button>
  <button class="tab" data-module="3">Math 1</button>
  <button class="tab" data-module="4">Math 2</button>
  <span class="status-pill" id="statusPill">In progress</span>
</nav>
<div class="dash-line"></div>

<!-- ============================ MAIN ============================ -->
<main id="main">
  <div class="wrap">
    <div id="results"></div>
    <div id="questionArea"></div>
  </div>
</main>

const QUESTIONS = [{"id":"rw1q1","module":1,"number":1,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The architect's design was praised for its <span class=\"blank\">______<\/span>: every room served a clear purpose, and nothing in the building was merely decorative.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["economy","ambiguity","fragility","extravagance"],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw1q2","module":1,"number":2,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Although early reviews of the novel were harsh, its reputation <span class=\"blank\">______<\/span> over the following decades, and today it is taught in many university courses.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["stagnated","concealed","flourished","deteriorated"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q3","module":1,"number":3,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>When the river flooded each spring, farmers in the valley did not try to hold back the water. Instead, they planted crops that could tolerate wet soil, choosing to <u>accommodate<\/u> the flood rather than fight it.<\/p>","question":"As used in the text, what does the word “accommodate” most nearly mean?","choices":["provide housing for","make room for guests","adapt to","lend money to"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q4","module":1,"number":4,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Chemist Lena Ortiz's results proved to be <span class=\"blank\">______<\/span>: three separate laboratories repeated her experiment and obtained the same measurements.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["dubious","preliminary","unconventional","reproducible"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q5","module":1,"number":5,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>Many people assume that bees are the most important pollinators of fruit crops. <u>However, in several mango orchards, researchers observed that flies visited mango flowers far more often than bees did.<\/u> In some of those orchards, flies were responsible for most of the pollination that produced fruit.<\/p>","question":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It proposes a solution to a problem faced by mango farmers.","It presents an observation that challenges the assumption described in the first sentence.","It restates the main conclusion of the text in different words.","It explains why bees are more effective pollinators than flies."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw1q6","module":1,"number":6,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>The following text is from a short story. Ama had walked past the old bakery every morning for years without noticing it. Then, one rainy Tuesday, the smell of cardamom bread drifted through its open door, and she stopped. Inside, an elderly man was shaping dough with the slow precision of someone who had done it ten thousand times.<\/p>","question":"Which choice best states the main purpose of the text?","choices":["To compare the bakery with other shops on the same street","To describe a moment when a character notices something familiar in a new way","To criticize the character for failing to notice her surroundings","To explain the steps involved in baking cardamom bread"],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw1q7","module":1,"number":7,"domain":"Craft and Structure","skill":"Cross-text connections","type":"mcq","passage":"<p><b>Text 1<\/b><br>Some historians argue that the printing press spread literacy rapidly across fifteenth-century Europe. Because printed books cost far less than handwritten ones, they claim, ordinary people quickly gained access to reading.<\/p><p><b>Text 2<\/b><br>Printed books did become cheaper, but most people in the fifteenth century still could not afford them, and very few schools existed to teach reading. Literacy rates in most of Europe rose only gradually, over more than a century.<\/p>","question":"Based on the texts, how would the author of Text 2 most likely respond to the historians discussed in Text 1?","choices":["By arguing that handwritten books were actually cheaper than printed ones","By agreeing that most people learned to read within a few years of the printing press's invention","By claiming that the printing press had no effect on the price of books","By agreeing that printing lowered the cost of books but disputing that literacy spread rapidly as a result"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q8","module":1,"number":8,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>Octopuses can change the color of their skin in a fraction of a second. Their skin contains thousands of cells called chromatophores, each holding a sac of pigment surrounded by tiny muscles. When the muscles contract, the sac is stretched wide and its color becomes visible; when the muscles relax, the sac shrinks back to a small dot.<\/p>","question":"Which choice best states the main idea of the text?","choices":["Octopuses change color mainly to communicate with one another.","Octopuses change color using pigment-filled cells that are controlled by muscles.","Chromatophores are found only in the arms of octopuses.","Octopuses are the only animals that can change the color of their skin."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw1q9","module":1,"number":9,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>In the 1970s, the city of Curitiba, Brazil, became known for an unusual bus system. Instead of building an expensive subway, city planners created lanes used only by buses and built raised, tube-shaped stations where passengers paid their fares before boarding. As a result, buses could load passengers almost as quickly as trains.<\/p>","question":"According to the text, why could buses in Curitiba load passengers quickly?","choices":["The buses traveled through underground tunnels.","The buses were much smaller than buses in other cities.","Passengers paid their fares at the stations before boarding.","Planners reduced the number of stations in the city."],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q10","module":1,"number":10,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>“Harbor at Dusk” is a poem about a fishing town at the end of a difficult season. A student claims that, despite the town's hardships, the speaker of the poem remains hopeful about its future.<\/p>","question":"Which quotation from “Harbor at Dusk” most effectively illustrates the student's claim?","choices":["“The tide comes in as quietly as grief.”","“The gulls have left for kinder, warmer shores,”","“Yet every boat still turns its bow toward dawn,”","“The nets hang empty on the salted rail,”"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q11","module":1,"number":11,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>Researchers hypothesized that songbirds living in cities sing at higher pitches than members of the same species in the countryside because low-pitched songs are harder to hear over traffic noise.<\/p>","question":"Which finding, if true, would most directly support the researchers' hypothesis?","choices":["City birds of the species sing at higher pitches on busy weekdays than on quiet holidays, when there is less traffic.","Birds in the countryside sing more often in the morning than in the evening.","Both city and countryside birds stop singing during heavy snowstorms.","City birds of the species have slightly larger bodies than countryside birds."],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw1q12","module":1,"number":12,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<p><table class=\"data-table\"><caption>Average Daily Screen Time by Age Group (survey of 1,200 people)<\/caption><thead><tr><th>Age group<\/th><th>Hours per day<\/th><\/tr><\/thead><tbody><tr><td>13–17<\/td><td>7.2<\/td><\/tr><tr><td>18–29<\/td><td>6.4<\/td><\/tr><tr><td>30–49<\/td><td>4.9<\/td><\/tr><tr><td>50 and older<\/td><td>3.1<\/td><\/tr><\/tbody><\/table><\/p><p>A researcher reviewing the survey results noted that average daily screen time was lower for each successively older age group. For example, <span class=\"blank\">______<\/span><\/p>","question":"Which choice most effectively uses data from the table to complete the example?","choices":["people in every age group reported more than 4 hours of screen time per day.","people aged 18–29 reported more screen time than people aged 13–17 did.","people aged 30–49 reported 6.4 hours of screen time per day.","people aged 18–29 reported 6.4 hours per day, while people aged 30–49 reported 4.9 hours per day."],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q13","module":1,"number":13,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>Some ancient Roman concrete structures have survived in seawater for about two thousand years, while many modern concrete structures crack within decades. Researchers found that Roman builders mixed volcanic ash with lime and seawater, which produced minerals that keep growing inside small cracks and gradually seal them. Modern concrete, which is made without these ingredients, therefore <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["contains more volcanic ash than Roman concrete does.","lacks a process that would repair its cracks over time.","was first developed by Roman builders.","lasts longer in seawater than Roman concrete does."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw1q14","module":1,"number":14,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>In a study of 40 classrooms, students who took short movement breaks every 30 minutes answered more questions correctly on afternoon quizzes than students who did not take breaks. On morning quizzes, however, the two groups performed equally well. These results suggest that movement breaks <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["lower students' performance on morning quizzes.","may be most helpful after students have been sitting for a long time.","have no effect on students' performance at any time of day.","are less useful than quizzes for helping students learn."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw1q15","module":1,"number":15,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>Marine biologist Rosa Ita spent a decade photographing coral <span class=\"blank\">______<\/span> her images now fill an entire gallery at the city's natural history museum.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["reefs,","reefs, who","reefs;","reefs"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q16","module":1,"number":16,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>The collection of letters written by the explorer during her travels <span class=\"blank\">______<\/span> now on display at the city library.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["were","is","are","have been"],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw1q17","module":1,"number":17,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The traditional recipe requires only three <span class=\"blank\">______<\/span> flour, water, and salt.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["ingredients","ingredients;","ingredients,","ingredients:"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q18","module":1,"number":18,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>By the time the rescue team reached the summit, the stranded climbers <span class=\"blank\">______<\/span> there for nearly two days.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["wait","are waiting","will wait","had been waiting"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q19","module":1,"number":19,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The Atacama Desert, one of the driest places on <span class=\"blank\">______<\/span> receives less than one millimeter of rain in some years.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Earth—","Earth;","Earth","Earth,"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q20","module":1,"number":20,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>When the city council approved the plan for a new park, <span class=\"blank\">______<\/span> also set aside funds to build a public library nearby.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["them","its","those","it"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw1q21","module":1,"number":21,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Walking through the forest just after sunrise, <span class=\"blank\">______<\/span><\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the hikers heard dozens of birds singing.","dozens of birds sang for the hikers.","dozens of birds were heard singing by the hikers.","the singing of dozens of birds filled the hikers' ears."],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw1q22","module":1,"number":22,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Glass frogs are nearly transparent on their undersides. <span class=\"blank\">______<\/span> predators looking up at them from below often cannot see them against the bright, sunlit leaves.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["As a result,","For instance,","However,","Similarly,"],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw1q23","module":1,"number":23,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>The first electric cars appeared in the 1890s and were popular in many cities. <span class=\"blank\">______<\/span> by the 1920s, cheaper gasoline-powered cars had almost completely replaced them.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["However,","For example,","In addition,","Therefore,"],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw1q24","module":1,"number":24,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Honeybees share information about food sources through movement. <span class=\"blank\">______<\/span> a bee that has found flowers performs a “waggle dance,” and the angle of the dance tells other bees which direction to fly.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","Instead,","For example,","In contrast,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q25","module":1,"number":25,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>The Great Wall of China is a series of fortifications built over many centuries.<\/li><li>Including all of its branches, the wall is about 21,000 kilometers long.<\/li><li>Its best-known sections were built during the Ming dynasty (1368–1644).<\/li><\/ul>","question":"The student wants to emphasize the length of the Great Wall of China. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Ming dynasty ruled China from 1368 to 1644.","The best-known sections of the Great Wall were built during the Ming dynasty.","Including all of its branches, the Great Wall of China stretches about 21,000 kilometers.","The Great Wall of China is a series of fortifications built over many centuries."],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw1q26","module":1,"number":26,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Marie Curie was a physicist and chemist who studied radioactivity.<\/li><li>In 1903, she shared the Nobel Prize in Physics.<\/li><li>In 1911, she won the Nobel Prize in Chemistry.<\/li><li>She was the first person to win Nobel Prizes in two different sciences.<\/li><\/ul>","question":"The student wants to highlight an achievement that made Curie unique. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Marie Curie was the first person to win Nobel Prizes in two different sciences: physics in 1903 and chemistry in 1911.","In 1903, Marie Curie shared the Nobel Prize in Physics.","The Nobel Prize in Chemistry was awarded in 1911.","Marie Curie was a physicist and chemist who studied radioactivity."],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw1q27","module":1,"number":27,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Mauna Loa, in Hawaii, is a shield volcano.<\/li><li>Shield volcanoes are built from runny lava that spreads out, so they have gentle slopes.<\/li><li>Mount Fuji, in Japan, is a stratovolcano.<\/li><li>Stratovolcanoes are built from alternating layers of thick lava and ash, so they have steep slopes.<\/li><\/ul>","question":"The student wants to contrast the shapes of the two volcanoes. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Shield volcanoes such as Mauna Loa are built from runny lava.","Mauna Loa, a shield volcano, has gentle slopes, whereas Mount Fuji, a stratovolcano, has steep slopes.","Both Mauna Loa and Mount Fuji are volcanoes.","Mount Fuji, in Japan, is built from layers of thick lava and ash."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q1","module":2,"number":1,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The committee's response to the proposal was <span class=\"blank\">______<\/span>: members neither endorsed the plan nor rejected it, saying only that it required further study.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["unanimous","hostile","equivocal","emphatic"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q2","module":2,"number":2,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Although the documentary addresses a complex scientific topic, its explanations are remarkably <span class=\"blank\">______<\/span>, allowing viewers with no background in physics to follow every step of the argument.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["esoteric","tentative","cursory","lucid"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q3","module":2,"number":3,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Critics at first dismissed the painter's late works as careless. Later scholars, however, argued that the loose brushstrokes were deliberate, and they <u>credited<\/u> the artist with anticipating techniques that would not become common for another fifty years.<\/p>","question":"As used in the text, what does the word “credited” most nearly mean?","choices":["trusted","acknowledged as responsible for","added points to","loaned money to"],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q4","module":2,"number":4,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Far from being <span class=\"blank\">______<\/span>, the ancient trade network was highly organized, with fixed routes, standard weights, and prices that merchants agreed on in advance.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["lucrative","extensive","systematic","haphazard"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q5","module":2,"number":5,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>For decades, many astronomers believed that Venus was geologically inactive, its surface essentially unchanged for hundreds of millions of years. Radar images taken several months apart, however, show that the shape of one volcanic vent changed noticeably between observations. These images suggest that Venus may still have active volcanoes.<\/p>","question":"Which choice best describes the overall structure of the text?","choices":["It explains a research method and then lists the method's weaknesses.","It describes a long-held belief and then presents evidence that calls that belief into question.","It compares the volcanoes of two planets and then explains their differences.","It presents a theory and then supports it with historical examples."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q6","module":2,"number":6,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>Economist Tomas Reyes studies why people often stay with a default option, such as an automatically selected retirement savings plan, even when better options are available. Reyes notes that switching requires effort and attention. <u>He also points out that many people interpret a default as a recommendation, assuming that it must have been chosen for good reasons.<\/u><\/p>","question":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It presents evidence that contradicts Reyes's main claim.","It describes the method Reyes used to collect his data.","It introduces an additional explanation for the behavior that Reyes studies.","It suggests that default options are always the best choice."],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q7","module":2,"number":7,"domain":"Craft and Structure","skill":"Cross-text connections","type":"mcq","passage":"<p><b>Text 1<\/b><br>Many ecologists argue that removing invasive plant species should always be a priority in habitat restoration, since invasive plants crowd out native species and reduce biodiversity.<\/p><p><b>Text 2<\/b><br>Biologist Hana Sato studied degraded wetlands where invasive reeds now provide the only remaining nesting habitat for several native bird species. Removing the reeds before native plants are reestablished, Sato argues, could leave those birds with nowhere to nest.<\/p>","question":"Based on the texts, how would Sato (Text 2) most likely respond to the ecologists' position in Text 1?","choices":["She would argue that invasive plants never reduce biodiversity.","She would agree that invasive plants should always be removed as quickly as possible.","She would claim that native birds do not depend on wetland habitats.","She would argue that whether to remove invasive plants should depend on the conditions of a particular habitat."],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q8","module":2,"number":8,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>The following text is from a short story. Theo had rehearsed the speech for weeks, practicing in front of the mirror until every pause fell exactly where he wanted it. But when he stepped onto the stage and saw his grandmother in the front row, beaming and holding her program upside down, he set his notes aside and simply told the audience about her.<\/p>","question":"Which choice best states the main idea of the text?","choices":["Theo decides not to speak at the event after all.","Theo sets aside his carefully prepared speech in favor of a more personal message.","Theo's grandmother criticizes the speech he has prepared.","Theo forgets his speech because he is nervous about speaking in public."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q9","module":2,"number":9,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>The axolotl, a salamander native to lakes near Mexico City, can regrow entire limbs, parts of its spinal cord, and even sections of its heart. Unlike most salamanders, it usually spends its entire life in the water, keeping juvenile features such as feathery external gills into adulthood.<\/p>","question":"According to the text, what is one way in which the axolotl differs from most salamanders?","choices":["It usually remains in the water throughout its life.","It lives in lakes near a large city.","It has a spinal cord.","It is able to regrow lost limbs."],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw2q10","module":2,"number":10,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>A city council member claims that new bike lanes added to Main Street last year caused the decrease in traffic accidents on that street.<\/p>","question":"Which finding, if true, would most directly weaken the council member's claim?","choices":["Most residents surveyed said they approve of the new bike lanes.","During the same period, accidents decreased by the same amount on nearby streets that did not get bike lanes.","More people rode bicycles on Main Street after the lanes were added.","The bike lanes on Main Street were painted bright green."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q11","module":2,"number":11,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>In a short story, the narrator describes his Aunt Ida. A student claims that Aunt Ida hides her generosity behind a stern manner.<\/p>","question":"Which quotation from the story most effectively illustrates the student's claim?","choices":["“She laughed easily and hugged every visitor who came to the door.”","“Aunt Ida woke before sunrise every day of her life.”","“Her house stood at the end of a long gravel road lined with pines.”","“She frowned at the muddy boots by the door, then quietly set out a second plate of biscuits for the boy who had worn them.”"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q12","module":2,"number":12,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<p><table class=\"data-table\"><caption>Solar Panel Types<\/caption><thead><tr><th>Panel type<\/th><th>Cost per panel<\/th><th>Still at full output after 10 years<\/th><\/tr><\/thead><tbody><tr><td>Type A<\/td><td>$310<\/td><td>92%<\/td><\/tr><tr><td>Type B<\/td><td>$240<\/td><td>85%<\/td><\/tr><tr><td>Type C<\/td><td>$180<\/td><td>71%<\/td><\/tr><\/tbody><\/table><\/p><p>An engineer argues that Type B panels offer a reasonable compromise: they cost less than Type A panels but are considerably more durable than Type C panels.<\/p>","question":"Which choice best describes data from the table that support the engineer's argument?","choices":["Type A panels cost the most, and 92% of them were still at full output after 10 years.","Type B panels cost $240, and 92% of them were still at full output after 10 years.","Type B panels cost $70 less than Type A panels, and 85% of Type B panels were still at full output after 10 years, compared with 71% of Type C panels.","Type C panels cost $60 less than Type B panels and $130 less than Type A panels."],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q13","module":2,"number":13,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>When some plants are attacked by caterpillars, they release chemicals into the air. Researchers found that nearby plants of the same species that detect these chemicals begin producing bitter compounds in their leaves, which caterpillars avoid, even before any caterpillars reach them. This finding suggests that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["plants that are attacked by caterpillars stop releasing chemicals into the air.","plants may use airborne signals to prepare for threats before they are directly harmed.","all plant species respond in the same way to the same chemical signals.","caterpillars prefer to eat leaves that contain bitter compounds."],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q14","module":2,"number":14,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>In a survey of a town's residents, 70% said they wanted the town to build more public parks. Yet when the town held a vote on a small tax increase to pay for two new parks, the measure was defeated by a wide margin. One possible explanation is that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["many residents who wanted more parks were unwilling to pay higher taxes to fund them.","most residents of the town did not want any new parks.","the parks would have been built in a neighboring town.","the survey asked residents about libraries rather than parks."],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw2q15","module":2,"number":15,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The bridge was designed to withstand extremely strong <span class=\"blank\">______<\/span> engineers still closed it during the hurricane as a precaution.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["winds; however","winds however,","winds; however,","winds, however,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q16","module":2,"number":16,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Each of the paintings in the gallery's new wing <span class=\"blank\">______<\/span> by an artist under the age of thirty.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was created","were created","are created","have been created"],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw2q17","module":2,"number":17,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The Silk Road—a vast network of trade routes linking China to the <span class=\"blank\">______<\/span> carried silk, spices, and new ideas across thousands of miles.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["Mediterranean—","Mediterranean","Mediterranean;","Mediterranean,"],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw2q18","module":2,"number":18,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>The researchers presented <span class=\"blank\">______<\/span> findings at the conference, where several other teams questioned the results.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["they're","there","their","its"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q19","module":2,"number":19,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The ancient manuscripts that archaeologists discovered in the cave <span class=\"blank\">______<\/span> written on a material made from papyrus.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["were,","were;","were:","were"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q20","module":2,"number":20,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>The new policy is intended to reduce costs, improve workplace safety, and <span class=\"blank\">______<\/span><\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["efficiency will increase.","increasing efficiency.","increase efficiency.","to the increase of efficiency."],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q21","module":2,"number":21,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Over the past decade, the number of students enrolled in online courses <span class=\"blank\">______<\/span> steadily.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["has risen","rise","are rising","have risen"],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw2q22","module":2,"number":22,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Most substances expand when they are heated. Water, <span class=\"blank\">______<\/span> actually contracts as it is heated from 0°C to 4°C.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["for this reason,","in addition,","in contrast,","similarly,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"rw2q23","module":2,"number":23,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>The team's first prototype could not fly more than a few meters before crashing. <span class=\"blank\">______<\/span> the engineers studied the crash data carefully and redesigned the wings.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["For instance,","In other words,","Similarly,","Undeterred,"],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q24","module":2,"number":24,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Many deep-sea fish produce their own light. The anglerfish, <span class=\"blank\">______<\/span> uses a glowing lure that extends from its head to attract prey in the darkness.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["however,","for example,","meanwhile,","instead,"],"correctAnswer":"B","hints":[],"solution":""},{"id":"rw2q25","module":2,"number":25,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Katherine Johnson was a mathematician who worked for NASA.<\/li><li>She calculated the flight path for Alan Shepard's 1961 spaceflight.<\/li><li>Before John Glenn's 1962 orbital flight, she checked the electronic computer's calculations by hand.<\/li><li>She was awarded the Presidential Medal of Freedom in 2015.<\/li><\/ul>","question":"The student wants to emphasize Johnson's role in John Glenn's flight. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["In 2015, Katherine Johnson was awarded the Presidential Medal of Freedom.","Katherine Johnson was a mathematician who worked for NASA.","Katherine Johnson calculated the flight path for Alan Shepard's 1961 spaceflight.","Before John Glenn's 1962 orbital flight, NASA mathematician Katherine Johnson checked the electronic computer's calculations by hand."],"correctAnswer":"D","hints":[],"solution":""},{"id":"rw2q26","module":2,"number":26,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Telescopes gather light using either lenses or mirrors.<\/li><li>Refracting telescopes use lenses; reflecting telescopes use mirrors.<\/li><li>A very large lens can sag under its own weight because it can be supported only at its edges.<\/li><li>A mirror can be supported across its entire back, so it can be made much larger.<\/li><li>Today's largest telescopes are all reflecting telescopes.<\/li><\/ul>","question":"The student wants to explain why today's largest telescopes are reflecting telescopes. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Because a mirror can be supported across its entire back while a lens can be supported only at its edges, the largest telescopes use mirrors.","Telescopes gather light using either lenses or mirrors.","Refracting telescopes use lenses, while reflecting telescopes use mirrors.","A very large lens can sag under its own weight."],"correctAnswer":"A","hints":[],"solution":""},{"id":"rw2q27","module":2,"number":27,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Researchers studied 300 community gardens in five cities.<\/li><li>They measured summer temperatures in neighborhoods with and without gardens.<\/li><li>Neighborhoods with gardens were cooler on average.<\/li><li>The researchers concluded that community gardens can help cool urban areas.<\/li><\/ul>","question":"The student wants to present the study's conclusion to an audience unfamiliar with the study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Researchers studied 300 community gardens in five cities.","After studying 300 community gardens in five cities, researchers concluded that such gardens can help cool urban areas.","The researchers measured summer temperatures in different neighborhoods.","Some neighborhoods in the five cities had community gardens, and others did not."],"correctAnswer":"B","hints":[],"solution":""},{"id":"ma1q1","module":3,"number":1,"domain":"Algebra","skill":"Linear equations in one variable","type":"mcq","question":"If \\(4x+7=31\\), what is the value of \\(2x\\)?","choices":["\\(6\\)","\\(12\\)","\\(19\\)","\\(24\\)"],"correctAnswer":"B","hints":[],"solution":""},{"id":"ma1q2","module":3,"number":2,"domain":"Problem-Solving and Data Analysis","skill":"Ratios and rates","type":"spr","question":"A recipe uses 3 cups of flour to make 24 cookies. At this rate, how many cups of flour are needed to make 40 cookies?","correctAnswer":"5","acceptedAnswers":["5"],"hints":[],"solution":""},{"id":"ma1q3","module":3,"number":3,"domain":"Algebra","skill":"Linear equations in two variables","type":"mcq","question":"Which equation represents a line in the \\(xy\\)-plane with a slope of 3 and a \\(y\\)-intercept of \\(-4\\)?","choices":["\\(y=-4x+3\\)","\\(y=3x+4\\)","\\(y=3x-4\\)","\\(y=-3x-4\\)"],"correctAnswer":"C","hints":[],"solution":""},{"id":"ma1q4","module":3,"number":4,"domain":"Advanced Math","skill":"Equivalent expressions","type":"mcq","question":"Which of the following is equivalent to \\((x+5)(x-2)\\)?","choices":["\\(x^2+3x-10\\)","\\(x^2-3x-10\\)","\\(x^2+7x-10\\)","\\(x^2-10\\)"],"correctAnswer":"A","hints":[],"solution":""},{"id":"ma1q5","module":3,"number":5,"domain":"Geometry and Trigonometry","skill":"Right triangles (Pythagorean theorem)","type":"spr","question":"The lengths of the legs of a right triangle are 9 and 12. What is the length of the hypotenuse?","correctAnswer":"15","acceptedAnswers":["15"],"hints":[],"solution":""},{"id":"ma1q6","module":3,"number":6,"domain":"Algebra","skill":"Systems of two linear equations","type":"mcq","question":"\\[x+y=10\\]\\[x-y=4\\] What is the value of \\(x\\) in the solution to the system of equations above?","choices":["\\(7\\)","\\(3\\)","\\(6\\)","\\(14\\)"],"correctAnswer":"A","hints":[],"solution":""},{"id":"ma1q7","module":3,"number":7,"domain":"Problem-Solving and Data Analysis","skill":"Percentages","type":"mcq","question":"In a class of 30 students, 40% of the students are in the school band. How many students in the class are <b>not<\/b> in the band?","choices":["\\(12\\)","\\(18\\)","\\(20\\)","\\(26\\)"],"correctAnswer":"B","hints":[],"solution":""},{"id":"ma1q8","module":3,"number":8,"domain":"Advanced Math","skill":"Function notation","type":"mcq","question":"The function \\(f\\) is defined by \\(f(x)=2x^2-3\\). What is the value of \\(f(-2)\\)?","choices":["\\(-11\\)","\\(13\\)","\\(-5\\)","\\(5\\)"],"correctAnswer":"D","hints":[],"solution":""},{"id":"ma1q9","module":3,"number":9,"domain":"Algebra","skill":"Linear equations in context","type":"spr","question":"A gym charges a one-time sign-up fee of $25 plus $15 per month. A member has paid a total of $160. For how many months has the member paid?","correctAnswer":"9","acceptedAnswers":["9"],"hints":[],"solution":""},{"id":"ma1q10","module":3,"number":10,"domain":"Geometry and Trigonometry","skill":"Lines and angles","type":"mcq","question":"Two angles form a linear pair. Their measures are \\((3x+15)^\\circ\\) and \\((2x)^\\circ\\). What /* =========================================================
   5. TIMERS (module countdown + per-question stopwatch)
   ========================================================= */
function moduleElapsed(m) {
  const t = state.moduleTimers[m];
  return t.elapsed + (t.start ? Date.now() - t.start : 0);
}
function pauseModule(m) {
  const t = state.moduleTimers[m];
  if (t.start) { t.elapsed += Date.now() - t.start; t.start = null; }
}
function startModule(m) {
  const t = state.moduleTimers[m];
  if (!t.start && !isLocked() && state.studentName && !state.frozen) t.start = Date.now();
}
function qt(id) {
  if (!state.qTimers[id]) state.qTimers[id] = { acc: 0, start: null };
  return state.qTimers[id];
}
const qElapsed = (id) => { const t = qt(id); return t.acc + (t.start ? Date.now() - t.start : 0); };
function stopQ(id) { const t = qt(id); if (t.start) { t.acc += Date.now() - t.start; t.start = null; } }
function stopAllQ() { Object.keys(state.qTimers).forEach(stopQ); }
function startQ(id) { if (state.frozen) return; stopAllQ(); qt(id).start = Date.now(); }
const isOvertime = (m) => moduleElapsed(m) >= modTime(m);
function markTiming(q) {
  if (!hasAnswer(q)) delete state.lateAnswers[q.id];
  else if (isOvertime(q.module)) state.lateAnswers[q.id] = true;
}
function stopAllTimers() { stopAllQ(); MODULES.forEach(pauseModule); }

function tick() {
  if (state.onBreak) { tickBreak(); return; }
  const m = state.currentModule;
  const remaining = modTime(m) - moduleElapsed(m);
  const el = $("moduleTimer");
  const over = remaining <= 0;
  el.textContent = state.timerHidden ? "" : (over ? "00:00" : fmt(remaining));
  el.classList.toggle("low", !over && remaining < 5 * 60 * 1000);
  el.classList.toggle("over", over);
  el.classList.toggle("frozen", !!state.frozen);
  const sub = $("timerSub");
  if (sub) sub.textContent = state.frozen && !isLocked() ? "❄ Time frozen" : "";
  if (over && !isLocked() && state.studentName) {
    if (m === state.stage && m < 4) { closeModal(); finishModule(true); }   // time's up → next module (or break)
    else if (m === 4 && state.stage === 4 && !sending) {                     // time's up → test submits itself
      state.autoSubmitted = true; saveState(); closeModal(); openSubmitReview(); sendReport();
    }
  }
  const q = currentQ();
  const clock = $("qClock");
  if (q && clock) clock.textContent = fmt(qElapsed(q.id));
}

function parseNum(str) {
  if (str === undefined || str === null) return NaN;
  const s = String(str).trim();
  if (/^-?(\d+\.?\d*|\.\d+)\/(\d+\.?\d*|\.\d+)$/.test(s)) {
    const [a, b] = s.split("/").map(Number);
    return b === 0 ? NaN : a / b;
  }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
function normalizeSpr(s) {
  let t = String(s).trim().replace(/\s+/g, "");
  if (/^-?0\.\d/.test(t)) t = t.replace("0.", ".");
  return t;
}
function isCorrect(q, ans) {
  if (ans === undefined || ans === null || String(ans).trim() === "") return false;
  if (q.type === "mcq") return ans === q.correctAnswer;
  const n = normalizeSpr(ans);
  if (q.acceptedAnswers.some(a => normalizeSpr(a) === n)) return true;
  const v = parseNum(ans), target = parseNum(q.correctAnswer);
  return !isNaN(v) && !isNaN(target) && Math.abs(v - target) < 1e-9;
}
function statusOf(q) {
  if (!hasAnswer(q)) return "unanswered";
  return isCorrect(q, state.answers[q.id]) ? "correct" : "wrong";
}
function buildStats() {
  const rows = QUESTIONS.map(q => ({
    q, status: statusOf(q), time: qElapsed(q.id), hints: state.hintLevel[q.id] || 0,
    late: hasAnswer(q) && !!state.lateAnswers[q.id],
    answer: hasAnswer(q) ? String(state.answers[q.id]) : "—"
  }));
  const total = rows.filter(r => r.status === "correct").length;
  const perModule = MODULES.map(m => {
    const rs = rows.filter(r => r.q.module === m);
    return { m, correct: rs.filter(r => r.status === "correct").length, onTime: rs.filter(r => r.status === "correct" && !r.late).length, late: rs.filter(r => r.late).length, total: rs.length, time: moduleElapsed(m) };
  });
  const perDomain = DOMAINS.filter(d => rows.some(r => r.q.domain === d)).map(d => {
    const rs = rows.filter(r => r.q.domain === d);
    const correct = rs.filter(r => r.status === "correct").length;
    const time = rs.reduce((s, r) => s + r.time, 0);
    return { d, correct, total: rs.length, pct: rs.length ? Math.round(correct / rs.length * 100) : 0, avg: rs.length ? time / rs.length : 0, hints: rs.reduce((s, r) => s + r.hints, 0) };
  });
  const totalTime = rows.reduce((s, r) => s + r.time, 0);
  const hintsUsed = rows.reduce((s, r) => s + r.hints, 0);
  const correctNoHint = rows.filter(r => r.status === "correct" && r.hints === 0).length;
  const onTime = rows.filter(r => r.status === "correct" && !r.late).length;
  const lateCount = rows.filter(r => r.late).length;
  return { rows, total, perModule, perDomain, totalTime, hintsUsed, correctNoHint, onTime, lateCount, count: rows.length };
}
