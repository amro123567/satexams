<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amro Academy – SAT Diagnostic Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* =========================================================
   THEME
   ========================================================= */
:root{
  --sky:#87CEEB; --sky-light:#e8f6fc; --sky-soft:#cdebf7; --sky-dark:#3a9fd1; --sky-deep:#1d6a96;
  --ink:#1b1b1b; --muted:#5f6b75; --line:#d5dde3; --bg:#ffffff;
  --green:#1e8e3e; --green-bg:#e6f4ea; --red:#c5221f; --red-bg:#fce8e6; --amber:#b06000;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}

/* ---------- Top bar ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 20px;background:var(--sky-light);border-bottom:1px solid var(--sky-soft)}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.tb-left img{height:44px;width:auto;border-radius:6px}
.brand{font-weight:700;font-size:15px;color:var(--sky-deep);white-space:nowrap}
.sec-label{font-size:14px;color:var(--ink);margin-top:2px}
.tb-center{display:flex;flex-direction:column;align-items:center}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.low{color:var(--red)}
.link-btn{background:none;border:1px solid var(--line);border-radius:14px;font-size:12px;padding:2px 12px;margin-top:3px;color:var(--ink)}
.link-btn:hover{border-color:var(--sky-dark)}
.tb-right{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tool-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.tool-btn:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.tool-btn.primary{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.tool-btn.primary:hover:not(:disabled){background:var(--sky-deep)}
.tool-btn.danger{color:var(--red)}
.tool-btn.success{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Module tabs ---------- */
.module-tabs{display:flex;align-items:center;gap:6px;padding:8px 20px 0}
.module-tabs .tab{border:1px solid var(--line);border-bottom:none;background:#f6f8fa;padding:8px 18px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px;color:var(--muted)}
.module-tabs .tab:disabled{opacity:1;cursor:default}
.module-tabs .tab.active{background:var(--sky);color:#0c3a52;border-color:var(--sky)}
.status-pill{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#f1f3f4;color:var(--muted)}
.status-pill.ok{background:var(--green-bg);color:var(--green)}
.dash-line{height:0;border-top:3px dashed var(--sky);margin:0 0 0}

/* ---------- Main ---------- */
main{flex:1;overflow:auto;padding:0 0 24px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.q-wrap{display:grid;grid-template-columns:1fr;gap:0;margin-top:20px}
.q-wrap.spr{grid-template-columns:minmax(260px,1fr) 1.3fr}
.spr-dir{padding:4px 28px 20px 4px;border-right:3px solid var(--sky-soft);font-size:14.5px;line-height:1.6}
.spr-dir h3{margin:4px 0 10px;font-size:16px}
.spr-dir ul{padding-left:18px;margin:0 0 12px}
.spr-dir li{margin-bottom:6px}
.ex-table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
.ex-table th,.ex-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ex-table th{background:var(--sky-light)}
.q-main{max-width:760px;width:100%;margin:0 auto;padding:0 4px}
.q-wrap.spr .q-main{padding-left:28px;margin:0}
.q-head{display:flex;align-items:center;gap:10px;background:#eef1f4;border-bottom:2px dashed #9aa5ad;padding:0 8px 0 0;margin-bottom:18px;min-height:40px}
.q-num{background:#111;color:#fff;font-weight:700;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:17px}
.flag-btn,.hint-btn{background:none;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;color:var(--ink)}
.flag-btn:hover,.hint-btn:hover{background:#e1e6ea}
.flag-btn.on{color:#b3261e}
.flag-icon{display:inline-block;width:14px;height:16px}
.hint-btn{color:var(--sky-deep);border:1px solid var(--sky);background:#fff}
.hint-btn:hover{background:var(--sky-light)}
.hint-btn.on{background:var(--sky);color:#0c3a52}
.spacer{flex:1}
.abc-btn{border:1px solid #444;background:#fff;border-radius:5px;padding:3px 6px;font-size:13px;font-weight:700;text-decoration:line-through}
.abc-btn.on{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
.q-text{font-size:17px;line-height:1.7;margin-bottom:20px}
.q-text .katex-display{margin:.6em 0}
.data-table{border-collapse:collapse;margin:12px auto;font-size:15px}
.data-table th,.data-table td{border:1px solid #8b959c;padding:6px 14px;text-align:center}
.data-table thead th{background:var(--sky-light)}

/* ---------- Choices ---------- */
.choices{display:flex;flex-direction:column;gap:12px}
.choice-row{display:flex;align-items:center;gap:10px}
.choice{flex:1;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid #5f6b75;border-radius:var(--radius);padding:12px 14px;font-size:16px;color:var(--ink);transition:background .12s,border-color .12s;position:relative}
.choice:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.choice .letter{flex:none;width:28px;height:28px;border:1.5px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.choice.selected{border:3px solid var(--sky-dark);background:var(--sky-light);padding:10.5px 12.5px}
.choice.selected .letter{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.choice:disabled{opacity:1;cursor:default}
.choice.eliminated,.choice.eliminated:disabled{opacity:.45}
.choice.eliminated::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:2px solid #222}
.choice.correct{border:3px solid var(--green);background:var(--green-bg);padding:10.5px 12.5px}
.choice.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong{border:3px solid var(--red);background:var(--red-bg);padding:10.5px 12.5px}
.choice.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag.g{background:var(--green);color:#fff}.tag.r{background:var(--red);color:#fff}
.elim-btn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #333;background:#fff;font-weight:700;font-size:13px;text-decoration:line-through;position:relative}
.elim-btn:hover{background:#f1f1f1}
.elim-undo{flex:none;background:none;border:none;text-decoration:underline;font-weight:700;font-size:13px;width:44px}

/* ---------- SPR ---------- */
.spr-input{width:200px;font-size:20px;padding:10px 12px;border:1.5px solid #5f6b75;border-radius:8px;border-bottom:3px solid #222;font-family:inherit}
.spr-input:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px var(--sky-soft)}
.spr-input:disabled{background:#f6f8fa}
.spr-input.correct{border-color:var(--green);background:var(--green-bg)}
.spr-input.wrong{border-color:var(--red);background:var(--red-bg)}
.preview{margin-top:12px;font-size:15px;color:var(--muted);min-height:34px}
.preview b{color:var(--ink)}
.preview .pv{font-size:20px;color:var(--ink);margin-left:6px}

/* ---------- Tools under question ---------- */
.q-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.timer-btn{background:#fff;border:1.5px solid var(--sky-dark);color:var(--sky-deep);border-radius:20px;padding:6px 16px;font-weight:600;font-size:14px}
.timer-btn.running{background:var(--sky-dark);color:#fff}
.q-clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.q-clock-label{font-size:13px;color:var(--muted)}
.hint-box{margin-top:16px;background:var(--sky-light);border:1px solid var(--sky);border-left:5px solid var(--sky-dark);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6}
.hint-box .hint{margin-bottom:8px}
.hint-box .hint b{color:var(--sky-deep)}
.small-btn{background:#fff;border:1px solid var(--sky-dark);color:var(--sky-deep);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.review-box{margin-top:16px;border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6;border:1px solid var(--line);background:#fafbfc}
.status-badge{display:inline-block;font-weight:700;padding:4px 12px;border-radius:14px;margin-bottom:8px}
.status-badge.correct{background:var(--green-bg);color:var(--green)}
.status-badge.wrong{background:var(--red-bg);color:var(--red)}
.status-badge.unanswered{background:#fef7e0;color:var(--amber)}
.ans-g{color:var(--green);font-weight:700}.ans-r{color:var(--red);font-weight:700}

/* ---------- Results panel ---------- */
.results{margin-top:18px;border:1px solid var(--sky);border-radius:12px;background:linear-gradient(180deg,var(--sky-light),#fff 120px);padding:16px 20px}
.results-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:20px;color:var(--sky-deep)}
.big-score{font-size:30px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.rtable th,.rtable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.rtable th{background:var(--sky-light)}
.rtable tr.clickable{cursor:pointer}
.rtable tr.clickable:hover td{background:var(--sky-light)}
.res-correct{color:var(--green);font-weight:700}.res-wrong{color:var(--red);font-weight:700}.res-unanswered{color:var(--amber);font-weight:700}
details summary{cursor:pointer;font-weight:600;margin:10px 0 8px;color:var(--sky-deep)}
.table-scroll{overflow-x:auto}

/* ---------- Bottom bar ---------- */
.bottombar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 20px;border-top:3px dashed var(--sky);background:var(--sky-light)}
.student{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-pill{background:#111;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:14px}
.nav-pill:hover{background:#333}
.bb-right{display:flex;gap:10px;justify-content:flex-end}
.nav-btn{background:var(--sky-dark);color:#fff;border:none;border-radius:22px;padding:10px 26px;font-weight:700;font-size:15px}
.nav-btn:hover:not(:disabled){background:var(--sky-deep)}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.overlay.lock{background:var(--sky-light)}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sky-light);position:sticky;top:0}
.modal-head h3{margin:0;font-size:18px}
.x-btn{background:none;border:none;font-size:24px;line-height:1;color:var(--muted)}
.modal-body{padding:18px 20px;font-size:15px;line-height:1.6}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.name-input{width:100%;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-top:8px}
.name-input:focus{outline:none;border-color:var(--sky-dark)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin:14px 0}
.nav-cell{position:relative;height:44px;border:2px dashed #555;background:#fff;font-weight:700;font-size:15px;border-radius:4px;color:var(--sky-deep)}
.nav-cell.answered{border:2px solid var(--sky-dark);background:var(--sky-dark);color:#fff}
.nav-cell.current{outline:3px solid #111;outline-offset:2px}
.nav-cell.flagged::after{content:"";position:absolute;top:-7px;right:-7px;width:14px;height:14px;background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)}
.nav-cell.c{background:var(--green);border:2px solid var(--green);color:#fff}
.nav-cell.w{background:var(--red);border:2px solid var(--red);color:#fff}
.nav-cell.u{background:#fef7e0;border:2px solid var(--amber);color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:3px;display:inline-block}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ref-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdfe}
.ref-item b{display:block;margin-bottom:4px;color:var(--sky-deep)}
.list-q{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px;font-weight:600}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.err{background:var(--red-bg);color:var(--red)}
.msg.info{background:var(--sky-light);color:var(--sky-deep)}
.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:10px;z-index:60;font-weight:600;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}

/* ---------- Reading and Writing passages ---------- */
.passage{font-size:16.5px;line-height:1.75}
.passage p{margin:0 0 12px}
.passage ul{margin:6px 0 0;padding-left:20px}
.passage li{margin-bottom:6px}
.passage .data-table{margin:4px 0 12px}
.passage caption{font-weight:700;font-size:14px;margin-bottom:6px;text-align:left}
.blank{letter-spacing:1px;font-weight:600}
.module-tabs{flex-wrap:wrap}

/* ---------- Question timer (top bar) ---------- */
.q-head{flex-wrap:wrap;row-gap:6px}
.qtimer{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:18px;padding:5px 12px;font-weight:700;font-size:13.5px;line-height:1}
.qtimer:hover:not(:disabled){background:var(--sky-light)}
.qtimer .qt-clock{font-variant-numeric:tabular-nums;font-size:14px;padding-left:7px;border-left:1.5px solid currentColor;opacity:.9}
.qtimer.running{background:var(--sky-dark);color:#fff}
.qtimer.running:hover{background:var(--sky-deep)}
.qtimer.running .qt-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:qtblink 1s steps(2) infinite}
.qtimer.idle{animation:qtpulse 1.8s ease-in-out infinite}
@keyframes qtpulse{0%,100%{box-shadow:0 0 0 0 rgba(58,159,209,.5)}50%{box-shadow:0 0 0 7px rgba(58,159,209,0)}}
@keyframes qtblink{50%{opacity:.2}}
.qtimer kbd{font:600 11px inherit;border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.7}
.qtimer.running kbd{display:none}

/* ---------- Freeze / overtime / review navigation ---------- */
.tool-btn.frozen{background:#dff3fb;border-color:var(--sky-dark);color:var(--sky-deep)}
.timer.frozen{color:var(--sky-dark)}
.timer.over{color:var(--red)}
.timer-sub{font-size:11px;font-weight:700;color:var(--sky-deep);letter-spacing:.4px;text-transform:uppercase;min-height:14px}
.late-badge{font-size:12px;font-weight:700;color:var(--amber);background:#fef7e0;border:1px solid #f3d27a;border-radius:12px;padding:2px 9px;white-space:nowrap}
.late-badge[hidden]{display:none}
.nav-cell.late::before{content:"⏰";position:absolute;bottom:-10px;left:-8px;font-size:12px}
.review-nav{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--sky);border-radius:12px;padding:10px 12px;margin-top:16px;box-shadow:0 4px 14px rgba(29,106,150,.10)}
.rv-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.rv-m{font-size:12px;font-weight:700;color:var(--muted);width:26px}
.rv-chip{width:30px;height:28px;border-radius:6px;border:none;font-size:12px;font-weight:700;color:#fff;position:relative;padding:0}
.rv-chip.c{background:var(--green)}.rv-chip.w{background:var(--red)}
.rv-chip.u{background:#fef7e0;color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber)}
.rv-chip.cur{outline:3px solid #111;outline-offset:1px}
.rv-chip.late::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 1px #8a5a00}
.rv-chip:hover{filter:brightness(1.1)}
.rv-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:14px}
.rv-actions label{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted);cursor:pointer}
.rv-tip{font-size:12px;color:var(--muted);margin-top:4px}
.q-wrap{animation:qfade .18s ease}
@keyframes qfade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .topbar{grid-template-columns:1fr auto;grid-template-areas:"l c" "r r"}
  .tb-left{grid-area:l}.tb-center{grid-area:c}.tb-right{grid-area:r;justify-content:flex-start}
  .q-wrap.spr{grid-template-columns:1fr}
  .spr-dir{order:2;border-right:none;border-top:3px solid var(--sky-soft);padding:14px 0 0;margin-top:20px;font-size:13.5px}
  .q-wrap.spr .q-main{padding-left:4px}
}
@media (max-width:560px){
  .topbar,.bottombar,.module-tabs{padding-left:12px;padding-right:12px}
  .wrap{padding:0 12px}
  .brand{font-size:13px;white-space:normal}
  .tb-left img{height:36px}
  .timer{font-size:18px}
  .tool-btn{padding:6px 9px;font-size:12px}
  .bottombar{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "s r"}
  .student{grid-area:s}.nav-pill{grid-area:n;justify-self:center}.bb-right{grid-area:r}
  .nav-btn{padding:8px 18px}
  .q-text{font-size:16px}
  .choice{font-size:15px}
}
</style>
</head>
<body>

<!-- ============================ TOP BAR ============================ -->
<header class="topbar">
  <div class="tb-left">
    <img src="image.png" alt="Amro Academy logo" onerror="this.style.display='none'">
    <div>
      <div class="brand">Amro Academy – SAT Diagnostic Test</div>
      <div class="sec-label" id="secLabel">Section 2, Module 1: Math</div>
    </div>
  </div>
  <div class="tb-center">
    <div class="timer" id="moduleTimer">35:00</div>
    <div class="timer-sub" id="timerSub"></div>
    <button class="link-btn" id="hideTimerBtn">Hide</button>
  </div>
  <div class="tb-right">
    <button class="tool-btn" id="directionsBtn">Directions</button>
    <button class="tool-btn" id="refBtn">Reference</button>
    <a class="tool-btn" id="desmosBtn" href="https://www.desmos.com/" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Desmos ↗</a>
    <button class="tool-btn primary" id="submitBtn">Submit Exam</button>
    <button class="tool-btn danger" id="resetBtn">Reset Exam</button>
  </div>
</header>

<nav class="module-tabs">
  <button class="tab" data-module="1">Reading &amp; Writing 1</button>
  <button class="tab" data-module="2">Reading &amp; Writing 2</button>
  <button class="tab" data-module="3">Math 1</button>
  <button class="tab" data-module="4">Math 2</button>
  <span class="status-pill" id="statusPill">In progress</span>
</nav>
<div class="dash-line"></div>

const QUESTIONS = [{"id":"d_rw1q1","module":1,"number":1,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Although the mountain orchid is often described as rare, botanist Mei Tanaka notes that it is actually <span class=\"blank\">______<\/span> in the forests of southern Japan, where thousands of the plants bloom each spring; it only seems rare because those forests are seldom visited.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["unknown","abundant","endangered","fragile"],"correctAnswer":"B","hints":[],"solution":""},{"id":"d_rw1q2","module":1,"number":2,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The committee's report was remarkably <span class=\"blank\">______<\/span>: in only four pages, it summarized two years of research and stated each of its recommendations in a single sentence.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["tentative","verbose","concise","speculative"],"correctAnswer":"C","hints":[],"solution":""},{"id":"d_rw1q3","module":1,"number":3,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>Historians long assumed that medieval European peasants rarely traveled beyond their home villages. Analyzing court records from fourteenth-century England, historian Ruth Adeyemi found that many peasants regularly journeyed to markets twenty or more miles away. <u>Some even appeared as witnesses in courts in distant towns, suggesting that they had contacts far from home.<\/u> Adeyemi argues that the familiar image of the isolated village needs revision.<\/p>","question":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It provides additional evidence for Adeyemi's finding that peasants traveled more than historians had assumed.","It explains why historians long believed that peasants rarely traveled.","It describes the method Adeyemi used to analyze the court records.","It introduces a counterexample that challenges Adeyemi's argument."],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw1q4","module":1,"number":4,"domain":"Craft and Structure","skill":"Cross-text connections","type":"mcq","passage":"<p><b>Text 1<\/b><br>Some paleontologists argue that the large crests on the heads of hadrosaurs, a group of plant-eating dinosaurs, evolved mainly to attract mates, much as flashy feathers do in many modern birds.<\/p><p><b>Text 2<\/b><br>Paleontologist Lucas Brandt points out that the hollow crests of some hadrosaurs contain long internal air passages. Computer models show that air moving through these passages would have produced low, resonant sounds. Brandt argues that the crests likely served, at least in part, to help the animals communicate over long distances.<\/p>","question":"Based on the texts, how would Brandt (Text 2) most likely respond to the paleontologists' argument in Text 1?","choices":["By claiming that modern birds do not use their feathers to attract mates","By agreeing that the crests evolved only to attract mates","By suggesting that the crests may also have served a purpose other than attracting mates","By arguing that hadrosaurs were unable to produce sounds of any kind"],"correctAnswer":"C","hints":[],"solution":""},{"id":"d_rw1q5","module":1,"number":5,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>When a honeybee colony needs a new home, several hundred scout bees search the surrounding area and report back by dancing. Each scout dances longer for sites it judges to be better, and other scouts that visit a well-advertised site often begin dancing for it too. Over hours or days, support shifts until nearly all the scouts are dancing for a single site, and the swarm flies there. No single bee compares all the options; the decision emerges from many individual choices.<\/p>","question":"Which choice best states the main idea of the text?","choices":["Honeybee swarms usually move to the first site that any scout discovers.","A single experienced scout compares all the possible sites and chooses the best one for the colony.","Scout bees dance mainly to warn the colony about sites that are dangerous.","A honeybee swarm chooses a new home through a process in which many scouts' individual judgments combine into a group decision."],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw1q6","module":1,"number":6,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<table class=\"data-table\"><caption>Percentage of Seeds That Germinated at Three Temperatures<\/caption><thead><tr><th>Temperature<\/th><th>Species A<\/th><th>Species B<\/th><\/tr><\/thead><tbody><tr><td>10°C<\/td><td>22%<\/td><td>61%<\/td><\/tr><tr><td>20°C<\/td><td>74%<\/td><td>68%<\/td><\/tr><tr><td>30°C<\/td><td>81%<\/td><td>35%<\/td><\/tr><\/tbody><\/table><p>A biologist claims that Species B germinates better than Species A in cool conditions but worse than Species A in warm conditions.<\/p>","question":"Which choice most effectively uses data from the table to support the biologist's claim?","choices":["At 10°C, 61% of Species B seeds germinated compared with 22% of Species A seeds, but at 30°C, only 35% of Species B seeds germinated compared with 81% of Species A seeds.","At 20°C, Species A and Species B had similar germination rates of 74% and 68%, respectively.","At 30°C, 35% of Species B seeds germinated.","The germination rate of Species A rose from 22% at 10°C to 81% at 30°C."],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw1q7","module":1,"number":7,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>Researchers found that a species of coral living near an underwater volcanic vent, where the surrounding water is unusually acidic, grows much more slowly than the same species living in ordinary seawater. Because the world's oceans are gradually becoming more acidic as they absorb carbon dioxide from the air, these findings suggest that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["volcanic vents are the main cause of rising ocean acidity worldwide.","the coral species is unable to survive in ordinary seawater.","corals living near volcanic vents grow faster than other corals do.","the coral species may grow more slowly in many parts of the ocean in the future."],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw1q8","module":1,"number":8,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>In 1928, Alexander Fleming noticed that mold had contaminated one of his dishes of bacterial <span class=\"blank\">______<\/span> in the area surrounding the mold, the bacteria had died.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["cultures;","cultures that","cultures","cultures,"],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw1q9","module":1,"number":9,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>The collection of letters written by the poet to her younger brother, now housed in a university library, <span class=\"blank\">______<\/span> valuable insight into her early career.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["offer","offers","are offering","have offered"],"correctAnswer":"B","hints":[],"solution":""},{"id":"d_rw1q10","module":1,"number":10,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Many songbirds that migrate at night use the positions of the stars to find <span class=\"blank\">______<\/span> way, a skill that young birds appear to learn by watching the night sky before they leave the nest.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["they're","its","there","their"],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw1q11","module":1,"number":11,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>The Great Wall of China is often said to be visible from space with the naked eye. <span class=\"blank\">______<\/span> astronauts who have orbited Earth report that the wall is very difficult, if not impossible, to see without magnification.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Similarly,","However,","Therefore,","For example,"],"correctAnswer":"B","hints":[],"solution":""},{"id":"d_rw1q12","module":1,"number":12,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Wangari Maathai was an environmental activist from Kenya.<\/li><li>In 1977, she founded the Green Belt Movement.<\/li><li>The movement has planted more than 30 million trees.<\/li><li>In 2004, Maathai became the first African woman to win the Nobel Peace Prize.<\/li><\/ul>","question":"The student wants to emphasize the scale of the Green Belt Movement's work. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Green Belt Movement, founded by Wangari Maathai in Kenya in 1977, has planted more than 30 million trees.","Wangari Maathai founded the Green Belt Movement in 1977 and won the Nobel Peace Prize in 2004.","In 2004, Wangari Maathai became the first African woman to win the Nobel Peace Prize.","Wangari Maathai, an environmental activist from Kenya, founded the Green Belt Movement."],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw1q13","module":1,"number":13,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>The Hubble Space Telescope was launched in 1990.<\/li><li>Hubble observes mainly visible and ultraviolet light.<\/li><li>The James Webb Space Telescope was launched in 2021.<\/li><li>Webb observes mainly infrared light.<\/li><\/ul>","question":"The student wants to contrast the types of light the two telescopes observe. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Hubble Space Telescope was launched in 1990, and the James Webb Space Telescope was launched in 2021.","The James Webb Space Telescope, launched in 2021, observes mainly infrared light.","Both the Hubble and James Webb Space Telescopes observe light from distant objects in space.","Whereas the Hubble Space Telescope observes mainly visible and ultraviolet light, the James Webb Space Telescope observes mainly infrared light."],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw2q1","module":2,"number":1,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The historian's account of the treaty negotiations is notably <span class=\"blank\">______<\/span>: she presents the arguments of each delegation with equal care and refrains from judging which side acted more wisely.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["cursory","partisan","evenhanded","polemical"],"correctAnswer":"C","hints":[],"solution":""},{"id":"d_rw2q2","module":2,"number":2,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Some critics dismissed the composer's early works as merely <span class=\"blank\">______<\/span> of his teacher's style, but recent scholarship has shown that even his first pieces contained harmonic ideas his teacher never used.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["independent","critical","innovative","derivative"],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw2q3","module":2,"number":3,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The following text is from a novel.<\/p><p>Though the old captain's voice had lost none of its force, his stories had grown <u>thin<\/u> with repetition, and the younger sailors, who had heard each one a dozen times, listened only out of courtesy.<\/p>","question":"As used in the text, what does the word “thin” most nearly mean?","choices":["narrow in width","lacking in freshness","small in number","slender in build"],"correctAnswer":"B","hints":[],"solution":""},{"id":"d_rw2q4","module":2,"number":4,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>In an essay, a chef reflects on her training: “For years I believed that a great dish required rare and expensive ingredients. Then I spent a winter cooking in a mountain village where the market offered little beyond potatoes, cabbage, and salt pork. By spring I had learned more about technique than in all my years in the city, because with so few ingredients, every decision about heat, timing, and seasoning mattered.”<\/p>","question":"Which choice best states the main purpose of the text?","choices":["To compare the cost of ingredients in cities with their cost in villages","To describe how cooking with limited ingredients changed the chef's understanding of her craft","To explain why potatoes and cabbage are difficult to cook well","To argue that restaurants in cities should use only locally grown ingredients"],"correctAnswer":"B","hints":[],"solution":""},{"id":"d_rw2q5","module":2,"number":5,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>In a poem, the speaker describes the life of a lighthouse keeper on a remote island. A student claims that the poem portrays the keeper as finding meaning in work that others overlook.<\/p>","question":"Which quotation from the poem most effectively illustrates the student's claim?","choices":["“The tower stands alone above the foam, / Where gray waves break and seabirds make their home.”","“No ship will thank him, and no sailor know, / Yet still he climbs to set the lamp aglow.”","“His boots are worn, his coat is patched and old, / His hands are stiff and cracked from winter's cold.”","“The gulls wheel white across the morning sky / And call to boats that pass the island by.”"],"correctAnswer":"B","hints":[],"solution":""},{"id":"d_rw2q6","module":2,"number":6,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>Psychologist Kenji Mori hypothesizes that people remember information better when they explain it aloud to a listener than when they simply reread it, because explaining forces them to organize the ideas in their own words.<\/p>","question":"Which finding, if true, would most directly weaken Mori's hypothesis?","choices":["Participants reported that explaining a text aloud felt more tiring than rereading it.","Participants who reread a text twice recalled more of it than participants who read it only once.","Participants who explained a text to a listener recalled no more of it a week later than participants who spent the same amount of time rereading it.","Participants who explained a text to a listener recalled more of it a week later than participants who reread it."],"correctAnswer":"C","hints":[],"solution":""},{"id":"d_rw2q7","module":2,"number":7,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<table class=\"data-table\"><caption>Annual Ridership on City Public Transit (millions of trips)<\/caption><thead><tr><th>Year<\/th><th>Bus<\/th><th>Light rail<\/th><\/tr><\/thead><tbody><tr><td>2019<\/td><td>82<\/td><td>31<\/td><\/tr><tr><td>2020<\/td><td>45<\/td><td>14<\/td><\/tr><tr><td>2021<\/td><td>58<\/td><td>22<\/td><\/tr><tr><td>2022<\/td><td>66<\/td><td>30<\/td><\/tr><\/tbody><\/table><p>A city planner claims that after the sharp drop in 2020, light rail ridership recovered more fully than bus ridership did.<\/p>","question":"Which choice most effectively uses data from the table to support the planner's claim?","choices":["Both bus ridership and light rail ridership fell sharply from 2019 to 2020.","From 2021 to 2022, bus ridership and light rail ridership each increased by 8 million trips.","Bus ridership was higher than light rail ridership in every year shown in the table.","By 2022, light rail ridership had returned to 30 million trips, nearly its 2019 level of 31 million, while bus ridership, at 66 million trips, remained well below its 2019 level of 82 million."],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw2q8","module":2,"number":8,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>At an ancient settlement in the eastern Mediterranean, archaeologists found grinding stones bearing traces of wild grass seeds dated to about 23,000 years ago, more than 10,000 years before the earliest known farming in the region. Some of the seeds show signs of having been baked. Because wild grasses produce small seeds that take considerable labor to gather, grind, and cook, the find suggests that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["people in the region were investing significant effort in processing plant foods long before farming began there.","wild grass seeds were the main source of food for the settlement's inhabitants.","people in the region did not use fire to prepare food until after farming began.","farming in the region began about 23,000 years ago rather than at a later date."],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw2q9","module":2,"number":9,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The museum's newest acquisition is an extremely rare <span class=\"blank\">______<\/span> a 2,000-year-old bronze mirror whose surface is still polished enough to reflect light.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["object, and","object, which","object;","object:"],"correctAnswer":"D","hints":[],"solution":""},{"id":"d_rw2q10","module":2,"number":10,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Having spent a decade studying glaciers in Greenland, <span class=\"blank\">______<\/span><\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the changes in the island's ice sheet are described in a book by geologist Ana Petrova.","a book about how the island's ice sheet is changing was written by geologist Ana Petrova.","geologist Ana Petrova wrote a book about how the island's ice sheet is changing.","geologist Ana Petrova's book describes how the island's ice sheet is changing."],"correctAnswer":"C","hints":[],"solution":""},{"id":"d_rw2q11","module":2,"number":11,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>The two <span class=\"blank\">______<\/span> findings were published together in a single article, since each researcher's data helped explain the other's results.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["scientists'","scientists's","scientist's","scientists"],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw2q12","module":2,"number":12,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>The architect insisted that the library's exterior be covered in stone from a nearby quarry. Stone shipped from distant quarries would have cost considerably less. <span class=\"blank\">______<\/span> she argued that local stone would help the building blend into the surrounding hills and would weather in the same way as the town's older buildings.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Nevertheless,","For instance,","Therefore,","Similarly,"],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_rw2q13","module":2,"number":13,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>In 1843, Ada Lovelace published detailed notes on Charles Babbage's Analytical Engine, a proposed mechanical computer.<\/li><li>Her notes included a method for calculating a sequence of numbers called Bernoulli numbers.<\/li><li>This method is often regarded as the first published computer program.<\/li><li>Lovelace suggested that the machine could work with symbols as well as numbers and might, for example, compose music.<\/li><\/ul>","question":"The student wants to emphasize that Lovelace saw possibilities for the Analytical Engine beyond calculation. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Lovelace suggested that Babbage's Analytical Engine could work with symbols as well as numbers—it might, for example, compose music.","Lovelace's method for calculating Bernoulli numbers is often regarded as the first published computer program.","Lovelace's notes included a method for calculating Bernoulli numbers.","In 1843, Lovelace published detailed notes on Babbage's Analytical Engine, a proposed mechanical computer."],"correctAnswer":"A","hints":[],"solution":""},{"id":"d_ma1q1","module":3,"number":1,"domain":"Algebra","skill":"Linear equations in one variable","type":"mcq","question":"\\[3(x-4)+2x=2x+9\\] What value of \\(x\\) is the solution to the equation above?","hints":[],"solution":"","choices":["\\(21\\)","\\(3\\)","\\(\\dfrac{21}{5}\\)","\\(7\\)"],"correctAnswer":"D"},{"id":"d_ma1q2","module":3,"number":2,"domain":"Problem-Solving and Data Analysis","skill":"Percentages","type":"spr","question":"The price of a jacket was $80. The price was increased by 15%, and then the new price was decreased by 15%. What is the final price of the jacket, in dollars?","hints":[],"solution":"","acceptedAnswers":["78.2","78.20"],"correctAnswer":"78.2"},{"id":"d_ma1q3","module":3,"number":3,"domain":"Advanced Math","skill":"Equivalent expressions","type":"mcq","question":"Which expression is equivalent to \\((2x-3)^2\\)?","hints":[],"solution":"","choices":["\\(4x^2-9\\)","\\(4x^2-12x+9\\)","\\(4x^2+9\\)","\\(4x^2-6x+9\\)"],"correctAnswer":"B"},{"id":"d_ma1q4","module":3,"number":4,"domain":"Algebra","skill":"Linear functions (interpretation)","type":"mcq","question":"The total cost \\(C\\), in dollars, of a plumber's visit that lasts \\(h\\) hours is given by \\(C=45h+60\\). What is the best interpretation of \\(60\\) in this context?","hints":[],"solution":"","choices":["The number of hours the visit lasts","The cost of each hour of the visit","A fixed fee charged for every visit, regardless of its length","The total cost of a one-hour visit"],"correctAnswer":"C"},{"id":"d_ma1q5","module":3,"number":5,"domain":"Algebra","skill":"Systems of linear equations","type":"spr","question":"\\[2x+3y=12\\]\\[x-y=1\\] If \\((x,\\,y)\\) is the solution to the system of equations above, what is the value of \\(x+y\\)?","hints":[],"solution":"","acceptedAnswers":["5"],"correctAnswer":"5"},{"id":"d_ma1q6","module":3,"number":6,"domain":"Advanced Math","skill":"Exponential functions (modeling)","type":"mcq","question":"A town had a population of 2,400 in 2020. The population increases by 3% each year. Which function gives the town's population \\(P\\) \\(t\\) years after 2020?","hints":[],"solution":"","choices":["\\(P=2400(1.03)^t\\)","\\(P=2400(1.3)^t\\)","\\(P=240 /* =========================================================
   5. TIMERS (module countdown + per-question stopwatch)
   ========================================================= */
function moduleElapsed(m) {
  const t = state.moduleTimers[m];
  return t.elapsed + (t.start ? Date.now() - t.start : 0);
}
function pauseModule(m) {
  const t = state.moduleTimers[m];
  if (t.start) { t.elapsed += Date.now() - t.start; t.start = null; }
}
function startModule(m) {
  const t = state.moduleTimers[m];
  if (!t.start && !isLocked() && state.studentName && !state.frozen) t.start = Date.now();
}
function qt(id) {
  if (!state.qTimers[id]) state.qTimers[id] = { acc: 0, start: null };
  return state.qTimers[id];
}
const qElapsed = (id) => { const t = qt(id); return t.acc + (t.start ? Date.now() - t.start : 0); };
function stopQ(id) { const t = qt(id); if (t.start) { t.acc += Date.now() - t.start; t.start = null; } }
function stopAllQ() { Object.keys(state.qTimers).forEach(stopQ); }
function startQ(id) { if (state.frozen) return; stopAllQ(); qt(id).start = Date.now(); }
const isOvertime = (m) => moduleElapsed(m) >= modTime(m);
function markTiming(q) {
  if (!hasAnswer(q)) delete state.lateAnswers[q.id];
  else if (isOvertime(q.module)) state.lateAnswers[q.id] = true;
}
function stopAllTimers() { stopAllQ(); MODULES.forEach(pauseModule); }

function tick() {
  if (state.onBreak) { tickBreak(); return; }
  const m = state.currentModule;
  const remaining = modTime(m) - moduleElapsed(m);
  const el = $("moduleTimer");
  const over = remaining <= 0;
  el.textContent = state.timerHidden ? "" : (over ? "00:00" : fmt(remaining));
  el.classList.toggle("low", !over && remaining < 5 * 60 * 1000);
  el.classList.toggle("over", over);
  el.classList.toggle("frozen", !!state.frozen);
  const sub = $("timerSub");
  if (sub) sub.textContent = state.frozen && !isLocked() ? "❄ Time frozen" : "";
  if (over && !isLocked() && state.studentName) {
    if (m === state.stage && m < 4) { closeModal(); finishModule(true); }   // time's up → next module (or break)
    else if (m === 4 && state.stage === 4 && !sending) {                     // time's up → test submits itself
      state.autoSubmitted = true; saveState(); closeModal(); openSubmitReview(); sendReport();
    }
  }
  const q = currentQ();
  const clock = $("qClock");
  if (q && clock) clock.textContent = fmt(qElapsed(q.id));
}

function parseNum(str) {
  if (str === undefined || str === null) return NaN;
  const s = String(str).trim();
  if (/^-?(\d+\.?\d*|\.\d+)\/(\d+\.?\d*|\.\d+)$/.test(s)) {
    const [a, b] = s.split("/").map(Number);
    return b === 0 ? NaN : a / b;
  }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
function normalizeSpr(s) {
  let t = String(s).trim().replace(/\s+/g, "");
  if (/^-?0\.\d/.test(t)) t = t.replace("0.", ".");
  return t;
}
function isCorrect(q, ans) {
  if (ans === undefined || ans === null || String(ans).trim() === "") return false;
  if (q.type === "mcq") return ans === q.correctAnswer;
  const n = normalizeSpr(ans);
  if (q.acceptedAnswers.some(a => normalizeSpr(a) === n)) return true;
  const v = parseNum(ans), target = parseNum(q.correctAnswer);
  return !isNaN(v) && !isNaN(target) && Math.abs(v - target) < 1e-9;
}
function statusOf(q) {
  if (!hasAnswer(q)) return "unanswered";
  return isCorrect(q, state.answers[q.id]) ? "correct" : "wrong";
}
function buildStats() {
  const rows = QUESTIONS.map(q => ({
    q, status: statusOf(q), time: qElapsed(q.id), hints: state.hintLevel[q.id] || 0,
    late: hasAnswer(q) && !!state.lateAnswers[q.id],
    answer: hasAnswer(q) ? String(state.answers[q.id]) : "—"
  }));
  const total = rows.filter(r => r.status === "correct").length;
  const perModule = MODULES.map(m => {
    const rs = rows.filter(r => r.q.module === m);
    return { m, correct: rs.filter(r => r.status === "correct").length, onTime: rs.filter(r => r.status === "correct" && !r.late).length, late: rs.filter(r => r.late).length, total: rs.length, time: moduleElapsed(m) };
  });
  const perDomain = DOMAINS.filter(d => rows.some(r => r.q.domain === d)).map(d => {
    const rs = rows.filter(r => r.q.domain === d);
    const correct = rs.filter(r => r.status === "correct").length;
    const time = rs.reduce((s, r) => s + r.time, 0);
    return { d, correct, total: rs.length, pct: rs.length ? Math.round(correct / rs.length * 100) : 0, avg: rs.length ? time / rs.length : 0, hints: rs.reduce((s, r) => s + r.hints, 0) };
  });
  const totalTime = rows.reduce((s, r) => s + r.time, 0);
  const hintsUsed = rows.reduce((s, r) => s + r.hints, 0);
  const correctNoHint = rows.filter(r => r.status === "correct" && r.hints === 0).length;
  const onTime = rows.filter(r => r.status === "correct" && !r.late).length;
  const lateCount = rows.filter(r => r.late).length;
  return { rows, total, perModule, perDomain, totalTime, hintsUsed, correctNoHint, onTime, lateCount, count: rows.length };
}

    if (corrected && hasAnswer(q)) cls += isCorrect(q, val) ? " correct" : " wrong";
    body = `<input class="${cls}" id="sprInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
              maxlength="${val.startsWith("-") ? 6 : 5}" value="${esc(val)}" ${locked ? "disabled" : ""} aria-label="Your answer">
            <div class="preview" id="sprPreview"></div>`;
  }

  // hints
  let hintHtml = "";
  if (hintOpen) {
    hintHtml = `<div class="hint-box">`;
    if (hintLevel === 0) hintHtml += `<div class="hint" style="color:var(--muted)">Hints are revealed one at a time.</div>`;
    for (let i = 0; i < hintLevel; i++) hintHtml += `<div class="hint"><b>Hint ${i + 1}:</b> ${q.hints[i]}</div>`;
    if (hintLevel < q.hints.length) hintHtml += `<button class="small-btn" id="nextHintBtn">${hintLevel === 0 ? "Reveal Hint 1" : "Reveal Hint 2"}</button>`;
    else hintHtml += `<div style="font-size:13px;color:var(--muted)">All hints revealed.</div>`;
    hintHtml += `</div>`;
  }

  // review (after correction)
  let reviewHtml = "";
  if (corrected) {
    const st = statusOf(q);
    reviewHtml = `<div class="review-box"><span class="status-badge ${st}">${st === "correct" ? "✓ Correct" : st === "wrong" ? "✗ Incorrect" : "Not answered"}</span>`;
    if (q.type === "spr") {
      reviewHtml += `<div>Your answer: ${hasAnswer(q) ? `<span class="${st === "correct" ? "ans-g" : "ans-r"}">${esc(ans)}</span>` : "<i>none</i>"}
        &nbsp;|&nbsp; Accepted answer(s): <span class="ans-g">${esc(q.acceptedAnswers.join(", "))}</span></div>`;
    } else if (st === "unanswered") {
      reviewHtml += `<div>Correct answer: <span class="ans-g">${q.correctAnswer}</span></div>`;
    }
    reviewHtml += `<div style="margin-top:8px"><b>Step-by-step solution:</b> ${q.solution}</div>
      <div style="margin-top:6px;font-size:13px;color:var(--muted)">${esc(q.domain)} · ${esc(q.skill)} · Time: ${fmt(qElapsed(q.id))} · Hints used: ${hintLevel}${hasAnswer(q) && state.lateAnswers[q.id] ? " · ⏰ Answered after time" : ""}</div></div>`;
  }

  area.innerHTML = (corrected ? reviewNavHtml(q) : "") + `
    <div class="q-wrap ${q.type === "spr" || q.passage ? "spr" : ""}">
      ${q.passage ? `<aside class="spr-dir passage">${q.passage}</aside>` : q.type === "spr" ? sprDirections() : ""}
      <section class="q-main">
        <div class="q-head">
          <span class="q-num">${q.number}</span>
          <button class="flag-btn ${state.marked[q.id] ? "on" : ""}" id="flagBtn">${flagSvg(!!state.marked[q.id])} Mark for Review</button>
          <span class="late-badge" id="lateBadge" title="This answer was given after the module time ran out" ${hasAnswer(q) && state.lateAnswers[q.id] ? "" : "hidden"}>⏰ Answered after time</span>
          <span class="spacer"></span>
          ${q.type === "mcq" && !locked ? `<button class="abc-btn ${elimOn ? "on" : ""}" id="abcBtn" title="Cross out answer choices">ABC</button>` : ""}
        </div>
        <div class="q-text">${q.question}</div>
        ${body}
        ${hintHtml}
        ${reviewHtml}
      </section>
    </div>`;

  if (q.type === "spr") updatePreview();
  typeset(area);
  bindQuestionEvents(q);
  if (corrected) bindReviewNav();
}

/* ---------- Review navigation (after correction) ---------- */
const ORDER = () => [...byModule(1), ...byModule(2)];
function reviewNavHtml(q) {
  const cls = { correct: "c", wrong: "w", unanswered: "u" };
  const row = (m) => `<div class="rv-row"><span class="rv-m">M${m}</span>${byModule(m).map(x => {
    const st = statusOf(x), late = hasAnswer(x) && state.lateAnswers[x.id];
    return `<button class="rv-chip ${cls[st]} ${x.id === q.id ? "cur" : ""} ${late ? "late" : ""}" data-rv="${x.id}"
      title="Module ${m} Q${x.number}: ${statusLabel(st)}${late ? " (answered after time)" : ""}">${x.number}</button>`;
  }).join("")}</div>`;
  const st = statusOf(q);
  const mistakes = ORDER().filter(x => statusOf(x) !== "correct").length;
  return `<div class="review-nav" id="reviewNav">${row(1)}${row(2)}
    <div class="rv-actions">
      <button class="small-btn" id="prevMistake" ${mistakes ? "" : "disabled"}>← Previous mistake</button>
      <span class="res-${st}">Module ${q.module} · Q${q.number} · ${statusLabel(st)}</span>
      <button class="small-btn" id="nextMistake" ${mistakes ? "" : "disabled"}>Next mistake →</button>
      <label><input type="checkbox" id="onlyMistakes" ${state.reviewOnlyMistakes ? "checked" : ""}> Back / Next skip correct answers</label>
    </div>
    <div class="rv-tip">Click any number to jump to it · use the ← → arrow keys to move · a yellow dot means answered after time</div>
  </div>`;
}
function stepTo(dir, onlyMistakes) {
  const list = ORDER(), cur = currentQ();
  let i = list.findIndex(x => x.id === cur.id);
  while (true) {
    i += dir;
    if (i < 0 || i >= list.length) break;
    if (!onlyMistakes || statusOf(list[i]) !== "correct") { goTo(list[i].module, list[i].number - 1); return true; }
  }
  toast(onlyMistakes ? (dir > 0 ? "No more mistakes after this question." : "No mistakes before this question.")
                     : (dir > 0 ? "This is the last question." : "This is the first question."), 2500);
  return false;
}
function bindReviewNav() {
  document.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { const x = findQ(b.dataset.rv); goTo(x.module, x.number - 1); });
  const p = $("prevMistake"), n = $("nextMistake"), o = $("onlyMistakes");
  if (p) p.onclick = () => stepTo(-1, true);
  if (n) n.onclick = () => stepTo(1, true);
  if (o) o.onchange = () => { state.reviewOnlyMistakes = o.checked; saveState(); };
}

function updatePreview() {
  const inp = $("sprInput"), pv = $("sprPreview");
  if (!inp || !pv) return;
  const v = inp.value.trim();
  if (!v) { pv.innerHTML = ""; return; }
  let tex = v.replace(/-/g, "-");
  const m = v.match(/^(-?)(.+)\/(.+)$/);
  if (m) tex = `${m[1]}\\dfrac{${m[2]}}{${m[3]}}`;
  let html = esc(v);
  if (window.katex) { try { html = katex.renderToString(tex, { throwOnError: false }); } catch (e) {} }
  const valid = !isNaN(parseNum(v));
  pv.innerHTML = `<b>Answer Preview:</b><span class="pv">${html}</span>${valid ? "" : ` <span style="color:var(--red);font-size:13px;margin-left:8px">Not a valid number yet</span>`}`;
}

function renderResults() {
  const box = $("results");
  if (!state.corrected) { box.innerHTML = ""; return; }
  const s = buildStats();
  const pct = Math.round(s.total / s.count * 100);
  const rowsHtml = s.rows.map(r => `<tr class="clickable" data-goto="${r.q.id}">
      <td>M${r.q.module} Q${r.q.number}</td><td>${esc(r.q.domain)}</td><td>${r.q.type.toUpperCase()}</td>

      <div class="stat"><div class="k">Score within time</div><div class="v">${s.onTime} / ${s.count}</div><div style="font-size:12px;color:var(--muted)">Answered after time: ${s.lateCount}</div></div>
      <div class="stat"><div class="k">Time on questions</div><div class="v">${fmt(s.totalTime)}</div></div>
      <div class="stat"><div class="k">Hints used</div><div class="v">${s.hintsUsed}</div><div style="font-size:12px;color:var(--muted)">Correct without hints: ${s.correctNoHint}</div></div>
    </div>
    <div class="table-scroll"><table class="rtable"><thead><tr><th>Domain</th><th>Correct</th><th>%</th><th>Avg time / question</th><th>Hints</th></tr></thead><tbody>
      ${s.perDomain.map(d => `<tr><td>${esc(d.d)}</td><td>${d.correct} / ${d.total}</td><td>${d.pct}%</td><td>${fmt(d.avg)}</td><td>${d.hints}</td></tr>`).join("")}
    </tbody></table></div>
    <details><summary>Per-question breakdown (click a row to open that question)</summary>
      <div class="table-scroll"><table class="rtable"><thead><tr><th>Q</th><th>Domain</th><th>Type</th><th>Result</th><th>Your answer</th><th>Correct</th><th>Time</th><th>Hints</th><th>Timing</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div></details>` : ""}

  const tg = $("toggleResults");

    const q = findQ(tr.dataset.goto); goTo(q.module, q.number - 1);

}

/* =========================================================
   8. QUESTION EVENTS
   ========================================================= */
function bindQuestionEvents(q) {
  $("flagBtn").onclick = () => { state.marked[q.id] = !state.marked[q.id]; saveState(); renderQuestion(); };
  if ($("hintBtn")) $("hintBtn").onclick = () => {
    state.hintOpen[q.id] = !state.hintOpen[q.id];
    if (state.hintOpen[q.id] && !state.hintLevel[q.id]) state.hintLevel[q.id] = 1; // first open reveals Hint 1
    saveState(); renderQuestion();
  };
  const nh = $("nextHintBtn");
  if (nh) nh.onclick = () => { state.hintLevel[q.id] = Math.min(2, (state.hintLevel[q.id] || 0) + 1); saveState(); renderQuestion(); };

  const abc = $("abcBtn");
  if (abc) abc.onclick = () => { state.eliminatorOn[q.id] = !state.eliminatorOn[q.id]; saveState(); renderQuestion(); };

  if ($("timerBtn")) $("timerBtn").onclick = () => {
    if (isLocked()) return;
    if (qt(q.id).start) stopQ(q.id); else startQ(q.id);
    saveState(); renderQuestion();
  };

  document.querySelectorAll("[data-choice]").forEach(btn => btn.onclick = () => {
    if (isLocked()) return;
    const L = btn.dataset.choice;
    if ((state.eliminated[q.id] || []).includes(L)) return;
    state.answers[q.id] = L;
    markTiming(q);               // flag answers given after the module time ran out
    stopQ(q.id);                 // answering stops the stopwatch
    saveState(); renderQuestion();
  });
  document.querySelectorAll("[data-elim]").forEach(btn => btn.onclick = () => {
    const L = btn.dataset.elim;
    const arr = state.eliminated[q.id] || (state.eliminated[q.id] = []);
    if (!arr.includes(L)) arr.push(L);
    if (state.answers[q.id] === L) { delete state.answers[q.id]; markTiming(q); } // crossing out the selected choice clears it
    saveState(); renderQuestion();
  });
  document.querySelectorAll("[data-undo]").forEach(btn => btn.onclick = () => {
    state.eliminated[q.id] = (state.eliminated[q.id] || []).filter(x => x !== btn.dataset.undo);
    saveState(); renderQuestion();
  });

  const inp = $("sprInput");
  if (inp) {
    inp.oninput = () => {
      let v = inp.value.replace(/[^0-9.\/-]/g, "");
      v = v.replace(/(?!^)-/g, "");                 // minus only at the start
      const parts = v.split("/"); if (parts.length > 2) v = parts[0] + "/" + parts.slice(1).join("");
      const max = v.startsWith("-") ? 6 : 5;
      v = v.slice(0, max);
      inp.maxLength = max;
      if (inp.value !== v) inp.value = v;
      state.answers[q.id] = v;
      markTiming(q);
      const lb = $("lateBadge"); if (lb) lb.hidden = !(hasAnswer(q) && state.lateAnswers[q.id]);
      if (v.length) stopQ(q.id);                    // typing an answer stops the stopwatch
      saveState(); updatePreview(); refreshTimerUi(q);
    };
  }
}
function timerClass(q) {
  const running = !!qt(q.id).start;
  return running ? "running" : (qElapsed(q.id) === 0 && !isLocked() && !state.frozen && !hasAnswer(q) ? "idle" : "");
}
function timerInner(q) {
  const running = !!qt(q.id).start, el = qElapsed(q.id);
  const icon = running ? '<span class="qt-dot"></span>' : "⏱";
  const label = running ? "Stop" : (el > 0 ? "Resume" : "Start timer");
  return `${icon}<span>${label}</span>${running ? "" : "<kbd>T</kbd>"}<span class="qt-clock" id="qClock">${fmt(el)}</span>`;
}
function refreshTimerUi(q) {
  const b = $("timerBtn"); if (!b) return;
  b.className = "qtimer " + timerClass(q);
  b.innerHTML = timerInner(q);
}

/* =========================================================
   9. NAVIGATION
   ========================================================= */
function goTo(m, idx) {
  if (m !== state.stage) return;             // a finished module can't be reopened
  const n = byModule(m).length;
  idx = Math.max(0, Math.min(n - 1, idx));
  stopAllQ();                                  // leaving a question pauses its stopwatch
  if (m !== state.currentModule) { pauseModule(state.currentModule); state.currentModule = m; startModule(m); }
  state.currentIndex[m] = idx;
  saveState(); render();
  const main = $("main");
  if (state.corrected) {
    // keep the review bar in view instead of jumping back to the results panel
    const top = $("questionArea").getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - 8;
    main.scrollTop = Math.max(0, top);
  } else main.scrollTop = 0;
}
function next() {
  if (state.corrected) { stepTo(1, state.reviewOnlyMistakes); return; }
  const m = state.currentModule, i = state.currentIndex[m], n = byModule(m).length;
  if (i < n - 1) goTo(m, i + 1);
  else openNavigator();                       // end of module: review page, like Bluebook
}
function back() {
  if (state.corrected) { stepTo(-1, state.reviewOnlyMistakes); return; }
  const m = state.currentModule, i = state.currentIndex[m];
  if (i > 0) goTo(m, i - 1);

}

}

/* ---------- Password gate (only a SHA-256 hash is stored) ---------- */
const PASSWORD_HASH = "806d3d5697b651f31bc592e5fa0fffb8e936cbc99f13242025e383bdc0474519";
function sha256Hex(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const mp = Math.pow, maxWord = mp(2, 32); let result = "", i, j;
  const words = [], bitLen = ascii.length * 8, k = [], isComposite = {};
  let hash = [], primeCounter = 0;
  for (let c = 2; primeCounter < 64; c++) {
    if (!isComposite[c]) { for (i = 0; i < 313; i += c) isComposite[i] = c; hash[primeCounter] = (mp(c, .5) * maxWord) | 0; k[primeCounter++] = (mp(c, 1 / 3) * maxWord) | 0; }
  }
  hash = hash.slice(0, 8);
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return ""; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = (bitLen / maxWord) | 0; words[words.length] = bitLen;
  for (j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; result += (b < 16 ? "0" : "") + b.toString(16); }
  return result;
}
function openPasswordModal() {
  openModal(head("🔒 Password required", false) + `<div class="modal-body">

function openNavigator() {
  const m = state.currentModule;
  const cells = byModule(m).map((q, i) => {
    let cls = "nav-cell";
    if (state.corrected) cls += " " + ({ correct: "c", wrong: "w", unanswered: "u" }[statusOf(q)]);

  }).join("");
  const legend = state.corrected
    ? `<span><i class="lg" style="background:var(--green)"></i>Correct</span><span><i class="lg" style="background:var(--red)"></i>Wrong</span><span><i class="lg" style="background:#fef7e0;border:2px solid var(--amber)"></i>Unanswered</span><span><i class="lg" style="background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)"></i>For Review</span>`

  openModal(head(modLabel(m) + " Questions") + `<div class="modal-body">
    <div class="legend">${legend}</div>
    <div class="nav-grid">${cells}</div>
    ${state.submitted ? "" : `<div style="display:flex;justify-content:flex-end"><button class="tool-btn primary" id="navFinish">${m < 4 ? "Next Module →" : "Submit Exam"}</button></div>`}</div>`);
  $("modal").querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { closeModal(); goTo(m, Number(b.dataset.jump)); });
  const nf = $("navFinish");
  if (nf) nf.onclick = () => { closeModal(); state.stage < 4 ? openFinishModule() : openSubmitReview(); };
}

function openDirections() {
  openModal(head("Directions") + `<div class="modal-body">
    ${isRW(state.currentModule) ? `<p>The questions in this section address a number of important reading and writing skills. Each question includes one or more passages, which may include a table.

    <p>Unless otherwise indicated: all variables and expressions represent real numbers; figures are drawn to scale; figures lie in a plane;

function confirmModal(title, text, okLabel, onOk, danger = false) {

  $("okBtn").onclick = () => { closeModal(); onOk(); };
