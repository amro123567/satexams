/* =========================================================
   11. RESET
   ========================================================= */
/* =========================================================
   FREEZE TIME
   ========================================================= */
function toggleFreeze() {
  if (isLocked()) return;
  if (state.frozen) { state.frozen = false; startModule(state.currentModule); toast("Time resumed.", 2500); }
  else { stopAllTimers(); state.frozen = true; toast("Time frozen. The module timer and question stopwatch are paused.", 3500); }
  saveState(); render();
}

/* =========================================================
   TEST-DAY FLOW
   ========================================================= */
function openFinishModule() {
  const m = state.stage, un = byModule(m).filter(q => !hasAnswer(q)).length;
  const nextText = m === 2 ? "Next is a <b>5-minute break</b>, then the Math section."
    : `Module ${MODULE_INFO[m + 1].sub} of ${MODULE_INFO[m + 1].name} and its ${MODULE_INFO[m + 1].min}-minute timer will start right away.`;
  confirmModal("Finish this module",
    (un ? `You have <b>${un} unanswered question${un > 1 ? "s" : ""}</b> in this module. There is no penalty for guessing.<br><br>` : "") +
    `Once you move on, <b>you can't return to this module</b>. ${nextText}`,
    m === 2 ? "Start the break" : "Next module", () => finishModule(false));
}
function finishModule(auto) {
  const m = state.stage;
  if (m >= 4 || isLocked()) return;
  stopAllQ(); pauseModule(m);
  if (m === 2) {                                   // break between the two sections
    state.stage = 3; state.currentModule = 3; state.currentIndex[3] = 0;
    state.onBreak = true; state.breakStart = Date.now();
    saveState(); render(); $("main").scrollTop = 0;
    toast(auto ? "Time is up for Reading and Writing. Your 5-minute break has started." : "Your 5-minute break has started.", 5000);
    return;
  }
  startModuleNow(m + 1, auto ? `Time is up. ${modLabel(m + 1)} has started.` : `${modLabel(m + 1)} has started.`);
}
function startModuleNow(m, msg) {
  state.onBreak = false; state.stage = m; state.currentModule = m; state.currentIndex[m] = 0;
  startModule(m); saveState(); render(); $("main").scrollTop = 0;
  toast(msg + ` You have ${MODULE_INFO[m].min} minutes.`, 5000);
}
function endBreak() { if (state.onBreak) startModuleNow(3, "The Math section has started."); }
function tickBreak() {
  const left = BREAK_MS - (Date.now() - state.breakStart);
  const el = $("moduleTimer"); el.textContent = fmt(Math.max(0, left)); el.classList.remove("low", "over");
  const bt = $("breakClock"); if (bt) bt.textContent = fmt(Math.max(0, left));
  if (left <= 0) endBreak();
}
function breakHtml() {
  return `<div style="max-width:640px;margin:50px auto;text-align:center;padding:0 16px">
    <div style="font-size:15px;font-weight:700;color:var(--sky-deep);letter-spacing:.06em;text-transform:uppercase">Scheduled break</div>
    <div id="breakClock" style="font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0">${fmt(Math.max(0, BREAK_MS - (Date.now() - state.breakStart)))}</div>
    <p style="font-size:16px;color:var(--muted)">You've finished the Reading and Writing section. Stand up, stretch, drink some water.
      The Math section (2 modules, 18 minutes each) starts automatically when the break ends.</p>
    <button class="tool-btn primary" id="resumeBtn" style="font-size:15px;padding:10px 22px">Resume Testing Now →</button>
  </div>`;
}
function submittedHtml() {
  return `<div style="max-width:620px;margin:60px auto;text-align:center;padding:0 16px">
    <div style="font-size:52px;line-height:1">✓</div>
    <h2 style="margin:10px 0 6px">Your test has been submitted</h2>
    <p style="color:var(--muted);font-size:16px">${state.autoSubmitted ? "Time ran out in the last module, so your answers were submitted automatically. " : ""}
      Thank you, ${esc(state.studentName)}. Your teacher will receive your answers and score.</p>
    ${state.emailSent ? `<div class="msg ok" style="display:inline-block">Report sent ✓</div>`
      : `<div class="msg err" style="display:inline-block">The report has not been sent yet.</div>
         <div style="margin-top:12px"><button class="tool-btn primary" id="resendBtn">Send report</button></div>`}
  </div>`;
}

function resetExam() {
  confirmModal("Reset Exam", "Are you sure? All answers and times will be erased.", "Yes, reset everything", () => {
    localStorage.removeItem(STORAGE_KEY);
    state = freshState();
    sending = false;
    saveState(); render(); openPasswordModal();
  }, true);
}

/* =========================================================
   12. CORRECTION
   ========================================================= */
function correctExam() {
  if (state.corrected) { state.resultsOpen = true; saveState(); renderResults(); $("main").scrollTop = 0; return; }
  confirmModal("Correct Exam", "This will calculate your score, show correct answers in green and wrong answers in red, and <b>lock your answers</b>. Continue?", "Correct now", () => {
    stopAllTimers();
    state.corrected = true; state.correctedAt = new Date().toISOString(); state.resultsOpen = true;
    saveState(); render(); $("main").scrollTop = 0;
    const s = buildStats();
    toast("Score: " + s.total + " / " + s.count);
  });
}

/* =========================================================
   13. REPORT + EMAILJS
   ========================================================= */
/* ---------- Estimated SAT scores (200–800 per section) ----------
   Short diagnostic: raw scores are scaled to a full-length test and read on hard-route curves. The real test uses IRT and an
   adaptive Module 2, so these are estimates, not official scores. */
const RW_CURVE = [[0,200],[10,330],[20,450],[30,560],[35,610],[40,660],[45,710],[48,740],[50,760],[52,780],[54,800]];
const MATH_CURVE = [[0,200],[10,380],[20,500],[25,560],[30,630],[33,670],[35,700],[38,740],[40,760],[42,780],[44,800]];
function estimateScaled(raw, curve) {
  for (let i = 1; i < curve.length; i++) {
    const [x0, y0] = curve[i - 1], [x1, y1] = curve[i];
    if (raw <= x1) return Math.max(200, Math.min(800, Math.round((y0 + (raw - x0) * (y1 - y0) / (x1 - x0)) / 10) * 10));
  }
  return 800;
}
function estimateSAT(rwRaw, mathRaw) {
  const rw = estimateScaled(rwRaw * 54 / 26, RW_CURVE), math = estimateScaled(mathRaw * 2, MATH_CURVE);
  return { rw, math, total: rw + math };
}

function buildReport() {
  const s = buildStats();
  const date = new Date().toLocaleString();
  const pct = (x, y) => y ? Math.round(x / y * 100) : 0;
  const used = (m) => fmt(Math.min(moduleElapsed(m), modTime(m))) + " of " + MODULE_INFO[m].min + ":00";
  const right = (q) => q.type === "mcq" ? q.correctAnswer : q.acceptedAnswers.join(" or ");
  const ans = (r) => r.status === "unanswered" ? "(blank)" : r.answer;
  const sec = (rw) => { const rs = s.rows.filter(r => isRW(r.q.module) === rw); return { c: rs.filter(r => r.status === "correct").length, n: rs.length }; };
  const RWs = sec(true), MAs = sec(false);
  const est = estimateSAT(RWs.c, MAs.c);
  const mistakes = s.rows.filter(r => r.status !== "correct");
  const how = state.autoSubmitted ? "automatically (time ran out in the last module)" : "by the student";

  let t = "AMRO ACADEMY – SAT DIAGNOSTIC TEST REPORT\n========================================\n";
  t += "Student: " + state.studentName + "\nDate: " + date + "\nSubmitted: " + how + "\n\n";
  t += "Reading and Writing: " + RWs.c + "/" + RWs.n + " (" + pct(RWs.c, RWs.n) + "%)\n";
  t += "Math: " + MAs.c + "/" + MAs.n + " (" + pct(MAs.c, MAs.n) + "%)\n";
  t += "TOTAL: " + s.total + "/" + s.count + " (" + pct(s.total, s.count) + "%)\n\n";
  t += "ESTIMATED SAT SCORE: " + est.total + " / 1600\n";
  t += "  Reading and Writing: " + est.rw + " / 800\n  Math: " + est.math + " / 800\n";
  t += "  (Estimate from a typical digital SAT conversion. The real SAT adjusts for question difficulty, so official scores can differ.)\n\n";
  s.perModule.forEach(pm => { t += modLabel(pm.m) + ": " + pm.correct + "/" + pm.total + " | time used " + used(pm.m) + "\n"; });
  t += "\nSCORE BY DOMAIN\n";
  s.perDomain.forEach(d => { t += "- " + d.d + ": " + d.correct + "/" + d.total + " (" + d.pct + "%)\n"; });
  t += "\nMISTAKES & BLANKS (" + mistakes.length + ")\n";
  if (!mistakes.length) t += "None — perfect score!\n";
  mistakes.forEach(r => { t += "- " + qLabel(r.q) + " | " + r.q.domain + " – " + r.q.skill + " | Student: " + ans(r) + " | Correct: " + right(r.q) + "\n"; });
  t += "\nALL ANSWERS\n";
  s.rows.forEach(r => { t += qLabel(r.q) + " | " + ans(r) + " | correct " + right(r.q) + " | " + statusLabel(r.status) + "\n"; });

  const color = { correct: "#1e8e3e", wrong: "#c5221f", unanswered: "#b06000" };
  const res = (st) => `<font color="${color[st]}"><b>${statusLabel(st)}</b></font>`;
  const tbl = (heads, rows) => `<table border="1" cellpadding="4" cellspacing="0" style="border-collapse:collapse;font:13px Arial;margin:6px 0 16px"><tr bgcolor="#e8f6fc"><th>${heads.join("</th><th>")}</th></tr>${rows.join("")}</table>`;
  const tr = (cells) => `<tr><td>${cells.join("</td><td>")}</td></tr>`;
  let h = `<div style="font:14px Arial"><h2 style="color:#1d6a96">Amro Academy – SAT Diagnostic Test Report</h2>`;
  h += `<p><b>Student:</b> ${esc(state.studentName)}<br><b>Date:</b> ${esc(date)}<br><b>Submitted:</b> ${how}</p>`;
  h += `<div style="border:2px solid #3a9fd1;border-radius:8px;padding:10px 14px;margin:8px 0 14px;background:#e8f6fc">
    <div style="font-size:12px;color:#1d6a96;font-weight:bold;text-transform:uppercase">Estimated SAT score</div>
    <div style="font-size:28px;font-weight:bold;margin:2px 0">${est.total} <span style="font-size:16px;color:#555">/ 1600</span></div>
    <div>Reading and Writing: <b>${est.rw}</b> / 800 &nbsp;·&nbsp; Math: <b>${est.math}</b> / 800</div>
    <div style="font-size:12px;color:#555;margin-top:4px">Estimate based on a typical digital SAT conversion. The real SAT adjusts for question difficulty, so official scores can differ.</div></div>`;
  h += tbl(["Section", "Correct", "%", "Estimated score"], [tr(["Reading and Writing", RWs.c + "/" + RWs.n, pct(RWs.c, RWs.n) + "%", est.rw + " / 800"]), tr(["Math", MAs.c + "/" + MAs.n, pct(MAs.c, MAs.n) + "%", est.math + " / 800"]), tr(["<b>Total</b>", "<b>" + s.total + "/" + s.count + "</b>", "<b>" + pct(s.total, s.count) + "%</b>", "<b>" + est.total + " / 1600</b>"])]);
  h += `<h3>By module</h3>` + tbl(["Module", "Correct", "Time used"], s.perModule.map(pm => tr([modLabel(pm.m), pm.correct + "/" + pm.total, used(pm.m)])));
  h += `<h3>By domain</h3>` + tbl(["Domain", "Correct", "%"], s.perDomain.map(d => tr([d.d, d.correct + "/" + d.total, d.pct + "%"])));
  h += `<h3>Mistakes &amp; blanks (${mistakes.length})</h3>` + (mistakes.length ? tbl(["Q", "Domain", "Skill", "Student", "Correct"],
    mistakes.map(r => tr([qLabel(r.q), r.q.domain, esc(r.q.skill), r.status === "unanswered" ? res("unanswered") : `<font color="#c5221f"><b>${esc(r.answer)}</b></font>`, esc(right(r.q))]))) : "<p>None — perfect score!</p>");
  h += `<h3>All answers</h3>` + tbl(["Q", "Student", "Correct", "Result"], s.rows.map(r => tr([qLabel(r.q), esc(ans(r)), esc(right(r.q)), res(r.status)])));
  h += `</div>`;
  return { text: t, html: h, stats: s, date };
}

function openSubmitReview() {
  if (state.emailSent) { toast("This exam has already been submitted."); return; }
  const un = byModule(state.currentModule).filter(q => !hasAnswer(q));
  const mk = byModule(state.currentModule).filter(q => state.marked[q.id]);
  const chips = (list) => list.length
    ? `<div class="list-q">${list.map(q => `<button class="chip" data-go="${q.id}">${qLabel(q)}</button>`).join("")}</div>`
    : `<p style="color:var(--green);font-weight:600">None</p>`;
  openModal(head("Check Your Work") + `<div class="modal-body">
    <p>Once you submit, your answers are locked and sent to your teacher. You won't see your score here.</p>
    <b>Unanswered questions (${un.length})</b>${chips(un)}
    <b>Marked for review (${mk.length})</b>${chips(mk)}
    <div id="sendStatus"></div></div>
    <div class="modal-foot"><button class="tool-btn" data-close>Back to exam</button>
    <button class="tool-btn primary" id="confirmSubmit">Confirm Submit</button></div>`);
  $("modal").querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const q = findQ(b.dataset.go); closeModal(); goTo(q.module, q.number - 1); });
  $("confirmSubmit").onclick = sendReport;
}

async function sendReport() {
  if (sending || state.emailSent) return;            // prevent double sending
  const btn = $("confirmSubmit"), status = $("sendStatus");
  sending = true;
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  if (status) status.innerHTML = `<div class="msg info">Sending your report…</div>`;

  stopAllTimers();
  state.submitted = true; state.submittedAt = state.submittedAt || new Date().toISOString();
  saveState(); render();

  const rep = buildReport();
  const sizeOf = (o) => new Blob([JSON.stringify(o)]).size;
  const params = {
    to_email: RECIPIENT_EMAIL,
    student_name: state.studentName,
    submit_date: rep.date,
    score: (() => { const rw = rep.stats.rows.filter(r => isRW(r.q.module) && r.status === "correct").length, ma = rep.stats.rows.filter(r => !isRW(r.q.module) && r.status === "correct").length, e = estimateSAT(rw, ma); return "≈" + e.total + " (R&W ≈" + e.rw + ", Math ≈" + e.math + ") · raw "; })() + rep.stats.total + "/" + rep.stats.count + " (R&W " + rep.stats.rows.filter(r => isRW(r.q.module) && r.status === "correct").length + "/26 · Math " + rep.stats.rows.filter(r => !isRW(r.q.module) && r.status === "correct").length + "/22)",
    total_time: MODULES.map(m => MODULE_INFO[m].tab + " " + fmt(Math.min(moduleElapsed(m), modTime(m)))).join(" · "),
    report: rep.text,
    report_html: rep.html
  };
  // EmailJS limit is 50 KB: trim the plain-text copy first if needed
  if (sizeOf(params) > 48000) params.report = rep.text.split("\nPER-QUESTION TABLE")[0] + "\n(Per-question table: see HTML version.)";
  if (sizeOf(params) > 48000) params.report = "See the HTML report.";
  try {
    if (!window.emailjs) throw new Error("EmailJS could not be loaded. Check your internet connection.");
    await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params);
    state.emailSent = true; saveState(); render();
    if (status) status.innerHTML = `<div class="msg ok">✓ Your exam was submitted and the report was sent successfully.</div>`;
    if (btn) { btn.textContent = "Submitted ✓"; }
    const foot = $("modal").querySelector(".modal-foot");
    if (foot) foot.innerHTML = `<button class="tool-btn primary" data-close>Close</button>`, foot.querySelector("[data-close]").onclick = closeModal;
  } catch (err) {
    const reason = (err && (err.text || err.message)) || "Unknown error";
    if (status) status.innerHTML = `<div class="msg err">✗ The report could not be sent: ${esc(reason)}. Your answers are saved.
      <div style="margin-top:8px"><button class="small-btn" id="retryBtn">Retry</button></div></div>`;
    if (btn) { btn.disabled = false; btn.textContent = "Confirm Submit"; }
    const r = $("retryBtn"); if (r) r.onclick = sendReport;
  } finally {
    sending = false;
  }
}

/* =========================================================
   14. INIT
   ========================================================= */
function init() {
  try { if (window.emailjs) emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey }); } catch (e) {}

  document.querySelectorAll(".module-tabs .tab").forEach(b => b.onclick = () => { const m = Number(b.dataset.module); goTo(m, state.currentIndex[m]); });
  $("hideTimerBtn").onclick = () => { state.timerHidden = !state.timerHidden; saveState(); renderTop(); tick(); };
  $("refBtn").onclick = openReference;
  $("directionsBtn").onclick = openDirections;
  $("navBtn").onclick = openNavigator;
  $("nextBtn").onclick = next;
  $("backBtn").onclick = back;
  $("resetBtn").onclick = resetExam;
  $("submitBtn").onclick = () => { if (state.emailSent) return; if (state.onBreak) { endBreak(); return; } if (state.submitted || state.stage === 4) { openSubmitReview(); return; } openFinishModule(); };
  $("overlay").onclick = (e) => { if (e.target.id === "overlay" && $("overlay").dataset.dismiss === "1") closeModal(); };
  document.addEventListener("keydown", (e) => {
    const modalOpen = $("overlay").classList.contains("open");
    if (e.key === "Escape" && modalOpen && $("overlay").dataset.dismiss === "1") closeModal();
    // T toggles the question timer
    if (!modalOpen && (e.key === "t" || e.key === "T") && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
      const b = $("timerBtn"); if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
    // Arrow keys move between questions in review mode
    if (!modalOpen && state.corrected && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
      if (e.key === "ArrowRight") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
    }
  });

  // Persist running timers when leaving (timestamps already make them refresh-safe)
  window.addEventListener("beforeunload", saveState);

  if (state.studentName) startModule(state.currentModule);
  saveState();
  render();
  if (!state.unlocked) openPasswordModal();
  else if (!state.studentName) openNameModal();
  else notifyStart();
  setInterval(tick, 250);
}

// KaTeX scripts are deferred; wait for them so math renders on first paint.
if (document.readyState === "complete") init();
else window.addEventListener("load", init);
</script>
