:db8::1</code>.</li>\n<li>An address has a <b>network part</b> and a <b>host part</b>, split by the <b>subnet mask</b> (e.g. <code>255.255.255.0</code> = <code>/24</code>, CIDR notation = number of network bits).</li>\n<li><b>Network address</b> = first address, host bits all 0 — identifies the network, not assignable. <b>Broadcast address</b> = last address, host bits all 1. Everything between = usable hosts.</li>\n<li><b>Default gateway</b> = router that forwards traffic leaving your subnet. <b>MAC address</b> = 48-bit hardware address (L2). <b>ARP</b> maps IP → MAC on the local network.</li>\n<li><code>127.0.0.1</code> = <b>loopback / localhost</b> (this machine). <code>0.0.0.0</code> = “all interfaces” when a server listens. <code>169.254.x.x</code> = APIPA (DHCP failed).</li>\n</ul>", "ipv4 = 32 bits, written as 4 octets (0–255): 192.168.1.10 . ipv6 = 128 bits, hex: 2001:db8::1 . an address has a network part and a host part , split by the subnet mask (e.g. 255.255.255.0 = /24 , cidr notation = number of network bits). network address = first address, host bits all 0 — identifies the network, not assignable. broadcast address = last address, host bits all 1. everything between = usable hosts. default gateway = router that forwards traffic leaving your subnet. mac address = 48-bit hardware address (l2). arp maps ip → mac on the local network. 127.0.0.1 = loopback / localhost (this machine). 0.0.0.0 = “all interfaces” when a server listens. 169.254.x.x = apipa (dhcp failed)."], ["<div class=\"tw\"><table>\n<tr><th>Class</th><th>First octet</th><th>Default mask</th><th>Private range (RFC 1918)</th></tr>\n<tr><td>A</td><td>1–126</td><td><code>255.0.0.0</code> (/8)</td><td><code>10.0.0.0 – 10.255.255.255</code> (10.0.0.0/8)</td></tr>\n<tr><td>B</td><td>128–191</td><td><code>255.255.0.0</code> (/16)</td><td><code>172.16.0.0 – 172.31.255.255</code> (172.16.0.0/12)</td></tr>\n<tr><td>C</td><td>192–223</td><td><code>255.255.255.0</code> (/24)</td><td><code>192.168.0.0 – 192.168.255.255</code> (192.168.0.0/16)</td></tr>\n<tr><td>D</td><td>224–239</td><td>—</td><td>multicast</td></tr>\n<tr><td>E</td><td>240–255</td><td>—</td><td>experimental</td></tr>\n</table></div>", "class first octet default mask private range (rfc 1918) a 1–126 255.0.0.0 (/8) 10.0.0.0 – 10.255.255.255 (10.0.0.0/8) b 128–191 255.255.0.0 (/16) 172.16.0.0 – 172.31.255.255 (172.16.0.0/12) c 192–223 255.255.255.0 (/24) 192.168.0.0 – 192.168.255.255 (192.168.0.0/16) d 224–239 — multicast e 240–255 — experimental"], ["<p>127.x.x.x is reserved for loopback (that’s why class A stops at 126). Private addresses are not routable on the internet; <b>NAT</b> translates them to a public IP.</p>", "127.x.x.x is reserved for loopback (that’s why class a stops at 126). private addresses are not routable on the internet; nat translates them to a public ip."]]}, {"h": "Subnet math (do these by hand)", "blocks": [["<div class=\"key\">Addresses in a block = <b>2<sup>(32 − prefix)</sup></b>. Usable hosts = that − 2 (network + broadcast).</div>", "addresses in a block = 2 (32 − prefix) . usable hosts = that − 2 (network + broadcast)."], ["<div class=\"tw\"><table>\n<tr><th>CIDR</th><th>Mask</th><th>Addresses</th><th>Usable hosts</th></tr>\n<tr><td>/8</td><td>255.0.0.0</td><td>16,777,216</td><td>16,777,214</td></tr>\n<tr><td>/16</td><td>255.255.0.0</td><td>65,536</td><td>65,534</td></tr>\n<tr><td>/20</td><td>255.255.240.0</td><td>4,096</td><td>4,094</td></tr>\n<tr><td>/22</td><td>255.255.252.0</td><td>1,024</td><td>1,022</td></tr>\n<tr><td>/24</td><td>255.255.255.0</td><td>256</td><td>254</td></tr>\n<tr><td>/25</td><td>255.255.255.128</td><td>128</td><td>126</td></tr>\n<tr><td>/26</td><td>255.255.255.192</td><td>64</td><td>62</td></tr>\n<tr><td>/27</td><td>255.255.255.224</td><td>32</td><td>30</td></tr>\n<tr><td>/28</td><td>255.255.255.240</td><td>16</td><td>14</td></tr>\n<tr><td>/30</td><td>255.255.255.252</td><td>4</td><td>2</td></tr>\n<tr><td>/32</td><td>255.255.255.255</td><td>1</td><td>single host</td></tr>\n</table></div>", "cidr mask addresses usable hosts /8 255.0.0.0 16,777,216 16,777,214 /16 255.255.0.0 65,536 65,534 /20 255.255.240.0 4,096 4,094 /22 255.255.252.0 1,024 1,022 /24 255.255.255.0 256 254 /25 255.255.255.128 128 126 /26 255.255.255.192 64 62 /27 255.255.255.224 32 30 /28 255.255.255.240 16 14 /30 255.255.255.252 4 2 /32 255.255.255.255 1 single host"], ["<p>Mask octet values: 128, 192, 224, 240, 248, 252, 254, 255 (adding bits 128+64+32+16+8+4+2+1).</p>", "mask octet values: 128, 192, 224, 240, 248, 252, 254, 255 (adding bits 128+64+32+16+8+4+2+1)."], ["<h4>Worked example: <code>10.25.0.0/16</code></h4>", "worked example: 10.25.0.0/16"], ["<ul>\n<li>Host bits = 32 − 16 = 16 → 2<sup>16</sup> = <b>65,536</b> addresses (65,534 usable).</li>\n<li>Network address <code>10.25.0.0</code>, broadcast <code>10.25.255.255</code>, hosts <code>10.25.0.1 – 10.25.255.254</code>.</li>\n<li>First octet 10 → <b>Class A</b>, default mask <b>255.0.0.0</b>; the /16 mask here is 255.255.0.0. Private range.</li>\n</ul>", "host bits = 32 − 16 = 16 → 2 16 = 65,536 addresses (65,534 usable). network address 10.25.0.0 , broadcast 10.25.255.255 , hosts 10.25.0.1 – 10.25.255.254 . first octet 10 → class a , default mask 255.0.0.0 ; the /16 mask here is 255.255.0.0. private range."], ["<h4>Worked example: <code>192.168.1.77/26</code></h4>", "worked example: 192.168.1.77/26"], ["<p>/26 → block size 64 → subnets start at .0, .64, .128, .192. 77 falls in <b>.64</b> → network <code>192.168.1.64</code>, broadcast <code>192.168.1.127</code>, hosts .65–.126.</p>", "/26 → block size 64 → subnets start at .0, .64, .128, .192. 77 falls in .64 → network 192.168.1.64 , broadcast 192.168.1.127 , hosts .65–.126."]]}, {"h": "Protocols: TCP, UDP, DNS, DHCP, ICMP", "blocks": [["<div class=\"tw\"><table>\n<tr><th>TCP</th><th>UDP</th></tr>\n<tr><td>Connection-oriented (3-way handshake: <b>SYN → SYN-ACK → ACK</b>; close with FIN)</td><td>Connectionless, no handshake</td></tr>\n<tr><td>Reliable: acknowledgements, retransmission, ordering, flow &amp; congestion control</td><td>No delivery/order guarantee, no retransmission</td></tr>\n<tr><td>Slower, more overhead</td><td>Faster, lightweight</td></tr>\n<tr><td>HTTP/HTTPS, SSH, FTP, SMTP, DB connections</td><td>DNS queries, DHCP, video/voice streaming, gaming, SNMP</td></tr>\n</table></div>", "tcp udp connection-oriented (3-way handshake: syn → syn-ack → ack ; close with fin) connectionless, no handshake reliable: acknowledgements, retransmission, ordering, flow & congestion control no delivery/order guarantee, no retransmission slower, more overhead faster, lightweight http/https, ssh, ftp, smtp, db connections dns queries, dhcp, video/voice streaming, gaming, snmp"], ["<ul>\n<li><b>DNS</b> translates names to IPs. Records: <b>A</b> (name→IPv4), <b>AAAA</b> (→IPv6), <b>CNAME</b> (alias), <b>MX</b> (mail server), <b>NS</b> (name server), <b>PTR</b> (reverse IP→name), <b>TXT</b>. Resolution order: local cache → <code>/etc/hosts</code> → DNS resolver. A host can be reached by <b>domain name or IP</b>.</li>\n<li><b>DHCP</b> automatically gives a machine its IP, mask, gateway, DNS (DORA: Discover, Offer, Request, Ack).</li>\n<li><b>ICMP</b>: control messages — ping (echo request/reply), “destination unreachable”, TTL exceeded (used by traceroute).</li>\n<li><b>NAT</b>: many private IPs share one public IP. <b>Port forwarding</b> maps public port → internal host.</li>\n<li><b>Firewall</b>: allows/blocks traffic by IP/port/protocol. <b>Proxy</b>: intermediary for client requests (forward) or in front of servers (reverse proxy, e.g. Nginx). <b>VPN</b>: encrypted tunnel into a private network.</li>\n<li><b>Latency</b> = delay (ms) · <b>bandwidth</b> = max throughput (Mbps) · <b>throughput</b> = actual rate · <b>packet loss</b> = % packets lost · <b>jitter</b> = latency variation.</li>\n</ul>", "dns translates names to ips. records: a (name→ipv4), aaaa (→ipv6), cname (alias), mx (mail server), ns (name server), ptr (reverse ip→name), txt . resolution order: local cache → /etc/hosts → dns resolver. a host can be reached by domain name or ip . dhcp automatically gives a machine its ip, mask, gateway, dns (dora: discover, offer, request, ack). icmp : control messages — ping (echo request/reply), “destination unreachable”, ttl exceeded (used by traceroute). nat : many private ips share one public ip. port forwarding maps public port → internal host. firewall : allows/blocks traffic by ip/port/protocol. proxy : intermediary for client requests (forward) or in front of servers (reverse proxy, e.g. nginx). vpn : encrypted tunnel into a private network. latency = delay (ms) · bandwidth = max throughput (mbps) · throughput = actual rate · packet loss = % packets lost · jitter = latency variation."]]}, {"h": "Well-known ports", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Port</th><th>Service</th><th>Port</th><th>Service</th></tr>\n<tr><td>20/21</td><td>FTP (data/control)</td><td>443</td><td>HTTPS</td></tr>\n<tr><td>22</td><td>SSH, SCP, SFTP</td><td>445</td><td>SMB (Windows file sharing)</td></tr>\n<tr><td>23</td><td>Telnet (unencrypted)</td><td>1433</td><td>Microsoft SQL Server</td></tr>\n<tr><td>25</td><td>SMTP (send mail)</td><td>1521</td><td>Oracle DB</td></tr>\n<tr><td>53</td><td>DNS</td><td>3306</td><td>MySQL</td></tr>\n<tr><td>67/68</td><td>DHCP</td><td>3389</td><td>RDP (Windows remote desktop)</td></tr>\n<tr><td>80</td><td>HTTP</td><td>5432</td><td>PostgreSQL</td></tr>\n<tr><td>110 / 143</td><td>POP3 / IMAP</td><td>6379 / 27017</td><td>Redis / MongoDB</td></tr>\n<tr><td>123</td><td>NTP (time)</td><td>8080 / 8443</td><td>alternative HTTP / HTTPS (Tomcat, Spring Boot)</td></tr>\n<tr><td>161</td><td>SNMP</td><td>0–1023</td><td>“well-known” ports need root to bind</td></tr>\n</table></div>", "port service port service 20/21 ftp (data/control) 443 https 22 ssh, scp, sftp 445 smb (windows file sharing) 23 telnet (unencrypted) 1433 microsoft sql server 25 smtp (send mail) 1521 oracle db 53 dns 3306 mysql 67/68 dhcp 3389 rdp (windows remote desktop) 80 http 5432 postgresql 110 / 143 pop3 / imap 6379 / 27017 redis / mongodb 123 ntp (time) 8080 / 8443 alternative http / https (tomcat, spring boot) 161 snmp 0–1023 “well-known” ports need root to bind"]]}, {"h": "HTTP, REST & status codes", "blocks": [["<p><b>HTTP methods</b>: GET (read, no body, idempotent) · POST (create/submit) · PUT (replace, idempotent) · PATCH (partial update) · DELETE · HEAD (headers only) · OPTIONS. <b>HTTPS</b> = HTTP over TLS (encryption + server certificate). <b>REST</b> = resources at URLs, stateless requests, JSON responses. Cookies/sessions/tokens (JWT) carry identity.</p>", "http methods : get (read, no body, idempotent) · post (create/submit) · put (replace, idempotent) · patch (partial update) · delete · head (headers only) · options. https = http over tls (encryption + server certificate). rest = resources at urls, stateless requests, json responses. cookies/sessions/tokens (jwt) carry identity."], ["<div class=\"tw\"><table>\n<tr><th>Code</th><th>Meaning</th><th>Typical cause</th></tr>\n<tr><td>200 OK · 201 Created · 204 No Content</td><td>success</td><td></td></tr>\n<tr><td>301 / 302 / 304</td><td>moved permanently / found (temp redirect) / not modified (cache)</td><td></td></tr>\n<tr><td><b>400</b> Bad Request</td><td>malformed request</td><td>invalid JSON, missing parameter</td></tr>\n<tr><td><b>401</b> Unauthorized</td><td><b>not authenticated</b></td><td>no/invalid login, missing token</td></tr>\n<tr><td><b>403</b> Forbidden</td><td>authenticated (or not) but <b>not allowed</b></td><td>insufficient role/permission, expired token, IP not whitelisted, CSRF, wrong service account</td></tr>\n<tr><td><b>404</b> Not Found</td><td>resource doesn’t exist</td><td>wrong URL/path, not deployed</td></tr>\n<tr><td>405 Method Not Allowed</td><td>wrong verb</td><td>POST on a GET-only endpoint</td></tr>\n<tr><td>408 / 429</td><td>request timeout / too many requests</td><td>rate limiting</td></tr>\n<tr><td><b>500</b> Internal Server Error</td><td>bug/crash on the server</td><td>unhandled exception — check server logs</td></tr>\n<tr><td><b>502</b> Bad Gateway</td><td>proxy got an invalid response from upstream</td><td>backend app down behind Nginx/LB</td></tr>\n<tr><td><b>503</b> Service Unavailable</td><td>server overloaded or in maintenance</td><td></td></tr>\n<tr><td><b>504</b> Gateway Timeout</td><td>upstream too slow</td><td>slow DB query behind the proxy</td></tr>\n</table></div>", "code meaning typical cause 200 ok · 201 created · 204 no content success 301 / 302 / 304 moved permanently / found (temp redirect) / not modified (cache) 400 bad request malformed request invalid json, missing parameter 401 unauthorized not authenticated no/invalid login, missing token 403 forbidden authenticated (or not) but not allowed insufficient role/permission, expired token, ip not whitelisted, csrf, wrong service account 404 not found resource doesn’t exist wrong url/path, not deployed 405 method not allowed wrong verb post on a get-only endpoint 408 / 429 request timeout / too many requests rate limiting 500 internal server error bug/crash on the server unhandled exception — check server logs 502 bad gateway proxy got an invalid response from upstream backend app down behind nginx/lb 503 service unavailable server overloaded or in maintenance 504 gateway timeout upstream too slow slow db query behind the proxy"], ["<div class=\"key\">Families: <b>1xx</b> info · <b>2xx</b> success · <b>3xx</b> redirect · <b>4xx</b> client’s fault · <b>5xx</b> server’s fault.</div>", "families: 1xx info · 2xx success · 3xx redirect · 4xx client’s fault · 5xx server’s fault."]]}, {"h": "Reading connection errors", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Error</th><th>Means</th><th>Check</th></tr>\n<tr><td><b>Connection refused</b> (<code>java.net.ConnectException</code>)</td><td>host reachable, but nothing listening on that port (RST)</td><td>service down/crashed · wrong host/port in config · listening on 127.0.0.1 only · firewall REJECT · backlog full · proxy settings. Use <code>telnet/nc host port</code>, <code>ss -tlnp</code>, service logs</td></tr>\n<tr><td><b>Connection timed out</b></td><td>no answer at all</td><td>firewall DROP, host down, wrong IP, routing issue</td></tr>\n<tr><td><b>Unknown host</b> (<code>UnknownHostException</code>)</td><td>DNS can’t resolve the name</td><td><code>nslookup</code>, <code>/etc/hosts</code>, typo</td></tr>\n<tr><td><b>No route to host</b></td><td>network unreachable</td><td>routing, gateway, firewall</td></tr>\n<tr><td>SSL handshake / certificate errors</td><td>TLS problem</td><td>expired/self-signed cert, missing CA in truststore, wrong hostname</td></tr>\n<tr><td><code>SocketTimeoutException: Read timed out</code></td><td>connected, but response too slow</td><td>slow server/DB, timeout too low</td></tr>\n</table></div>", "error means check connection refused ( java.net.connectexception ) host reachable, but nothing listening on that port (rst) service down/crashed · wrong host/port in config · listening on 127.0.0.1 only · firewall reject · backlog full · proxy settings. use telnet/nc host port , ss -tlnp , service logs connection timed out no answer at all firewall drop, host down, wrong ip, routing issue unknown host ( unknownhostexception ) dns can’t resolve the name nslookup , /etc/hosts , typo no route to host network unreachable routing, gateway, firewall ssl handshake / certificate errors tls problem expired/self-signed cert, missing ca in truststore, wrong hostname sockettimeoutexception: read timed out connected, but response too slow slow server/db, timeout too low"]]}]}, {"title": "SQL & databases", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">Written queries (joins + GROUP BY + HAVING + ORDER BY), CREATE TABLE with constraints, and MCQs on indexes, triggers, joins and DBMS theory.</p>", "written queries (joins + group by + having + order by), create table with constraints, and mcqs on indexes, triggers, joins and dbms theory."]]}, {"h": "Command categories & data types", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Category</th><th>Commands</th></tr>\n<tr><td><b>DDL</b> – Data Definition</td><td><code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code>, <code>RENAME</code> (structure; auto-commit in Oracle/MySQL)</td></tr>\n<tr><td><b>DML</b> – Data Manipulation</td><td><code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>MERGE</code> (and <code>SELECT</code>, sometimes called DQL)</td></tr>\n<tr><td><b>DCL</b> – Data Control</td><td><code>GRANT</code>, <code>REVOKE</code> (permissions)</td></tr>\n<tr><td><b>TCL</b> – Transaction Control</td><td><code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVEPOINT</code></td></tr>\n</table></div>", "category commands ddl – data definition create , alter , drop , truncate , rename (structure; auto-commit in oracle/mysql) dml – data manipulation insert , update , delete , merge (and select , sometimes called dql) dcl – data control grant , revoke (permissions) tcl – transaction control commit , rollback , savepoint"], ["<p>Types: <code>INT</code>/<code>BIGINT</code>/<code>SMALLINT</code> · <code>DECIMAL(10,2)</code>/<code>NUMERIC</code> (exact — money) · <code>REAL</code>/<code>FLOAT</code>/<code>DOUBLE</code> (approximate) · <code>CHAR(n)</code> (fixed length, padded) vs <code>VARCHAR(n)</code> (variable; Oracle <code>VARCHAR2</code>) · <code>TEXT</code>/<code>CLOB</code> · <code>DATE</code>, <code>TIMESTAMP</code>, <code>DATETIME</code> · <code>BOOLEAN</code> · <code>BLOB</code>.</p>", "types: int / bigint / smallint · decimal(10,2) / numeric (exact — money) · real / float / double (approximate) · char(n) (fixed length, padded) vs varchar(n) (variable; oracle varchar2 ) · text / clob · date , timestamp , datetime · boolean · blob ."]]}, {"h": "CREATE / ALTER / DROP & constraints", "blocks": [["<pre>CREATE TABLE Drivers (\n  driver_id  INT PRIMARY KEY,               <span class=\"c\">-- unique + not null, one per table</span>\n  first_name VARCHAR(50) NOT NULL,\n  last_name  VARCHAR(50) NOT NULL,\n  email      VARCHAR(100) UNIQUE,           <span class=\"c\">-- no duplicates (NULLs allowed)</span>\n  hired_on   DATE DEFAULT CURRENT_DATE\n);\nCREATE TABLE Vehicles (\n  vehicle_id   INT PRIMARY KEY AUTO_INCREMENT,    <span class=\"c\">-- Oracle: GENERATED AS IDENTITY; SQL Server: IDENTITY(1,1)</span>\n  vehicle_type VARCHAR(20) NOT NULL,\n  capacity     INT NOT NULL CHECK (capacity &gt; 0)  <span class=\"c\">-- business rule</span>\n);\nCREATE TABLE Shipments (\n  shipment_id   INT PRIMARY KEY,\n  vehicle_id    INT NOT NULL,\n  driver_id     INT NOT NULL,\n  shipment_date DATE NOT NULL,\n  CONSTRAINT fk_ship_vehicle FOREIGN KEY (vehicle_id) REFERENCES Vehicles(vehicle_id),\n  CONSTRAINT fk_ship_driver  FOREIGN KEY (driver_id)  REFERENCES Drivers(driver_id)\n    ON DELETE CASCADE                       <span class=\"c\">-- or RESTRICT / SET NULL</span>\n);\nCREATE TABLE Reservations (EID INT, BID INT, PRIMARY KEY (EID, BID));   <span class=\"c\">-- composite key</span>\n\nALTER TABLE Drivers ADD phone VARCHAR(20);\nALTER TABLE Drivers MODIFY phone VARCHAR(30);        <span class=\"c\">-- SQL Server/Postgres: ALTER COLUMN</span>\nALTER TABLE Drivers DROP COLUMN phone;\nALTER TABLE Drivers RENAME TO Staff;\nDROP TABLE Staff;                                     <span class=\"c\">-- table + data gone</span></pre>", "create table drivers ( driver_id int primary key, -- unique + not null, one per table first_name varchar(50) not null, last_name varchar(50) not null, email varchar(100) unique, -- no duplicates (nulls allowed) hired_on date default current_date ); create table vehicles ( vehicle_id int primary key auto_increment, -- oracle: generated as identity; sql server: identity(1,1) vehicle_type varchar(20) not null, capacity int not null check (capacity > 0) -- business rule ); create table shipments ( shipment_id int primary key, vehicle_id int not null, driver_id int not null, shipment_date date not null, constraint fk_ship_vehicle foreign key (vehicle_id) references vehicles(vehicle_id), constraint fk_ship_driver foreign key (driver_id) references drivers(driver_id) on delete cascade -- or restrict / set null ); create table reservations (eid int, bid int, primary key (eid, bid)); -- composite key alter table drivers add phone varchar(20); alter table drivers modify phone varchar(30); -- sql server/postgres: alter column alter table drivers drop column phone; alter table drivers rename to staff; drop table staff; -- table + data gone"], ["<div class=\"tw\"><table>\n<tr><th>Constraint</th><th>Ensures</th></tr>\n<tr><td><code>PRIMARY KEY</code></td><td>unique + not null row identifier (entity integrity). One per table, can be composite.</td></tr>\n<tr><td><code>FOREIGN KEY</code></td><td>value exists in the referenced table (<b>referential integrity</b>)</td></tr>\n<tr><td><code>UNIQUE</code></td><td>no duplicate values (many per table)</td></tr>\n<tr><td><code>NOT NULL</code></td><td>value required</td></tr>\n<tr><td><code>CHECK</code></td><td>custom condition</td></tr>\n<tr><td><code>DEFAULT</code></td><td>value when none given</td></tr>\n</table></div>", "constraint ensures primary key unique + not null row identifier (entity integrity). one per table, can be composite. foreign key value exists in the referenced table ( referential integrity ) unique no duplicate values (many per table) not null value required check custom condition default value when none given"], ["<p><b>Keys vocabulary</b>: <b>candidate key</b> (any minimal unique set) · <b>primary key</b> (chosen candidate) · <b>alternate key</b> (other candidates) · <b>composite key</b> (several columns) · <b>surrogate key</b> (artificial id) vs <b>natural key</b> (real-world e.g. email) · <b>super key</b> (any unique set, maybe not minimal) · <b>foreign key</b>.</p>", "keys vocabulary : candidate key (any minimal unique set) · primary key (chosen candidate) · alternate key (other candidates) · composite key (several columns) · surrogate key (artificial id) vs natural key (real-world e.g. email) · super key (any unique set, maybe not minimal) · foreign key ."]]}, {"h": "INSERT, UPDATE, DELETE, TRUNCATE", "blocks": [["<pre>INSERT INTO Murex_Office_Cities VALUES ('Beirut', 33.89, 35.50);                 <span class=\"c\">-- all columns, table order</span>\nINSERT INTO Murex_Office_Cities (Latitude, Longitude, Name) VALUES (48.85, 2.35, 'Paris'); <span class=\"c\">-- named columns</span>\nINSERT INTO Murex_Office_Cities (Name, Latitude, Longitude)\nVALUES ('Dublin', 53.35, -6.26), ('Sydney', -33.87, 151.21);                      <span class=\"c\">-- multi-row (MySQL/Postgres)</span>\nINSERT INTO Archive (Name, Latitude, Longitude) SELECT Name, Latitude, Longitude FROM Murex_Office_Cities;\n\nUPDATE Employees SET salary = salary * 1.10 WHERE dept_id = 3;   <span class=\"c\">-- without WHERE: every row!</span>\nDELETE FROM Employees WHERE emp_id = 7;                           <span class=\"c\">-- without WHERE: every row</span>\nTRUNCATE TABLE Logs;                                              <span class=\"c\">-- all rows, fast</span></pre>", "insert into murex_office_cities values ('beirut', 33.89, 35.50); -- all columns, table order insert into murex_office_cities (latitude, longitude, name) values (48.85, 2.35, 'paris'); -- named columns insert into murex_office_cities (name, latitude, longitude) values ('dublin', 53.35, -6.26), ('sydney', -33.87, 151.21); -- multi-row (mysql/postgres) insert into archive (name, latitude, longitude) select name, latitude, longitude from murex_office_cities; update employees set salary = salary * 1.10 where dept_id = 3; -- without where: every row! delete from employees where emp_id = 7; -- without where: every row truncate table logs; -- all rows, fast"], ["<div class=\"tw\"><table>\n<tr><th></th><th>DELETE</th><th>TRUNCATE</th><th>DROP</th></tr>\n<tr><td>Type</td><td>DML</td><td>DDL</td><td>DDL</td></tr>\n<tr><td>Removes</td><td>rows (WHERE allowed)</td><td>all rows</td><td>table + structure + indexes</td></tr>\n<tr><td>Rollback</td><td>yes (before commit)</td><td>usually no (auto-commit)</td><td>no</td></tr>\n<tr><td>Triggers fire</td><td>yes</td><td>no</td><td>no</td></tr>\n<tr><td>Speed</td><td>slow (logged per row)</td><td>fast</td><td>fast</td></tr>\n<tr><td>Identity counter</td><td>kept</td><td>reset</td><td>—</td></tr>\n</table></div>", "delete truncate drop type dml ddl ddl removes rows (where allowed) all rows table + structure + indexes rollback yes (before commit) usually no (auto-commit) no triggers fire yes no no speed slow (logged per row) fast fast identity counter kept reset —"]]}, {"h": "SELECT: clauses & execution order", "blocks": [["<pre>SELECT   DISTINCT column, AGG(col) AS alias      <span class=\"c\">-- 5</span>\nFROM     table t JOIN other o ON ...             <span class=\"c\">-- 1</span>\nWHERE    row condition                           <span class=\"c\">-- 2  (no aggregates here)</span>\nGROUP BY column                                  <span class=\"c\">-- 3</span>\nHAVING   group condition (aggregates allowed)    <span class=\"c\">-- 4</span>\nORDER BY alias DESC                              <span class=\"c\">-- 6  (aliases allowed here)</span>\nLIMIT 10 OFFSET 20;                              <span class=\"c\">-- 7  (Oracle/SQL standard: FETCH FIRST 10 ROWS ONLY; SQL Server: TOP 10)</span></pre>", "select distinct column, agg(col) as alias -- 5 from table t join other o on ... -- 1 where row condition -- 2 (no aggregates here) group by column -- 3 having group condition (aggregates allowed) -- 4 order by alias desc -- 6 (aliases allowed here) limit 10 offset 20; -- 7 (oracle/sql standard: fetch first 10 rows only; sql server: top 10)"], ["<div class=\"key\">Logical order: <b>FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT</b>. That’s why you can’t use a SELECT alias in WHERE, but you can in ORDER BY.</div>", "logical order: from → join → where → group by → having → select → distinct → order by → limit . that’s why you can’t use a select alias in where, but you can in order by."], ["<div class=\"tw\"><table>\n<tr><th>Operator</th><th>Example</th></tr>\n<tr><td>Comparison</td><td><code>=</code>, <code>&lt;&gt;</code> / <code>!=</code>, <code>&gt;</code>, <code>&lt;=</code></td></tr>\n<tr><td><code>AND</code>, <code>OR</code>, <code>NOT</code></td><td>AND binds tighter than OR — use parentheses</td></tr>\n<tr><td><code>BETWEEN a AND b</code></td><td>inclusive both ends</td></tr>\n<tr><td><code>IN (…)</code> / <code>NOT IN</code></td><td><code>major IN ('CS','Math')</code></td></tr>\n<tr><td><code>LIKE</code></td><td><code>%</code> any number of chars, <code>_</code> exactly one: <code>name LIKE 'M%'</code>, <code>'_a%'</code></td></tr>\n<tr><td><code>IS NULL</code> / <code>IS NOT NULL</code></td><td><b>never</b> <code>= NULL</code> (always unknown)</td></tr>\n<tr><td>Aliases</td><td><code>SELECT name AS n FROM Students s</code></td></tr>\n<tr><td>String concat</td><td><code>CONCAT(a,' ',b)</code> (MySQL) · <code>a || ' ' || b</code> (Oracle/Postgres) · <code>a + ' ' + b</code> (SQL Server)</td></tr>\n</table></div>", "operator example comparison = , <> / != , > , <= and , or , not and binds tighter than or — use parentheses between a and b inclusive both ends in (…) / not in major in ('cs','math') like % any number of chars, _ exactly one: name like 'm%' , '_a%' is null / is not null never = null (always unknown) aliases select name as n from students s string concat concat(a,' ',b) (mysql) · a || ' ' || b (oracle/postgres) · a + ' ' + b (sql server)"]]}, {"h": "Aggregates, GROUP BY, HAVING", "blocks": [["<p><code>COUNT(*)</code> (all rows) · <code>COUNT(col)</code> (non-NULL values) · <code>COUNT(DISTINCT col)</code> · <code>SUM</code> · <code>AVG</code> · <code>MIN</code> · <code>MAX</code>. All aggregates except <code>COUNT(*)</code> <b>ignore NULLs</b>.</p>", "count(*) (all rows) · count(col) (non-null values) · count(distinct col) · sum · avg · min · max . all aggregates except count(*) ignore nulls ."], ["<pre>SELECT Major, COUNT(*) AS num_students\nFROM Students\nGROUP BY Major\nORDER BY num_students DESC;\n\nSELECT c.course_name, MIN(g.grade), AVG(g.grade), MAX(g.grade)\nFROM Courses c JOIN Grades g ON g.course_id = c.course_id\nGROUP BY c.course_id, c.course_name;\n\nSELECT trader, SUM(notional) AS total\nFROM Trades\nWHERE trade_date &gt;= '2026-01-01'      <span class=\"c\">-- filters ROWS before grouping</span>\nGROUP BY trader\nHAVING SUM(notional) &gt; 1000000        <span class=\"c\">-- filters GROUPS after aggregation</span>\nORDER BY total DESC;</pre>", "select major, count(*) as num_students from students group by major order by num_students desc; select c.course_name, min(g.grade), avg(g.grade), max(g.grade) from courses c join grades g on g.course_id = c.course_id group by c.course_id, c.course_name; select trader, sum(notional) as total from trades where trade_date >= '2026-01-01' -- filters rows before grouping group by trader having sum(notional) > 1000000 -- filters groups after aggregation order by total desc;"], ["<div class=\"trap\">Every non-aggregated column in SELECT must appear in GROUP BY (<code>SELECT name, dept_id, COUNT(*) … GROUP BY dept_id</code> is invalid). <b>WHERE</b> filters rows before aggregation and can’t use aggregates; <b>HAVING</b> filters groups and is used with aggregate functions.</div>", "every non-aggregated column in select must appear in group by ( select name, dept_id, count(*) … group by dept_id is invalid). where filters rows before aggregation and can’t use aggregates; having filters groups and is used with aggregate functions."]]}, {"h": "Joins", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Join</th><th>Returns</th></tr>\n<tr><td><b>INNER JOIN</b> (or just <code>JOIN</code>)</td><td>only rows with a match in <b>both</b> tables</td></tr>\n<tr><td><b>LEFT (OUTER) JOIN</b></td><td>all rows from the left table + matches from right (NULL if none)</td></tr>\n<tr><td><b>RIGHT (OUTER) JOIN</b></td><td>all rows from right + matches from left</td></tr>\n<tr><td><b>FULL (OUTER) JOIN</b></td><td>all rows from both, NULLs where no match (MySQL lacks it: LEFT UNION RIGHT)</td></tr>\n<tr><td><b>CROSS JOIN</b></td><td>Cartesian product: every row × every row (m × n rows)</td></tr>\n<tr><td><b>SELF JOIN</b></td><td>a table joined to itself (employee ↔ manager)</td></tr>\n<tr><td><b>NATURAL JOIN</b></td><td>inner join on all same-named columns automatically (risky)</td></tr>\n<tr><td>Equi-join / non-equi-join</td><td>condition with <code>=</code> / with <code>&lt;</code>, <code>BETWEEN</code>…</td></tr>\n</table></div>", "join returns inner join (or just join ) only rows with a match in both tables left (outer) join all rows from the left table + matches from right (null if none) right (outer) join all rows from right + matches from left full (outer) join all rows from both, nulls where no match (mysql lacks it: left union right) cross join cartesian product: every row × every row (m × n rows) self join a table joined to itself (employee ↔ manager) natural join inner join on all same-named columns automatically (risky) equi-join / non-equi-join condition with = / with < , between …"], ["<pre><span class=\"c\">-- unique colours of boats that have been reserved</span>\nSELECT DISTINCT b.Color\nFROM Boat_Details b\nJOIN Reservations r ON r.BID = b.BID;\n\n<span class=\"c\">-- three-table join: total &amp; average treatment cost per facility</span>\nSELECT f.facility_name, SUM(t.price) AS total_cost, AVG(t.price) AS avg_cost\nFROM Facilities f\nJOIN Visits v     ON v.facility_id = f.facility_id\nJOIN Treatments t ON t.visit_id    = v.visit_id\nGROUP BY f.facility_id, f.facility_name\nORDER BY avg_cost DESC;\n\n<span class=\"c\">-- rows with NO match (anti-join)</span>\nSELECT d.dept_name FROM Departments d\nLEFT JOIN Employees e ON e.dept_id = d.dept_id\nWHERE e.emp_id IS NULL;\n\n<span class=\"c\">-- self join</span>\nSELECT e.name AS employee, m.name AS manager\nFROM Employees e LEFT JOIN Employees m ON e.manager_id = m.emp_id;\n\n<span class=\"c\">-- old comma syntax (= inner join)</span>\nSELECT * FROM A, B WHERE A.id = B.a_id;</pre>", "-- unique colours of boats that have been reserved select distinct b.color from boat_details b join reservations r on r.bid = b.bid; -- three-table join: total & average treatment cost per facility select f.facility_name, sum(t.price) as total_cost, avg(t.price) as avg_cost from facilities f join visits v on v.facility_id = f.facility_id join treatments t on t.visit_id = v.visit_id group by f.facility_id, f.facility_name order by avg_cost desc; -- rows with no match (anti-join) select d.dept_name from departments d left join employees e on e.dept_id = d.dept_id where e.emp_id is null; -- self join select e.name as employee, m.name as manager from employees e left join employees m on e.manager_id = m.emp_id; -- old comma syntax (= inner join) select * from a, b where a.id = b.a_id;"], ["<div class=\"tip\">Plan multi-table queries by asking: which table holds the output columns? which holds the filter? what’s the chain of keys between them? Ignore tables you don’t need (in the treatment question, <b>Patients</b> is a distractor).</div>", "plan multi-table queries by asking: which table holds the output columns? which holds the filter? what’s the chain of keys between them? ignore tables you don’t need (in the treatment question, patients is a distractor)."]]}, {"h": "Subqueries, EXISTS, set operators, CASE", "blocks": [["<pre><span class=\"c\">-- scalar subquery</span>\nSELECT name FROM Employees WHERE salary &gt; (SELECT AVG(salary) FROM Employees);\n<span class=\"c\">-- IN subquery</span>\nSELECT DISTINCT Color FROM Boat_Details WHERE BID IN (SELECT BID FROM Reservations);\n<span class=\"c\">-- correlated subquery (runs per outer row): earns more than their dept average</span>\nSELECT e.name FROM Employees e\nWHERE e.salary &gt; (SELECT AVG(salary) FROM Employees x WHERE x.dept_id = e.dept_id);\n<span class=\"c\">-- EXISTS / NOT EXISTS</span>\nSELECT d.dept_name FROM Departments d\nWHERE NOT EXISTS (SELECT 1 FROM Employees e WHERE e.dept_id = d.dept_id);\n<span class=\"c\">-- derived table / CTE</span>\nWITH totals AS (SELECT trader, SUM(notional) s FROM Trades GROUP BY trader)\nSELECT * FROM totals WHERE s &gt; 1000000;</pre>", "-- scalar subquery select name from employees where salary > (select avg(salary) from employees); -- in subquery select distinct color from boat_details where bid in (select bid from reservations); -- correlated subquery (runs per outer row): earns more than their dept average select e.name from employees e where e.salary > (select avg(salary) from employees x where x.dept_id = e.dept_id); -- exists / not exists select d.dept_name from departments d where not exists (select 1 from employees e where e.dept_id = d.dept_id); -- derived table / cte with totals as (select trader, sum(notional) s from trades group by trader) select * from totals where s > 1000000;"], ["<div class=\"trap\"><code>NOT IN (subquery)</code> returns <b>nothing</b> if the subquery contains a NULL. Prefer <code>NOT EXISTS</code>.</div>", "not in (subquery) returns nothing if the subquery contains a null. prefer not exists ."], ["<div class=\"tw\"><table>\n<tr><th>Operator</th><th>Result</th></tr>\n<tr><td><code>UNION</code></td><td>rows from both, <b>duplicates removed</b> (sorts → slower)</td></tr>\n<tr><td><code>UNION ALL</code></td><td>rows from both, duplicates kept (faster)</td></tr>\n<tr><td><code>INTERSECT</code></td><td>rows in both</td></tr>\n<tr><td><code>EXCEPT</code> / <code>MINUS</code> (Oracle)</td><td>rows in first but not second</td></tr>\n</table></div>", "operator result union rows from both, duplicates removed (sorts → slower) union all rows from both, duplicates kept (faster) intersect rows in both except / minus (oracle) rows in first but not second"], ["<p>Columns must match in number and compatible types. T1 = {1,2,2,3}, T2 = {2,3,4}: UNION → 4 rows; UNION ALL → 7 rows.</p>", "columns must match in number and compatible types. t1 = {1,2,2,3}, t2 = {2,3,4}: union → 4 rows; union all → 7 rows."], ["<pre>SELECT name,\n  CASE WHEN grade &gt;= 90 THEN 'A' WHEN grade &gt;= 80 THEN 'B' ELSE 'C' END AS letter\nFROM Students;\nSELECT COALESCE(commission, 0) FROM Deals;      <span class=\"c\">-- first non-NULL (Oracle NVL, SQL Server ISNULL, MySQL IFNULL)</span>\nSELECT NULLIF(a, 0) ...                          <span class=\"c\">-- NULL if a = 0 (avoid divide by zero)</span></pre>", "select name, case when grade >= 90 then 'a' when grade >= 80 then 'b' else 'c' end as letter from students; select coalesce(commission, 0) from deals; -- first non-null (oracle nvl, sql server isnull, mysql ifnull) select nullif(a, 0) ... -- null if a = 0 (avoid divide by zero)"], ["<p><b>NULL logic</b>: any comparison with NULL is UNKNOWN; <code>NULL + 5</code> = NULL; <code>WHERE</code> keeps only TRUE rows.</p>", "null logic : any comparison with null is unknown; null + 5 = null; where keeps only true rows."]]}, {"h": "Window functions", "blocks": [["<pre>SELECT name, dept_id, salary,\n  ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn,   <span class=\"c\">-- 1,2,3,4 (unique)</span>\n  RANK()       OVER (ORDER BY salary DESC) AS rnk,                        <span class=\"c\">-- 1,2,2,4 (gaps)</span>\n  DENSE_RANK() OVER (ORDER BY salary DESC) AS drnk,                       <span class=\"c\">-- 1,2,2,3 (no gaps)</span>\n  SUM(salary)  OVER (PARTITION BY dept_id) AS dept_total,                 <span class=\"c\">-- aggregate without collapsing rows</span>\n  LAG(salary)  OVER (ORDER BY hire_date) AS prev_salary                   <span class=\"c\">-- previous row (LEAD = next)</span>\nFROM Employees;</pre>", "select name, dept_id, salary, row_number() over (partition by dept_id order by salary desc) as rn, -- 1,2,3,4 (unique) rank() over (order by salary desc) as rnk, -- 1,2,2,4 (gaps) dense_rank() over (order by salary desc) as drnk, -- 1,2,2,3 (no gaps) sum(salary) over (partition by dept_id) as dept_total, -- aggregate without collapsing rows lag(salary) over (order by hire_date) as prev_salary -- previous row (lead = next) from employees;"]]}, {"h": "Classic query patterns", "blocks": [["<pre><span class=\"c\">-- Nth (2nd) highest salary</span>\nSELECT MAX(salary) FROM Employees WHERE salary &lt; (SELECT MAX(salary) FROM Employees);\nSELECT DISTINCT salary FROM Employees ORDER BY salary DESC LIMIT 1 OFFSET 1;\nSELECT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) r FROM Employees) x WHERE r = 2;\n\n<span class=\"c\">-- find duplicates</span>\nSELECT invoice_no, COUNT(*) FROM Sales GROUP BY invoice_no HAVING COUNT(*) &gt; 1;\n\n<span class=\"c\">-- top earner per department</span>\nSELECT * FROM (SELECT e.*, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) rn FROM Employees e) x WHERE rn = 1;\n\n<span class=\"c\">-- last N years (MySQL / Oracle / Postgres)</span>\nWHERE shipment_date &gt;= DATE_SUB(CURDATE(), INTERVAL 3 YEAR)\nWHERE shipment_date &gt;= ADD_MONTHS(SYSDATE, -36)\nWHERE shipment_date &gt;= CURRENT_DATE - INTERVAL '3 years'\n\n<span class=\"c\">-- full logistics answer: avg capacity per driver, last 3 years, ≥ 2 shipments</span>\nSELECT CONCAT(d.first_name, ' ', d.last_name) AS full_name, AVG(v.capacity) AS avg_capacity\nFROM Shipments s\nJOIN Drivers d  ON d.driver_id  = s.driver_id\nJOIN Vehicles v ON v.vehicle_id = s.vehicle_id\nWHERE s.shipment_date &gt;= DATE_SUB(CURDATE(), INTERVAL 3 YEAR)\nGROUP BY d.driver_id, d.first_name, d.last_name\nHAVING COUNT(*) &gt;= 2\nORDER BY avg_capacity DESC;\n\n<span class=\"c\">-- total per category</span>\nSELECT p.category_id, SUM(s.sales_amount) FROM Products p JOIN Sales s ON s.product_id = p.product_id GROUP BY p.category_id;\n\n<span class=\"c\">-- delete duplicates keeping lowest id (MySQL)</span>\nDELETE t1 FROM T t1 JOIN T t2 ON t1.email = t2.email AND t1.id &gt; t2.id;</pre>", "-- nth (2nd) highest salary select max(salary) from employees where salary < (select max(salary) from employees); select distinct salary from employees order by salary desc limit 1 offset 1; select salary from (select salary, dense_rank() over (order by salary desc) r from employees) x where r = 2; -- find duplicates select invoice_no, count(*) from sales group by invoice_no having count(*) > 1; -- top earner per department select * from (select e.*, row_number() over (partition by dept_id order by salary desc) rn from employees e) x where rn = 1; -- last n years (mysql / oracle / postgres) where shipment_date >= date_sub(curdate(), interval 3 year) where shipment_date >= add_months(sysdate, -36) where shipment_date >= current_date - interval '3 years' -- full logistics answer: avg capacity per driver, last 3 years, ≥ 2 shipments select concat(d.first_name, ' ', d.last_name) as full_name, avg(v.capacity) as avg_capacity from shipments s join drivers d on d.driver_id = s.driver_id join vehicles v on v.vehicle_id = s.vehicle_id where s.shipment_date >= date_sub(curdate(), interval 3 year) group by d.driver_id, d.first_name, d.last_name having count(*) >= 2 order by avg_capacity desc; -- total per category select p.category_id, sum(s.sales_amount) from products p join sales s on s.product_id = p.product_id group by p.category_id; -- delete duplicates keeping lowest id (mysql) delete t1 from t t1 join t t2 on t1.email = t2.email and t1.id > t2.id;"], ["<p>Date functions: <code>NOW()</code>, <code>CURDATE()</code>, <code>SYSDATE</code> (Oracle), <code>YEAR(d)</code>, <code>EXTRACT(YEAR FROM d)</code>, <code>DATEDIFF(a,b)</code>, <code>TO_DATE('2026-11-09','YYYY-MM-DD')</code>, <code>TO_CHAR(d,'YYYY')</code>. String: <code>UPPER</code>, <code>LOWER</code>, <code>LENGTH</code>, <code>SUBSTR</code>, <code>TRIM</code>, <code>REPLACE</code>. Numbers: <code>ROUND(x,2)</code>, <code>FLOOR</code>, <code>CEIL</code>, <code>MOD</code>.</p>", "date functions: now() , curdate() , sysdate (oracle), year(d) , extract(year from d) , datediff(a,b) , to_date('2026-11-09','yyyy-mm-dd') , to_char(d,'yyyy') . string: upper , lower , length , substr , trim , replace . numbers: round(x,2) , floor , ceil , mod ."]]}, {"h": "Indexes & performance", "blocks": [["<ul>\n<li>An <b>index</b> is a separate structure (usually a <b>B-tree</b>) that lets the DB find rows without scanning the whole table (full table scan). Speeds up WHERE, JOIN, ORDER BY on indexed columns.</li>\n<li>Cost: extra <b>storage</b>, and <b>slower INSERT/UPDATE/DELETE</b> (index must be maintained). Not useful on low-selectivity columns (gender) or tiny tables.</li>\n<li><b>Clustered</b> index: defines the physical order of the table rows; <b>only one per table</b> (usually the primary key). <b>Non-clustered</b>: separate structure with pointers to rows; many per table.</li>\n<li><b>Unique index</b>: also enforces uniqueness → solves both “slow search” and “duplicate invoice numbers”.</li>\n<li><b>Composite index</b> (a, b): helps queries filtering on <code>a</code> or <code>a AND b</code> (leftmost prefix), not <code>b</code> alone.</li>\n<li><b>Covering index</b>: contains all columns a query needs. <b>Partitioning</b>: split a huge table by range (e.g. by year) → partition pruning.</li>\n<li>Index killers: functions on the column (<code>WHERE YEAR(order_date)=2026</code>), leading wildcard (<code>LIKE '%x'</code>), implicit type conversion, <code>OR</code> on different columns.</li>\n</ul>", "an index is a separate structure (usually a b-tree ) that lets the db find rows without scanning the whole table (full table scan). speeds up where, join, order by on indexed columns. cost: extra storage , and slower insert/update/delete (index must be maintained). not useful on low-selectivity columns (gender) or tiny tables. clustered index: defines the physical order of the table rows; only one per table (usually the primary key). non-clustered : separate structure with pointers to rows; many per table. unique index : also enforces uniqueness → solves both “slow search” and “duplicate invoice numbers”. composite index (a, b): helps queries filtering on a or a and b (leftmost prefix), not b alone. covering index : contains all columns a query needs. partitioning : split a huge table by range (e.g. by year) → partition pruning. index killers: functions on the column ( where year(order_date)=2026 ), leading wildcard ( like '%x' ), implicit type conversion, or on different columns."], ["<pre>CREATE INDEX idx_orders_date ON Orders(order_date);\nCREATE UNIQUE INDEX ux_invoice ON Sales(invoice_no);\nCREATE INDEX idx_c ON Orders(customer_id, order_date);\nEXPLAIN SELECT * FROM Orders WHERE order_date &gt; '2026-01-01';   <span class=\"c\">-- see the execution plan</span></pre>", "create index idx_orders_date on orders(order_date); create unique index ux_invoice on sales(invoice_no); create index idx_c on orders(customer_id, order_date); explain select * from orders where order_date > '2026-01-01'; -- see the execution plan"], ["<div class=\"tip\">Slow query checklist: execution plan (full scan?) → add/fix index → fresh statistics → select only needed columns (no <code>SELECT *</code>) → avoid N+1 queries → rewrite correlated subqueries as joins → check locks/blocking → pagination.</div>", "slow query checklist: execution plan (full scan?) → add/fix index → fresh statistics → select only needed columns (no select * ) → avoid n+1 queries → rewrite correlated subqueries as joins → check locks/blocking → pagination."]]}, {"h": "Views, procedures, functions, triggers, sequences", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Object</th><th>What it is</th></tr>\n<tr><td><b>View</b></td><td>a saved SELECT, used like a virtual table (simplify, restrict columns for security). Materialized view = stores the result.</td></tr>\n<tr><td><b>Stored procedure</b></td><td>named block of SQL statements stored in the DB, <b>called explicitly</b> (<code>CALL p()</code>/<code>EXEC p</code>), may modify data, IN/OUT params</td></tr>\n<tr><td><b>Function</b></td><td>returns a value, usable inside SELECT</td></tr>\n<tr><td><b>Trigger</b></td><td>code that <b>executes automatically</b> in response to an event (INSERT/UPDATE/DELETE, BEFORE/AFTER) on a table or view — used for audit, validation, <b>maintaining integrity</b></td></tr>\n<tr><td><b>Sequence</b></td><td>generates unique numbers (Oracle <code>seq.NEXTVAL</code>)</td></tr>\n<tr><td><b>Synonym</b></td><td>alias for an object (Oracle)</td></tr>\n<tr><td><b>Cursor</b></td><td>iterate over a result row by row in procedural code</td></tr>\n</table></div>", "object what it is view a saved select, used like a virtual table (simplify, restrict columns for security). materialized view = stores the result. stored procedure named block of sql statements stored in the db, called explicitly ( call p() / exec p ), may modify data, in/out params function returns a value, usable inside select trigger code that executes automatically in response to an event (insert/update/delete, before/after) on a table or view — used for audit, validation, maintaining integrity sequence generates unique numbers (oracle seq.nextval ) synonym alias for an object (oracle) cursor iterate over a result row by row in procedural code"], ["<pre>CREATE VIEW v_cs AS SELECT ID, First_Name FROM Students WHERE Major = 'CS';\nCREATE TRIGGER trg_audit AFTER UPDATE ON Employees\nFOR EACH ROW INSERT INTO Audit(emp_id, changed_at) VALUES (NEW.emp_id, NOW());</pre>", "create view v_cs as select id, first_name from students where major = 'cs'; create trigger trg_audit after update on employees for each row insert into audit(emp_id, changed_at) values (new.emp_id, now());"]]}, {"h": "Transactions, ACID, isolation, locks", "blocks": [["<div class=\"tw\"><table>\n<tr><th>ACID</th><th>Meaning</th></tr>\n<tr><td><b>A</b>tomicity</td><td>all statements succeed or none (rollback)</td></tr>\n<tr><td><b>C</b>onsistency</td><td>DB moves from one valid state to another (constraints hold)</td></tr>\n<tr><td><b>I</b>solation</td><td>concurrent transactions don’t see each other’s partial work</td></tr>\n<tr><td><b>D</b>urability</td><td>once committed, survives crashes (redo/transaction logs)</td></tr>\n</table></div>", "acid meaning a tomicity all statements succeed or none (rollback) c onsistency db moves from one valid state to another (constraints hold) i solation concurrent transactions don’t see each other’s partial work d urability once committed, survives crashes (redo/transaction logs)"], ["<pre>START TRANSACTION;     <span class=\"c\">-- BEGIN</span>\nUPDATE Accounts SET bal = bal - 100 WHERE id = 1;\nUPDATE Accounts SET bal = bal + 100 WHERE id = 2;\nCOMMIT;                <span class=\"c\">-- or ROLLBACK;   SAVEPOINT s1; ROLLBACK TO s1;</span></pre>", "start transaction; -- begin update accounts set bal = bal - 100 where id = 1; update accounts set bal = bal + 100 where id = 2; commit; -- or rollback; savepoint s1; rollback to s1;"], ["<div class=\"tw\"><table>\n<tr><th>Isolation level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom read</th></tr>\n<tr><td>Read Uncommitted</td><td>possible</td><td>possible</td><td>possible</td></tr>\n<tr><td>Read Committed (Oracle, SQL Server default)</td><td>no</td><td>possible</td><td>possible</td></tr>\n<tr><td>Repeatable Read (MySQL InnoDB default)</td><td>no</td><td>no</td><td>possible</td></tr>\n<tr><td>Serializable</td><td>no</td><td>no</td><td>no</td></tr>\n</table></div>", "isolation level dirty read non-repeatable read phantom read read uncommitted possible possible possible read committed (oracle, sql server default) no possible possible repeatable read (mysql innodb default) no no possible serializable no no no"], ["<p>Dirty read = reading uncommitted data · non-repeatable = same row gives different value on re-read · phantom = new rows appear on re-query. <b>Locks</b>: shared (read) vs exclusive (write); row vs table level. <b>Deadlock</b> = two transactions each waiting for a lock the other holds (Oracle <code>ORA-00060</code>) → DB kills one. Prevent: same access order, short transactions, index foreign keys.</p>", "dirty read = reading uncommitted data · non-repeatable = same row gives different value on re-read · phantom = new rows appear on re-query. locks : shared (read) vs exclusive (write); row vs table level. deadlock = two transactions each waiting for a lock the other holds (oracle ora-00060 ) → db kills one. prevent: same access order, short transactions, index foreign keys."]]}, {"h": "Normalization", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Form</th><th>Rule</th><th>Violation example</th></tr>\n<tr><td><b>1NF</b></td><td>atomic values, no repeating groups, each row unique</td><td><code>phones = \"111, 222\"</code></td></tr>\n<tr><td><b>2NF</b></td><td>1NF + no <b>partial</b> dependency (non-key column depends on part of a composite key)</td><td>(student_id, course_id) → student_name</td></tr>\n<tr><td><b>3NF</b></td><td>2NF + no <b>transitive</b> dependency (non-key → non-key)</td><td>emp_id → dept_id → dept_name in Employees</td></tr>\n<tr><td><b>BCNF</b></td><td>every determinant is a candidate key</td><td></td></tr>\n</table></div>", "form rule violation example 1nf atomic values, no repeating groups, each row unique phones = \"111, 222\" 2nf 1nf + no partial dependency (non-key column depends on part of a composite key) (student_id, course_id) → student_name 3nf 2nf + no transitive dependency (non-key → non-key) emp_id → dept_id → dept_name in employees bcnf every determinant is a candidate key"], ["<p>Goal: remove redundancy and update/insert/delete anomalies. <b>Denormalization</b> = deliberately adding redundancy for read speed (reporting, data warehouses). Relationships: one-to-one, one-to-many (FK on the “many” side), many-to-many (junction table, e.g. Reservations(EID, BID)).</p>", "goal: remove redundancy and update/insert/delete anomalies. denormalization = deliberately adding redundancy for read speed (reporting, data warehouses). relationships: one-to-one, one-to-many (fk on the “many” side), many-to-many (junction table, e.g. reservations(eid, bid))."]]}, {"h": "DBMS theory & scaling", "blocks": [["<ul>\n<li><b>DBMS</b> = software to store, organize, query and manage data (its primary function: let users store and <b>retrieve data through queries</b>; also handles security, integrity, concurrency, backup/recovery). <b>RDBMS</b> = relational: tables, rows, keys, SQL (Oracle, MySQL, PostgreSQL, SQL Server). <b>NoSQL</b> = document (MongoDB), key-value (Redis), column (Cassandra), graph (Neo4j) — flexible schema, horizontal scale.</li>\n<li><b>OLTP</b> (many small transactions, normalized) vs <b>OLAP</b> (analytics, aggregates, data warehouse, star schema).</li>\n<li><b>Benefits of an RDBMS on multiple servers</b>: high availability &amp; failover (no single point of failure) · scalability/load balancing (read replicas, sharding) · performance · disaster recovery (replica in another site) · maintenance without downtime.</li>\n<li><b>Replication</b>: copies of data (master–slave/primary–replica, synchronous vs asynchronous). <b>Sharding</b>: split rows across servers by key. <b>Clustering</b>: Oracle RAC — several instances, one DB.</li>\n<li><b>CAP theorem</b>: a distributed system can guarantee at most two of Consistency, Availability, Partition tolerance.</li>\n<li><b>Backup</b>: full / incremental / differential; point-in-time recovery via logs.</li>\n<li><b>SQL injection</b>: user input concatenated into SQL (<code>' OR 1=1 --</code>). Prevent with <b>prepared statements / bind variables</b>.</li>\n<li>Oracle specifics (Murex runs on Oracle/Sybase/SQL Server): <code>DUAL</code> table, <code>ROWNUM</code>, <code>NVL</code>, <code>SYSDATE</code>, <code>VARCHAR2</code>, <code>MINUS</code>, sequences, <code>v$session</code>, <code>v$sql</code>, <code>EXPLAIN PLAN</code>, AWR reports, <code>ORA-</code> error codes (ORA-00001 unique violated, ORA-00942 table doesn’t exist, ORA-01017 invalid login, ORA-00060 deadlock, ORA-01555 snapshot too old, ORA-12154 TNS can’t resolve service).</li>\n</ul>", "dbms = software to store, organize, query and manage data (its primary function: let users store and retrieve data through queries ; also handles security, integrity, concurrency, backup/recovery). rdbms = relational: tables, rows, keys, sql (oracle, mysql, postgresql, sql server). nosql = document (mongodb), key-value (redis), column (cassandra), graph (neo4j) — flexible schema, horizontal scale. oltp (many small transactions, normalized) vs olap (analytics, aggregates, data warehouse, star schema). benefits of an rdbms on multiple servers : high availability & failover (no single point of failure) · scalability/load balancing (read replicas, sharding) · performance · disaster recovery (replica in another site) · maintenance without downtime. replication : copies of data (master–slave/primary–replica, synchronous vs asynchronous). sharding : split rows across servers by key. clustering : oracle rac — several instances, one db. cap theorem : a distributed system can guarantee at most two of consistency, availability, partition tolerance. backup : full / incremental / differential; point-in-time recovery via logs. sql injection : user input concatenated into sql ( ' or 1=1 -- ). prevent with prepared statements / bind variables . oracle specifics (murex runs on oracle/sybase/sql server): dual table, rownum , nvl , sysdate , varchar2 , minus , sequences, v$session , v$sql , explain plan , awr reports, ora- error codes (ora-00001 unique violated, ora-00942 table doesn’t exist, ora-01017 invalid login, ora-00060 deadlock, ora-01555 snapshot too old, ora-12154 tns can’t resolve service)."]]}]}, {"title": "Java — crash & code analysis", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">“What is the output?”, “Does it compile?”, “What causes this exception?”. Decide <b>compile-time vs runtime</b> first, then trace carefully.</p>", "“what is the output?”, “does it compile?”, “what causes this exception?”. decide compile-time vs runtime first, then trace carefully."]]}, {"h": "Platform basics", "blocks": [["<ul>\n<li><code>javac A.java</code> compiles source → <b>bytecode</b> (<code>A.class</code>), <code>java A</code> runs it on the <b>JVM</b>. Bytecode is portable (“write once, run anywhere”); native C binaries are not.</li>\n<li><b>JDK</b> (compiler + tools) ⊃ <b>JRE</b> (runtime libraries) ⊃ <b>JVM</b> (executes bytecode, JIT-compiles hot code). <code>.jar</code> = zipped classes. <b>Classpath</b> = where the JVM looks for classes.</li>\n<li>Memory: <b>stack</b> (per thread: method frames, local primitives, references) · <b>heap</b> (all objects, shared; size via <code>-Xms</code>/<code>-Xmx</code>) · metaspace (class metadata). <b>Garbage collector</b> frees objects no longer referenced.</li>\n<li><code>main</code> signature: <code>public static void main(String[] args)</code> (the parameter name doesn’t matter — <code>numbers</code> is fine).</li>\n</ul>", "javac a.java compiles source → bytecode ( a.class ), java a runs it on the jvm . bytecode is portable (“write once, run anywhere”); native c binaries are not. jdk (compiler + tools) ⊃ jre (runtime libraries) ⊃ jvm (executes bytecode, jit-compiles hot code). .jar = zipped classes. classpath = where the jvm looks for classes. memory: stack (per thread: method frames, local primitives, references) · heap (all objects, shared; size via -xms / -xmx ) · metaspace (class metadata). garbage collector frees objects no longer referenced. main signature: public static void main(string[] args) (the parameter name doesn’t matter — numbers is fine)."]]}, {"h": "Types, operators & arithmetic traps", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Primitive</th><th>Size</th><th>Range / note</th></tr>\n<tr><td><code>byte</code></td><td>8 bit</td><td>−128 … 127</td></tr>\n<tr><td><code>short</code></td><td>16 bit</td><td>−32,768 … 32,767</td></tr>\n<tr><td><code>int</code></td><td>32 bit</td><td>−2,147,483,648 … 2,147,483,647 (≈ ±2.1 × 10⁹)</td></tr>\n<tr><td><code>long</code></td><td>64 bit</td><td>≈ ±9.22 × 10¹⁸; literal needs <code>L</code>: <code>10000000000L</code></td></tr>\n<tr><td><code>float</code> / <code>double</code></td><td>32 / 64 bit</td><td>approximate; float literal needs <code>f</code>: <code>3.5f</code></td></tr>\n<tr><td><code>char</code></td><td>16 bit</td><td>Unicode, numeric value: <code>'A'</code> = 65, <code>'a'</code> = 97, <code>'0'</code> = 48</td></tr>\n<tr><td><code>boolean</code></td><td>—</td><td><code>true</code>/<code>false</code> only (not 0/1)</td></tr>\n</table></div>", "primitive size range / note byte 8 bit −128 … 127 short 16 bit −32,768 … 32,767 int 32 bit −2,147,483,648 … 2,147,483,647 (≈ ±2.1 × 10⁹) long 64 bit ≈ ±9.22 × 10¹⁸; literal needs l : 10000000000l float / double 32 / 64 bit approximate; float literal needs f : 3.5f char 16 bit unicode, numeric value: 'a' = 65, 'a' = 97, '0' = 48 boolean — true / false only (not 0/1)"], ["<div class=\"tw\"><table>\n<tr><th>Expression</th><th>Result</th><th>Why</th></tr>\n<tr><td><code>7 / 2</code></td><td><code>3</code></td><td>int / int = integer division (truncates toward zero); <code>-7 / 2</code> = −3</td></tr>\n<tr><td><code>7 % 2</code> · <code>-7 % 2</code></td><td><code>1</code> · <code>-1</code></td><td>remainder takes the sign of the left operand</td></tr>\n<tr><td><code>7 / 2.0</code></td><td><code>3.5</code></td><td>one double operand → double division</td></tr>\n<tr><td><code>int z = y / 0;</code></td><td><b>ArithmeticException</b> at runtime</td><td>compiles fine; only integer division by zero throws</td></tr>\n<tr><td><code>5.0 / 0</code> · <code>0.0 / 0</code></td><td><code>Infinity</code> · <code>NaN</code></td><td>floating point never throws</td></tr>\n<tr><td><code>Integer.MAX_VALUE + 1</code></td><td><code>-2147483648</code></td><td>silent overflow (wrap-around). <code>Math.addExact</code> throws instead</td></tr>\n<tr><td><code>(byte) 130</code></td><td><code>-126</code></td><td>narrowing cast keeps low 8 bits</td></tr>\n<tr><td><code>(int) 3.99</code></td><td><code>3</code></td><td>cast truncates, doesn’t round (<code>Math.round</code> rounds)</td></tr>\n<tr><td><code>0.1 + 0.2 == 0.3</code></td><td><code>false</code></td><td>binary floating point; use <code>BigDecimal</code> for money</td></tr>\n<tr><td><code>'a' + 1</code> · <code>(char)('a' + 1)</code></td><td><code>98</code> · <code>b</code></td><td>char promotes to int in arithmetic</td></tr>\n<tr><td><code>'a' + 'b'</code></td><td><code>195</code></td><td>two chars add numerically (97 + 98)</td></tr>\n<tr><td><code>int i = 5; i = i++;</code></td><td><code>5</code></td><td>post-increment returns the old value, then assignment overwrites</td></tr>\n<tr><td><code>int a = 5; int b = a++ + ++a;</code></td><td><code>b = 12</code></td><td>5 (a→6) + 7 (a→7)</td></tr>\n<tr><td><code>x &gt; 0 &amp;&amp; y / x &gt; 1</code></td><td>safe when x = 0</td><td><code>&amp;&amp;</code> / <code>||</code> short-circuit; <code>&amp;</code> / <code>|</code> evaluate both</td></tr>\n<tr><td><code>5 &gt;&gt; 1</code> · <code>5 &lt;&lt; 1</code> · <code>5 ^ 3</code></td><td><code>2</code> · <code>10</code> · <code>6</code></td><td>shift right/left, XOR</td></tr>\n</table></div>", "expression result why 7 / 2 3 int / int = integer division (truncates toward zero); -7 / 2 = −3 7 % 2 · -7 % 2 1 · -1 remainder takes the sign of the left operand 7 / 2.0 3.5 one double operand → double division int z = y / 0; arithmeticexception at runtime compiles fine; only integer division by zero throws 5.0 / 0 · 0.0 / 0 infinity · nan floating point never throws integer.max_value + 1 -2147483648 silent overflow (wrap-around). math.addexact throws instead (byte) 130 -126 narrowing cast keeps low 8 bits (int) 3.99 3 cast truncates, doesn’t round ( math.round rounds) 0.1 + 0.2 == 0.3 false binary floating point; use bigdecimal for money 'a' + 1 · (char)('a' + 1) 98 · b char promotes to int in arithmetic 'a' + 'b' 195 two chars add numerically (97 + 98) int i = 5; i = i++; 5 post-increment returns the old value, then assignment overwrites int a = 5; int b = a++ + ++a; b = 12 5 (a→6) + 7 (a→7) x > 0 && y / x > 1 safe when x = 0 && / || short-circuit; & / | evaluate both 5 >> 1 · 5 << 1 · 5 ^ 3 2 · 10 · 6 shift right/left, xor"]]}, {"h": "Strings", "blocks": [["<pre>System.out.println(100 + 100 + \"MUREX\");        <span class=\"c\">// 200MUREX  (left to right: int+int first)</span>\nSystem.out.println(\"Murex Company\" + 100 + 100); <span class=\"c\">// Murex Company100100 (String+int = String)</span>\nSystem.out.println(\"Sum \" + (100 + 100));        <span class=\"c\">// Sum 200</span>\nSystem.out.println(1 + 2 + \"3\" + 4 + 5);         <span class=\"c\">// 3345</span>\nSystem.out.println('a' + 'b' + \"c\");             <span class=\"c\">// 195c</span>\n\nString s1 = \"murex\";                 <span class=\"c\">// from the string pool</span>\nString s2 = \"murex\";                 <span class=\"c\">// same pooled object</span>\nString s3 = new String(\"murex\");     <span class=\"c\">// new object on the heap</span>\ns1 == s2        <span class=\"c\">// true  (same reference)</span>\ns1 == s3        <span class=\"c\">// false (different objects)</span>\ns1.equals(s3)   <span class=\"c\">// true  (same content) → ALWAYS compare strings with equals()</span>\n\nString s = \"abc\";\ns.toUpperCase();                     <span class=\"c\">// result discarded: Strings are IMMUTABLE</span>\nSystem.out.println(s);               <span class=\"c\">// abc</span>\ns = s.toUpperCase();                 <span class=\"c\">// ABC</span></pre>", "system.out.println(100 + 100 + \"murex\"); // 200murex (left to right: int+int first) system.out.println(\"murex company\" + 100 + 100); // murex company100100 (string+int = string) system.out.println(\"sum \" + (100 + 100)); // sum 200 system.out.println(1 + 2 + \"3\" + 4 + 5); // 3345 system.out.println('a' + 'b' + \"c\"); // 195c string s1 = \"murex\"; // from the string pool string s2 = \"murex\"; // same pooled object string s3 = new string(\"murex\"); // new object on the heap s1 == s2 // true (same reference) s1 == s3 // false (different objects) s1.equals(s3) // true (same content) → always compare strings with equals() string s = \"abc\"; s.touppercase(); // result discarded: strings are immutable system.out.println(s); // abc s = s.touppercase(); // abc"], ["<p>Useful methods: <code>length()</code>, <code>charAt(i)</code>, <code>substring(b, e)</code> (e exclusive), <code>indexOf</code>, <code>contains</code>, <code>split(\",\")</code>, <code>trim()</code>, <code>equalsIgnoreCase</code>, <code>toCharArray()</code>, <code>String.valueOf()</code>, <code>Integer.parseInt()</code>. Build strings in loops with <code>StringBuilder</code> (mutable, fast). Same <code>==</code> trap for wrappers: <code>Integer a = 127, b = 127; a == b</code> true (cached −128…127) but with 128 → false.</p>", "useful methods: length() , charat(i) , substring(b, e) (e exclusive), indexof , contains , split(\",\") , trim() , equalsignorecase , tochararray() , string.valueof() , integer.parseint() . build strings in loops with stringbuilder (mutable, fast). same == trap for wrappers: integer a = 127, b = 127; a == b true (cached −128…127) but with 128 → false."]]}, {"h": "OOP: inheritance, overriding, hiding", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Member</th><th>Resolved by</th><th>Polymorphic?</th></tr>\n<tr><td>Instance method (overridden)</td><td><b>runtime</b> type of the object</td><td>yes</td></tr>\n<tr><td>Field (same name in subclass)</td><td><b>declared</b> (reference) type — field <i>hiding</i></td><td><b>no</b></td></tr>\n<tr><td>Static method (same signature)</td><td><b>declared</b> type — method <i>hiding</i></td><td><b>no</b></td></tr>\n<tr><td>Overloaded method (different params)</td><td>compile time, by argument types</td><td>no</td></tr>\n<tr><td>Private / final methods</td><td>can’t be overridden</td><td>no</td></tr>\n</table></div>", "member resolved by polymorphic? instance method (overridden) runtime type of the object yes field (same name in subclass) declared (reference) type — field hiding no static method (same signature) declared type — method hiding no overloaded method (different params) compile time, by argument types no private / final methods can’t be overridden no"], ["<pre>class Math { public final double secret = 2; }\nclass ComplexMath extends Math { public final double secret = 4; }\nclass InfiniteMath extends ComplexMath {\n  public final double secret = 8;\n  public static void main(String[] n) {\n    Math math = new InfiniteMath();\n    System.out.print(math.secret);           <span class=\"c\">// 2.0  → declared type Math; double prints with .0</span>\n    System.out.print(((InfiniteMath) math).secret); <span class=\"c\">// 8.0</span>\n  }\n}\n\nclass P { static String who(){return \"P\";} String me(){return \"p\";} }\nclass C extends P { static String who(){return \"C\";} String me(){return \"c\";} }\nP x = new C();\nSystem.out.println(x.who() + x.me());        <span class=\"c\">// Pc</span></pre>", "class math { public final double secret = 2; } class complexmath extends math { public final double secret = 4; } class infinitemath extends complexmath { public final double secret = 8; public static void main(string[] n) { math math = new infinitemath(); system.out.print(math.secret); // 2.0 → declared type math; double prints with .0 system.out.print(((infinitemath) math).secret); // 8.0 } } class p { static string who(){return \"p\";} string me(){return \"p\";} } class c extends p { static string who(){return \"c\";} string me(){return \"c\";} } p x = new c(); system.out.println(x.who() + x.me()); // pc"], ["<ul>\n<li><b>Constructors</b>: the parent constructor runs <b>first</b> (implicit <code>super()</code> as first line). If the parent has no no-arg constructor, the child must call <code>super(args)</code> or it’s a compile error. Constructors are not inherited.</li>\n<li><b>Overriding rules</b>: same signature, same or covariant return type, access can’t be more restrictive, can’t throw broader checked exceptions. <code>@Override</code> makes the compiler verify.</li>\n<li><b>Abstract class</b>: can’t be instantiated, may have abstract and concrete methods, constructors, state. <b>Interface</b>: contract; methods public abstract by default (plus <code>default</code>/<code>static</code> since Java 8); fields are <code>public static final</code>; a class can implement many interfaces but extend one class.</li>\n<li><b>final</b>: variable can’t be reassigned · method can’t be overridden · class can’t be extended (e.g. <code>String</code>).</li>\n<li><b>static</b>: belongs to the class, shared by all instances; static methods can’t use <code>this</code> or instance fields directly.</li>\n<li>Access: <code>private</code> (class) &lt; default/package &lt; <code>protected</code> (package + subclasses) &lt; <code>public</code>.</li>\n<li>Four pillars: <b>encapsulation</b> (private fields + getters), <b>inheritance</b>, <b>polymorphism</b>, <b>abstraction</b>.</li>\n<li><code>equals()</code>/<code>hashCode()</code> contract: equal objects must have equal hash codes (needed for HashMap/HashSet).</li>\n<li>Casting: upcast implicit (<code>Animal a = new Dog()</code>); downcast explicit, wrong type → <code>ClassCastException</code>; check with <code>instanceof</code>.</li>\n</ul>", "constructors : the parent constructor runs first (implicit super() as first line). if the parent has no no-arg constructor, the child must call super(args) or it’s a compile error. constructors are not inherited. overriding rules : same signature, same or covariant return type, access can’t be more restrictive, can’t throw broader checked exceptions. @override makes the compiler verify. abstract class : can’t be instantiated, may have abstract and concrete methods, constructors, state. interface : contract; methods public abstract by default (plus default / static since java 8); fields are public static final ; a class can implement many interfaces but extend one class. final : variable can’t be reassigned · method can’t be overridden · class can’t be extended (e.g. string ). static : belongs to the class, shared by all instances; static methods can’t use this or instance fields directly. access: private (class) < default/package < protected (package + subclasses) < public . four pillars: encapsulation (private fields + getters), inheritance , polymorphism , abstraction . equals() / hashcode() contract: equal objects must have equal hash codes (needed for hashmap/hashset). casting: upcast implicit ( animal a = new dog() ); downcast explicit, wrong type → classcastexception ; check with instanceof ."]]}, {"h": "Compile errors (code won’t compile)", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Code</th><th>Error</th></tr>\n<tr><td><code>int x; System.out.println(x);</code></td><td>local variable might not have been initialized (fields get defaults: 0, null, false — locals don’t)</td></tr>\n<tr><td><code>int x = 3.5;</code></td><td>incompatible types: possible lossy conversion from double to int</td></tr>\n<tr><td><code>long l = 10000000000;</code></td><td>integer number too large (needs <code>L</code>)</td></tr>\n<tr><td><code>float f = 1.5;</code></td><td>lossy conversion (needs <code>1.5f</code>)</td></tr>\n<tr><td><code>final int a = 1; a = 2;</code></td><td>cannot assign a value to final variable</td></tr>\n<tr><td><code>return 1; System.out.println();</code></td><td><b>unreachable statement</b> (also after <code>while(true){}</code> with no break, after <code>throw</code>)</td></tr>\n<tr><td>non-void method without return on all paths</td><td>missing return statement</td></tr>\n<tr><td>calling a method that throws a checked exception without try/catch or <code>throws</code></td><td>unreported exception … must be caught or declared to be thrown</td></tr>\n<tr><td><code>new AbstractClass()</code> / <code>new Interface()</code></td><td>is abstract; cannot be instantiated</td></tr>\n<tr><td>instance field used in <code>static main</code></td><td>non-static variable cannot be referenced from a static context</td></tr>\n<tr><td>missing <code>;</code>, unmatched braces, undefined variable/method</td><td>cannot find symbol / ‘;’ expected</td></tr>\n<tr><td><code>String s = 'ab';</code> · <code>char c = \"a\";</code></td><td>unclosed character literal / incompatible types</td></tr>\n<tr><td><code>if (x = 5)</code></td><td>incompatible types: int cannot be converted to boolean</td></tr>\n<tr><td>two public classes in one file / file name ≠ public class name</td><td>class X is public, should be declared in a file named X.java</td></tr>\n<tr><td>catching a subclass exception after its superclass</td><td>exception has already been caught</td></tr>\n</table></div>", "code error int x; system.out.println(x); local variable might not have been initialized (fields get defaults: 0, null, false — locals don’t) int x = 3.5; incompatible types: possible lossy conversion from double to int long l = 10000000000; integer number too large (needs l ) float f = 1.5; lossy conversion (needs 1.5f ) final int a = 1; a = 2; cannot assign a value to final variable return 1; system.out.println(); unreachable statement (also after while(true){} with no break, after throw ) non-void method without return on all paths missing return statement calling a method that throws a checked exception without try/catch or throws unreported exception … must be caught or declared to be thrown new abstractclass() / new interface() is abstract; cannot be instantiated instance field used in static main non-static variable cannot be referenced from a static context missing ; , unmatched braces, undefined variable/method cannot find symbol / ‘;’ expected string s = 'ab'; · char c = \"a\"; unclosed character literal / incompatible types if (x = 5) incompatible types: int cannot be converted to boolean two public classes in one file / file name ≠ public class name class x is public, should be declared in a file named x.java catching a subclass exception after its superclass exception has already been caught"]]}, {"h": "Runtime exceptions & errors", "blocks": [["<pre>Throwable\n ├── Error                    (serious, don't catch: OutOfMemoryError, StackOverflowError)\n └── Exception\n      ├── checked             (must catch or declare: IOException, SQLException, ClassNotFoundException, InterruptedException)\n      └── RuntimeException    (unchecked: NullPointerException, ArithmeticException, ...)</pre>", "throwable ├── error (serious, don't catch: outofmemoryerror, stackoverflowerror) └── exception ├── checked (must catch or declare: ioexception, sqlexception, classnotfoundexception, interruptedexception) └── runtimeexception (unchecked: nullpointerexception, arithmeticexception, ...)"], ["<div class=\"tw\"><table>\n<tr><th>Exception</th><th>Cause</th></tr>\n<tr><td><code>NullPointerException</code></td><td>calling a method/field on a <code>null</code> reference, unboxing null, <code>array.length</code> of null array</td></tr>\n<tr><td><code>ArithmeticException: / by zero</code></td><td>integer division or modulo by zero</td></tr>\n<tr><td><code>ArrayIndexOutOfBoundsException</code></td><td>index &lt; 0 or ≥ length (classic: <code>i &lt;= arr.length</code>)</td></tr>\n<tr><td><code>StringIndexOutOfBoundsException</code></td><td><code>charAt</code>/<code>substring</code> outside the string</td></tr>\n<tr><td><code>ClassCastException</code></td><td>invalid downcast</td></tr>\n<tr><td><code>NumberFormatException</code></td><td><code>Integer.parseInt(\"12a\")</code></td></tr>\n<tr><td><code>IllegalArgumentException</code> / <code>IllegalStateException</code></td><td>bad argument / object not in the right state</td></tr>\n<tr><td><code>ConcurrentModificationException</code></td><td>modifying a collection while iterating it with for-each (use <code>Iterator.remove()</code>)</td></tr>\n<tr><td><code>UnsupportedOperationException</code></td><td>modifying an immutable list (<code>List.of</code>, <code>Arrays.asList(...).add</code>)</td></tr>\n<tr><td><code>StackOverflowError</code></td><td>infinite/too-deep recursion (no base case)</td></tr>\n<tr><td><code>OutOfMemoryError: Java heap space</code></td><td>heap too small for data, loading everything in memory, memory leak (static collections, caches). Also “GC overhead limit exceeded”, “Metaspace”, “unable to create new native thread”</td></tr>\n<tr><td><code>ClassNotFoundException</code> (checked)</td><td>class loaded by name at runtime (<code>Class.forName</code>, JDBC driver) not on classpath</td></tr>\n<tr><td><code>NoClassDefFoundError</code></td><td>class existed at compile time but missing at runtime (missing jar)</td></tr>\n<tr><td><code>NoSuchMethodError</code></td><td>jar version mismatch</td></tr>\n<tr><td><code>java.net.ConnectException: Connection refused</code></td><td>nothing listening at host:port (see Networking)</td></tr>\n<tr><td><code>SocketTimeoutException</code>, <code>UnknownHostException</code></td><td>slow server / DNS failure</td></tr>\n<tr><td><code>SQLException</code></td><td>DB error — read the vendor code (ORA-xxxxx)</td></tr>\n<tr><td><code>FileNotFoundException</code> / <code>IOException</code></td><td>missing file, permissions, disk full</td></tr>\n<tr><td><code>InterruptedException</code></td><td>thread interrupted while sleeping/waiting</td></tr>\n</table></div>", "exception cause nullpointerexception calling a method/field on a null reference, unboxing null, array.length of null array arithmeticexception: / by zero integer division or modulo by zero arrayindexoutofboundsexception index < 0 or ≥ length (classic: i <= arr.length ) stringindexoutofboundsexception charat / substring outside the string classcastexception invalid downcast numberformatexception integer.parseint(\"12a\") illegalargumentexception / illegalstateexception bad argument / object not in the right state concurrentmodificationexception modifying a collection while iterating it with for-each (use iterator.remove() ) unsupportedoperationexception modifying an immutable list ( list.of , arrays.aslist(...).add ) stackoverflowerror infinite/too-deep recursion (no base case) outofmemoryerror: java heap space heap too small for data, loading everything in memory, memory leak (static collections, caches). also “gc overhead limit exceeded”, “metaspace”, “unable to create new native thread” classnotfoundexception (checked) class loaded by name at runtime ( class.forname , jdbc driver) not on classpath noclassdeffounderror class existed at compile time but missing at runtime (missing jar) nosuchmethoderror jar version mismatch java.net.connectexception: connection refused nothing listening at host:port (see networking) sockettimeoutexception , unknownhostexception slow server / dns failure sqlexception db error — read the vendor code (ora-xxxxx) filenotfoundexception / ioexception missing file, permissions, disk full interruptedexception thread interrupted while sleeping/waiting"], ["<pre>try {\n    risky();\n} catch (IOException | SQLException e) {   <span class=\"c\">// multi-catch; specific before general</span>\n    log.error(\"failed\", e);\n} finally {\n    close();                               <span class=\"c\">// ALWAYS runs (even after return), except System.exit()</span>\n}\ntry (BufferedReader r = new BufferedReader(new FileReader(\"f\"))) { }   <span class=\"c\">// try-with-resources closes automatically</span></pre>", "try { risky(); } catch (ioexception | sqlexception e) { // multi-catch; specific before general log.error(
