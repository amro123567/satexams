lst) none, 0, \"\", [], {} are falsy int is unbounded (no overflow) try / except valueerror as e / finally with open(\"f\") as fh: (auto-close)"]]}, {"h": "JVM: bytecode, GC, thread vs heap dumps", "blocks": [["<ul>\n<li><code>javac A.java</code> → <code>A.class</code> = <b>bytecode</b>, which is <b>portable</b> because every OS/CPU has its own JVM that interprets and JIT-compiles it. (C → native binary, not portable.)</li>\n<li><b>Heap generations</b>: Young (Eden + Survivor; frequent <b>minor GC</b>) → Old/Tenured (long-lived objects). A <b>full GC</b> runs when the old generation/heap has no space left for allocation; it is slow and can pause the application (“stop the world”). <code>System.gc()</code> is only a <i>request</i>. An object becomes eligible for GC when nothing references it.</li>\n<li>Collectors: Serial, Parallel, <b>G1</b> (default), ZGC/Shenandoah (low pause). Flags: <code>-Xms</code>, <code>-Xmx</code>, <code>-Xlog:gc</code>.</li>\n<li><b>Thread dump</b> (<code>jstack PID</code>, <code>kill -3 PID</code>, <code>jcmd PID Thread.print</code>): the state and stack of every thread (RUNNABLE, BLOCKED, WAITING, TIMED_WAITING). Use it for <b>hangs, deadlocks, high CPU</b>. Several threads BLOCKED on the same monitor → <b>deadlock</b>/contention.</li>\n<li><b>Heap dump</b> (<code>jmap -dump:format=b,file=h.hprof PID</code>, <code>-XX:+HeapDumpOnOutOfMemoryError</code>): every object in memory and its references. Use it for <b>memory leaks / OutOfMemoryError</b>, analysed with Eclipse MAT or VisualVM.</li>\n</ul>", "javac a.java → a.class = bytecode , which is portable because every os/cpu has its own jvm that interprets and jit-compiles it. (c → native binary, not portable.) heap generations : young (eden + survivor; frequent minor gc ) → old/tenured (long-lived objects). a full gc runs when the old generation/heap has no space left for allocation; it is slow and can pause the application (“stop the world”). system.gc() is only a request . an object becomes eligible for gc when nothing references it. collectors: serial, parallel, g1 (default), zgc/shenandoah (low pause). flags: -xms , -xmx , -xlog:gc . thread dump ( jstack pid , kill -3 pid , jcmd pid thread.print ): the state and stack of every thread (runnable, blocked, waiting, timed_waiting). use it for hangs, deadlocks, high cpu . several threads blocked on the same monitor → deadlock /contention. heap dump ( jmap -dump:format=b,file=h.hprof pid , -xx:+heapdumponoutofmemoryerror ): every object in memory and its references. use it for memory leaks / outofmemoryerror , analysed with eclipse mat or visualvm."]]}, {"h": "Security concepts", "blocks": [["<ul>\n<li><b>Zero trust</b>: “never trust, always verify”, regardless of network location. Authenticate and authorise every request, least privilege, MFA, micro-segmentation, encrypt everything. The opposite of perimeter security (“inside the firewall = trusted”).</li>\n<li><b>IAM</b>: Identity and Access Management controls <b>authentication</b> (who you are) and <b>authorization</b> (what you may do): users, groups, roles, policies.</li>\n<li><b>Authentication vs authorization</b> → HTTP 401 vs 403. <b>MFA</b> combines different factor types: something you know, have, or are.</li>\n<li><b>Least privilege</b>, separation of duties, encryption at rest and in transit (TLS), hashing passwords (bcrypt), the <b>CIA triad</b> (Confidentiality, Integrity, Availability).</li>\n<li>Common attacks: SQL injection, XSS, CSRF, phishing, brute force, DDoS, man-in-the-middle.</li>\n</ul>", "zero trust : “never trust, always verify”, regardless of network location. authenticate and authorise every request, least privilege, mfa, micro-segmentation, encrypt everything. the opposite of perimeter security (“inside the firewall = trusted”). iam : identity and access management controls authentication (who you are) and authorization (what you may do): users, groups, roles, policies. authentication vs authorization → http 401 vs 403. mfa combines different factor types: something you know, have, or are. least privilege , separation of duties, encryption at rest and in transit (tls), hashing passwords (bcrypt), the cia triad (confidentiality, integrity, availability). common attacks: sql injection, xss, csrf, phishing, brute force, ddos, man-in-the-middle."]]}, {"h": "Memory types & hypervisor products", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Memory</th><th>Volatile?</th><th>Notes</th></tr>\n<tr><td>Registers / cache</td><td>yes</td><td>fastest, inside the CPU</td></tr>\n<tr><td>RAM</td><td>yes</td><td>working memory, lost at power off</td></tr>\n<tr><td><b>ROM</b></td><td><b>no</b></td><td>read-only, <b>permanent instructions such as BIOS/firmware</b>; slower than RAM, not modified during normal operation (EEPROM/flash can be re-flashed)</td></tr>\n<tr><td>SSD / HDD</td><td>no</td><td>storage. <b>SSD advantages</b>: much faster (no seek time, fast random I/O), no moving parts (shock resistant, silent), less power and heat. HDD: cheaper per GB, good for bulk storage</td></tr>\n</table></div>", "memory volatile? notes registers / cache yes fastest, inside the cpu ram yes working memory, lost at power off rom no read-only, permanent instructions such as bios/firmware ; slower than ram, not modified during normal operation (eeprom/flash can be re-flashed) ssd / hdd no storage. ssd advantages : much faster (no seek time, fast random i/o), no moving parts (shock resistant, silent), less power and heat. hdd: cheaper per gb, good for bulk storage"], ["<div class=\"tw\"><table>\n<tr><th></th><th>VMware</th><th>VirtualBox</th><th>Hyper-V</th></tr>\n<tr><td>Type</td><td>ESXi = type 1; Workstation/Fusion = type 2</td><td>type 2</td><td>type 1</td></tr>\n<tr><td>Cost</td><td>commercial (enterprise)</td><td>free, open source (Oracle)</td><td>included with Windows Server/Pro</td></tr>\n<tr><td>Strengths</td><td>vSphere/vCenter, vMotion live migration, HA, DRS, top performance</td><td>cross-platform, simple, snapshots, Vagrant</td><td>Windows/Azure integration, PowerShell, live migration</td></tr>\n<tr><td>Use</td><td>data-centre production</td><td>developers/students, local labs</td><td>Microsoft environments, hybrid cloud</td></tr>\n</table></div>", "vmware virtualbox hyper-v type esxi = type 1; workstation/fusion = type 2 type 2 type 1 cost commercial (enterprise) free, open source (oracle) included with windows server/pro strengths vsphere/vcenter, vmotion live migration, ha, drs, top performance cross-platform, simple, snapshots, vagrant windows/azure integration, powershell, live migration use data-centre production developers/students, local labs microsoft environments, hybrid cloud"], ["<p>A <b>hypervisor</b> creates and manages VMs on a host. One host can run both VMs and containers (and containers inside VMs).</p>", "a hypervisor creates and manages vms on a host. one host can run both vms and containers (and containers inside vms)."]]}, {"h": "ISTQB-style testing theory", "blocks": [["<ul>\n<li><b>Main goal of a test team</b>: provide information and build <b>enough confidence to decide whether to release</b>. You can never prove the absence of faults.</li>\n<li><b>Risk-based prioritisation</b>: when time is short, run the high-impact/high-probability tests first. Setup and teardown steps (open/close DB) are needed by the others; changes that alter nothing (replace a value with the same value) and cosmetic edits come last.</li>\n<li><b>Tester skills in agile</b>: product/domain knowledge, being a good team player (collaboration, communication), critical thinking. The <b>Product Owner</b> owns the vision and backlog; the Scrum Master facilitates; the team plans its own work.</li>\n<li>Agile testing: whole-team quality, testing inside the sprint, test automation pyramid (many unit tests, fewer API tests, fewest UI tests), definition of done, test-first (TDD/BDD/ATDD).</li>\n<li><b>Field validation recipe</b> (e.g. alphanumeric username, max 16): valid classes (letters, digits, mix, case), boundaries (0, 1, 15, 16, 17), invalid characters (special, spaces, Unicode, emoji), empty, duplicates/case-sensitivity, injection (SQL, XSS), client- and server-side validation, error messages, copy/paste, browsers/mobile.</li>\n<li><b>Test timeout</b> (a scenario exceeds its time limit): performance regression, slow or overloaded environment, hang/deadlock/waiting on a resource, larger data, an unrealistic limit.</li>\n</ul>", "main goal of a test team : provide information and build enough confidence to decide whether to release . you can never prove the absence of faults. risk-based prioritisation : when time is short, run the high-impact/high-probability tests first. setup and teardown steps (open/close db) are needed by the others; changes that alter nothing (replace a value with the same value) and cosmetic edits come last. tester skills in agile : product/domain knowledge, being a good team player (collaboration, communication), critical thinking. the product owner owns the vision and backlog; the scrum master facilitates; the team plans its own work. agile testing: whole-team quality, testing inside the sprint, test automation pyramid (many unit tests, fewer api tests, fewest ui tests), definition of done, test-first (tdd/bdd/atdd). field validation recipe (e.g. alphanumeric username, max 16): valid classes (letters, digits, mix, case), boundaries (0, 1, 15, 16, 17), invalid characters (special, spaces, unicode, emoji), empty, duplicates/case-sensitivity, injection (sql, xss), client- and server-side validation, error messages, copy/paste, browsers/mobile. test timeout (a scenario exceeds its time limit): performance regression, slow or overloaded environment, hang/deadlock/waiting on a resource, larger data, an unrealistic limit."]]}, {"h": "Extra UNIX details", "blocks": [["<ul>\n<li><code>touch f</code> creates an empty file (<code>mkdir</code> = directory; <code>vim f</code> only creates it when you save). <code>pwd</code> = current directory. <code>id</code> = user + group info. <code>top</code> = live processes and resource usage.</li>\n<li><code>rm -r *</code> = delete all files <b>and subdirectories</b> here (dot-files excepted). <code>rm -r</code> alone has no target; <code>rm -f *</code> doesn’t remove directories.</li>\n<li><code>chmod a+rw f</code> → adds read and write for user, group and others; execute unchanged.</li>\n<li><code>ls data &gt; data/files</code>: the shell creates <code>data/files</code> <b>before</b> ls runs, so it appears in its own listing.</li>\n<li><code>find -mtime</code> (content modified, days) · <code>-ctime</code> (inode/status changed) · <code>-atime</code> (accessed) · <code>-mmin</code> (minutes).</li>\n<li>Viewers: <code>cat</code>, <code>less</code>, <code>more</code>, <code>head</code>, <code>tail</code>. Editors: <code>vi</code>/<code>vim</code>, <code>nano</code>.</li>\n<li>Open ports: <code>ss -tuln</code>, <code>netstat -tuln</code>, <code>netstat -plnt</code>, <code>lsof -i</code>. Ping tests reachability and latency, <b>not</b> ports.</li>\n<li>Git staging area = where <code>git add</code> puts changes for the <b>next commit</b>. <code>git commit -a</code> auto-stages <b>tracked</b> files only; new files need <code>git add</code> first. You can’t delete the branch you’re on.</li>\n</ul>", "touch f creates an empty file ( mkdir = directory; vim f only creates it when you save). pwd = current directory. id = user + group info. top = live processes and resource usage. rm -r * = delete all files and subdirectories here (dot-files excepted). rm -r alone has no target; rm -f * doesn’t remove directories. chmod a+rw f → adds read and write for user, group and others; execute unchanged. ls data > data/files : the shell creates data/files before ls runs, so it appears in its own listing. find -mtime (content modified, days) · -ctime (inode/status changed) · -atime (accessed) · -mmin (minutes). viewers: cat , less , more , head , tail . editors: vi / vim , nano . open ports: ss -tuln , netstat -tuln , netstat -plnt , lsof -i . ping tests reachability and latency, not ports. git staging area = where git add puts changes for the next commit . git commit -a auto-stages tracked files only; new files need git add first. you can’t delete the branch you’re on."]]}, {"h": "Extra SQL syntax", "blocks": [["<pre>SELECT SUBSTR(First_Name, 1, 3) FROM Students;          <span class=\"c\">-- first 3 chars (SUBSTRING / LEFT in MySQL, SQL Server); 1-indexed</span>\nALTER TABLE t MODIFY col NUMBER(10) DEFAULT 0;          <span class=\"c\">-- Oracle/MySQL: change type + default</span>\nALTER TABLE t ALTER COLUMN col TYPE INT;                <span class=\"c\">-- PostgreSQL</span>\nALTER TABLE t ALTER COLUMN col SET DEFAULT 0;\nALTER TABLE t CHANGE old_name new_name INT;             <span class=\"c\">-- MySQL rename + type</span>\nUPDATE t SET c = v WHERE c IN ('A','B');                <span class=\"c\">-- = WHERE c = 'A' OR c = 'B'</span>\n                                                        <span class=\"c\">-- WHERE c = 'A' OR 'B'  → wrong;  c = 'A' AND c = 'B' → never true</span>\nSELECT name, CASE WHEN yrs &lt; 3 THEN 'Junior'\n                  WHEN yrs BETWEEN 3 AND 7 THEN 'Mid-Level'\n                  ELSE 'Senior' END AS level FROM Employees;\n<span class=\"c\">-- top 3 per group</span>\nSELECT * FROM (SELECT e.*, DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) r FROM Employees e) x WHERE r &lt;= 3;\n<span class=\"c\">-- HAVING COUNT(project_id) = 1 → exactly one project</span></pre>", "select substr(first_name, 1, 3) from students; -- first 3 chars (substring / left in mysql, sql server); 1-indexed alter table t modify col number(10) default 0; -- oracle/mysql: change type + default alter table t alter column col type int; -- postgresql alter table t alter column col set default 0; alter table t change old_name new_name int; -- mysql rename + type update t set c = v where c in ('a','b'); -- = where c = 'a' or c = 'b' -- where c = 'a' or 'b' → wrong; c = 'a' and c = 'b' → never true select name, case when yrs < 3 then 'junior' when yrs between 3 and 7 then 'mid-level' else 'senior' end as level from employees; -- top 3 per group select * from (select e.*, dense_rank() over (partition by dept_id order by salary desc) r from employees e) x where r <= 3; -- having count(project_id) = 1 → exactly one project"], ["<div class=\"tw\"><table>\n<tr><th>Oracle error</th><th>Meaning</th></tr>\n<tr><td>ORA-00001</td><td>unique constraint violated (duplicate key)</td></tr>\n<tr><td>ORA-02291</td><td>parent key not found: inserting a child with no parent</td></tr>\n<tr><td><b>ORA-02292</b></td><td>child record found: <b>deleting a parent still referenced by a foreign key</b> (ON DELETE RESTRICT). Fix: delete the children first, or use CASCADE / SET NULL</td></tr>\n<tr><td>ORA-01400</td><td>cannot insert NULL into a NOT NULL column</td></tr>\n<tr><td>ORA-00904 / 00942</td><td>invalid identifier (column) / table or view does not exist</td></tr>\n</table></div>", "oracle error meaning ora-00001 unique constraint violated (duplicate key) ora-02291 parent key not found: inserting a child with no parent ora-02292 child record found: deleting a parent still referenced by a foreign key (on delete restrict). fix: delete the children first, or use cascade / set null ora-01400 cannot insert null into a not null column ora-00904 / 00942 invalid identifier (column) / table or view does not exist"]]}, {"h": "Algorithmic pseudo-code patterns", "blocks": [["<h4>Clock angle</h4>", "clock angle"], ["<pre>minuteAngle = 6 * m                    <span class=\"c\"># 360° / 60 min</span>\nhourAngle   = 30 * (h % 12) + 0.5 * m  <span class=\"c\"># 360° / 12 h, plus 0.5° per minute</span>\ndiff = |hourAngle − minuteAngle|\nanswer = min(diff, 360 − diff)         <span class=\"c\"># 3:00 → 90,  3:30 → |105 − 180| = 75</span></pre>", "minuteangle = 6 * m # 360° / 60 min hourangle = 30 * (h % 12) + 0.5 * m # 360° / 12 h, plus 0.5° per minute diff = |hourangle − minuteangle| answer = min(diff, 360 − diff) # 3:00 → 90, 3:30 → |105 − 180| = 75"], ["<h4>Traffic light (two-state machine)</h4>", "traffic light (two-state machine)"], ["<pre>A = GREEN; B = RED\nloop forever:\n    show(A, B); wait(60 s)\n    swap: if A == GREEN then (A, B) = (RED, GREEN) else (A, B) = (GREEN, RED)\n<span class=\"c\"># invariant: never both green; optional all-red/yellow interval</span></pre>", "a = green; b = red loop forever: show(a, b); wait(60 s) swap: if a == green then (a, b) = (red, green) else (a, b) = (green, red) # invariant: never both green; optional all-red/yellow interval"], ["<h4>Reverse an array in place (no library)</h4>", "reverse an array in place (no library)"], ["<pre>i = 0; j = n − 1\nwhile i &lt; j: swap(a[i], a[j]); i++; j--      <span class=\"c\"># O(n) time, O(1) space</span></pre>", "i = 0; j = n − 1 while i < j: swap(a[i], a[j]); i++; j-- # o(n) time, o(1) space"], ["<p>Common relatives: rotate an array (reverse whole, then both parts), palindrome check (two pointers), find min/max in one pass, merge two sorted arrays, count occurrences with a hash map.</p>", "common relatives: rotate an array (reverse whole, then both parts), palindrome check (two pointers), find min/max in one pass, merge two sorted arrays, count occurrences with a hash map."]]}, {"h": "Misc definitions", "blocks": [["<ul>\n<li><b>Module</b>: a reusable unit of code/functionality with a clear interface (package, library, Python module, Java module).</li>\n<li><b>DHCP</b> assigns IP addresses automatically; <b>DNS</b> resolves names. Class C default mask = <code>255.255.255.0</code>.</li>\n<li><b>SaaS advantages</b> over on-premises: no upfront hardware/licence cost (subscription), the provider handles maintenance/updates/security, fast deployment, access from anywhere, elastic scaling, SLAs.</li>\n<li><b>CI/CD</b> = Continuous Integration / Continuous Delivery <i>and</i> Continuous Deployment.</li>\n</ul>", "module : a reusable unit of code/functionality with a clear interface (package, library, python module, java module). dhcp assigns ip addresses automatically; dns resolves names. class c default mask = 255.255.255.0 . saas advantages over on-premises: no upfront hardware/licence cost (subscription), the provider handles maintenance/updates/security, fast deployment, access from anywhere, elastic scaling, slas. ci/cd = continuous integration / continuous delivery and continuous deployment."]]}]}, {"title": "Last-hour cheat sheet", "chunks": [{"h": "Overview", "blocks": [["<div class=\"grid2\">\n<div>\n<h4>Linux one-liners</h4>\n<pre>chmod 700 f   rwx------  owner only\nchmod 755 f   rwxr-xr-x\nchmod 744 f   rwxr--r--\nchmod 600 f   rw-------\nchmod go-rwx  strip group+others\n2&gt;1    → file named \"1\"\n2&gt;&amp;1   → where stdout points\n&gt;/dev/null 2&gt;&amp;1 → discard all\ndu -h  per dir   du -sh total\ndf -h  per filesystem\nps -ef / top     kill -9 = SIGKILL\nhead / tail -f   grep -v -c -i -r\nuname -a         docker ps (-a)\ntar -czvf create gz  -xzvf extract\ncron: min hour dom mon dow\n30 * 15 * *  → :30 hourly on 15th</pre>\n</div>\n<div>\n<h4>SQL skeleton</h4>\n<pre>SELECT col, AGG(x) AS a\nFROM t JOIN u ON t.k = u.k\nWHERE row_filter\nGROUP BY col\nHAVING AGG(x) &gt; n\nORDER BY a DESC;\n-- no-match: LEFT JOIN … WHERE u.k IS NULL\n-- unique values: DISTINCT\n-- NULL: IS NULL, COUNT(col) skips NULL\n-- UNION dedups, UNION ALL keeps\n-- unique index = fast + no duplicates\n-- trigger = auto on event, integrity\n-- INNER = match in both tables</pre>\n</div>\n<div>\n<h4>Git</h4>\n<pre>checkout -b x   create + switch\nbranch x        create only\nreset --soft    keep staged\nreset (mixed)   keep working dir\nreset --hard    destroy changes\nrevert          new undo commit\nrebase          replay on new base\nrebase -i       squash commits\nmerge --squash  one commit at merge\ncherry-pick     copy one commit\nstash / pop     shelve changes\nfetch ≠ pull (fetch + merge)</pre>\n</div>\n<div>\n<h4>Java</h4>\n<pre>fields &amp; static methods: declared type\ninstance methods: runtime type\n\"a\"+1+2 = a12    1+2+\"a\" = 3a\n== reference   equals() content\nint/0 → ArithmeticException (runtime)\ndouble/0 → Infinity\nMAX_VALUE+1 → MIN_VALUE\ndouble prints 2.0\nfinally always runs; its return wins\nunreachable code = compile error\nchecked must be caught/declared</pre>\n</div>\n<div>\n<h4>Networking</h4>\n<pre>/n → 2^(32−n) addrs, −2 usable\n/16 = 65,536   /24 = 256 (254)\nA 1–126 /8  B 128–191 /16  C 192–223 /24\nprivate 10/8 172.16/12 192.168/16\nTCP reliable  UDP fast\n22 SSH 53 DNS 80 HTTP 443 HTTPS\n1521 Oracle 3306 MySQL\n401 not logged in  403 not allowed\n404 not found  500 server bug\n502 bad gateway  504 gw timeout\nrefused = nothing listening\ntimeout = firewall drop / down</pre>\n</div>\n<div>\n<h4>Testing</h4>\n<pre>Verification = built right (spec)\nValidation  = right product (users)\nExploratory = intuition, no scripts\nSmoke = broad shallow  Sanity = narrow\nRegression = nothing else broke\nBVA: B−1, B, B+1\nEP: 1 value per class\nDecision table: 2^n rules\nStatement ⊂ Branch ⊂ Path coverage\nSeverity = impact  Priority = urgency\nBug cost: dev &lt; tester &lt; campaign &lt; client\nEnv failure ≠ product bug</pre>\n</div>\n</div>", "linux one-liners chmod 700 f rwx------ owner only chmod 755 f rwxr-xr-x chmod 744 f rwxr--r-- chmod 600 f rw------- chmod go-rwx strip group+others 2>1 → file named \"1\" 2>&1 → where stdout points >/dev/null 2>&1 → discard all du -h per dir du -sh total df -h per filesystem ps -ef / top kill -9 = sigkill head / tail -f grep -v -c -i -r uname -a docker ps (-a) tar -czvf create gz -xzvf extract cron: min hour dom mon dow 30 * 15 * * → :30 hourly on 15th sql skeleton select col, agg(x) as a from t join u on t.k = u.k where row_filter group by col having agg(x) > n order by a desc; -- no-match: left join … where u.k is null -- unique values: distinct -- null: is null, count(col) skips null -- union dedups, union all keeps -- unique index = fast + no duplicates -- trigger = auto on event, integrity -- inner = match in both tables git checkout -b x create + switch branch x create only reset --soft keep staged reset (mixed) keep working dir reset --hard destroy changes revert new undo commit rebase replay on new base rebase -i squash commits merge --squash one commit at merge cherry-pick copy one commit stash / pop shelve changes fetch ≠ pull (fetch + merge) java fields & static methods: declared type instance methods: runtime type \"a\"+1+2 = a12 1+2+\"a\" = 3a == reference equals() content int/0 → arithmeticexception (runtime) double/0 → infinity max_value+1 → min_value double prints 2.0 finally always runs; its return wins unreachable code = compile error checked must be caught/declared networking /n → 2^(32−n) addrs, −2 usable /16 = 65,536 /24 = 256 (254) a 1–126 /8 b 128–191 /16 c 192–223 /24 private 10/8 172.16/12 192.168/16 tcp reliable udp fast 22 ssh 53 dns 80 http 443 https 1521 oracle 3306 mysql 401 not logged in 403 not allowed 404 not found 500 server bug 502 bad gateway 504 gw timeout refused = nothing listening timeout = firewall drop / down testing verification = built right (spec) validation = right product (users) exploratory = intuition, no scripts smoke = broad shallow sanity = narrow regression = nothing else broke bva: b−1, b, b+1 ep: 1 value per class decision table: 2^n rules statement ⊂ branch ⊂ path coverage severity = impact priority = urgency bug cost: dev < tester < campaign < client env failure ≠ product bug"], ["<div class=\"tip\">On the day: read every word (“exclusively”, “running”, “minimum”, “NOT”), watch for missing <code>&amp;</code> or <code>$</code>, decide compile-time vs runtime, and for “pick one or more” check each option on its own. You can’t revisit a section — answer everything before submitting.</div>", "on the day: read every word (“exclusively”, “running”, “minimum”, “not”), watch for missing & or $ , decide compile-time vs runtime, and for “pick one or more” check each option on its own. you can’t revisit a section — answer everything before submitting."]]}]}];

{ h:'Service map AWS · Azure · GCP', rows:[

 ['queue / messaging', 'SQS/SNS · Service Bus · Pub/Sub', ''],

CHEAT.splice(1, 0, ERRORS, ...PAST);
CHEAT.push(CLOUD);
CHEAT.push({ id:'all', icon:'📚', title:'Everything A–Z (full guide)', groups: INDEX_GROUPS });
</script>
<script>
(function(){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const note = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  const main = document.getElementById('main'), nav = document.getElementById('nav'), q = document.getElementById('q');

  function renderAll(){
    nav.innerHTML = CHEAT.map(s => `<a href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title}</a>`).join('') + `<a href="#full" data-id="full">📖 Full Concept Review</a>`;
    main.innerHTML = '<div class="hint">Tap a command to copy it · tap a group to fold it · search covers every entry and the complete Concept Review (📖 last tab)</div>' +
      CHEAT.map(s => `<section id="${s.id}"><h2>${s.icon} ${s.title}</h2>` + s.groups.map((g, gi) =>
        `<details ${s.id === 'traps' && gi === 0 ? 'open' : ''}><summary>${esc(g.h)} <span class="n">${g.rows.length}</span></summary>` +
        g.rows.map(r => rowHTML(r)).join('') + `</details>`).join('') + `</section>`).join('') +
      `<section id="full"><h2>📖 Full Concept Review</h2><div class="hint">The complete guide: every section, table, example and trap. Tap a section to open it.</div>` +
      FULL.map((s, i) => `<details class="gsec" data-i="${i}"><summary>${i + 1}. ${esc(s.title)} <span class="n">${s.chunks.length}</span></summary><div class="gbody"></div></details>`).join('') + `</section>`;
    main.querySelectorAll('details.gsec').forEach(d => d.addEventListener('toggle', () => {
      const body = d.querySelector('.gbody');
      if (d.open && !body.childElementCount) {
        const s = FULL[+d.dataset.i];
        body.innerHTML = s.chunks.map(c => (c.h !== 'Overview' ? `<h3 class="gh">${esc(c.h)}</h3>` : '') + c.blocks.map(b => b[0]).join('')).join('');
      }
    }));
  }
  function highlight(root, term) {
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      if (!re.test(n.nodeValue)) return; re.lastIndex = 0;
      const span = document.createElement('span');
      span.innerHTML = esc(n.nodeValue).replace(new RegExp('(' + esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
      n.parentNode.replaceChild(span, n);
    });
  }
  function rowHTML(r, secTitle, term){
    const hl = t => term ? t.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'),'<mark>$1</mark>') : t;
    const blk = r[1].includes('\n');
    if (r[4] === 'q' || r[4] === 'm') {
      return `<div class="row tpl qrow">${secTitle ? `<div class="sec-tag">${esc(secTitle)}</div>` : ''}<div class="qtxt">${hl(esc(r[0]))}</div>${r[3] ? `<pre class="qcode">${hl(esc(r[3]))}</pre>` : ''}<div class="anslbl">${r[4] === 'm' ? 'Method' : 'Answer'}</div><span class="cmd block" data-c="${esc(r[1])}">${hl(esc(r[1]))}</span>${r[2] ? `<div class="note pl">${hl(esc(r[2]))}</div>` : ''}</div>`;
    }
    return `<div class="row${blk ? ' tpl' : ''}">${secTitle ? `<div class="sec-tag">${esc(secTitle)}</div>` : ''}<div class="task">${hl(esc(r[0]))}</div><div><span class="cmd${blk ? ' block' : ''}" data-c="${esc(r[1])}">${hl(esc(r[1]))}</span>${r[2] ? `<div class="note">${hl(note(r[2]))}</div>` : ''}</div></div>`;
  }
  function search(term){
    term = term.trim();
    if (!term){ renderAll(); return; }
    const t = term.toLowerCase(); let h = '', n = 0;
    // command card: entries whose command starts with / contains the term as a whole word
    const reEsc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const wordRe = new RegExp('(^|[\\s·|(/])' + reEsc + '(?=$|[\\s,;)·|/])', 'i');
    const card = [], inCard = new Set(), seenCmd = new Set();
    if (term.length <= 30) CHEAT.forEach(s => s.groups.forEach(g => g.rows.forEach(r => {
      if (r[4] || r[1].includes('\n')) return;
      if (wordRe.test(r[1]) && !seenCmd.has(r[1] + '|' + r[0])) { seenCmd.add(r[1] + '|' + r[0]); card.push(r); inCard.add(r); }
    })));
    const cardHTML = card.length ? `<div class="ccard"><div class="cc-h">⚡ <code>${esc(term)}</code> at a glance <span class="n">${card.length}</span></div>` +
      card.slice(0, 40).map(r => `<div class="cc-row"><span class="cmd" data-c="${esc(r[1])}">${esc(r[1])}</span><div class="cc-what">${esc(r[0])}${r[2] ? ' · <span class="cc-note">' + note(r[2]) + '</span>' : ''}</div></div>`).join('') + `</div>` : '';
    CHEAT.forEach(s => s.groups.forEach(g => g.rows.forEach(r => {
      if (inCard.has(r)) return;
      if ((r[0] + ' ' + r[1] + ' ' + (r[2]||'') + ' ' + (r[3]||'')).toLowerCase().includes(t)) { h += rowHTML(r, s.id === 'all' ? g.h : s.title + ' › ' + g.h, term); n++; }
    })));
    let gh = '', gn = 0;
    FULL.forEach(s => s.chunks.forEach(c => c.blocks.forEach(b => {
      if (b[1].includes(t) && gn < 80) { gh += `<div class="gblock"><div class="sec-tag">${esc(s.title)}${c.h !== 'Overview' ? ' › ' + esc(c.h) : ''}</div><div class="gbody">${b[0]}</div></div>`; gn++; }
    })));
    if (!n && !gn && !card.length) { main.innerHTML = `<div class="empty">No match for “${esc(term)}”.<br>Try a shorter word (e.g. “port”, “join”, “kill”).</div>`; return; }
    main.innerHTML = cardHTML + `<div class="hint">${n} more result${n !== 1 ? 's' : ''} + ${gn} guide passage${gn !== 1 ? 's' : ''} for “${esc(term)}”</div>` +
      (n ? `<details open><summary>Quick results <span class="n">${n}</span></summary>${h}</details>` : '') +
      (gn ? `<details ${n ? '' : 'open'} id="gres"><summary>In the full Concept Review <span class="n">${gn}${gn === 80 ? '+' : ''}</span></summary>${gh}</details>` : '');
    const gres = document.getElementById('gres'); if (gres) highlight(gres, term);
  }
  let tmr; q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => search(q.value), 120); });

  // copy on tap
  main.addEventListener('click', e => {
    const c = e.target.closest('.cmd'); if (!c) return;
    const text = c.getAttribute('data-c');
    const done = () => { const t = document.getElementById('toast'); t.textContent = 'Copied: ' + (text.length > 34 ? text.slice(0, 34) + '…' : text); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1300); };
    try { navigator.clipboard.writeText(text).then(done, () => {}); } catch (err) {}
  });

  // nav active + back to top
  nav.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; if (q.value) { q.value = ''; renderAll(); } setTimeout(() => { const s = document.getElementById(a.dataset.id); if (s) { s.scrollIntoView({behavior:'smooth'}); const d = s.querySelector('details'); if (d) d.open = true; } }, 10); e.preventDefault(); });
  const top = document.getElementById('totop');
  top.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  window.addEventListener('scroll', () => {
    top.style.display = window.scrollY > 600 ? 'block' : 'none';
    let cur = null; for (const id of CHEAT.map(s => s.id).concat('full')) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 140) cur = id; }
    nav.querySelectorAll('a').forEach(a => { const on = a.dataset.id === cur; if (on && !a.classList.contains('on')) a.scrollIntoView({inline:'center', block:'nearest'}); a.classList.toggle('on', on); });
  }, {passive:true});

  // font size (remembered on this device)
  let fs = 15; try { fs = +localStorage.getItem('cheatFs') || 15; } catch (e) {}
  const setFs = v => { fs = Math.max(13, Math.min(20, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('cheatFs', fs); } catch (e) {} };
  setFs(fs);
  document.getElementById('fsUp').onclick = () => setFs(fs + 1);
  document.getElementById('fsDown').onclick = () => setFs(fs - 1);

  renderAll();
})();
</script>
</body>
