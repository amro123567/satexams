<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Murex Tech Cheatsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --card:#12161d; --card2:#171c25; --line:#232a35;
  --txt:#aeb6c2; --dim:#6f7a88; --head:#c7ab7a; --cmd:#8cc9ad; --cmdbg:#0f1a16;
  --chip:#1a2029; --chipOn:#2a3340; --hl:#5c4a1e; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:var(--fs);line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
code,.cmd{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
header{position:sticky;top:0;z-index:10;background:rgba(11,14,19,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.toprow{display:flex;gap:8px;align-items:center}
.title{font-weight:600;color:var(--head);font-size:14px;white-space:nowrap}
#q{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;outline:none}
#q::placeholder{color:var(--dim)}
.tbtn{background:var(--chip);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);color:var(--txt);text-decoration:none;border-radius:20px;padding:6px 11px;font-size:13px;white-space:nowrap}
nav a.on{background:var(--chipOn);color:var(--head);border-color:#3a4554}
main{padding:10px 10px 80px;max-width:820px;margin:0 auto}
section{margin-bottom:16px;scroll-margin-top:110px}
section>h2{font-size:17px;color:var(--head);margin:14px 4px 8px;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;color:#c3cad4;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .n{color:var(--dim);font-weight:400;font-size:12px}
summary::after{content:"▸";color:var(--dim);margin-left:8px;transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.row{padding:9px 14px;border-top:1px solid var(--line)}
.task{font-size:13px;color:var(--dim);margin-bottom:3px}
.cmd{display:inline-block;color:var(--cmd);background:var(--cmdbg);border:1px solid #1d2f27;border-radius:7px;padding:4px 8px;font-size:13.5px;word-break:break-word;white-space:pre-wrap;cursor:pointer;max-width:100%}
.cmd:active{filter:brightness(1.3)}
.cmd.block{display:block;white-space:pre;overflow-x:auto;line-height:1.5;padding:8px 10px;font-size:12.5px}
.row.tpl{display:block}
.note{font-size:12px;color:#7d8896;margin-top:3px}
.note code{color:#a9b3bf;background:#1a2029;padding:0 4px;border-radius:4px;font-size:11.5px}
.sec-tag{font-size:11px;color:var(--head);opacity:.8;margin-bottom:2px}
mark{background:var(--hl);color:#e8d7ae;border-radius:3px;padding:0 1px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a24;color:var(--cmd);border:1px solid #2d4a3d;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#totop{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--chipOn);color:var(--head);border:1px solid #3a4554;border-radius:50%;width:42px;height:42px;font-size:18px;display:none}
.hint{font-size:12px;color:var(--dim);margin:2px 4px 10px}
@media(min-width:700px){.row{display:grid;grid-template-columns:38% 1fr;gap:12px;align-items:start}.task{margin:3px 0 0}}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <span class="title">Murex Cheats</span>
    <input id="q" type="search" placeholder="Search: create table, port, kill…" autocomplete="off">
    <button class="tbtn" id="fsDown" aria-label="Smaller text">A−</button>
    <button class="tbtn" id="fsUp" aria-label="Bigger text">A+</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<button id="totop" aria-label="Back to top">↑</button>
<div id="toast">Copied</div>

</script>
<script>
(function(){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const note = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  const main = document.getElementById('main'), nav = document.getElementById('nav'), q = document.getElementById('q');

  function renderAll(){
    nav.innerHTML = CHEAT.map(s => `<a href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title}</a>`).join('');
    main.innerHTML = '<div class="hint">Tap a command to copy it · tap a group to fold it · use search for anything</div>' +
      CHEAT.map(s => `<section id="${s.id}"><h2>${s.icon} ${s.title}</h2>` + s.groups.map((g, gi) =>
        `<details ${s.id === 'traps' && gi === 0 ? 'open' : ''}><summary>${esc(g.h)} <span class="n">${g.rows.length}</span></summary>` +
        g.rows.map(r => rowHTML(r)).join('') + `</details>`).join('') + `</section>`).join('');
  }
  function rowHTML(r, secTitle, term){
    const hl = t => term ? t.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'),'<mark>$1</mark>') : t;
    const blk = r[1].includes('\n');
    return `<div class="row${blk ? ' tpl' : ''}">${secTitle ? `<div class="sec-tag">${esc(secTitle)}</div>` : ''}<div class="task">${hl(esc(r[0]))}</div><div><span class="cmd${blk ? ' block' : ''}" data-c="${esc(r[1])}">${hl(esc(r[1]))}</span>${r[2] ? `<div class="note">${hl(note(r[2]))}</div>` : ''}</div></div>`;
  }
  function search(term){
    term = term.trim();
    if (!term){ renderAll(); return; }
    const t = term.toLowerCase(); let h = '', n = 0;
    CHEAT.forEach(s => s.groups.forEach(g => g.rows.forEach(r => {
      if ((r[0] + ' ' + r[1] + ' ' + (r[2]||'') + ' ' + g.h + ' ' + s.title).toLowerCase().includes(t)) { h += rowHTML(r, s.title + ' › ' + g.h, term); n++; }
    })));
    main.innerHTML = n ? `<div class="hint">${n} result${n>1?'s':''} for “${esc(term)}”</div><details open><summary>Results <span class="n">${n}</span></summary>${h}</details>` : `<div class="empty">No match for “${esc(term)}”.<br>Try a shorter word (e.g. “port”, “join”, “kill”).</div>`;
  }
  let tmr; q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => search(q.value), 120); });

  // copy on tap
  main.addEventListener('click', e => {
    const c = e.target.closest('.cmd'); if (!c) return;
    const text = c.getAttribute('data-c');
    const done = () => { const t = document.getElementById('toast'); t.textContent = 'Copied: ' + (text.length > 34 ? text.slice(0, 34) + '…' : text); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1300); };
    try { navigator.clipboard.writeText(text).then(done, () => {}); } catch (err) {}
  });

  // nav active + back to top
  nav.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; if (q.value) { q.value = ''; renderAll(); } setTimeout(() => { const s = document.getElementById(a.dataset.id); if (s) { s.scrollIntoView({behavior:'smooth'}); const d = s.querySelector('details'); if (d) d.open = true; } }, 10); e.preventDefault(); });
  const top = document.getElementById('totop');
  top.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  window.addEventListener('scroll', () => {
    top.style.display = window.scrollY > 600 ? 'block' : 'none';
    let cur = null; for (const s of CHEAT) { const el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top < 140) cur = s.id; }
    nav.querySelectorAll('a').forEach(a => { const on = a.dataset.id === cur; if (on && !a.classList.contains('on')) a.scrollIntoView({inline:'center', block:'nearest'}); a.classList.toggle('on', on); });
  }, {passive:true});

  // font size (remembered on this device)
  let fs = 15; try { fs = +localStorage.getItem('cheatFs') || 15; } catch (e) {}
  const setFs = v => { fs = Math.max(13, Math.min(20, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('cheatFs', fs); } catch (e) {} };
  setFs(fs);
  document.getElementById('fsUp').onclick = () => setFs(fs + 1);
  document.getElementById('fsDown').onclick = () => setFs(fs - 1);

  renderAll();
})();
</script>
