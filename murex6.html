 -ef every process, full format (system v style) ps aux every process with cpu/memory columns (bsd style, no dash). a = all users, u = user-oriented, x = include processes without a terminal (daemons) ps -u murex processes of a user ps -p 1234 -o pid,ppid,%cpu,%mem,etime,cmd choose columns for one pid ( etime = elapsed running time) ps aux --sort=-%mem | head top memory consumers ( -%cpu for cpu) ps -ejh / ps auxf / pstree -p process tree (parents and children) ps -ef | grep [j]ava the [j] trick stops grep from matching its own process"], ["<div class=\"tw\"><table>\n<tr><th>ps aux column</th><th>Meaning</th><th>ps aux column</th><th>Meaning</th></tr>\n<tr><td>USER</td><td>owner</td><td>RSS</td><td>resident memory actually in RAM (KB)</td></tr>\n<tr><td>PID</td><td>process ID</td><td>VSZ</td><td>virtual memory size (KB): includes mapped but unused memory</td></tr>\n<tr><td>%CPU / %MEM</td><td>CPU share / RAM share</td><td>TTY</td><td>terminal (<code>?</code> = daemon, no terminal)</td></tr>\n<tr><td>STAT</td><td>state (below)</td><td>START / TIME</td><td>start time / total CPU time used</td></tr>\n</table></div>", "ps aux column meaning ps aux column meaning user owner rss resident memory actually in ram (kb) pid process id vsz virtual memory size (kb): includes mapped but unused memory %cpu / %mem cpu share / ram share tty terminal ( ? = daemon, no terminal) stat state (below) start / time start time / total cpu time used"], ["<p><b>STAT codes</b>: <code>R</code> running/runnable · <code>S</code> sleeping (waiting for an event) · <code>D</code> uninterruptible sleep (usually disk/NFS I/O; can’t be killed) · <code>T</code> stopped · <code>Z</code> zombie (exited, parent hasn’t read its status) · extra letters: <code>&lt;</code> high priority, <code>N</code> low priority, <code>s</code> session leader, <code>l</code> multi-threaded, <code>+</code> foreground.</p>", "stat codes : r running/runnable · s sleeping (waiting for an event) · d uninterruptible sleep (usually disk/nfs i/o; can’t be killed) · t stopped · z zombie (exited, parent hasn’t read its status) · extra letters: < high priority, n low priority, s session leader, l multi-threaded, + foreground."], ["<div class=\"tw\"><table>\n<tr><th>top</th><th>Meaning</th></tr>\n<tr><td>Header line 1</td><td>time, uptime, users, <b>load average</b> (1, 5, 15 min)</td></tr>\n<tr><td>Tasks</td><td>total, running, sleeping, stopped, zombie</td></tr>\n<tr><td>%Cpu(s)</td><td><code>us</code> user code · <code>sy</code> kernel · <code>ni</code> niced · <code>id</code> idle · <b><code>wa</code> waiting for I/O</b> (high = disk bottleneck) · <code>hi</code>/<code>si</code> interrupts · <code>st</code> stolen by the hypervisor (VM starved)</td></tr>\n<tr><td>MiB Mem / Swap</td><td>total, free, used, buff/cache; <b>avail Mem</b> = what is really available. Swap used + rising = memory pressure</td></tr>\n<tr><td>Columns</td><td>PID USER PR NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND</td></tr>\n<tr><td>Keys</td><td><code>P</code> sort by CPU · <code>M</code> by memory · <code>T</code> by time · <code>1</code> per-core view · <code>c</code> full command · <code>u</code> filter user · <code>k</code> kill · <code>r</code> renice · <code>H</code> show threads · <code>q</code> quit</td></tr>\n<tr><td>Flags</td><td><code>top -p 1234</code> one process · <code>-u murex</code> · <code>-d 2</code> refresh every 2 s · <code>-b -n 1</code> batch, one snapshot (for scripts/logs) · <code>-H</code> threads</td></tr>\n</table></div>", "top meaning header line 1 time, uptime, users, load average (1, 5, 15 min) tasks total, running, sleeping, stopped, zombie %cpu(s) us user code · sy kernel · ni niced · id idle · wa waiting for i/o (high = disk bottleneck) · hi / si interrupts · st stolen by the hypervisor (vm starved) mib mem / swap total, free, used, buff/cache; avail mem = what is really available. swap used + rising = memory pressure columns pid user pr ni virt res shr s %cpu %mem time+ command keys p sort by cpu · m by memory · t by time · 1 per-core view · c full command · u filter user · k kill · r renice · h show threads · q quit flags top -p 1234 one process · -u murex · -d 2 refresh every 2 s · -b -n 1 batch, one snapshot (for scripts/logs) · -h threads"], ["<div class=\"tw\"><table>\n<tr><th>Signal</th><th>Number</th><th>Sent by</th><th>Effect</th></tr>\n<tr><td>SIGHUP</td><td>1</td><td><code>kill -1</code>, terminal closed</td><td>hang up; many daemons reload their config</td></tr>\n<tr><td>SIGINT</td><td>2</td><td>Ctrl+C</td><td>interrupt (can be caught)</td></tr>\n<tr><td>SIGQUIT</td><td>3</td><td>Ctrl+\\, <code>kill -3</code></td><td>quit with core dump; a <b>JVM prints a thread dump</b> and keeps running</td></tr>\n<tr><td>SIGKILL</td><td>9</td><td><code>kill -9</code></td><td>immediate kill; can’t be caught, blocked or cleaned up</td></tr>\n<tr><td>SIGSEGV</td><td>11</td><td>kernel</td><td>invalid memory access</td></tr>\n<tr><td>SIGTERM</td><td>15</td><td><code>kill</code> (default)</td><td>polite termination; the process can clean up</td></tr>\n<tr><td>SIGSTOP / SIGCONT</td><td>19 / 18</td><td>Ctrl+Z (SIGTSTP), <code>kill -STOP</code></td><td>pause / resume</td></tr>\n</table></div>", "signal number sent by effect sighup 1 kill -1 , terminal closed hang up; many daemons reload their config sigint 2 ctrl+c interrupt (can be caught) sigquit 3 ctrl+\\, kill -3 quit with core dump; a jvm prints a thread dump and keeps running sigkill 9 kill -9 immediate kill; can’t be caught, blocked or cleaned up sigsegv 11 kernel invalid memory access sigterm 15 kill (default) polite termination; the process can clean up sigstop / sigcont 19 / 18 ctrl+z (sigtstp), kill -stop pause / resume"], ["<p><code>kill -l</code> lists signals · <code>kill -0 PID</code> checks whether a process exists (no signal sent) · <code>pkill -f \"java.*murex\"</code> matches the full command line · <code>pgrep -fl java</code> lists PIDs with names · <code>killall name</code> by exact name. <b>Jobs</b>: <code>cmd &amp;</code> background · Ctrl+Z suspend · <code>jobs -l</code> · <code>fg %1</code> · <code>bg %1</code> · <code>disown</code> detach from the shell · <code>nohup cmd &gt; out.log 2&gt;&amp;1 &amp;</code> survive logout · Ctrl+D = end of input / log out.</p>", "kill -l lists signals · kill -0 pid checks whether a process exists (no signal sent) · pkill -f \"java.*murex\" matches the full command line · pgrep -fl java lists pids with names · killall name by exact name. jobs : cmd & background · ctrl+z suspend · jobs -l · fg %1 · bg %1 · disown detach from the shell · nohup cmd > out.log 2>&1 & survive logout · ctrl+d = end of input / log out."]]}, {"h": "df · du · free · lsof: flags and reading output", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>Meaning</th></tr>\n<tr><td><code>df</code></td><td>space per mounted filesystem, in 1K blocks</td></tr>\n<tr><td><code>df -h</code> / <code>-H</code></td><td>human-readable, powers of 1024 / of 1000</td></tr>\n<tr><td><code>df -T</code></td><td>add filesystem type (ext4, xfs, tmpfs, nfs)</td></tr>\n<tr><td><code>df -i</code></td><td>inode usage. 100% inodes = “No space left on device” even with free GBs (millions of tiny files)</td></tr>\n<tr><td><code>df -h /var/log</code></td><td>the filesystem holding that path</td></tr>\n<tr><td><code>du dir</code></td><td>disk usage of every subdirectory, recursively</td></tr>\n<tr><td><code>du -h</code></td><td>human-readable</td></tr>\n<tr><td><code>du -s</code></td><td>summary: one total per argument</td></tr>\n<tr><td><code>du -a</code></td><td>include files, not just directories</td></tr>\n<tr><td><code>du -c</code></td><td>add a grand total</td></tr>\n<tr><td><code>du -d 1</code> / <code>--max-depth=1</code></td><td>only one level deep</td></tr>\n<tr><td><code>du -x</code></td><td>stay on one filesystem</td></tr>\n<tr><td><code>du -sh * | sort -rh | head</code></td><td>the biggest items in the current directory</td></tr>\n<tr><td><code>free -h</code> / <code>-m</code> / <code>-s 2</code></td><td>memory: human / MB / refresh every 2 s</td></tr>\n<tr><td><code>lsof -p PID</code></td><td>files and sockets opened by a process</td></tr>\n<tr><td><code>lsof -i :8080</code> / <code>lsof -i</code></td><td>who uses port 8080 / all network connections</td></tr>\n<tr><td><code>lsof +L1</code></td><td>deleted files still held open (space not freed until the process restarts)</td></tr>\n<tr><td><code>lsof /var/log/app.log</code></td><td>which process has this file open</td></tr>\n</table></div>", "command + flag meaning df space per mounted filesystem, in 1k blocks df -h / -h human-readable, powers of 1024 / of 1000 df -t add filesystem type (ext4, xfs, tmpfs, nfs) df -i inode usage. 100% inodes = “no space left on device” even with free gbs (millions of tiny files) df -h /var/log the filesystem holding that path du dir disk usage of every subdirectory, recursively du -h human-readable du -s summary: one total per argument du -a include files, not just directories du -c add a grand total du -d 1 / --max-depth=1 only one level deep du -x stay on one filesystem du -sh * | sort -rh | head the biggest items in the current directory free -h / -m / -s 2 memory: human / mb / refresh every 2 s lsof -p pid files and sockets opened by a process lsof -i :8080 / lsof -i who uses port 8080 / all network connections lsof +l1 deleted files still held open (space not freed until the process restarts) lsof /var/log/app.log which process has this file open"], ["<pre>$ free -h\n              total   used   free  shared  buff/cache  available\nMem:           15Gi   6.1Gi  0.8Gi  0.2Gi     8.6Gi       8.9Gi\nSwap:         2.0Gi   0.0Gi  2.0Gi</pre>", "$ free -h total used free shared buff/cache available mem: 15gi 6.1gi 0.8gi 0.2gi 8.6gi 8.9gi swap: 2.0gi 0.0gi 2.0gi"], ["<p>Low “free” is <b>normal</b>: Linux uses spare RAM as disk cache (buff/cache) and gives it back on demand. Look at <b>available</b> and at swap activity.</p>", "low “free” is normal : linux uses spare ram as disk cache (buff/cache) and gives it back on demand. look at available and at swap activity."], ["<div class=\"trap\"><code>df</code> and <code>du</code> disagree? A deleted log file is still held open by a running process: <code>du</code> no longer sees it, <code>df</code> still counts it. Find it with <code>lsof +L1</code> and restart that process.</div>", "df and du disagree? a deleted log file is still held open by a running process: du no longer sees it, df still counts it. find it with lsof +l1 and restart that process."]]}, {"h": "ss · netstat · ping · traceroute · curl · ssh · scp · dig", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>Meaning</th></tr>\n<tr><td><code>ss -t</code> / <code>-u</code></td><td>TCP / UDP sockets</td></tr>\n<tr><td><code>ss -l</code> / <code>-a</code></td><td>listening only / all (listening + established)</td></tr>\n<tr><td><code>ss -n</code></td><td>numeric: don’t resolve port names or hosts (faster, shows 8080 not “http-alt”)</td></tr>\n<tr><td><code>ss -p</code></td><td>show the process using each socket (needs root for others’ processes)</td></tr>\n<tr><td><code>ss -s</code> / <code>-4</code> / <code>-6</code></td><td>summary counts / IPv4 / IPv6 only</td></tr>\n<tr><td><code>ss -tulnp</code></td><td>all listening TCP and UDP ports with processes: the classic “what is listening?”</td></tr>\n<tr><td><code>ss -tn state established '( dport = :1521 )'</code></td><td>open connections to Oracle</td></tr>\n<tr><td><code>netstat -tulnp</code> / <code>-plnt</code> / <code>-r</code> / <code>-i</code></td><td>same as ss (older tool) / routing table / interface stats</td></tr>\n<tr><td><code>ping host</code></td><td>ICMP echo until Ctrl+C (Linux); Windows sends 4</td></tr>\n<tr><td><code>ping -c 4</code> / <code>-i 0.5</code> / <code>-W 2</code> / <code>-s 1400</code> / <code>-t 64</code></td><td>count / interval / timeout per reply / packet size / TTL</td></tr>\n<tr><td>ping output</td><td><code>64 bytes from 1.2.3.4: icmp_seq=1 ttl=56 time=114 ms</code>; summary: transmitted, received, <b>% packet loss</b>, rtt min/avg/max/mdev (mdev = jitter)</td></tr>\n<tr><td><code>traceroute host</code> / <code>-n</code> / <code>-I</code> / <code>-T -p 443</code></td><td>hops to the destination / no DNS / use ICMP / use TCP to a port (passes firewalls). <code>* * *</code> = that hop didn’t answer (often just filtered)</td></tr>\n<tr><td><code>curl url</code></td><td>HTTP request, prints the body</td></tr>\n<tr><td><code>curl -v</code></td><td>verbose: DNS, TCP connect, TLS handshake, request and response headers (best for debugging)</td></tr>\n<tr><td><code>curl -I</code> / <code>-i</code></td><td>HEAD request (headers only) / include response headers with the body</td></tr>\n<tr><td><code>curl -o file</code> / <code>-O</code></td><td>save to file / save with the remote file name</td></tr>\n<tr><td><code>curl -L</code></td><td>follow redirects (3xx)</td></tr>\n<tr><td><code>curl -s</code> / <code>-S</code></td><td>silent / but still show errors</td></tr>\n<tr><td><code>curl -X POST -H \"Content-Type: application/json\" -d '{\"a\":1}'</code></td><td>method, header, body</td></tr>\n<tr><td><code>curl -u user:pass</code> / <code>-H \"Authorization: Bearer TOKEN\"</code></td><td>basic auth / token auth</td></tr>\n<tr><td><code>curl -k</code></td><td>skip TLS certificate verification (testing only)</td></tr>\n<tr><td><code>curl --connect-timeout 5 -m 30</code></td><td>connection timeout / total timeout</td></tr>\n<tr><td><code>curl -s -o /dev/null -w \"%{http_code} %{time_total}\\n\" url</code></td><td>print only the status code and response time: a perfect health check</td></tr>\n<tr><td><code>wget url</code> / <code>-O f</code> / <code>-c</code> / <code>-q</code></td><td>download / to file / resume / quiet</td></tr>\n<tr><td><code>ssh user@host</code></td><td>remote shell (port 22)</td></tr>\n<tr><td><code>ssh -p 2222</code> / <code>-i key.pem</code> / <code>-v</code></td><td>port (lowercase p) / identity key / verbose (debug auth problems)</td></tr>\n<tr><td><code>ssh -L 9000:db:1521 jump</code></td><td>local port forwarding: localhost:9000 → db:1521 through the jump host</td></tr>\n<tr><td><code>ssh host \"df -h\"</code></td><td>run one command remotely</td></tr>\n<tr><td><code>ssh-keygen -t ed25519</code> · <code>ssh-copy-id user@host</code></td><td>create a key pair · install the public key on the server (<code>~/.ssh/authorized_keys</code>; <code>~/.ssh</code> must be 700, keys 600)</td></tr>\n<tr><td><code>scp f user@host:/tmp/</code> / <code>scp user@host:/tmp/f .</code></td><td>copy to / from a remote host</td></tr>\n<tr><td><code>scp -r</code> / <code>-P 2222</code> / <code>-i key</code></td><td>recursive / port (<b>capital P</b> in scp!) / key</td></tr>\n<tr><td><code>rsync -avz src/ host:/dst/</code></td><td>sync: archive, verbose, compress; only sends differences. <code>--delete</code> mirror deletions · <code>-n</code> dry run · <code>--progress</code>. A trailing slash on src = copy the contents, not the folder</td></tr>\n<tr><td><code>dig host</code> / <code>+short</code> / <code>MX</code> / <code>@8.8.8.8</code> / <code>-x IP</code></td><td>DNS query / answer only / mail records / ask a specific server / reverse lookup</td></tr>\n<tr><td><code>nslookup host [server]</code> · <code>host host</code></td><td>simpler DNS lookups</td></tr>\n<tr><td><code>ip a</code> · <code>ip r</code> · <code>ip -s link</code> · <code>ip link set eth0 up</code> · <code>hostname -I</code></td><td>addresses · routes/default gateway · interface error counters · bring an interface up · this host’s IPs</td></tr>\n<tr><td><code>nc -zv host 443</code> / <code>telnet host 443</code></td><td>test whether a TCP port is open (succeeded / connection refused / timed out)</td></tr>\n</table></div>", "command + flag meaning ss -t / -u tcp / udp sockets ss -l / -a listening only / all (listening + established) ss -n numeric: don’t resolve port names or hosts (faster, shows 8080 not “http-alt”) ss -p show the process using each socket (needs root for others’ processes) ss -s / -4 / -6 summary counts / ipv4 / ipv6 only ss -tulnp all listening tcp and udp ports with processes: the classic “what is listening?” ss -tn state established '( dport = :1521 )' open connections to oracle netstat -tulnp / -plnt / -r / -i same as ss (older tool) / routing table / interface stats ping host icmp echo until ctrl+c (linux); windows sends 4 ping -c 4 / -i 0.5 / -w 2 / -s 1400 / -t 64 count / interval / timeout per reply / packet size / ttl ping output 64 bytes from 1.2.3.4: icmp_seq=1 ttl=56 time=114 ms ; summary: transmitted, received, % packet loss , rtt min/avg/max/mdev (mdev = jitter) traceroute host / -n / -i / -t -p 443 hops to the destination / no dns / use icmp / use tcp to a port (passes firewalls). * * * = that hop didn’t answer (often just filtered) curl url http request, prints the body curl -v verbose: dns, tcp connect, tls handshake, request and response headers (best for debugging) curl -i / -i head request (headers only) / include response headers with the body curl -o file / -o save to file / save with the remote file name curl -l follow redirects (3xx) curl -s / -s silent / but still show errors curl -x post -h \"content-type: application/json\" -d '{\"a\":1}' method, header, body curl -u user:pass / -h \"authorization: bearer token\" basic auth / token auth curl -k skip tls certificate verification (testing only) curl --connect-timeout 5 -m 30 connection timeout / total timeout curl -s -o /dev/null -w \"%{http_code} %{time_total}\\n\" url print only the status code and response time: a perfect health check wget url / -o f / -c / -q download / to file / resume / quiet ssh user@host remote shell (port 22) ssh -p 2222 / -i key.pem / -v port (lowercase p) / identity key / verbose (debug auth problems) ssh -l 9000:db:1521 jump local port forwarding: localhost:9000 → db:1521 through the jump host ssh host \"df -h\" run one command remotely ssh-keygen -t ed25519 · ssh-copy-id user@host create a key pair · install the public key on the server ( ~/.ssh/authorized_keys ; ~/.ssh must be 700, keys 600) scp f user@host:/tmp/ / scp user@host:/tmp/f . copy to / from a remote host scp -r / -p 2222 / -i key recursive / port ( capital p in scp!) / key rsync -avz src/ host:/dst/ sync: archive, verbose, compress; only sends differences. --delete mirror deletions · -n dry run · --progress . a trailing slash on src = copy the contents, not the folder dig host / +short / mx / @8.8.8.8 / -x ip dns query / answer only / mail records / ask a specific server / reverse lookup nslookup host [server] · host host simpler dns lookups ip a · ip r · ip -s link · ip link set eth0 up · hostname -i addresses · routes/default gateway · interface error counters · bring an interface up · this host’s ips nc -zv host 443 / telnet host 443 test whether a tcp port is open (succeeded / connection refused / timed out)"]]}, {"h": "crontab in depth", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Item</th><th>Meaning</th></tr>\n<tr><td><code>crontab -e</code> / <code>-l</code> / <code>-r</code> / <code>-u user -l</code></td><td>edit / list / <b>remove all</b> (careful: next to -e on the keyboard) / another user’s</td></tr>\n<tr><td>Field values</td><td><code>*</code> any · <code>5</code> exact · <code>1,15</code> list · <code>1-5</code> range · <code>*/10</code> every 10 · <code>0-30/10</code> 0,10,20,30</td></tr>\n<tr><td><code>/etc/crontab</code>, <code>/etc/cron.d/*</code></td><td>system crontabs: have an extra <b>user</b> field after the 5 time fields</td></tr>\n<tr><td><code>/etc/cron.hourly|daily|weekly|monthly/</code></td><td>drop executable scripts here</td></tr>\n<tr><td>Environment</td><td>cron runs with a <b>minimal PATH</b> and no profile: use absolute paths (<code>/usr/bin/python3</code>), set variables at the top</td></tr>\n<tr><td>Output</td><td>stdout/stderr are mailed to the user unless redirected: <code>… &gt;&gt; /var/log/job.log 2&gt;&amp;1</code></td></tr>\n<tr><td><code>%</code></td><td>means newline in crontab; escape it: <code>date +\\%F</code></td></tr>\n<tr><td>Day-of-month AND day-of-week</td><td>if both are set (not <code>*</code>), the job runs when <b>either</b> matches</td></tr>\n<tr><td>Logs</td><td><code>grep CRON /var/log/syslog</code> or <code>journalctl -u cron</code> (crond on RHEL)</td></tr>\n</table></div>", "item meaning crontab -e / -l / -r / -u user -l edit / list / remove all (careful: next to -e on the keyboard) / another user’s field values * any · 5 exact · 1,15 list · 1-5 range · */10 every 10 · 0-30/10 0,10,20,30 /etc/crontab , /etc/cron.d/* system crontabs: have an extra user field after the 5 time fields /etc/cron.hourly|daily|weekly|monthly/ drop executable scripts here environment cron runs with a minimal path and no profile: use absolute paths ( /usr/bin/python3 ), set variables at the top output stdout/stderr are mailed to the user unless redirected: … >> /var/log/job.log 2>&1 % means newline in crontab; escape it: date +\\%f day-of-month and day-of-week if both are set (not * ), the job runs when either matches logs grep cron /var/log/syslog or journalctl -u cron (crond on rhel)"], ["<pre>*/15 * * * *    every 15 minutes\n0 */2 * * *     every 2 hours on the hour\n30 * 15 * *     minute 30 of every hour on the 15th\n0 2 * * 1-5     02:00 Monday–Friday\n0 0 1 1 *       midnight on 1 January\n0 18 * * 5      Friday 18:00\n5 4 * * 0       Sunday 04:05 (0 or 7 = Sunday)</pre>", "*/15 * * * * every 15 minutes 0 */2 * * * every 2 hours on the hour 30 * 15 * * minute 30 of every hour on the 15th 0 2 * * 1-5 02:00 monday–friday 0 0 1 1 * midnight on 1 january 0 18 * * 5 friday 18:00 5 4 * * 0 sunday 04:05 (0 or 7 = sunday)"]]}, {"h": "Shell, environment & Bash details", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Item</th><th>Meaning</th></tr>\n<tr><td><code>echo $PATH</code></td><td>colon-separated directories searched for commands. <code>export PATH=$PATH:/opt/bin</code> adds one</td></tr>\n<tr><td><code>VAR=x</code> vs <code>export VAR=x</code></td><td>shell-only variable vs passed to child processes (environment variable)</td></tr>\n<tr><td><code>env</code> / <code>printenv HOME</code> / <code>set</code> / <code>unset VAR</code></td><td>environment / one variable / all shell variables and functions / delete</td></tr>\n<tr><td><code>./script.sh</code> vs <code>source script.sh</code> (<code>. script.sh</code>)</td><td>runs in a <b>new</b> process (its variables vanish) vs runs in the <b>current</b> shell (variables and <code>cd</code> stay)</td></tr>\n<tr><td><code>~/.bashrc</code> / <code>~/.bash_profile</code> / <code>/etc/profile</code></td><td>interactive non-login shells / login shells / system-wide</td></tr>\n<tr><td><code>alias ll='ls -lah'</code> · <code>type ll</code> · <code>which java</code> · <code>whereis</code></td><td>alias · what a name is (alias, builtin, file) · path of an executable</td></tr>\n<tr><td><code>history</code> · <code>!!</code> · <code>!42</code> · <code>!grep</code> · Ctrl+R</td><td>history · repeat the last command (<code>sudo !!</code>) · run number 42 · last command starting with grep · reverse search</td></tr>\n<tr><td><code>sudo cmd</code> / <code>sudo -u murex cmd</code> / <code>sudo -i</code> / <code>sudo -l</code></td><td>as root / as another user / root login shell / list what you may run</td></tr>\n<tr><td><code>su -</code> vs <code>su</code></td><td>switch to root with root’s environment (login) vs keeping yours</td></tr>\n<tr><td><code>bash -n s.sh</code> / <code>bash -x s.sh</code></td><td>syntax check without running / trace every command</td></tr>\n<tr><td><code>set -e</code> / <code>-u</code> / <code>-x</code> / <code>-o pipefail</code></td><td>exit on error / error on unset variable / trace / a pipeline fails if any command fails</td></tr>\n<tr><td><code>\"$var\"</code> vs <code>$var</code> vs <code>'$var'</code></td><td>expanded, kept as one word / expanded and split on spaces (breaks file names) / literal text</td></tr>\n<tr><td><code>$(cmd)</code> · <code>$((a+b))</code> · <code>${v:-def}</code> · <code>${#v}</code> · <code>${v%.log}</code> · <code>${v#*/}</code></td><td>command output · arithmetic · default value · length · strip a suffix · strip a prefix</td></tr>\n<tr><td>Exit codes</td><td><code>0</code> success · <code>1</code> general error · <code>2</code> misuse · <code>126</code> not executable · <code>127</code> command not found · <code>130</code> Ctrl+C · <code>137</code> killed by -9 (often the OOM killer) · <code>139</code> segfault</td></tr>\n<tr><td>Wildcards (globbing)</td><td><code>*</code> any chars · <code>?</code> one char · <code>[abc]</code> one of · <code>{a,b}</code> expands to both (<code>cp f{,.bak}</code> = <code>cp f f.bak</code>). Globs don’t match hidden files</td></tr>\n<tr><td>Shortcuts</td><td>Ctrl+C interrupt · Ctrl+Z suspend · Ctrl+D EOF/logout · Ctrl+L clear · Ctrl+A/E line start/end · Ctrl+U delete to start · Tab autocomplete</td></tr>\n</table></div>", "item meaning echo $path colon-separated directories searched for commands. export path=$path:/opt/bin adds one var=x vs export var=x shell-only variable vs passed to child processes (environment variable) env / printenv home / set / unset var environment / one variable / all shell variables and functions / delete ./script.sh vs source script.sh ( . script.sh ) runs in a new process (its variables vanish) vs runs in the current shell (variables and cd stay) ~/.bashrc / ~/.bash_profile / /etc/profile interactive non-login shells / login shells / system-wide alias ll='ls -lah' · type ll · which java · whereis alias · what a name is (alias, builtin, file) · path of an executable history · !! · !42 · !grep · ctrl+r history · repeat the last command ( sudo !! ) · run number 42 · last command starting with grep · reverse search sudo cmd / sudo -u murex cmd / sudo -i / sudo -l as root / as another user / root login shell / list what you may run su - vs su switch to root with root’s environment (login) vs keeping yours bash -n s.sh / bash -x s.sh syntax check without running / trace every command set -e / -u / -x / -o pipefail exit on error / error on unset variable / trace / a pipeline fails if any command fails \"$var\" vs $var vs '$var' expanded, kept as one word / expanded and split on spaces (breaks file names) / literal text $(cmd) · $((a+b)) · ${v:-def} · ${#v} · ${v%.log} · ${v#*/} command output · arithmetic · default value · length · strip a suffix · strip a prefix exit codes 0 success · 1 general error · 2 misuse · 126 not executable · 127 command not found · 130 ctrl+c · 137 killed by -9 (often the oom killer) · 139 segfault wildcards (globbing) * any chars · ? one char · [abc] one of · {a,b} expands to both ( cp f{,.bak} = cp f f.bak ). globs don’t match hidden files shortcuts ctrl+c interrupt · ctrl+z suspend · ctrl+d eof/logout · ctrl+l clear · ctrl+a/e line start/end · ctrl+u delete to start · tab autocomplete"]]}]}, {"title": "systemd, services & system information", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">How Linux starts and manages services (systemd/systemctl), how to read service logs (journalctl), and every command for “tell me about this machine”, with what each output field means.</p>", "how linux starts and manages services (systemd/systemctl), how to read service logs (journalctl), and every command for “tell me about this machine”, with what each output field means."]]}, {"h": "What systemd is", "blocks": [["<ul>\n<li><b>systemd</b> is the <b>init system</b> on almost every modern Linux (RHEL/CentOS/Rocky, Ubuntu, Debian, SUSE). It is <b>PID 1</b>: the first process the kernel starts, and the parent/adopter of all others.</li>\n<li>It starts services at boot (in parallel, respecting dependencies), supervises them (restarts on crash), collects their logs (journald), and handles timers, mounts, sockets, hostname, time and logins.</li>\n<li>Everything it manages is a <b>unit</b>, described by a <b>unit file</b>. You control it with <code>systemctl</code> and read its logs with <code>journalctl</code>.</li>\n<li>Older systems used <b>SysV init</b> (<code>/etc/init.d/</code> scripts, <code>service</code>, <code>chkconfig</code>, runlevels). You may still see those commands; on systemd they are redirected to systemctl.</li>\n</ul>", "systemd is the init system on almost every modern linux (rhel/centos/rocky, ubuntu, debian, suse). it is pid 1 : the first process the kernel starts, and the parent/adopter of all others. it starts services at boot (in parallel, respecting dependencies), supervises them (restarts on crash), collects their logs (journald), and handles timers, mounts, sockets, hostname, time and logins. everything it manages is a unit , described by a unit file . you control it with systemctl and read its logs with journalctl . older systems used sysv init ( /etc/init.d/ scripts, service , chkconfig , runlevels). you may still see those commands; on systemd they are redirected to systemctl."], ["<div class=\"tw\"><table>\n<tr><th>Unit type</th><th>Extension</th><th>Represents</th></tr>\n<tr><td>Service</td><td><code>.service</code></td><td>a daemon/process: <code>sshd.service</code>, <code>nginx.service</code>, <code>mysqld.service</code>, a Java app</td></tr>\n<tr><td>Target</td><td><code>.target</code></td><td>a group of units = a system state (like runlevels): <code>multi-user.target</code></td></tr>\n<tr><td>Timer</td><td><code>.timer</code></td><td>schedule that triggers a service (modern cron)</td></tr>\n<tr><td>Socket</td><td><code>.socket</code></td><td>starts a service when a connection arrives</td></tr>\n<tr><td>Mount / Automount</td><td><code>.mount</code></td><td>filesystem mount points</td></tr>\n<tr><td>Path</td><td><code>.path</code></td><td>triggers a service when a file/dir changes</td></tr>\n<tr><td>Device / Swap / Slice</td><td></td><td>hardware, swap space, cgroup resource groups</td></tr>\n</table></div>", "unit type extension represents service .service a daemon/process: sshd.service , nginx.service , mysqld.service , a java app target .target a group of units = a system state (like runlevels): multi-user.target timer .timer schedule that triggers a service (modern cron) socket .socket starts a service when a connection arrives mount / automount .mount filesystem mount points path .path triggers a service when a file/dir changes device / swap / slice hardware, swap space, cgroup resource groups"], ["<p><b>Unit file locations</b> (highest priority first): <code>/etc/systemd/system/</code> (yours, admin overrides) → <code>/run/systemd/system/</code> (runtime) → <code>/usr/lib/systemd/system/</code> or <code>/lib/systemd/system/</code> (installed by packages; don’t edit these).</p>", "unit file locations (highest priority first): /etc/systemd/system/ (yours, admin overrides) → /run/systemd/system/ (runtime) → /usr/lib/systemd/system/ or /lib/systemd/system/ (installed by packages; don’t edit these)."]]}, {"h": "systemctl: every command you need", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>What it does</th></tr>\n<tr><td><code>systemctl start nginx</code></td><td>start <b>now</b> (doesn’t survive a reboot)</td></tr>\n<tr><td><code>systemctl stop nginx</code></td><td>stop now (sends SIGTERM, then SIGKILL after a timeout, 90 s by default)</td></tr>\n<tr><td><code>systemctl restart nginx</code></td><td>stop + start (new process, brief downtime)</td></tr>\n<tr><td><code>systemctl reload nginx</code></td><td>tell the running process to <b>re-read its config</b> without stopping (only if the service supports it, usually via SIGHUP)</td></tr>\n<tr><td><code>systemctl reload-or-restart nginx</code></td><td>reload if supported, otherwise restart</td></tr>\n<tr><td><code>systemctl try-restart nginx</code></td><td>restart only if it is already running</td></tr>\n<tr><td><code>systemctl status nginx</code></td><td>state, PID, memory, cgroup, and the last log lines (see below)</td></tr>\n<tr><td><code>systemctl enable nginx</code></td><td>start automatically <b>at boot</b> (creates a symlink in <code>multi-user.target.wants/</code>). Does <b>not</b> start it now</td></tr>\n<tr><td><code>systemctl enable --now nginx</code></td><td>enable at boot <b>and</b> start now</td></tr>\n<tr><td><code>systemctl disable nginx</code> / <code>--now</code></td><td>don’t start at boot (removes the symlink) / and stop now</td></tr>\n<tr><td><code>systemctl is-active nginx</code></td><td>prints active/inactive/failed; exit code 0 if active (for scripts)</td></tr>\n<tr><td><code>systemctl is-enabled nginx</code></td><td>enabled / disabled / static / masked</td></tr>\n<tr><td><code>systemctl is-failed nginx</code></td><td>is it in the failed state?</td></tr>\n<tr><td><code>systemctl mask nginx</code> / <code>unmask</code></td><td>make it impossible to start, even manually or as a dependency (links the unit to <code>/dev/null</code>) / undo</td></tr>\n<tr><td><code>systemctl daemon-reload</code></td><td>re-read all unit files. <b>Required after creating or editing a unit file</b>, otherwise systemd keeps using the old version</td></tr>\n<tr><td><code>systemctl list-units --type=service</code></td><td>loaded and active services. <code>--all</code> includes inactive ones; <code>--state=running</code> / <code>--state=failed</code> filter</td></tr>\n<tr><td><code>systemctl --failed</code></td><td>all failed units: the first command after a bad boot</td></tr>\n<tr><td><code>systemctl list-unit-files --type=service</code></td><td>every installed unit file with its enable state</td></tr>\n<tr><td><code>systemctl cat nginx</code></td><td>print the unit file actually in use, including overrides</td></tr>\n<tr><td><code>systemctl show nginx -p MainPID,ActiveState,Restart</code></td><td>machine-readable properties</td></tr>\n<tr><td><code>systemctl edit nginx</code></td><td>create a <b>drop-in override</b> (<code>/etc/systemd/system/nginx.service.d/override.conf</code>) instead of editing the package file. <code>--full</code> edits a full copy</td></tr>\n<tr><td><code>systemctl list-dependencies nginx</code></td><td>dependency tree</td></tr>\n<tr><td><code>systemctl kill -s SIGKILL nginx</code></td><td>send a signal to all the service’s processes</td></tr>\n<tr><td><code>systemctl reset-failed</code></td><td>clear the failed state (after fixing)</td></tr>\n<tr><td><code>systemctl get-default</code> / <code>set-default multi-user.target</code></td><td>boot target (graphical vs text)</td></tr>\n<tr><td><code>systemctl isolate rescue.target</code></td><td>switch to another target now</td></tr>\n<tr><td><code>systemctl reboot</code> / <code>poweroff</code> / <code>suspend</code></td><td>power management</td></tr>\n<tr><td><code>systemctl list-timers</code></td><td>scheduled timers with next and last run times</td></tr>\n<tr><td><code>systemctl --user …</code></td><td>per-user services (no root)</td></tr>\n<tr><td><code>systemctl -H user@host status x</code></td><td>run on a remote host over SSH</td></tr>\n</table></div>", "command what it does systemctl start nginx start now (doesn’t survive a reboot) systemctl stop nginx stop now (sends sigterm, then sigkill after a timeout, 90 s by default) systemctl restart nginx stop + start (new process, brief downtime) systemctl reload nginx tell the running process to re-read its config without stopping (only if the service supports it, usually via sighup) systemctl reload-or-restart nginx reload if supported, otherwise restart systemctl try-restart nginx restart only if it is already running systemctl status nginx state, pid, memory, cgroup, and the last log lines (see below) systemctl enable nginx start automatically at boot (creates a symlink in multi-user.target.wants/ ). does not start it now systemctl enable --now nginx enable at boot and start now systemctl disable nginx / --now don’t start at boot (removes the symlink) / and stop now systemctl is-active nginx prints active/inactive/failed; exit code 0 if active (for scripts) systemctl is-enabled nginx enabled / disabled / static / masked systemctl is-failed nginx is it in the failed state? systemctl mask nginx / unmask make it impossible to start, even manually or as a dependency (links the unit to /dev/null ) / undo systemctl daemon-reload re-read all unit files. required after creating or editing a unit file , otherwise systemd keeps using the old version systemctl list-units --type=service loaded and active services. --all includes inactive ones; --state=running / --state=failed filter systemctl --failed all failed units: the first command after a bad boot systemctl list-unit-files --type=service every installed unit file with its enable state systemctl cat nginx print the unit file actually in use, including overrides systemctl show nginx -p mainpid,activestate,restart machine-readable properties systemctl edit nginx create a drop-in override ( /etc/systemd/system/nginx.service.d/override.conf ) instead of editing the package file. --full edits a full copy systemctl list-dependencies nginx dependency tree systemctl kill -s sigkill nginx send a signal to all the service’s processes systemctl reset-failed clear the failed state (after fixing) systemctl get-default / set-default multi-user.target boot target (graphical vs text) systemctl isolate rescue.target switch to another target now systemctl reboot / poweroff / suspend power management systemctl list-timers scheduled timers with next and last run times systemctl --user … per-user services (no root) systemctl -h user@host status x run on a remote host over ssh"], ["<div class=\"key\"><b>start vs enable</b>: start = now; enable = at next boot. <b>restart vs reload</b>: restart = new process; reload = same process re-reads its config. <b>disable vs mask</b>: disable = not at boot but still startable; mask = can’t be started at all. Edited a unit file → <b>daemon-reload</b>, then restart.</div>", "start vs enable : start = now; enable = at next boot. restart vs reload : restart = new process; reload = same process re-reads its config. disable vs mask : disable = not at boot but still startable; mask = can’t be started at all. edited a unit file → daemon-reload , then restart."]]}, {"h": "Reading systemctl status", "blocks": [["<pre>● murex-api.service - Murex pricing API\n     Loaded: loaded (/etc/systemd/system/murex-api.service; enabled; vendor preset: disabled)\n     Active: failed (Result: exit-code) since Wed 2026-11-11 09:12:04 EET; 3min ago\n    Process: 4211 ExecStart=/usr/bin/java -jar /opt/murex/api.jar (code=exited, status=1/FAILURE)\n   Main PID: 4211 (code=exited, status=1/FAILURE)\n        CPU: 2.104s\n\nNov 11 09:12:03 srv01 java[4211]: Caused by: java.net.BindException: Address already in use\nNov 11 09:12:04 srv01 systemd[1]: murex-api.service: Main process exited, code=exited, status=1/FAILURE\nNov 11 09:12:04 srv01 systemd[1]: murex-api.service: Failed with result 'exit-code'.</pre>", "● murex-api.service - murex pricing api loaded: loaded (/etc/systemd/system/murex-api.service; enabled; vendor preset: disabled) active: failed (result: exit-code) since wed 2026-11-11 09:12:04 eet; 3min ago process: 4211 execstart=/usr/bin/java -jar /opt/murex/api.jar (code=exited, status=1/failure) main pid: 4211 (code=exited, status=1/failure) cpu: 2.104s nov 11 09:12:03 srv01 java[4211]: caused by: java.net.bindexception: address already in use nov 11 09:12:04 srv01 systemd[1]: murex-api.service: main process exited, code=exited, status=1/failure nov 11 09:12:04 srv01 systemd[1]: murex-api.service: failed with result 'exit-code'."], ["<div class=\"tw\"><table>\n<tr><th>Line</th><th>How to read it</th></tr>\n<tr><td>● colour</td><td>green = active, white = inactive, red = failed</td></tr>\n<tr><td><b>Loaded</b></td><td>unit file path; <b>enabled/disabled</b> = starts at boot or not; vendor preset = the package’s default. “not-found” = typo in the name or missing file; “masked” = blocked</td></tr>\n<tr><td><b>Active</b></td><td><code>active (running)</code> OK · <code>active (exited)</code> a one-shot that finished fine · <code>activating (auto-restart)</code> crash loop · <code>inactive (dead)</code> stopped · <code>failed</code> with a <b>Result</b>: <code>exit-code</code> (non-zero exit), <code>signal</code> (killed, e.g. SIGKILL by the OOM killer), <code>timeout</code> (didn’t start/stop in time), <code>core-dump</code>, <code>start-limit-hit</code> (restarted too often)</td></tr>\n<tr><td>Main PID</td><td>the PID of the service process; <code>status=1/FAILURE</code> = its exit code</td></tr>\n<tr><td>Tasks / Memory / CPU</td><td>resource usage of the whole cgroup</td></tr>\n<tr><td>CGroup</td><td>tree of all processes belonging to the service</td></tr>\n<tr><td>Log lines</td><td>the last ~10 journal entries. Here the <b>root cause</b> is visible: <code>BindException: Address already in use</code> = another process holds the port → <code>ss -tlnp | grep 8080</code></td></tr>\n</table></div>", "line how to read it ● colour green = active, white = inactive, red = failed loaded unit file path; enabled/disabled = starts at boot or not; vendor preset = the package’s default. “not-found” = typo in the name or missing file; “masked” = blocked active active (running) ok · active (exited) a one-shot that finished fine · activating (auto-restart) crash loop · inactive (dead) stopped · failed with a result : exit-code (non-zero exit), signal (killed, e.g. sigkill by the oom killer), timeout (didn’t start/stop in time), core-dump , start-limit-hit (restarted too often) main pid the pid of the service process; status=1/failure = its exit code tasks / memory / cpu resource usage of the whole cgroup cgroup tree of all processes belonging to the service log lines the last ~10 journal entries. here the root cause is visible: bindexception: address already in use = another process holds the port → ss -tlnp | grep 8080"]]}, {"h": "Writing a unit file", "blocks": [["<pre># /etc/systemd/system/murex-api.service\n[Unit]\nDescription=Murex pricing API\nDocumentation=https://intranet/docs/api\nAfter=network-online.target oracle.service      <span class=\"c\"># start ordering only</span>\nWants=network-online.target                     <span class=\"c\"># soft dependency (start it, don't fail if it fails)</span>\nRequires=oracle.service                         <span class=\"c\"># hard dependency (if it fails/stops, we stop)</span>\n\n[Service]\nType=simple                                     <span class=\"c\"># main process = ExecStart, stays in foreground</span>\nUser=murex\nGroup=murex\nWorkingDirectory=/opt/murex\nEnvironment=\"JAVA_OPTS=-Xms512m -Xmx2g\"\nEnvironmentFile=-/etc/murex/api.env             <span class=\"c\"># \"-\" = OK if the file is missing</span>\nExecStartPre=/opt/murex/bin/check-config.sh\nExecStart=/usr/bin/java $JAVA_OPTS -jar /opt/murex/api.jar\nExecReload=/bin/kill -HUP $MAINPID\nExecStop=/opt/murex/bin/stop.sh\nRestart=on-failure                              <span class=\"c\"># no | always | on-failure | on-abnormal</span>\nRestartSec=5\nTimeoutStartSec=120\nLimitNOFILE=65536                               <span class=\"c\"># max open files (fixes \"Too many open files\")</span>\nStandardOutput=journal\n\n[Install]\nWantedBy=multi-user.target                      <span class=\"c\"># \"enable\" hooks it into this target</span></pre>", "# /etc/systemd/system/murex-api.service [unit] description=murex pricing api documentation=https://intranet/docs/api after=network-online.target oracle.service # start ordering only wants=network-online.target # soft dependency (start it, don't fail if it fails) requires=oracle.service # hard dependency (if it fails/stops, we stop) [service] type=simple # main process = execstart, stays in foreground user=murex group=murex workingdirectory=/opt/murex environment=\"java_opts=-xms512m -xmx2g\" environmentfile=-/etc/murex/api.env # \"-\" = ok if the file is missing execstartpre=/opt/murex/bin/check-config.sh execstart=/usr/bin/java $java_opts -jar /opt/murex/api.jar execreload=/bin/kill -hup $mainpid execstop=/opt/murex/bin/stop.sh restart=on-failure # no | always | on-failure | on-abnormal restartsec=5 timeoutstartsec=120 limitnofile=65536 # max open files (fixes \"too many open files\") standardoutput=journal [install] wantedby=multi-user.target # \"enable\" hooks it into this target"], ["<div class=\"tw\"><table>\n<tr><th>Directive</th><th>Meaning</th></tr>\n<tr><td><code>After=</code> / <code>Before=</code></td><td><b>ordering</b> only: start after X. Doesn’t pull X in</td></tr>\n<tr><td><code>Wants=</code></td><td>also start X; keep going if X fails</td></tr>\n<tr><td><code>Requires=</code></td><td>also start X; if X fails or stops, this unit stops too. Usually combined with <code>After=</code></td></tr>\n<tr><td><code>Type=simple</code></td><td>default: the ExecStart process <i>is</i> the service</td></tr>\n<tr><td><code>Type=forking</code></td><td>old-style daemon that forks into the background and exits (use <code>PIDFile=</code>)</td></tr>\n<tr><td><code>Type=oneshot</code></td><td>runs and finishes (scripts); often with <code>RemainAfterExit=yes</code></td></tr>\n<tr><td><code>Type=notify</code></td><td>the service tells systemd when it’s ready</td></tr>\n<tr><td><code>Restart=</code></td><td>when to restart automatically; <code>StartLimitBurst</code>/<code>StartLimitIntervalSec</code> stop endless crash loops</td></tr>\n<tr><td><code>User=</code></td><td>run as a non-root user (least privilege)</td></tr>\n<tr><td><code>WantedBy=</code></td><td>the target that should include it when enabled</td></tr>\n</table></div>", "directive meaning after= / before= ordering only: start after x. doesn’t pull x in wants= also start x; keep going if x fails requires= also start x; if x fails or stops, this unit stops too. usually combined with after= type=simple default: the execstart process is the service type=forking old-style daemon that forks into the background and exits (use pidfile= ) type=oneshot runs and finishes (scripts); often with remainafterexit=yes type=notify the service tells systemd when it’s ready restart= when to restart automatically; startlimitburst / startlimitintervalsec stop endless crash loops user= run as a non-root user (least privilege) wantedby= the target that should include it when enabled"], ["<pre>sudo vi /etc/systemd/system/murex-api.service\nsudo systemctl daemon-reload\nsudo systemctl enable --now murex-api\nsystemctl status murex-api\njournalctl -u murex-api -f</pre>", "sudo vi /etc/systemd/system/murex-api.service sudo systemctl daemon-reload sudo systemctl enable --now murex-api systemctl status murex-api journalctl -u murex-api -f"]]}, {"h": "Targets vs runlevels, and the boot process", "blocks": [["<div class=\"tw\"><table>\n<tr><th>SysV runlevel</th><th>systemd target</th><th>State</th></tr>\n<tr><td>0</td><td><code>poweroff.target</code></td><td>shut down</td></tr>\n<tr><td>1 / S</td><td><code>rescue.target</code></td><td>single user, maintenance (root shell, minimal services)</td></tr>\n<tr><td>2, 3, 4</td><td><code>multi-user.target</code></td><td>multi-user, networking, <b>no GUI</b> (normal for servers)</td></tr>\n<tr><td>5</td><td><code>graphical.target</code></td><td>multi-user + GUI</td></tr>\n<tr><td>6</td><td><code>reboot.target</code></td><td>reboot</td></tr>\n<tr><td>—</td><td><code>emergency.target</code></td><td>even more minimal than rescue (root filesystem read-only)</td></tr>\n</table></div>", "sysv runlevel systemd target state 0 poweroff.target shut down 1 / s rescue.target single user, maintenance (root shell, minimal services) 2, 3, 4 multi-user.target multi-user, networking, no gui (normal for servers) 5 graphical.target multi-user + gui 6 reboot.target reboot — emergency.target even more minimal than rescue (root filesystem read-only)"], ["<p><b>Boot sequence</b>: firmware (BIOS/UEFI, in ROM) → bootloader (GRUB) → kernel + initramfs → <b>systemd (PID 1)</b> → default target → services. <code>systemd-analyze</code> shows boot time; <code>systemd-analyze blame</code> lists the slowest units; <code>systemd-analyze critical-chain</code> shows the critical path.</p>", "boot sequence : firmware (bios/uefi, in rom) → bootloader (grub) → kernel + initramfs → systemd (pid 1) → default target → services. systemd-analyze shows boot time; systemd-analyze blame lists the slowest units; systemd-analyze critical-chain shows the critical path."]]}, {"h": "Timers (systemd’s cron)", "blocks": [["<pre># /etc/systemd/system/backup.timer                # pairs with backup.service\n[Unit]\nDescription=Nightly backup\n[Timer]\nOnCalendar=*-*-* 02:00:00        <span class=\"c\"># every day 02:00   (Mon..Fri *-*-* 02:00 = weekdays)</span>\nPersistent=true                  <span class=\"c\"># run at next boot if the machine was off at 02:00</span>\n[Install]\nWantedBy=timers.target</pre>", "# /etc/systemd/system/backup.timer # pairs with backup.service [unit] description=nightly backup [timer] oncalendar=*-*-* 02:00:00 # every day 02:00 (mon..fri *-*-* 02:00 = weekdays) persistent=true # run at next boot if the machine was off at 02:00 [install] wantedby=timers.target"], ["<p><code>systemctl enable --now backup.timer</code> · <code>systemctl list-timers</code>. Other forms: <code>OnCalendar=hourly</code>, <code>daily</code>, <code>weekly</code>, <code>*-*-15 *:30:00</code> (minute 30 of every hour on the 15th) · <code>OnBootSec=5min</code> · <code>OnUnitActiveSec=1h</code>. Check syntax with <code>systemd-analyze calendar \"Mon..Fri 02:00\"</code>. Advantages over cron: logs in the journal, dependencies, catch-up after downtime, resource limits.</p>", "systemctl enable --now backup.timer · systemctl list-timers . other forms: oncalendar=hourly , daily , weekly , *-*-15 *:30:00 (minute 30 of every hour on the 15th) · onbootsec=5min · onunitactivesec=1h . check syntax with systemd-analyze calendar \"mon..fri 02:00\" . advantages over cron: logs in the journal, dependencies, catch-up after downtime, resource limits."]]}, {"h": "journalctl: reading logs", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Flag</th><th>Meaning</th></tr>\n<tr><td><code>journalctl</code></td><td>the whole journal, oldest first, in a pager</td></tr>\n<tr><td><code>-u nginx</code></td><td>logs of one unit (repeatable: <code>-u a -u b</code>)</td></tr>\n<tr><td><code>-f</code></td><td>follow live (like <code>tail -f</code>)</td></tr>\n<tr><td><code>-n 100</code></td><td>last 100 lines</td></tr>\n<tr><td><code>-e</code></td><td>jump to the end of the pager</td></tr>\n<tr><td><code>-r</code></td><td>reverse: newest first</td></tr>\n<tr><td><code>-b</code> / <code>-b -1</code> / <code>--list-boots</code></td><td>since the current boot / the previous boot (why did it crash before the reboot?) / list boots</td></tr>\n<tr><td><code>-p err</code></td><td>priority err and more severe. Levels: 0 emerg, 1 alert, 2 crit, <b>3 err</b>, 4 warning, 5 notice, 6 info, 7 debug. Range: <code>-p warning..err</code></td></tr>\n<tr><td><code>--since \"2026-11-11 09:00\" --until \"2026-11-11 10:00\"</code></td><td>time window; also <code>--since \"1 hour ago\"</code>, <code>--since today</code>, <code>yesterday</code></td></tr>\n<tr><td><code>-k</code> / <code>--dmesg</code></td><td>kernel messages only (hardware, OOM killer, disk errors)</td></tr>\n<tr><td><code>-x</code></td><td>add explanations from the message catalog</td></tr>\n<tr><td><code>-xe</code></td><td>explanations + jump to the end: the classic after a failed start (<code>journalctl -xeu nginx</code>)</td></tr>\n<tr><td><code>-o short-iso</code> / <code>json-pretty</code> / <code>cat</code> / <code>verbose</code></td><td>output format: ISO timestamps / JSON / message only / all fields</td></tr>\n<tr><td><code>--no-pager</code></td><td>print straight to stdout (pipe into grep)</td></tr>\n<tr><td><code>_PID=1234</code> · <code>_UID=1001</code> · <code>_COMM=java</code> · <code>SYSLOG_IDENTIFIER=x</code></td><td>filter by field</td></tr>\n<tr><td><code>-g \"Exception\"</code></td><td>grep inside messages (recent versions)</td></tr>\n<tr><td><code>--disk-usage</code> · <code>--vacuum-time=7d</code> · <code>--vacuum-size=500M</code></td><td>how much space logs use · delete entries older than 7 days / beyond 500 MB</td></tr>\n</table></div>", "flag meaning journalctl the whole journal, oldest first, in a pager -u nginx logs of one unit (repeatable: -u a -u b ) -f follow live (like tail -f ) -n 100 last 100 lines -e jump to the end of the pager -r reverse: newest first -b / -b -1 / --list-boots since the current boot / the previous boot (why did it crash before the reboot?) / list boots -p err priority err and more severe. levels: 0 emerg, 1 alert, 2 crit, 3 err , 4 warning, 5 notice, 6 info, 7 debug. range: -p warning..err --since \"2026-11-11 09:00\" --until \"2026-11-11 10:00\" time window; also --since \"1 hour ago\" , --since today , yesterday -k / --dmesg kernel messages only (hardware, oom killer, disk errors) -x add explanations from the message catalog -xe explanations + jump to the end: the classic after a failed start ( journalctl -xeu nginx ) -o short-iso / json-pretty / cat / verbose output format: iso timestamps / json / message only / all fields --no-pager print straight to stdout (pipe into grep) _pid=1234 · _uid=1001 · _comm=java · syslog_identifier=x filter by field -g \"exception\" grep inside messages (recent versions) --disk-usage · --vacuum-time=7d · --vacuum-size=500m how much space logs use · delete entries older than 7 days / beyond 500 mb"], ["<pre>journalctl -u murex-api --since \"30 min ago\" -p err --no-pager\njournalctl -k | grep -i \"out of memory\"       <span class=\"c\"># was it killed by the OOM killer?</span>\njournalctl -b -1 -e                            <span class=\"c\"># end of the previous boot</span>\nlogger -p user.err \"batch failed\"              <span class=\"c\"># write your own entry (shows in journalctl and /var/log/messages|syslog)</span></pre>", "journalctl -u murex-api --since \"30 min ago\" -p err --no-pager journalctl -k | grep -i \"out of memory\" # was it killed by the oom killer? journalctl -b -1 -e # end of the previous boot logger -p user.err \"batch failed\" # write your own entry (shows in journalctl and /var/log/messages|syslog)"], ["<p>Persistent logs live in <code>/var/log/journal/</code> (otherwise in memory under <code>/run/log/journal</code>, lost at reboot). Classic text logs still exist: <code>/var/log/messages</code> (RHEL) or <code>/var/log/syslog</code> (Ubuntu), <code>/var/log/secure</code> / <code>auth.log</code> (logins, sudo), <code>/var/log/dmesg</code>, plus app logs in <code>/var/log/&lt;app&gt;/</code>. <b>logrotate</b> (<code>/etc/logrotate.d/</code>) rotates, compresses and deletes old logs.</p>", "persistent logs live in /var/log/journal/ (otherwise in memory under /run/log/journal , lost at reboot). classic text logs still exist: /var/log/messages (rhel) or /var/log/syslog (ubuntu), /var/log/secure / auth.log (logins, sudo), /var/log/dmesg , plus app logs in /var/log/<app>/ . logrotate ( /etc/logrotate.d/ ) rotates, compresses and deletes old logs."]]}, {"h": "Troubleshooting a service that won’t start", "blocks": [["<ol>\n<li><code>systemctl status app</code>: read Loaded (right file? enabled?) and Active (Result: exit-code / signal / timeout).</li>\n<li><code>journalctl -xeu app</code>: find the real error (stack trace, “permission denied”, “address already in use”, “no such file”).</li>\n<li>Check the usual causes:\n<ul>\n<li>Port in use: <code>ss -tlnp | grep :8080</code>.</li>\n<li>Wrong path or not executable: <code>ls -l</code> on the ExecStart binary, <code>chmod +x</code>.</li>\n<li>Permissions for the <code>User=</code>: <code>sudo -u murex ls /opt/murex</code>.</li>\n<li>Bad config syntax (<code>nginx -t</code>, <code>sshd -t</code>).</li>\n<li>Missing environment variables (systemd doesn’t read your <code>.bashrc</code>).</li>\n<li>A dependency down.</li>\n<li>Disk full: <code>df -h</code>.</li>\n<li>SELinux: <code>ausearch -m avc</code>.</li>\n</ul></li>\n<li>Run the ExecStart command by hand as that user to see the error directly.</li>\n<li>After fixing the unit file: <code>daemon-reload</code> → <code>reset-failed</code> → <code>restart</code> → <code>status</code>.</li>\n</ol>", "systemctl status app : read loaded (right file? enabled?) and active (result: exit-code / signal / timeout). journalctl -xeu app : find the real error (stack trace, “permission denied”, “address already in use”, “no such file”). check the usual causes: port in use: ss -tlnp | grep :8080 . wrong path or not executable: ls -l on the execstart binary, chmod +x . permissions for the user= : sudo -u murex ls /opt/murex . bad config syntax ( nginx -t , sshd -t ). missing environment variables (systemd doesn’t read your .bashrc ). a dependency down. disk full: df -h . selinux: ausearch -m avc . run the execstart command by hand as that user to see the error directly. after fixing the unit file: daemon-reload → reset-failed → restart → status ."], ["<div class=\"tw\"><table>\n<tr><th>SysV (old)</th><th>systemd (new)</th></tr>\n<tr><td><code>service nginx start</code></td><td><code>systemctl start nginx</code></td></tr>\n<tr><td><code>service nginx status</code></td><td><code>systemctl status nginx</code></td></tr>\n<tr><td><code>chkconfig nginx on</code> / <code>update-rc.d nginx enable</code></td><td><code>systemctl enable nginx</code></td></tr>\n<tr><td><code>chkconfig --list</code></td><td><code>systemctl list-unit-files</code></td></tr>\n<tr><td><code>/etc/init.d/nginx restart</code></td><td><code>systemctl restart nginx</code></td></tr>\n<tr><td><code>init 3</code> / <code>runlevel</code></td><td><code>systemctl isolate multi-user.target</code> / <code>systemctl get-default</code></td></tr>\n<tr><td><code>tail -f /var/log/messages</code></td><td><code>journalctl -f</code></td></tr>\n</table></div>", "sysv (old) systemd (new) service nginx start systemctl start nginx service nginx status systemctl status nginx chkconfig nginx on / update-rc.d nginx enable systemctl enable nginx chkconfig --list systemctl list-unit-files /etc/init.d/nginx restart systemctl restart nginx init 3 / runlevel systemctl isolate multi-user.target / systemctl get-default tail -f /var/log/messages journalctl -f"], ["<p>Other systemd tools: <code>hostnamectl</code> (hostname, OS, kernel, virtualization), <code>timedatectl</code> (time zone, NTP sync), <code>localectl</code> (language, keyboard), <code>loginctl</code> (sessions), <code>systemd-cgtop</code> (resources per service).</p>", "other systemd tools: hostnamectl (hostname, os, kernel, virtualization), timedatectl (time zone, ntp sync), localectl (language, keyboard), loginctl (sessions), systemd-cgtop (resources per service)."]]}, {"h": "System information commands, with their output explained", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>Shows</th></tr>\n<tr><td><code>uname -a</code></td><td>all: kernel name, hostname, kernel release, kernel version/build date, architecture, OS. “Which UNIX/kernel version?” → <code>uname</code></td></tr>\n<tr><td><code>uname -s</code> · <code>-n</code> · <code>-r</code> · <code>-v</code> · <code>-m</code> · <code>-o</code></td><td>kernel name (Linux) · hostname · kernel release (<code>5.14.0-362.el9.x86_64</code>) · kernel build version · machine architecture (<code>x86_64</code>, <code>aarch64</code>) · operating system (GNU/Linux)</td></tr>\n<tr><td><code>cat /etc/os-release</code> · <code>hostnamectl</code> · <code>lsb_release -a</code> · <code>cat /etc/redhat-release</code></td><td>the <b>distribution</b> name and version (Rocky 9.3, Ubuntu 22.04). uname gives the kernel, not the distro</td></tr>\n<tr><td><code>hostname</code> · <code>hostname -f</code> · <code>hostname -I</code></td><td>short name · fully qualified domain name · IP addresses</td></tr>\n<tr><td><code>uptime</code></td><td><code>10:05:01 up 12 days, 3:14, 2 users, load average: 0.52, 0.71, 0.80</code> → current time, time since boot, logged-in users, load over 1/5/15 min. Compare the load with the CPU count (<code>nproc</code>): load 8 on 4 cores = overloaded</td></tr>\n<tr><td><code>cat /proc/loadavg</code></td><td>the same load numbers + running/total processes + last PID</td></tr>\n<tr><td><code>w</code> · <code>who</code> · <code>last</code> · <code>lastb</code> · <code>id</code> · <code>whoami</code></td><td>who is logged in and what they run · logged-in users · login history and reboots · failed logins · uid/gid/groups · username</td></tr>\n<tr><td><code>lscpu</code> · <code>nproc</code> · <code>cat /proc/cpuinfo</code></td><td>CPU model, cores, threads, sockets, caches, virtualization · number of usable CPUs · raw per-core details</td></tr>\n<tr><td><code>free -h</code> · <code>cat /proc/meminfo</code></td><td>RAM/swap summary · detailed memory counters</td></tr>\n<tr><td><code>vmstat 1 5</code></td><td>5 samples, 1 s apart. Columns: <code>r</code> runnable processes (&gt; CPUs = CPU-bound) · <code>b</code> blocked on I/O · <code>swpd</code> swap used · <code>free buff cache</code> memory · <b><code>si so</code></b> swap in/out (non-zero = memory pressure) · <code>bi bo</code> blocks in/out (disk I/O) · <code>in cs</code> interrupts, context switches · <code>us sy id wa st</code> CPU split (wa = I/O wait)</td></tr>\n<tr><td><code>iostat -x 1</code></td><td>per-disk stats: <code>r/s w/s</code> operations per second · <code>await</code> average ms per I/O (high = slow disk) · <b><code>%util</code></b> how busy the disk is (~100% = saturated)</td></tr>\n<tr><td><code>sar -u</code> / <code>-r</code> / <code>-d</code></td><td>historical CPU / memory / disk stats (sysstat), to see what happened at 3 a.m.</td></tr>\n<tr><td><code>lsblk</code> · <code>blkid</code> · <code>fdisk -l</code></td><td>disks and partitions as a tree · UUIDs and filesystem types · partition tables</td></tr>\n<tr><td><code>mount</code> · <code>findmnt</code> · <code>cat /etc/fstab</code></td><td>what is mounted where · the same as a tree · mounts done at boot</td></tr>\n<tr><td><code>lspci</code> · <code>lsusb</code> · <code>dmidecode</code> · <code>lshw</code></td><td>PCI devices (network cards, GPUs) · USB devices · BIOS/hardware info (serial number, RAM slots) · full hardware list</td></tr>\n<tr><td><code>dmesg -T</code> / <code>dmesg -w</code></td><td>kernel ring buffer with readable timestamps / follow. Look for disk errors, network link down, “Out of memory: Killed process”</td></tr>\n<tr><td><code>ulimit -a</code> · <code>ulimit -n</code></td><td>per-process limits · max open files (often 1024, too low for servers → “Too many open files”)</td></tr>\n<tr><td><code>sysctl -a</code> · <code>sysctl vm.swappiness</code></td><td>kernel parameters</td></tr>\n<tr><td><code>getconf LONG_BIT</code> · <code>arch</code></td><td>32- or 64-bit · architecture</td></tr>\n<tr><td><code>date</code> · <code>timedatectl</code></td><td>current time · time zone and NTP sync (wrong time breaks TLS, Kerberos and log correlation)</td></tr>\n<tr><td><code>/proc/&lt;PID&gt;/</code></td><td>per-process info: <code>cmdline</code>, <code>environ</code>, <code>status</code> (memory, threads), <code>fd/</code> (open files), <code>limits</code></td></tr>\n<tr><td><code>java -version</code> · <code>which java</code> · <code>echo $JAVA_HOME</code></td><td>Java runtime in use (version mismatches cause <code>UnsupportedClassVersionError</code>)</td></tr>\n</table></div>", "command shows uname -a all: kernel name, hostname, kernel release, kernel version/build date, architecture, os. “which unix/kernel version?” → uname uname -s · -n · -r · -v · -m · -o kernel name (linux) · hostname · kernel release ( 5.14.0-362.el9.x86_64 ) · kernel build version · machine architecture ( x86_64 , aarch64 ) · operating system (gnu/linux) cat /etc/os-release · hostnamectl · lsb_release -a · cat /etc/redhat-release the distribution name and version (rocky 9.3, ubuntu 22.04). uname gives the kernel, not the distro hostname · hostname -f · hostname -i short name · fully qualified domain name · ip addresses uptime 10:05:01 up 12 days, 3:14, 2 users, load average: 0.52, 0.71, 0.80 → current time, time since boot, logged-in users, load over 1/5/15 min. compare the load with the cpu count ( nproc ): load 8 on 4 cores = overloaded cat /proc/loadavg the same load numbers + running/total processes + last pid w · who · last · lastb · id · whoami who is logged in and what they run · logged-in users · login history and reboots · failed logins · uid/gid/groups · username lscpu · nproc · cat /proc/cpuinfo cpu model, cores, threads, sockets, caches, virtualization · number of usable cpus · raw per-core details free -h · cat /proc/meminfo ram/swap summary · detailed memory counters vmstat 1 5 5 samples, 1 s apart. columns: r runnable processes (> cpus = cpu-bound) · b blocked on i/o · swpd swap used · free buff cache memory · si so swap in/out (non-zero = memory pressure) · bi bo blocks in/out (disk i/o) · in cs interrupts, context switches · us sy id wa st cpu split (wa = i/o wait) iostat -x 1 per-disk stats: r/s w/s operations per second · await average ms per i/o (high = slow disk) · %util how busy the disk is (~100% = saturated) sar -u / -r / -d historical cpu / memory / disk stats (sysstat), to see what happened at 3 a.m. lsblk · blkid · fdisk -l disks and partitions as a tree · uuids and filesystem types · partition tables mount · findmnt · cat /etc/fstab what is mounted where · the same as a tree · mounts done at boot lspci · lsusb · dmidecode · lshw pci devices (network cards, gpus) · usb devices · bios/hardware info (serial number, ram slots) · full hardware list dmesg -t / dmesg -w kernel ring buffer with readable timestamps / follow. look for disk errors, network link down, “out of memory: killed process” ulimit -a · ulimit -n per-process limits · max open files (often 1024, too low for servers → “too many open files”) sysctl -a · sysctl vm.swappiness kernel parameters getconf long_bit · arch 32- or 64-bit · architecture date · timedatectl current time · time zone and ntp sync (wrong time breaks tls, kerberos and log correlation) /proc/<pid>/ per-process info: cmdline , environ , status (memory, threads), fd/ (open files), limits java -version · which java · echo $java_home java runtime in use (version mismatches cause unsupportedclassversionerror )"], ["<div class=\"tip\">“Give me a quick health check of this server” → <code>uptime</code> (load) · <code>free -h</code> (memory) · <code>df -h</code> (disk) · <code>top</code> (top processes) · <code>systemctl --failed</code> (broken services) · <code>journalctl -p err -b</code> (errors since boot) · <code>dmesg -T | tail</code> (kernel issues) · <code>ss -tulnp</code> (what is listening).</div>", "“give me a quick health check of this server” → uptime (load) · free -h (memory) · df -h (disk) · top (top processes) · systemctl --failed (broken services) · journalctl -p err -b (errors since boot) · dmesg -t | tail (kernel issues) · ss -tulnp (what is listening)."]]}]}, {"title": "Bash scripting", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">The crash-analysis section shows short scripts and asks what happens. Know the variable rules and the “errors don’t stop the script” trap.</p>", "the crash-analysis section shows short scripts and asks what happens. know the variable rules and the “errors don’t stop the script” trap."]]}, {"h": "Script basics & variables", "blocks": [["<pre>#!/bin/bash                 <span class=\"c\"># shebang: which interpreter runs the script</span>\nname=\"Murex\"                <span class=\"c\"># NO spaces around = (name = \"x\" is an error: runs command \"name\")</span>\necho \"Hello $name\"          <span class=\"c\"># double quotes expand variables → Hello Murex</span>\necho 'Hello $name'          <span class=\"c\"># single quotes are literal → Hello $name</span>\necho \"${name}_2026\"         <span class=\"c\"># braces separate the name → Murex_2026</span>\ntoday=$(date +%F)           <span class=\"c\"># command substitution (old form: `date`)</span>\nn=$((3 + 4 * 2))            <span class=\"c\"># arithmetic → 11</span>\nreadonly PI=3.14; unset name</pre>", "#!/bin/bash # shebang: which interpreter runs the script name=\"murex\" # no spaces around = (name = \"x\" is an error: runs command \"name\") echo \"hello $name\" # double quotes expand variables → hello murex echo 'hello $name' # single quotes are literal → hello $name echo \"${name}_2026\" # braces separate the name → murex_2026 today=$(date +%f) # command substitution (old form: `date`) n=$((3 + 4 * 2)) # arithmetic → 11 readonly pi=3.14; unset name"], ["<p>Run a script: <code>chmod +x s.sh &amp;&amp; ./s.sh arg1</code> or <code>bash s.sh arg1</code>. Debug: <code>bash -x s.sh</code> prints each command.</p>", "run a script: chmod +x s.sh && ./s.sh arg1 or bash s.sh arg1 . debug: bash -x s.sh prints each command."], ["<div class=\"tw\"><table>\n<tr><th>Special variable</th><th>Meaning</th></tr>\n<tr><td><code>$0</code></td><td>script name</td></tr>\n<tr><td><code>$1 … $9</code>, <code>${10}</code></td><td>positional arguments</td></tr>\n<tr><td><code>$#</code></td><td>number of arguments</td></tr>\n<tr><td><code>$@</code> / <code>$*</code></td><td>all arguments (<code>\"$@\"</code> keeps each as separate word)</td></tr>\n<tr><td><code>$?</code></td><td><b>exit status</b> of the last command (0 = success, non-zero = failure; 127 = command not found, 126 = not executable)</td></tr>\n<tr><td><code>$$</code></td><td>PID of the current shell</td></tr>\n<tr><td><code>$!</code></td><td>PID of the last background job</td></tr>\n<tr><td><code>$RANDOM</code></td><td>random integer 0–32767 (new value each time it’s expanded)</td></tr>\n<tr><td><code>$HOME $USER $PATH $PWD</code></td><td>environment</td></tr>\n<tr><td><code>${var:-default}</code></td><td>use default if var is unset/empty</td></tr>\n<tr><td><code>${#var}</code></td><td>length of string</td></tr>\n</table></div>", "special variable meaning $0 script name $1 … $9 , ${10} positional arguments $# number of arguments $@ / $* all arguments ( \"$@\" keeps each as separate word) $? exit status of the last command (0 = success, non-zero = failure; 127 = command not found, 126 = not executable) $$ pid of the current shell $! pid of the last background job $random random integer 0–32767 (new value each time it’s expanded) $home $user $path $pwd environment ${var:-default} use default if var is unset/empty ${#var} length of string"]]}, {"h": "Conditions & tests", "blocks": [["<pre>if [[ $param == true ]]; then\n  ext=.java\nelif [ \"$x\" -gt 10 ]; then\n  echo big\nelse\n  echo other\nfi</pre>", "if [[ $param == true ]]; then ext=.java elif [ \"$x\" -gt 10 ]; then echo big else echo other fi"], ["<div class=\"grid2\"><div class=\"tw\"><table>\n<tr><th>Numbers</th><th></th></tr>\n<tr><td><code>-eq</code> <code>-ne</code></td><td>equal / not equal</td></tr>\n<tr><td><code>-gt</code> <code>-ge</code></td><td>greater / greater-or-equal</td></tr>\n<tr><td><code>-lt</code> <code>-le</code></td><td>less / less-or-equal</td></tr>\n<tr><td><code>(( a &gt; b ))</code></td><td>arithmetic comparison</td></tr>\n</table></div><div class=\"tw\"><table>\n<tr><th>Strings &amp; files</th><th></th></tr>\n<tr><td><code>=</code> / <code>==</code> / <code>!=</code></td><td>string equal / not equal</td></tr>\n<tr><td><code>-z \"$s\"</code> / <code>-n \"$s\"</code></td><td>empty / not empty</td></tr>\n<tr><td><code>-f</code> <code>-d</code> <code>-e</code></td><td>is file / is directory / exists</td></tr>\n<tr><td><code>-r</code> <code>-w</code> <code>-x</code> <code>-s</code></td><td>readable / writable / executable / size &gt; 0</td></tr>\n</table></div></div>", "numbers -eq -ne equal / not equal -gt -ge greater / greater-or-equal -lt -le less / less-or-equal (( a > b )) arithmetic comparison strings & files = / == / != string equal / not equal -z \"$s\" / -n \"$s\" empty / not empty -f -d -e is file / is directory / exists -r -w -x -s readable / writable / executable / size > 0"], ["<p><code>[ ]</code> is the POSIX <code>test</code> command (quote your variables). <code>[[ ]]</code> is the bash keyword: safer with empty variables, supports <code>&amp;&amp;</code>, <code>||</code>, pattern <code>==*.log</code> and regex <code>=~</code>. Spaces inside brackets are mandatory: <code>[ $x -gt 3 ]</code>.</p>", "[ ] is the posix test command (quote your variables). [[ ]] is the bash keyword: safer with empty variables, supports && , || , pattern ==*.log and regex =~ . spaces inside brackets are mandatory: [ $x -gt 3 ] ."], ["<pre>case \"$1\" in\n  start) echo \"starting\" ;;\n  stop|halt) echo \"stopping\" ;;\n  *) echo \"usage: $0 start|stop\" ;;\nesac</pre>", "case \"$1\" in start) echo \"starting\" ;; stop|halt) echo \"stopping\" ;; *) echo \"usage: $0 start|stop\" ;; esac"]]}, {"h": "Loops, functions, input", "blocks": [["<pre>for f in *.log; do gzip \"$f\"; done\nfor i in {1..5}; do echo $i; done\nfor ((i=0; i&lt;5; i++)); do echo $i; done\nwhile read -r line; do echo \"$line\"; done &lt; file.txt\ncount=0; while [ $count -lt 3 ]; do count=$((count+1)); done\nuntil ping -c1 host &gt;/dev/null; do sleep 5; done\n\ngreet() {                 <span class=\"c\"># function</span>\n  local who=$1            <span class=\"c\"># local variable</span>\n  echo \"Hi $who\"\n  return 0                <span class=\"c\"># return = exit status only (0–255); output via echo</span>\n}\ngreet Mohamad\nread -p \"Name? \" name     <span class=\"c\"># read user input</span>\nexit 1                    <span class=\"c\"># end script with status 1</span></pre>", "for f in *.log; do gzip \"$f\"; done for i in {1..5}; do echo $i; done for ((i=0; i<5; i++)); do echo $i; done while read -r line; do echo \"$line\"; done < file.txt count=0; while [ $count -lt 3 ]; do count=$((count+1)); done until ping -c1 host >/dev/null; do sleep 5; done greet() { # function local who=$1 # local variable echo \"hi $who\" return 0 # return = exit status only (0–255); output via echo } greet mohamad read -p \"name? \" name # read user input exit 1 # end script with status 1"], ["<p><code>break</code> leaves a loop, <code>continue</code> jumps to the next iteration. Arrays: <code>arr=(a b c); echo ${arr[0]} ${arr[@]} ${#arr[@]}</code>.</p>", "break leaves a loop, continue jumps to the next iteration. arrays: arr=(a b c); echo ${arr[0]} ${arr[@]} ${#arr[@]} ."]]}, {"h": "Error behaviour — the classic traps", "blocks": [["<div class=\"trap\">By default bash <b>does not stop</b> when a command fails. <code>not a command</code> prints “command not found” (exit 127) and the next line still runs.</div>", "by default bash does not stop when a command fails. not a command prints “command not found” (exit 127) and the next line still runs."], ["<pre>#!/bin/bash                    <span class=\"c\"># called as: script.sh false</span>\nparam=$1\nif [[ $param == true ]]; then ext=.java; fi    <span class=\"c\"># false → ext never set (empty)</span>\nnot a command                  <span class=\"c\"># error, but script continues</span>\nrm *$ext                       <span class=\"c\"># becomes rm *  → deletes EVERY file in the directory</span></pre>", "#!/bin/bash # called as: script.sh false param=$1 if [[ $param == true ]]; then ext=.java; fi # false → ext never set (empty) not a command # error, but script continues rm *$ext # becomes rm * → deletes every file in the directory"], ["<pre>cd /opt/missing                <span class=\"c\"># fails, you stay where you are</span>\nrm -rf *                       <span class=\"c\"># runs in the WRONG directory</span>\n<span class=\"c\"># safe: cd /opt/missing || exit 1</span></pre>", "cd /opt/missing # fails, you stay where you are rm -rf * # runs in the wrong directory # safe: cd /opt/missing || exit 1"], ["<div class=\"key\">Defensive header: <code>set -euo pipefail</code> → <code>-e</code> exit on any error · <code>-u</code> error on unset variables (would have caught <code>$ext</code>) · <code>-o pipefail</code> a pipeline fails if any part fails. Always quote variables: <code>\"$file\"</code>.</div>", "defensive header: set -euo pipefail → -e exit on any error · -u error on unset variables (would have caught $ext ) · -o pipefail a pipeline fails if any part fails. always quote variables: \"$file\" ."], ["<pre>#!/bin/bash\nRND=\"Random number is:$RANDOM\"\necho \"$RND\"                    <span class=\"c\"># prints ONE random number on the console</span>\nlogger -p user.info \"$RND\"     <span class=\"c\"># writes it to the SYSTEM log, facility user, priority info</span></pre>", "#!/bin/bash rnd=\"random number is:$random\" echo \"$rnd\" # prints one random number on the console logger -p user.info \"$rnd\" # writes it to the system log, facility user, priority info"], ["<pre>x=5; [ $x -gt 3 ] &amp;&amp; echo big || echo small     <span class=\"c\"># → big</span>\nfalse &amp;&amp; echo A || echo B                       <span class=\"c\"># → B</span>\necho $(( 7 / 2 ))   <span class=\"c\"># → 3  (bash arithmetic is integer only)</span></pre>", "x=5; [ $x -gt 3 ] && echo big || echo small # → big false && echo a || echo b # → b echo $(( 7 / 2 )) # → 3 (bash arithmetic is integer only)"]]}]}, {"title": "Git", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">Expect command-meaning MCQs (reset, rebase, squash) and a “trace these commands” question.</p>", "expect command-meaning mcqs (reset, rebase, squash) and a “trace these commands” question."]]}, {"h": "The model: four places your code lives", "blocks": [["<pre>Working directory ──git add──▶ Staging area (index) ──git commit──▶ Local repository ──git push──▶ Remote (origin)\n        ◀──────────── git checkout / restore ────────────          ◀── git fetch / pull ──</pre>", "working directory ──git add──▶ staging area (index) ──git commit──▶ local repository ──git push──▶ remote (origin) ◀──────────── git checkout / restore ──────────── ◀── git fetch / pull ──"], ["<ul>\n<li><b>Commit</b> = snapshot of the staged files + message + author + pointer to parent commit(s). Identified by a SHA hash.</li>\n<li><b>Branch</b> = a movable pointer to a commit. <b>HEAD</b> = pointer to the current branch/commit. “Detached HEAD” = HEAD points to a commit, not a branch.</li>\n<li><b>Untracked</b> files are not in git at all until <code>git add</code>. Uncommitted changes in the working directory <b>follow you</b> when you switch branches (if no conflict).</li>\n<li><code>HEAD~1</code> = first parent of HEAD (one commit back), <code>HEAD~3</code> = three back. <code>HEAD^2</code> = second parent (of a merge commit).</li>\n</ul>", "commit = snapshot of the staged files + message + author + pointer to parent commit(s). identified by a sha hash. branch = a movable pointer to a commit. head = pointer to the current branch/commit. “detached head” = head points to a commit, not a branch. untracked files are not in git at all until git add . uncommitted changes in the working directory follow you when you switch branches (if no conflict). head~1 = first parent of head (one commit back), head~3 = three back. head^2 = second parent (of a merge commit)."]]}, {"h": "Everyday commands", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>Meaning</th></tr>\n<tr><td><code>git init</code> · <code>git clone url</code></td><td>new repo · copy a remote repo</td></tr>\n<tr><td><code>git status</code></td><td>what’s modified / staged / untracked</td></tr>\n<tr><td><code>git add f</code> · <code>git add .</code> · <code>git add -p</code></td><td>stage a file · all changes · interactively by hunk</td></tr>\n<tr><td><code>git commit -m \"msg\"</code> · <code>-am</code></td><td>commit staged changes · stage tracked modified file
