<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Murex Tech Cheatsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --card:#12161d; --card2:#171c25; --line:#232a35;
  --txt:#aeb6c2; --dim:#6f7a88; --head:#c7ab7a; --cmd:#8cc9ad; --cmdbg:#0f1a16;
  --chip:#1a2029; --chipOn:#2a3340; --hl:#5c4a1e; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:var(--fs);line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
code,.cmd{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
header{position:sticky;top:0;z-index:10;background:rgba(11,14,19,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.toprow{display:flex;gap:8px;align-items:center}
.title{font-weight:600;color:var(--head);font-size:14px;white-space:nowrap}
#q{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;outline:none}
#q::placeholder{color:var(--dim)}
.tbtn{background:var(--chip);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;background:var(--chip);border:1px solid var(--line);color:var(--txt);text-decoration:none;border-radius:20px;padding:6px 11px;font-size:13px;white-space:nowrap}
nav a.on{background:var(--chipOn);color:var(--head);border-color:#3a4554}
main{padding:10px 10px 80px;max-width:820px;margin:0 auto}
section{margin-bottom:16px;scroll-margin-top:110px}
section>h2{font-size:17px;color:var(--head);margin:14px 4px 8px;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;color:#c3cad4;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary .n{color:var(--dim);font-weight:400;font-size:12px}
summary::after{content:"▸";color:var(--dim);margin-left:8px;transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
.row{padding:9px 14px;border-top:1px solid var(--line)}
.task{font-size:13px;color:var(--dim);margin-bottom:3px}
.cmd{display:inline-block;color:var(--cmd);background:var(--cmdbg);border:1px solid #1d2f27;border-radius:7px;padding:4px 8px;font-size:13.5px;word-break:break-word;white-space:pre-wrap;cursor:pointer;max-width:100%}
.cmd:active{filter:brightness(1.3)}
.cmd.block{display:block;white-space:pre;overflow-x:auto;line-height:1.5;padding:8px 10px;font-size:12.5px}
.row.tpl{display:block}
.note{font-size:12px;color:#7d8896;margin-top:3px}
.note code{color:#a9b3bf;background:#1a2029;padding:0 4px;border-radius:4px;font-size:11.5px}
.sec-tag{font-size:11px;color:var(--head);opacity:.8;margin-bottom:2px}
mark{background:var(--hl);color:#e8d7ae;border-radius:3px;padding:0 1px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a24;color:var(--cmd);border:1px solid #2d4a3d;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#totop{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--chipOn);color:var(--head);border:1px solid #3a4554;border-radius:50%;width:42px;height:42px;font-size:18px;display:none}
.hint{font-size:12px;color:var(--dim);margin:2px 4px 10px}
@media(min-width:700px){.row{display:grid;grid-template-columns:38% 1fr;gap:12px;align-items:start}.task{margin:3px 0 0}}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <span class="title">Murex Cheats</span>
    <input id="q" type="search" placeholder="Search: create table, port, kill…" autocomplete="off">
    <button class="tbtn" id="fsDown" aria-label="Smaller text">A−</button>
    <button class="tbtn" id="fsUp" aria-label="Bigger text">A+</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<button id="totop" aria-label="Back to top">↑</button>
<div id="toast">Copied</div>

ue · Violation example: phones = \"111, 222\"", "Form 1NF", ""], ["Rule: 1NF + no partial dependency (non-key column depends on part of a composite key) · Violation example: (student_id, course_id) → student_name", "Form 2NF", ""], ["Rule: 2NF + no transitive dependency (non-key → non-key) · Violation example: emp_id → dept_id → dept_name in Employees", "Form 3NF", ""], ["Rule: every determinant is a candidate key", "Form BCNF", ""]]}, {"h": "SQL & databases › DBMS theory & scaling", "rows": [["software to store, organize, query and manage data (its primary function: let users store and retrieve data through queries ; also handles security, integrity, concurrency, backup/recovery). RDBMS = relational: tables, rows, keys, SQL (Oracle, MySQL, PostgreSQL, SQL Server). NoSQL = document (MongoDB), key-value (Redis), column (Cassandra), graph (Neo4j) — flexible schema, horizontal scale.", "DBMS", ""], ["(many small transactions, normalized) vs OLAP (analytics, aggregates, data warehouse, star schema).", "OLTP", ""], ["high availability & failover (no single point of failure) · scalability/load balancing (read replicas, sharding) · performance · disaster recovery (replica in another site) · maintenance without downtime.", "Benefits of an RDBMS on multiple servers", ""], ["copies of data (master–slave/primary–replica, synchronous vs asynchronous). Sharding : split rows across servers by key. Clustering : Oracle RAC — several instances, one DB.", "Replication", ""], ["a distributed system can guarantee at most two of Consistency, Availability, Partition tolerance.", "CAP theorem", ""], ["full / incremental / differential; point-in-time recovery via logs.", "Backup", ""], ["user input concatenated into SQL ( ' OR 1=1 -- ). Prevent with prepared statements / bind variables.", "SQL injection", ""], ["Oracle specifics (Murex runs on Oracle/Sybase/SQL Server): DUAL table, ROWNUM, NVL, SYSDATE, VARCHAR2, MINUS, sequences, v$session, v$sql, EXPLAIN PLAN, AWR reports, ORA- error codes (ORA-00001 unique violated, ORA-00942 table doesn’t exist, ORA-01017 invalid login, ORA-00060 deadlock, ORA-01555 snapshot too old, ORA-12154 TNS can’t resolve service).", "Oracle specifics (Murex runs on Oracle/S…", ""]]}, {"h": "Java — crash & code analysis › Platform basics", "rows": [["compiles source → bytecode ( A.class ), java A runs it on the JVM. Bytecode is portable (“write once, run anywhere”); native C binaries are not.", "javac A.java", ""], ["(compiler + tools) ⊃ JRE (runtime libraries) ⊃ JVM (executes bytecode, JIT-compiles hot code)..jar = zipped classes. Classpath = where the JVM looks for classes.", "JDK", ""], ["stack (per thread: method frames, local primitives, references) · heap (all objects, shared; size via -Xms / -Xmx ) · metaspace (class metadata). Garbage collector frees objects no longer referenced.", "Memory", ""], ["signature: public static void main(String[] args) (the parameter name doesn’t matter — numbers is fine).", "main", ""]]}, {"h": "Java — crash & code analysis › Types, operators & arithmetic traps", "rows": [["Size: 8 bit · Range / note: −128 … 127", "Primitive byte", ""], ["Size: 16 bit · Range / note: −32,768 … 32,767", "short", ""], ["Size: 32 bit · Range / note: −2,147,483,648 … 2,147,483,647 (≈ ±2.1 × 10⁹)", "Primitive int", ""], ["Size: 64 bit · Range / note: ≈ ±9.22 × 10¹⁸; literal needs L : 10000000000L", "Primitive long", ""], ["Size: 32 / 64 bit · Range / note: approximate; float literal needs f : 3.5f", "float / double", ""], ["Size: 16 bit · Range / note: Unicode, numeric value: 'A' = 65, 'a' = 97, '0' = 48", "Primitive char", ""], ["Size: — · Range / note: true / false only (not 0/1)", "boolean", ""], ["Result: 3 · Why: int / int = integer division (truncates toward zero); -7 / 2 = −3", "7 / 2", ""], ["Result: 1 · -1 · Why: remainder takes the sign of the left operand", "7 % 2 · -7 % 2", ""], ["Result: 3.5 · Why: one double operand → double division", "7 / 2.0", ""], ["Result: ArithmeticException at runtime · e + frequency (al…", ""], ["Error message, screenshot/recording, timestamp.", "Error message, screenshot/recording, tim…", ""], ["Application & server logs, stack trace, core dump.", "Application & server logs, stack trace, …", ""], ["Browser console + network tab (which request failed, HTTP status, response body).", "Browser console + network tab (which req…", ""], ["build/version, browser/OS/device, test environment, configuration.", "Environment", ""], ["Expected vs actual result; does it happen in other environments? what changed recently?", "Expected vs actual result; does it happe…", ""]]}, {"h": "Troubleshooting & log analysis › Symptom → likely cause", "rows": [["df -h / df -i ; clean logs/tmp, logrotate; deleted-but-open files ( lsof +L1 ); environment issue, not a product bug — clean up or move to another machine", "“No space left on device”", ""], ["ls -l, owner/group, execute bit, running as wrong user, SELinux", "“Permission denied”", ""], ["typo, not installed, not in $PATH", "“Command not found”", ""], ["OOM killer ( dmesg | grep -i kill ), ulimit", "Process killed suddenly", ""], ["ulimit -n, file/socket leak ( lsof -p )", "“Too many open files”", ""], ["authentication / authorization: credentials, token expiry, roles, whitelist, service account permissions", "HTTP 401 / 403", ""], ["server exception in logs / backend down behind proxy / backend too slow", "HTTP 500 / 502 / 504", ""], ["environment differences: config, versions, data, network, permissions", "Works on my machine only", ""], ["race conditions, resource exhaustion, timeouts, load balancer to one bad node, flaky test", "Intermittent failures", ""], ["pstack / jstack several times, strace ; waiting on DB lock, network, deadlock", "Process hung", ""], ["new query without index, N+1 queries, logging level DEBUG, config change", "Slow after release", ""]]}, {"h": "Software testing › Lifecycle & fundamentals", "rows": [["requirements → design → implementation → testing → deployment → maintenance. Models: Waterfall (sequential), V-model (each dev phase paired with a test level), Agile/Scrum (sprints, continuous testing), DevOps (CI/CD).", "SDLC", ""], ["requirement analysis → test planning → test case design → environment setup → execution → closure/report.", "STLC", ""], ["(human mistake) → defect/bug (in code) → failure (observed wrong behaviour).", "Error", ""], ["“are we building the product right ?” — checks against specifications, often static (reviews, walkthroughs, inspections). Validation = “are we building the right product ?” — checks it meets user needs, dynamic (executing the software, UAT).", "Verification", ""], ["(no execution: reviews, static analysis/linters) vs dynamic testing (running the code).", "Static testing", ""], ["(process-oriented, prevent defects) vs QC (product-oriented, find defects) vs testing.", "QA", ""], ["testing shows presence of defects not absence · exhaustive testing is impossible · test early (shift left) · defects cluster · pesticide paradox (update tests) · context dependent · absence-of-errors fallacy.", "Seven principles", ""]]}, {"h": "Software testing › Test levels & approaches", "rows": [["What: individual components (function/class) in isolation, with mocks/stubs; finds bugs early, enables refactoring, documents behaviour · Who: developers (JUnit, TestNG, pytest)", "Level Unit", ""], ["What: interfaces between modules/services (big-bang, top-down with stubs, bottom-up with drivers) · Who: dev/QA", "Integration", ""], ["What: complete integrated system against requirements (end-to-end) · Who: QA team", "System", ""], ["What: meets business needs; alpha (in-house) / beta (real users) · Who: client/users", "Acceptance (UAT)", ""], ["based on inputs/outputs and specs, no knowledge of code (EP, BVA, decision tables)", "Black-box", ""], ["based on internal code (statement/branch/path coverage)", "White-box (glass/structural)", ""], ["partial knowledge (DB schema, architecture)", "Grey-box", ""], ["automation fo ion, cloud & DevOps › Hardware basics", "rows": [["few powerful cores, general-purpose, sequential logic. Clock speed (GHz), cores, threads (hyper-threading), cache L1/L2/L3. 32-bit (max 4 GB addressable) vs 64-bit.", "CPU", ""], ["(Graphics Processing Unit): thousands of small cores for massively parallel work (same operation on lots of data). Uses: 3D rendering/gaming, video encoding, machine learning / AI training, scientific simulation, financial risk & Monte Carlo pricing, image processing, crypto mining.", "GPU", ""], ["volatile, fast working memory. Storage : non-volatile — HDD (spinning disk, cheap, slow) vs SSD (flash, fast, no moving parts) vs NVMe (SSD on PCIe, fastest). ROM/BIOS/UEFI : firmware that boots the machine.", "RAM", ""], ["DAS (direct attached) · NAS (file-level over network: NFS, SMB) · SAN (block-level storage network). Units: bit, byte = 8 bits, KB, MB, GB, TB (1024 or 1000).", "Storage types", ""], ["Technique: striping · Min disks: 2 · Usable capacity: 100% (0% loss) · Survives: no failure · Use: speed, temp data", "RAID 0", ""], ["Technique: mirroring · Min disks: 2 · Usable capacity: 50% · Survives: 1 disk (n−1) · Use: OS disks, safety", "RAID 1", ""], ["Technique: striping + distributed parity · Min disks: 3 · Usable capacity: (n−1)/n · Survives: 1 disk · Use: balance; slow writes, long rebuild", "RAID 5", ""], ["Technique: striping + double parity · Min disks: 4 · Usable capacity: (n−2)/n · Survives: 2 disks · Use: large arrays", "RAID 6", ""], ["Technique: mirrors, then striped · Min disks: 4 · Usable capacity: 50% · Survives: 1 per mirror pair · Use: databases: speed + redundancy", "10 (1+0)", ""]]}, {"h": "Hardware, OS, virtualization, cloud & DevOps › Operating system concepts", "rows": [["core of the OS — manages CPU scheduling, memory, devices, system calls. User space vs kernel space. Shell = command interpreter (bash).", "Kernel", ""], ["running program with its own memory space. Thread = unit of execution inside a process, shares its memory (lighter, but needs synchronization). Context switch = CPU switching between them.", "Process", ""], ["each process sees its own address space; pages mapped to RAM or swap on disk. Heavy swapping = “thrashing” = slow. Page fault = page not in RAM.", "Virtual memory", ""], ["FCFS, round robin (time slices), priority, shortest job first.", "Scheduling", ""], ["conditions (all four needed): mutual exclusion, hold and wait, no preemption, circular wait. Race condition : result depends on timing. Synchronization: mutex, semaphore, monitor.", "Deadlock", ""], ["pipes, sockets, shared memory, message queues, signals.", "IPC", ""], ["ext4, XFS (Linux), NTFS (Windows). Inode = file metadata. Windows vs Linux: \\ vs /, CRLF vs LF line endings, case-insensitive vs case-sensitive names.", "File systems", ""]]}, {"h": "Hardware, OS, virtualization, cloud & DevOps › Virtualization & containers", "rows": [["Virtual machine: full guest OS with its own kernel, on a hypervisor · Container: shares the host kernel ; isolated process (namespaces + cgroups)", "Isolation", ""], ["Virtual machine: GBs, minutes · Container: MBs, seconds", "Size / boot", ""], ["Virtual machine: VMware, Hyper-V, KVM, VirtualBox, EC2 · Container: Docker, Podman, containerd", "Examples", ""], ["Virtual machine: different OSes, strong isolation · Container: microservices, consistent deployments, density", "Best for", ""]]}, {"h": "Hardware, OS, virtualization, cloud & DevOps › Cloud computing", "rows": [["You manage: OS, runtime, apps, data · Examples: AWS EC2, Azure VMs, Google Compute Engine", "Model IaaS", ""], ["You manage: apps, data · Examples: AWS Elastic Beanstalk, Azure App Service, Google App Engine, Heroku", "Model PaaS", ""], ["You manage: just use it · Examples: Gmail, Office 365, Salesforce", "Model SaaS", ""], ["You manage: functions only · Examples: AWS Lambda, Azure Functions, Cloud Functions", "FaaS / serverless", ""], ["AWS: EC2 · Azure: Virtual Machines · Google Cloud: Compute cts with JSON.stringify · sessionStorage: document.cookie, HttpOnly, Secure, SameSite", "API", ""]]}, {"h": "Extra concepts from the 2026 Assessment paper › Python traps", "rows": [["default evaluated ONCE at definition → shared mutable list", "def f(x, y=[]):", "example"], ["same list object (alias); a.copy() / a[:] / list(a) = shallow copy", "b = a", "example"]]}, {"h": "Extra concepts from the 2026 Assessment paper › JVM: bytecode, GC, thread vs heap dumps", "rows": [["→ A.class = bytecode, which is portable because every OS/CPU has its own JVM that interprets and JIT-compiles it. (C → native binary, not portable.)", "javac A.java", ""], ["Young (Eden + Survivor; frequent minor GC ) → Old/Tenured (long-lived objects). A full GC runs when the old generation/heap has no space left for allocation; it is slow and can pause the application (“stop the world”). System.gc() is only a request. An object becomes eligible for GC when nothing references it.", "Heap generations", ""], ["Serial, Parallel, G1 (default), ZGC/Shenandoah (low pause). Flags: -Xms, -Xmx, -Xlog:gc.", "Collectors", ""], ["( jstack PID, kill -3 PID, jcmd PID Thread.print ): the state and stack of every thread (RUNNABLE, BLOCKED, WAITING, TIMED_WAITING). Use it for hangs, deadlocks, high CPU. Several threads BLOCKED on the same monitor → deadlock /contention.", "Thread dump", ""], ["( jmap -dump:format=b,file=h.hprof PID, -XX:+HeapDumpOnOutOfMemoryError ): every object in memory and its references. Use it for memory leaks / OutOfMemoryError, analysed with Eclipse MAT or VisualVM.", "Heap dump", ""]]}, {"h": "Extra concepts from the 2026 Assessment paper › Security concepts", "rows": [["“never trust, always verify”, regardless of network location. Authenticate and authorise every request, least privilege, MFA, micro-segmentation, encrypt everything. The opposite of perimeter security (“inside the firewall = trusted”).", "Zero trust", ""], ["Identity and Access Management controls authentication (who you are) and authorization (what you may do): users, groups, roles, policies.", "IAM", ""], ["→ HTTP 401 vs 403. MFA combines different factor types: something you know, have, or are.", "Authentication vs authorization", ""], [", separation of duties, encryption at rest and in transit (TLS), hashing passwords (bcrypt), the CIA triad (Confidentiality, Integrity, Availability).", "Least privilege", ""], ["SQL injection, XSS, CSRF, phishing, brute force, DDoS, man-in-the-middle.", "Common attacks", ""]]}, {"h": "Extra concepts from the 2026 Assessment paper › Memory types & hypervisor products", "rows": [["Volatile?: yes · Notes: fastest, inside the CPU", "Registers / cache", ""], ["Volatile?: yes · Notes: working memory, lost at power off", "Memory RAM", ""], ["Volatile?: no · Notes: read-only, permanent instructions such as BIOS/firmware ; slower than RAM, not modified during normal operation (EEPROM/flash can be re-flashed)", "Memory ROM", ""], ["Volatile?: no · Notes: storage. SSD advantages : much faster (no seek time, fast random I/O), no moving parts (shock resistant, silent), less power and heat. HDD: cheaper per GB, good for bulk storage", "SSD / HDD", ""], ["VMware: ESXi = type 1; Workstation/Fusion = type 2 · VirtualBox: type 2 · Hyper-V: type 1", "Type", ""], ["VMware: commercial (enterprise) · VirtualBox: free, open source (Oracle) · Hyper-V: included with Windows Server/Pro", "Cost", ""], ["VMware: vSphere/vCenter, vMotion live migration, HA, DRS, top performance · VirtualBox: cross-platform, simple, snapshots, Vagrant · Hyper-V: Windows/Azure integration, PowerShell, live migration", "Strengths", ""], ["VMware: data-centre production · VirtualBox: developers/students, local labs · Hyper-V: Microsoft environments, hybrid cloud", "Use", ""]]}, {"h": "Extra concepts from the 2026 Assessment paper › ISTQB-style testing theory", "rows": [["provide information and build enough confidence to decide whether to release. You can never prove the absence of faults.", "Main goal of a test team", ""], ["when time is short, run the high-impact/high-probability tests first. Setup and teardown steps (open/close DB) are needed by the others; changes that alter nothing (replace a value with the same value) and cosmetic edits come last.", "Risk-based prioritisation", ""], ["product/domain knowledge, being a good team player (collaboration, communication), critical thinking. The Product Owner owns the vision and backlog; the Scrum Master facilitates; the team plans its own work.", "Tester skills in agile", ""], ["whole-team quality, testing inside the sprint, test automation pyramid (many unit tests, fewer API tests, fewest UI tests), definition of done, test-first (TDD/BDD/ATDD).", "Agile testing", ""], ["(e.g. alphanumeric username, max 16): valid classes (letters, digits, mix, case), boundaries (0, 1, 15, 16, 17), invalid characters (special, spaces, Unicode, emoji), empty, duplicates/case-sensitivity, injection (SQL, XSS), client- and server-side validation, error messages, copy/paste, browsers/mobile.", "Field validation recipe", ""], ["(a scenario exceeds its time limit): performance regression, slow or overloaded environment, hang/deadlock/waiting on a resource, larger data, an unrealistic limit.", "Test timeout", ""]]}, {"h": "Extra concepts from the 2026 Assessment paper › Extra UNIX details", "rows": [["creates an empty file ( mkdir = directory; vim f only creates it when you save). pwd = current directory. id = user + group info. top = live processes and resource usage.", "touch f", ""], ["delete all files and subdirectories here (dot-files excepted). rm -r alone has no target; rm -f * doesn’t remove directories.", "rm -r *", ""], ["→ adds read and write for user, group and others; execute unchanged.", "chmod a+rw f", ""], ["the shell creates data/files before ls runs, so it appears in its own listing.", "ls data > data/files", ""], ["(content modified, days) · -ctime (inode/status changed) · -atime (accessed) · -mmin (minutes). ackage, library, Python module, Java module).", "Module", ""], ["assigns IP addresses automatically; DNS resolves names. Class C default mask = 255.255.255.0.", "DHCP", ""], ["over on-premises: no upfront hardware/licence cost (subscription), the provider handles maintenance/updates/security, fast deployment, access from anywhere, elastic scaling, SLAs.", "SaaS advantages", ""], ["Continuous Integration / Continuous Delivery and Continuous Deployment.", "CI/CD", ""]]}];

CHEAT.push({ id:'all', icon:'📚', title:'Everything A–Z (full guide)', groups: INDEX_GROUPS });
</script>
<script>
(function(){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const note = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  const main = document.getElementById('main'), nav = document.getElementById('nav'), q = document.getElementById('q');

  function renderAll(){
    nav.innerHTML = CHEAT.map(s => `<a href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title}</a>`).join('');
    main.innerHTML = '<div class="hint">Tap a command to copy it · tap a group to fold it · search covers every entry, including the full guide (📚 at the end)</div>' +
      CHEAT.map(s => `<section id="${s.id}"><h2>${s.icon} ${s.title}</h2>` + s.groups.map((g, gi) =>
        `<details ${s.id === 'traps' && gi === 0 ? 'open' : ''}><summary>${esc(g.h)} <span class="n">${g.rows.length}</span></summary>` +
        g.rows.map(r => rowHTML(r)).join('') + `</details>`).join('') + `</section>`).join('');
  }
  function rowHTML(r, secTitle, term){
    const hl = t => term ? t.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'),'<mark>$1</mark>') : t;
    const blk = r[1].includes('\n');
    return `<div class="row${blk ? ' tpl' : ''}">${secTitle ? `<div class="sec-tag">${esc(secTitle)}</div>` : ''}<div class="task">${hl(esc(r[0]))}</div><div><span class="cmd${blk ? ' block' : ''}" data-c="${esc(r[1])}">${hl(esc(r[1]))}</span>${r[2] ? `<div class="note">${hl(note(r[2]))}</div>` : ''}</div></div>`;
  }
  function search(term){
    term = term.trim();
    if (!term){ renderAll(); return; }
    const t = term.toLowerCase(); let h = '', n = 0;
    CHEAT.forEach(s => s.groups.forEach(g => g.rows.forEach(r => {
      if ((r[0] + ' ' + r[1] + ' ' + (r[2]||'')).toLowerCase().includes(t)) { h += rowHTML(r, s.id === 'all' ? g.h : s.title + ' › ' + g.h, term); n++; }
    })));
    main.innerHTML = n ? `<div class="hint">${n} result${n>1?'s':''} for “${esc(term)}”</div><details open><summary>Results <span class="n">${n}</span></summary>${h}</details>` : `<div class="empty">No match for “${esc(term)}”.<br>Try a shorter word (e.g. “port”, “join”, “kill”).</div>`;
  }
  let tmr; q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => search(q.value), 120); });

  // copy on tap
  main.addEventListener('click', e => {
    const c = e.target.closest('.cmd'); if (!c) return;
    const text = c.getAttribute('data-c');
    const done = () => { const t = document.getElementById('toast'); t.textContent = 'Copied: ' + (text.length > 34 ? text.slice(0, 34) + '…' : text); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1300); };
    try { navigator.clipboard.writeText(text).then(done, () => {}); } catch (err) {}
  });

  // nav active + back to top
  nav.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; if (q.value) { q.value = ''; renderAll(); } setTimeout(() => { const s = document.getElementById(a.dataset.id); if (s) { s.scrollIntoView({behavior:'smooth'}); const d = s.querySelector('details'); if (d) d.open = true; } }, 10); e.preventDefault(); });
  const top = document.getElementById('totop');
  top.onclick = () => window.scrollTo({top:0, behavior:'smooth'});
  window.addEventListener('scroll', () => {
    top.style.display = window.scrollY > 600 ? 'block' : 'none';
    let cur = null; for (const s of CHEAT) { const el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top < 140) cur = s.id; }
    nav.querySelectorAll('a').forEach(a => { const on = a.dataset.id === cur; if (on && !a.classList.contains('on')) a.scrollIntoView({inline:'center', block:'nearest'}); a.classList.toggle('on', on); });
  }, {passive:true});

  // font size (remembered on this device)
  let fs = 15; try { fs = +localStorage.getItem('cheatFs') || 15; } catch (e) {}
  const setFs = v => { fs = Math.max(13, Math.min(20, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('cheatFs', fs); } catch (e) {} };
  setFs(fs);
  document.getElementById('fsUp').onclick = () => setFs(fs + 1);
  document.getElementById('fsDown').onclick = () => setFs(fs - 1);

  renderAll();
})();
</script>
