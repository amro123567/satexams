s + commit</td></tr>\n<tr><td><code>git commit --amend</code></td><td>replace the <b>last</b> commit (fix message or add forgotten files)</td></tr>\n<tr><td><code>git log</code> · <code>--oneline --graph --all</code></td><td>history · compact tree of all branches</td></tr>\n<tr><td><code>git diff</code></td><td>working dir vs staging (unstaged changes)</td></tr>\n<tr><td><code>git diff --staged</code> (<code>--cached</code>)</td><td>staging vs last commit</td></tr>\n<tr><td><code>git diff branchA branchB</code></td><td>differences between two branches’ <b>commits</b></td></tr>\n<tr><td><code>git show &lt;sha&gt;</code> · <code>git blame f</code></td><td>details of a commit · who changed each line</td></tr>\n<tr><td><code>git rm f</code> · <code>git mv a b</code></td><td>delete/rename and stage it</td></tr>\n<tr><td><code>git restore f</code> · <code>git restore --staged f</code></td><td>discard working changes · unstage (old: <code>git checkout -- f</code>, <code>git reset f</code>)</td></tr>\n<tr><td><code>.gitignore</code></td><td>file patterns git ignores (<code>*.log</code>, <code>target/</code>, <code>node_modules/</code>)</td></tr>\n<tr><td><code>git tag v1.0</code></td><td>name a commit (releases)</td></tr>\n<tr><td><code>git config --global user.name \"…\"</code></td><td>identity</td></tr>\n</table></div>", "command meaning git init · git clone url new repo · copy a remote repo git status what’s modified / staged / untracked git add f · git add . · git add -p stage a file · all changes · interactively by hunk git commit -m \"msg\" · -am commit staged changes · stage tracked modified files + commit git commit --amend replace the last commit (fix message or add forgotten files) git log · --oneline --graph --all history · compact tree of all branches git diff working dir vs staging (unstaged changes) git diff --staged ( --cached ) staging vs last commit git diff brancha branchb differences between two branches’ commits git show <sha> · git blame f details of a commit · who changed each line git rm f · git mv a b delete/rename and stage it git restore f · git restore --staged f discard working changes · unstage (old: git checkout -- f , git reset f ) .gitignore file patterns git ignores ( *.log , target/ , node_modules/ ) git tag v1.0 name a commit (releases) git config --global user.name \"…\" identity"]]}, {"h": "Branches", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>Meaning</th></tr>\n<tr><td><code>git branch</code> · <code>-a</code> · <code>-r</code></td><td>list local · all · remote branches (current marked with *)</td></tr>\n<tr><td><code>git branch name</code></td><td><b>create</b> branch at current commit (does NOT switch)</td></tr>\n<tr><td><code>git checkout name</code> / <code>git switch name</code></td><td>switch branch</td></tr>\n<tr><td><code>git checkout -b name</code> / <code>git switch -c name</code></td><td>create <b>and</b> switch</td></tr>\n<tr><td><code>git branch -d name</code></td><td>delete (only if merged)</td></tr>\n<tr><td><code>git branch -D name</code></td><td>force delete (even if unmerged). Non-existent name → error “branch not found”</td></tr>\n<tr><td><code>git branch -m old new</code></td><td>rename</td></tr>\n<tr><td><code>git push origin --delete name</code></td><td>delete remote branch</td></tr>\n</table></div>", "command meaning git branch · -a · -r list local · all · remote branches (current marked with *) git branch name create branch at current commit (does not switch) git checkout name / git switch name switch branch git checkout -b name / git switch -c name create and switch git branch -d name delete (only if merged) git branch -d name force delete (even if unmerged). non-existent name → error “branch not found” git branch -m old new rename git push origin --delete name delete remote branch"], ["<h4>Trace example (from the paper)</h4>", "trace example (from the paper)"], ["<pre>git checkout -b murex                 <span class=\"c\"># new branch murex from master, switch to it</span>\ntouch mymurexfile\necho \"MUREX ROCKS\" &gt;&gt; mymurexfile\ngit add mymurexfile\ngit commit -m \"Murex file changes\"    <span class=\"c\"># committed on murex ONLY</span>\necho \"MUREX ALWAYS ROCKS\" &gt;&gt; mymurexfile   <span class=\"c\"># working dir only, not committed</span>\ngit branch                            <span class=\"c\"># just lists</span>\ngit diff murex master                 <span class=\"c\"># just shows differences</span>\ngit branch mures                      <span class=\"c\"># creates another branch, no switch</span>\ngit push origin master                <span class=\"c\"># pushes master (unchanged)</span>\ngit branch -D murer                   <span class=\"c\"># typo → error</span>\n<span class=\"c\"># murex: committed content \"MUREX ROCKS\" (2nd line uncommitted in working dir)</span>\n<span class=\"c\"># master: file does not exist</span></pre>", "git checkout -b murex # new branch murex from master, switch to it touch mymurexfile echo \"murex rocks\" >> mymurexfile git add mymurexfile git commit -m \"murex file changes\" # committed on murex only echo \"murex always rocks\" >> mymurexfile # working dir only, not committed git branch # just lists git diff murex master # just shows differences git branch mures # creates another branch, no switch git push origin master # pushes master (unchanged) git branch -d murer # typo → error # murex: committed content \"murex rocks\" (2nd line uncommitted in working dir) # master: file does not exist"]]}, {"h": "Merge vs rebase vs squash", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>What happens</th><th>History</th></tr>\n<tr><td><code>git merge feature</code></td><td>Integrates feature into current branch. If current hasn’t moved: <b>fast-forward</b> (pointer just moves). Otherwise: <b>three-way merge</b> creating a merge commit with 2 parents.</td><td>Keeps true history, non-linear</td></tr>\n<tr><td><code>git merge --no-ff</code></td><td>always create a merge commit</td><td></td></tr>\n<tr><td><code>git rebase main</code> (on feature)</td><td><b>Moves/replays</b> your commits on top of main → new commits, new hashes.</td><td>Linear, rewritten</td></tr>\n<tr><td><code>git rebase -i HEAD~3</code></td><td>interactive: <code>pick</code>, <code>reword</code>, <code>edit</code>, <b><code>squash</code></b> (combine with previous, keep message), <code>fixup</code> (combine, drop message), <code>drop</code>. → <b>the</b> way to squash commits before merging.</td><td>Rewritten</td></tr>\n<tr><td><code>git merge --squash feature</code></td><td>stages all of feature’s changes as one change; you then commit once (squashes <i>at</i> merge time)</td><td>One commit</td></tr>\n<tr><td><code>git cherry-pick &lt;sha&gt;</code></td><td>apply one specific commit onto the current branch as a new commit (e.g. hotfix to release branch)</td><td></td></tr>\n</table></div>", "command what happens history git merge feature integrates feature into current branch. if current hasn’t moved: fast-forward (pointer just moves). otherwise: three-way merge creating a merge commit with 2 parents. keeps true history, non-linear git merge --no-ff always create a merge commit git rebase main (on feature) moves/replays your commits on top of main → new commits, new hashes. linear, rewritten git rebase -i head~3 interactive: pick , reword , edit , squash (combine with previous, keep message), fixup (combine, drop message), drop . → the way to squash commits before merging. rewritten git merge --squash feature stages all of feature’s changes as one change; you then commit once (squashes at merge time) one commit git cherry-pick <sha> apply one specific commit onto the current branch as a new commit (e.g. hotfix to release branch)"], ["<div class=\"trap\">Golden rule: <b>never rebase / reset / amend commits already pushed to a shared branch</b> — it rewrites history others have. Use <code>git revert</code> instead.</div>", "golden rule: never rebase / reset / amend commits already pushed to a shared branch — it rewrites history others have. use git revert instead."], ["<p><b>Merge conflicts</b>: same lines changed in both branches. Git marks the file:</p>", "merge conflicts : same lines changed in both branches. git marks the file:"], ["<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nyour version\n=======\ntheir version\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</pre>", "<<<<<<< head your version ======= their version >>>>>>> feature"], ["<p>Edit to the final content, remove markers, <code>git add</code>, then <code>git commit</code> (or <code>git rebase --continue</code>). <code>git merge --abort</code> / <code>git rebase --abort</code> to cancel. <code>git mergetool</code> opens a visual tool for resolving conflicts (it does not merge by itself).</p>", "edit to the final content, remove markers, git add , then git commit (or git rebase --continue ). git merge --abort / git rebase --abort to cancel. git mergetool opens a visual tool for resolving conflicts (it does not merge by itself)."]]}, {"h": "Undoing: reset, revert, stash, reflog", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>HEAD/branch</th><th>Staging (index)</th><th>Working dir</th></tr>\n<tr><td><code>git reset --soft HEAD~1</code></td><td>moves back</td><td>kept (changes stay staged)</td><td>kept</td></tr>\n<tr><td><code>git reset --mixed HEAD~1</code> (default)</td><td>moves back</td><td>reset (changes unstaged)</td><td>kept</td></tr>\n<tr><td><code>git reset --hard HEAD~1</code></td><td>moves back</td><td>reset</td><td><b>reset — changes destroyed</b></td></tr>\n</table></div>", "command head/branch staging (index) working dir git reset --soft head~1 moves back kept (changes stay staged) kept git reset --mixed head~1 (default) moves back reset (changes unstaged) kept git reset --hard head~1 moves back reset reset — changes destroyed"], ["<ul>\n<li><code>git reset --hard HEAD~1</code> = <b>removes the last commit and its changes from the working directory and staging area</b>.</li>\n<li><code>git reset --soft HEAD~N</code> + one new commit = another way to squash the last N commits.</li>\n<li><code>git revert &lt;sha&gt;</code> = creates a <b>new commit that undoes</b> that commit. Safe on shared branches.</li>\n<li><code>git stash</code> saves uncommitted changes and cleans the working dir · <code>git stash pop</code> re-applies and removes from stash · <code>git stash apply</code> re-applies and keeps · <code>git stash list</code> · <code>git stash drop</code>.</li>\n<li><code>git reflog</code> = log of everywhere HEAD has been — recover “lost” commits after a bad reset.</li>\n<li><code>git clean -fd</code> = delete untracked files/dirs.</li>\n</ul>", "git reset --hard head~1 = removes the last commit and its changes from the working directory and staging area . git reset --soft head~n + one new commit = another way to squash the last n commits. git revert <sha> = creates a new commit that undoes that commit. safe on shared branches. git stash saves uncommitted changes and cleans the working dir · git stash pop re-applies and removes from stash · git stash apply re-applies and keeps · git stash list · git stash drop . git reflog = log of everywhere head has been — recover “lost” commits after a bad reset. git clean -fd = delete untracked files/dirs."]]}, {"h": "Remotes", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>Meaning</th></tr>\n<tr><td><code>git remote -v</code> · <code>git remote add origin url</code></td><td>list · add a remote</td></tr>\n<tr><td><code>git fetch</code></td><td>download remote commits, <b>don’t</b> change your branches</td></tr>\n<tr><td><code>git pull</code></td><td><code>fetch</code> + <code>merge</code> (or <code>--rebase</code>: fetch + rebase)</td></tr>\n<tr><td><code>git push origin branch</code> · <code>-u</code></td><td>upload commits · set upstream tracking</td></tr>\n<tr><td><code>git push --force-with-lease</code></td><td>safer force push (fails if someone else pushed)</td></tr>\n<tr><td>Pull/Merge request</td><td>code review on GitHub/GitLab/Bitbucket before merging</td></tr>\n</table></div>", "command meaning git remote -v · git remote add origin url list · add a remote git fetch download remote commits, don’t change your branches git pull fetch + merge (or --rebase : fetch + rebase) git push origin branch · -u upload commits · set upstream tracking git push --force-with-lease safer force push (fails if someone else pushed) pull/merge request code review on github/gitlab/bitbucket before merging"], ["<p><b>Branching strategies</b>: GitFlow (main, develop, feature/*, release/*, hotfix/*) · trunk-based (short-lived branches into main) · feature branches + PRs.</p>", "branching strategies : gitflow (main, develop, feature/*, release/*, hotfix/*) · trunk-based (short-lived branches into main) · feature branches + prs."]]}]}, {"title": "Git deep dive: flags, scenarios, traces & tricks", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">Everything needed to trace any sequence of Git commands in your head: how Git stores things, what every common flag does, the revision syntax, 23 real-world scenarios with the exact fix, 10 exam-style trace drills, and pro tricks.</p>", "everything needed to trace any sequence of git commands in your head: how git stores things, what every common flag does, the revision syntax, 23 real-world scenarios with the exact fix, 10 exam-style trace drills, and pro tricks."]]}, {"h": "How Git actually stores your work", "blocks": [["<ul>\n<li><code>.git/</code> holds the whole repository. Delete it and the folder is no longer a repo; the files stay.</li>\n<li>Four object types, each named by a SHA-1 hash of its content: <b>blob</b> (file content), <b>tree</b> (a directory: names → blobs/trees), <b>commit</b> (a tree snapshot + parent commit(s) + author + message), <b>tag</b> (annotated tag). Same content = same hash, so Git stores each version once.</li>\n<li>A <b>commit is a full snapshot</b>, not a diff. Diffs are computed when you ask.</li>\n<li>A <b>branch</b> is just a file (<code>.git/refs/heads/main</code>) containing one commit hash. Creating a branch is instant and costs 41 bytes. Committing moves the current branch forward.</li>\n<li><b>HEAD</b> (<code>.git/HEAD</code>) normally contains <code>ref: refs/heads/main</code>, i.e. which branch you’re on. <b>Detached HEAD</b> = HEAD contains a commit hash directly (after <code>git checkout &lt;sha&gt;</code> or a tag).</li>\n<li><b>Remote-tracking branches</b> (<code>origin/main</code>) are your local memory of where the remote’s branches were at the last <code>fetch</code>. You can’t commit on them.</li>\n</ul>", ".git/ holds the whole repository. delete it and the folder is no longer a repo; the files stay. four object types, each named by a sha-1 hash of its content: blob (file content), tree (a directory: names → blobs/trees), commit (a tree snapshot + parent commit(s) + author + message), tag (annotated tag). same content = same hash, so git stores each version once. a commit is a full snapshot , not a diff. diffs are computed when you ask. a branch is just a file ( .git/refs/heads/main ) containing one commit hash. creating a branch is instant and costs 41 bytes. committing moves the current branch forward. head ( .git/head ) normally contains ref: refs/heads/main , i.e. which branch you’re on. detached head = head contains a commit hash directly (after git checkout <sha> or a tag). remote-tracking branches ( origin/main ) are your local memory of where the remote’s branches were at the last fetch . you can’t commit on them."], ["<div class=\"tw\"><table>\n<tr><th>The three trees</th><th>What it is</th><th>Changed by</th></tr>\n<tr><td><b>Working directory</b></td><td>the actual files you edit</td><td>your editor, <code>checkout</code>/<code>restore</code>, <code>reset --hard</code>, <code>stash</code></td></tr>\n<tr><td><b>Index / staging area</b></td><td>the proposed next commit (<code>.git/index</code>)</td><td><code>add</code>, <code>rm</code>, <code>restore --staged</code>, <code>reset</code> (mixed/hard)</td></tr>\n<tr><td><b>HEAD</b></td><td>the last commit on the current branch</td><td><code>commit</code>, <code>reset</code> (all modes), <code>checkout</code>/<code>switch</code>, <code>merge</code>, <code>rebase</code></td></tr>\n</table></div>", "the three trees what it is changed by working directory the actual files you edit your editor, checkout / restore , reset --hard , stash index / staging area the proposed next commit ( .git/index ) add , rm , restore --staged , reset (mixed/hard) head the last commit on the current branch commit , reset (all modes), checkout / switch , merge , rebase"], ["<p><b>File life cycle</b>: <i>untracked</i> → (<code>add</code>) → <i>staged</i> → (<code>commit</code>) → <i>unmodified</i> → (edit) → <i>modified</i> → (<code>add</code>) → <i>staged</i> … ; <code>git rm --cached</code> returns a file to untracked.</p>", "file life cycle : untracked → ( add ) → staged → ( commit ) → unmodified → (edit) → modified → ( add ) → staged … ; git rm --cached returns a file to untracked."], ["<h4>Reading <code>git status -s</code> (short format)</h4>", "reading git status -s (short format)"], ["<div class=\"tw\"><table>\n<tr><th>Code</th><th>Meaning</th></tr>\n<tr><td><code>??</code></td><td>untracked</td></tr>\n<tr><td><code>A </code></td><td>new file, staged</td></tr>\n<tr><td><code>M </code> (left column)</td><td>modified and <b>staged</b></td></tr>\n<tr><td><code> M</code> (right column)</td><td>modified, <b>not staged</b></td></tr>\n<tr><td><code>MM</code></td><td>staged, then modified again (the index and working dir differ)</td></tr>\n<tr><td><code>D </code> / <code> D</code></td><td>deleted, staged / unstaged</td></tr>\n<tr><td><code>R </code></td><td>renamed (staged)</td></tr>\n<tr><td><code>UU</code></td><td>conflict: both sides modified (unmerged)</td></tr>\n<tr><td><code>!!</code></td><td>ignored (with <code>--ignored</code>)</td></tr>\n</table></div>", "code meaning ?? untracked a new file, staged m (left column) modified and staged m (right column) modified, not staged mm staged, then modified again (the index and working dir differ) d / d deleted, staged / unstaged r renamed (staged) uu conflict: both sides modified (unmerged) !! ignored (with --ignored )"], ["<p>Left column = index vs HEAD; right column = working dir vs index. <code>git status -sb</code> adds the branch and ahead/behind counts: <code>## main...origin/main [ahead 2, behind 1]</code>.</p>", "left column = index vs head; right column = working dir vs index. git status -sb adds the branch and ahead/behind counts: ## main...origin/main [ahead 2, behind 1] ."]]}, {"h": "Setup, staging & committing: every flag", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>What it does</th></tr>\n<tr><td><code>git init</code> / <code>git init dir</code></td><td>create a repo here / in a new folder <code>dir</code> (you are <b>not</b> moved into it; you still need <code>cd dir</code>)</td></tr>\n<tr><td><code>git init -b main</code> / <code>--bare</code></td><td>name the first branch / a repo with no working dir (used as a server/remote)</td></tr>\n<tr><td><code>git clone url [dir]</code></td><td>copy a repo, set up <code>origin</code>, and check out the default branch</td></tr>\n<tr><td><code>clone --depth 1</code> / <code>-b dev</code> / <code>--single-branch</code></td><td>shallow (latest snapshot only) / check out branch dev / fetch only that branch</td></tr>\n<tr><td><code>git config --global user.name \"…\"</code> / <code>user.email</code></td><td>identity stamped on commits. Scopes: <code>--system</code> (all users) &lt; <code>--global</code> (you, <code>~/.gitconfig</code>) &lt; <code>--local</code> (this repo, <code>.git/config</code>, wins)</td></tr>\n<tr><td><code>git config --list --show-origin</code></td><td>all settings and which file sets them</td></tr>\n<tr><td><code>git config --global alias.st \"status -sb\"</code></td><td>create <code>git st</code></td></tr>\n<tr><td><code>git config --global pull.rebase true</code> / <code>core.editor vim</code> / <code>init.defaultBranch main</code> / <code>core.autocrlf input</code></td><td>pull with rebase / editor for messages / default branch name / line-ending conversion (Windows CRLF vs Linux LF)</td></tr>\n<tr><td><code>git add file</code></td><td>stage that file’s current content (a snapshot: later edits need another add)</td></tr>\n<tr><td><code>git add .</code></td><td>stage new, modified and deleted files <b>in this directory and below</b></td></tr>\n<tr><td><code>git add -A</code></td><td>stage everything in the whole repo (new + modified + deleted)</td></tr>\n<tr><td><code>git add -u</code></td><td>stage modified and deleted <b>tracked</b> files only (no new files)</td></tr>\n<tr><td><code>git add -p</code></td><td>interactively choose hunks (y/n/s split/e edit): commit part of a file</td></tr>\n<tr><td><code>git add -n</code> / <code>-f</code></td><td>dry run / force-add an ignored file</td></tr>\n<tr><td><code>git commit</code></td><td>record the <b>index</b> as a new commit (opens the editor for a message)</td></tr>\n<tr><td><code>git commit -m \"msg\"</code></td><td>message inline (several <code>-m</code> = several paragraphs)</td></tr>\n<tr><td><code>git commit -a</code> / <code>-am \"msg\"</code></td><td>automatically stage <b>modified and deleted tracked files</b>, then commit. <b>New untracked files are NOT included</b></td></tr>\n<tr><td><code>git commit --amend</code></td><td>replace the last commit with a new one (new hash) including what’s staged now; edit the message</td></tr>\n<tr><td><code>--amend --no-edit</code></td><td>amend, keeping the message (add a forgotten file)</td></tr>\n<tr><td><code>--amend --author=\"Name &lt;mail&gt;\"</code></td><td>fix the author</td></tr>\n<tr><td><code>git commit -v</code> / <code>--allow-empty</code> / <code>-s</code> / <code>--fixup=&lt;sha&gt;</code></td><td>show the diff in the editor / commit with no changes (trigger CI) / add Signed-off-by / mark as a fix for an older commit (squashed later with <code>rebase -i --autosquash</code>)</td></tr>\n<tr><td><code>git rm file</code> / <code>-r dir</code></td><td>delete from the working dir <b>and</b> stage the deletion</td></tr>\n<tr><td><code>git rm --cached file</code></td><td>stop tracking (remove from the index) but <b>keep the file on disk</b>. Used for committed secrets and build output</td></tr>\n<tr><td><code>git mv old new</code></td><td>rename and stage (= mv + git rm + git add)</td></tr>\n<tr><td><code>git restore file</code></td><td>discard unstaged changes (working dir ← index). <b>Irreversible</b></td></tr>\n<tr><td><code>git restore --staged file</code></td><td>unstage (index ← HEAD); your edits stay in the working dir</td></tr>\n<tr><td><code>git restore --source=HEAD~2 file</code></td><td>bring back a file’s content from 2 commits ago</td></tr>\n<tr><td><code>git checkout -- file</code></td><td>old syntax for <code>git restore file</code></td></tr>\n<tr><td><code>git clean -n</code> / <code>-f</code> / <code>-fd</code> / <code>-fdx</code> / <code>-i</code></td><td>preview / delete untracked files / and untracked dirs / and ignored files too / interactive. Irreversible</td></tr>\n</table></div>", "command + flag what it does git init / git init dir create a repo here / in a new folder dir (you are not moved into it; you still need cd dir ) git init -b main / --bare name the first branch / a repo with no working dir (used as a server/remote) git clone url [dir] copy a repo, set up origin , and check out the default branch clone --depth 1 / -b dev / --single-branch shallow (latest snapshot only) / check out branch dev / fetch only that branch git config --global user.name \"…\" / user.email identity stamped on commits. scopes: --system (all users) < --global (you, ~/.gitconfig ) < --local (this repo, .git/config , wins) git config --list --show-origin all settings and which file sets them git config --global alias.st \"status -sb\" create git st git config --global pull.rebase true / core.editor vim / init.defaultbranch main / core.autocrlf input pull with rebase / editor for messages / default branch name / line-ending conversion (windows crlf vs linux lf) git add file stage that file’s current content (a snapshot: later edits need another add) git add . stage new, modified and deleted files in this directory and below git add -a stage everything in the whole repo (new + modified + deleted) git add -u stage modified and deleted tracked files only (no new files) git add -p interactively choose hunks (y/n/s split/e edit): commit part of a file git add -n / -f dry run / force-add an ignored file git commit record the index as a new commit (opens the editor for a message) git commit -m \"msg\" message inline (several -m = several paragraphs) git commit -a / -am \"msg\" automatically stage modified and deleted tracked files , then commit. new untracked files are not included git commit --amend replace the last commit with a new one (new hash) including what’s staged now; edit the message --amend --no-edit amend, keeping the message (add a forgotten file) --amend --author=\"name <mail>\" fix the author git commit -v / --allow-empty / -s / --fixup=<sha> show the diff in the editor / commit with no changes (trigger ci) / add signed-off-by / mark as a fix for an older commit (squashed later with rebase -i --autosquash ) git rm file / -r dir delete from the working dir and stage the deletion git rm --cached file stop tracking (remove from the index) but keep the file on disk . used for committed secrets and build output git mv old new rename and stage (= mv + git rm + git add) git restore file discard unstaged changes (working dir ← index). irreversible git restore --staged file unstage (index ← head); your edits stay in the working dir git restore --source=head~2 file bring back a file’s content from 2 commits ago git checkout -- file old syntax for git restore file git clean -n / -f / -fd / -fdx / -i preview / delete untracked files / and untracked dirs / and ignored files too / interactive. irreversible"], ["<h4>.gitignore patterns</h4>", ".gitignore patterns"], ["<pre>*.log            <span class=\"c\"># any .log file anywhere</span>\n!keep.log        <span class=\"c\"># exception: track this one</span>\n/build           <span class=\"c\"># only build at the repo root</span>\ntarget/          <span class=\"c\"># any directory named target</span>\n**/tmp           <span class=\"c\"># tmp directory at any depth</span>\n.env             <span class=\"c\"># secrets</span>\n*.class          <span class=\"c\"># compiled Java</span></pre>", "*.log # any .log file anywhere !keep.log # exception: track this one /build # only build at the repo root target/ # any directory named target **/tmp # tmp directory at any depth .env # secrets *.class # compiled java"], ["<div class=\"trap\">.gitignore only affects <b>untracked</b> files. A file already committed stays tracked even if added to .gitignore. Fix: <code>git rm --cached file</code> + commit. <code>git check-ignore -v file</code> tells you which rule ignores it.</div>", ".gitignore only affects untracked files. a file already committed stays tracked even if added to .gitignore. fix: git rm --cached file + commit. git check-ignore -v file tells you which rule ignores it."]]}, {"h": "Inspecting: log, show, diff, blame, grep", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>What it does</th></tr>\n<tr><td><code>git log</code></td><td>commits of the current branch, newest first (hash, author, date, message)</td></tr>\n<tr><td><code>--oneline</code></td><td>one line per commit (short hash + subject)</td></tr>\n<tr><td><code>--graph --all --decorate</code></td><td>ASCII branch graph, all branches, branch/tag labels. <code>git log --oneline --graph --all</code> is the best way to “see” a repo</td></tr>\n<tr><td><code>-n 5</code> / <code>-5</code></td><td>last 5 commits</td></tr>\n<tr><td><code>-p</code> / <code>--stat</code> / <code>--name-only</code></td><td>with the full diff / with files changed and +/- counts / file names only</td></tr>\n<tr><td><code>--author=\"Mohamad\"</code> / <code>--since=\"2 weeks ago\"</code> / <code>--until</code></td><td>filter by author / date</td></tr>\n<tr><td><code>--grep=\"JIRA-123\"</code></td><td>filter by commit message</td></tr>\n<tr><td><code>-S \"functionName\"</code></td><td>“pickaxe”: commits that added or removed this string (find when code appeared/vanished)</td></tr>\n<tr><td><code>-- path/file</code> / <code>--follow file</code></td><td>only commits touching that file / follow it across renames</td></tr>\n<tr><td><code>--merges</code> / <code>--no-merges</code> / <code>--first-parent</code></td><td>only merge commits / exclude them / follow only the main line</td></tr>\n<tr><td><code>main..feature</code></td><td>commits in feature that aren’t in main (“what will this merge bring?”)</td></tr>\n<tr><td><code>origin/main..HEAD</code></td><td>local commits not pushed yet</td></tr>\n<tr><td><code>--pretty=format:\"%h %an %ar %s\"</code></td><td>custom format: short hash, author, relative date, subject</td></tr>\n<tr><td><code>git shortlog -sn</code></td><td>commit count per author</td></tr>\n<tr><td><code>git show &lt;sha&gt;</code></td><td>one commit’s metadata + diff. <code>git show HEAD~1:src/App.java</code> = that file as it was then. <code>--stat</code> summary only</td></tr>\n<tr><td><code>git diff</code></td><td>working dir vs <b>index</b> (unstaged changes only)</td></tr>\n<tr><td><code>git diff --staged</code> / <code>--cached</code></td><td>index vs HEAD: exactly what <code>commit</code> will record</td></tr>\n<tr><td><code>git diff HEAD</code></td><td>working dir vs last commit (staged + unstaged)</td></tr>\n<tr><td><code>git diff A B</code> / <code>A..B</code></td><td>snapshot A vs snapshot B (branches or commits)</td></tr>\n<tr><td><code>git diff A...B</code></td><td>changes on B since it diverged from A (what a PR shows)</td></tr>\n<tr><td><code>--name-only</code> / <code>--name-status</code> / <code>--stat</code> / <code>--word-diff</code> / <code>-- file</code></td><td>file names / with A/M/D status / summary / inline word changes / limit to a file</td></tr>\n<tr><td><code>git blame file</code> / <code>-L 40,60</code></td><td>who last changed each line, in which commit / only lines 40–60</td></tr>\n<tr><td><code>git grep \"pattern\"</code></td><td>search tracked files (faster than grep -r, respects the repo)</td></tr>\n<tr><td><code>git reflog</code></td><td>local history of where HEAD pointed: every commit, checkout, reset, rebase. Kept ~90 days. Your safety net</td></tr>\n</table></div>", "command + flag what it does git log commits of the current branch, newest first (hash, author, date, message) --oneline one line per commit (short hash + subject) --graph --all --decorate ascii branch graph, all branches, branch/tag labels. git log --oneline --graph --all is the best way to “see” a repo -n 5 / -5 last 5 commits -p / --stat / --name-only with the full diff / with files changed and +/- counts / file names only --author=\"mohamad\" / --since=\"2 weeks ago\" / --until filter by author / date --grep=\"jira-123\" filter by commit message -s \"functionname\" “pickaxe”: commits that added or removed this string (find when code appeared/vanished) -- path/file / --follow file only commits touching that file / follow it across renames --merges / --no-merges / --first-parent only merge commits / exclude them / follow only the main line main..feature commits in feature that aren’t in main (“what will this merge bring?”) origin/main..head local commits not pushed yet --pretty=format:\"%h %an %ar %s\" custom format: short hash, author, relative date, subject git shortlog -sn commit count per author git show <sha> one commit’s metadata + diff. git show head~1:src/app.java = that file as it was then. --stat summary only git diff working dir vs index (unstaged changes only) git diff --staged / --cached index vs head: exactly what commit will record git diff head working dir vs last commit (staged + unstaged) git diff a b / a..b snapshot a vs snapshot b (branches or commits) git diff a...b changes on b since it diverged from a (what a pr shows) --name-only / --name-status / --stat / --word-diff / -- file file names / with a/m/d status / summary / inline word changes / limit to a file git blame file / -l 40,60 who last changed each line, in which commit / only lines 40–60 git grep \"pattern\" search tracked files (faster than grep -r, respects the repo) git reflog local history of where head pointed: every commit, checkout, reset, rebase. kept ~90 days. your safety net"]]}, {"h": "Branching & switching: every flag", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>What it does</th></tr>\n<tr><td><code>git branch</code></td><td>list local branches (<code>*</code> = current)</td></tr>\n<tr><td><code>-a</code> / <code>-r</code> / <code>-v</code> / <code>-vv</code></td><td>local + remote / remote only / with last commit / plus upstream and ahead/behind</td></tr>\n<tr><td><code>git branch name</code></td><td>create a branch at HEAD. <b>You stay on the current branch</b></td></tr>\n<tr><td><code>git branch name &lt;sha&gt;</code></td><td>create a branch at a specific commit</td></tr>\n<tr><td><code>git branch -d name</code></td><td>delete if fully merged (safe); error “not fully merged” otherwise</td></tr>\n<tr><td><code>git branch -D name</code></td><td>force delete. Fails for the branch you are on, and for a name that doesn’t exist (“branch not found”)</td></tr>\n<tr><td><code>git branch -m new</code> / <code>-m old new</code> / <code>-M</code></td><td>rename current / rename another / force rename</td></tr>\n<tr><td><code>git branch --merged</code> / <code>--no-merged</code></td><td>branches already merged into HEAD (safe to delete) / not merged</td></tr>\n<tr><td><code>git branch -u origin/dev</code></td><td>set the upstream (tracking) branch</td></tr>\n<tr><td><code>git branch -f main &lt;sha&gt;</code></td><td>move a branch pointer (not the current one)</td></tr>\n<tr><td><code>git switch name</code> / <code>git checkout name</code></td><td>move HEAD to the branch and update the index and working dir to its snapshot</td></tr>\n<tr><td><code>git switch -c name</code> / <code>git checkout -b name</code></td><td>create <b>and</b> switch</td></tr>\n<tr><td><code>git switch -c name origin/name</code></td><td>create a local branch tracking a remote one (just <code>git switch name</code> does it automatically if it exists on origin)</td></tr>\n<tr><td><code>git switch -C name</code> / <code>checkout -B</code></td><td>create or reset a branch to here, then switch</td></tr>\n<tr><td><code>git switch -</code> / <code>git checkout -</code></td><td>go back to the previous branch</td></tr>\n<tr><td><code>git checkout &lt;sha&gt;</code> / <code>git switch --detach &lt;sha&gt;</code></td><td>detached HEAD: look at an old version. Commits made here belong to no branch</td></tr>\n</table></div>", "command + flag what it does git branch list local branches ( * = current) -a / -r / -v / -vv local + remote / remote only / with last commit / plus upstream and ahead/behind git branch name create a branch at head. you stay on the current branch git branch name <sha> create a branch at a specific commit git branch -d name delete if fully merged (safe); error “not fully merged” otherwise git branch -d name force delete. fails for the branch you are on, and for a name that doesn’t exist (“branch not found”) git branch -m new / -m old new / -m rename current / rename another / force rename git branch --merged / --no-merged branches already merged into head (safe to delete) / not merged git branch -u origin/dev set the upstream (tracking) branch git branch -f main <sha> move a branch pointer (not the current one) git switch name / git checkout name move head to the branch and update the index and working dir to its snapshot git switch -c name / git checkout -b name create and switch git switch -c name origin/name create a local branch tracking a remote one (just git switch name does it automatically if it exists on origin) git switch -c name / checkout -b create or reset a branch to here, then switch git switch - / git checkout - go back to the previous branch git checkout <sha> / git switch --detach <sha> detached head: look at an old version. commits made here belong to no branch"], ["<div class=\"key\">When switching, <b>uncommitted changes travel with you</b> if the files are identical in both branches. If the switch would overwrite your uncommitted changes, Git <b>refuses</b> (“Your local changes would be overwritten by checkout… Please commit or stash them”). <b>Untracked</b> files are left alone (unless the target branch tracks a file with the same name). Files tracked in the old branch but absent from the new one are removed from disk, and come back when you switch back.</div>", "when switching, uncommitted changes travel with you if the files are identical in both branches. if the switch would overwrite your uncommitted changes, git refuses (“your local changes would be overwritten by checkout… please commit or stash them”). untracked files are left alone (unless the target branch tracks a file with the same name). files tracked in the old branch but absent from the new one are removed from disk, and come back when you switch back."]]}, {"h": "Merge, rebase, cherry-pick: flags and pictures", "blocks": [["<pre><span class=\"c\">Before:       main:    A---B                 feature branched at B, main moved on? (two cases)</span>\n                              \\\n                   feature:    C---D\n\n<span class=\"c\">1) main did NOT move → git switch main; git merge feature = FAST-FORWARD (pointer moves, no new commit)</span>\n   main, feature:  A---B---C---D\n\n<span class=\"c\">2) main has E → git merge feature = THREE-WAY MERGE (new merge commit M with two parents)</span>\n   main:     A---B---E-------M\n                  \\         /\n   feature:        C-------D\n\n<span class=\"c\">3) git switch feature; git rebase main = REPLAY C and D on top of E as new commits C' D'</span>\n   main:     A---B---E\n                      \\\n   feature:            C'---D'        <span class=\"c\">(then merging into main is a fast-forward → linear history)</span>\n\n<span class=\"c\">4) git switch main; git merge --squash feature; git commit = one new commit S with all of C+D</span>\n   main:     A---B---E---S             <span class=\"c\">(feature's commits are not in main's history)</span></pre>", "before: main: a---b feature branched at b, main moved on? (two cases) \\ feature: c---d 1) main did not move → git switch main; git merge feature = fast-forward (pointer moves, no new commit) main, feature: a---b---c---d 2) main has e → git merge feature = three-way merge (new merge commit m with two parents) main: a---b---e-------m \\ / feature: c-------d 3) git switch feature; git rebase main = replay c and d on top of e as new commits c' d' main: a---b---e \\ feature: c'---d' (then merging into main is a fast-forward → linear history) 4) git switch main; git merge --squash feature; git commit = one new commit s with all of c+d main: a---b---e---s (feature's commits are not in main's history)"], ["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>What it does</th></tr>\n<tr><td><code>git merge feature</code></td><td>integrate feature into the <b>current</b> branch (fast-forward if possible, otherwise a merge commit)</td></tr>\n<tr><td><code>--no-ff</code></td><td>always create a merge commit (keeps the feature visible as a group)</td></tr>\n<tr><td><code>--ff-only</code></td><td>merge only if a fast-forward is possible, otherwise fail</td></tr>\n<tr><td><code>--squash</code></td><td>apply all of feature’s changes to the index as one change, no commit, no merge link; you then <code>git commit</code></td></tr>\n<tr><td><code>-m \"msg\"</code> / <code>--no-commit</code></td><td>merge commit message / stop before committing</td></tr>\n<tr><td><code>--abort</code> / <code>--continue</code></td><td>cancel a conflicted merge (back to before) / finish after resolving</td></tr>\n<tr><td><code>-X ours</code> / <code>-X theirs</code></td><td>on conflicting hunks, automatically prefer our / their side</td></tr>\n<tr><td><code>git rebase main</code></td><td>replay the current branch’s unique commits on top of main (new hashes)</td></tr>\n<tr><td><code>git rebase -i HEAD~3</code></td><td>interactive: edit the last 3 commits. In the editor, per line: <code>pick</code> keep · <code>reword</code> change message · <code>edit</code> stop to amend · <b><code>squash</code></b> meld into previous, combining messages · <code>fixup</code> meld, discarding this message · <code>drop</code> delete · reorder lines to reorder commits</td></tr>\n<tr><td><code>--continue</code> / <code>--skip</code> / <code>--abort</code></td><td>after fixing a conflict / skip this commit / return to the original state</td></tr>\n<tr><td><code>--autosquash</code></td><td>automatically place <code>fixup!</code> commits next to their target</td></tr>\n<tr><td><code>git rebase --onto main old-base feature</code></td><td>move a branch from one base to another</td></tr>\n<tr><td><code>git pull --rebase</code></td><td>fetch, then rebase your local commits on top (no merge bubbles)</td></tr>\n<tr><td><code>git cherry-pick &lt;sha&gt;</code></td><td>copy one commit’s changes onto the current branch as a new commit</td></tr>\n<tr><td><code>cherry-pick A..B</code> / <code>-x</code> / <code>-n</code> / <code>--continue</code> / <code>--abort</code></td><td>a range (excluding A) / append “cherry picked from” to the message / apply without committing / after a conflict / cancel</td></tr>\n</table></div>", "command + flag what it does git merge feature integrate feature into the current branch (fast-forward if possible, otherwise a merge commit) --no-ff always create a merge commit (keeps the feature visible as a group) --ff-only merge only if a fast-forward is possible, otherwise fail --squash apply all of feature’s changes to the index as one change, no commit, no merge link; you then git commit -m \"msg\" / --no-commit merge commit message / stop before committing --abort / --continue cancel a conflicted merge (back to before) / finish after resolving -x ours / -x theirs on conflicting hunks, automatically prefer our / their side git rebase main replay the current branch’s unique commits on top of main (new hashes) git rebase -i head~3 interactive: edit the last 3 commits. in the editor, per line: pick keep · reword change message · edit stop to amend · squash meld into previous, combining messages · fixup meld, discarding this message · drop delete · reorder lines to reorder commits --continue / --skip / --abort after fixing a conflict / skip this commit / return to the original state --autosquash automatically place fixup! commits next to their target git rebase --onto main old-base feature move a branch from one base to another git pull --rebase fetch, then rebase your local commits on top (no merge bubbles) git cherry-pick <sha> copy one commit’s changes onto the current branch as a new commit cherry-pick a..b / -x / -n / --continue / --abort a range (excluding a) / append “cherry picked from” to the message / apply without committing / after a conflict / cancel"], ["<div class=\"tw\"><table>\n<tr><th></th><th>merge</th><th>rebase</th><th>merge --squash</th></tr>\n<tr><td>History</td><td>true, non-linear, merge commits</td><td>linear, rewritten (new hashes)</td><td>one commit, the feature’s individual commits are lost from main</td></tr>\n<tr><td>Safe on shared/pushed branches?</td><td><b>yes</b></td><td><b>no</b> (rewrites published commits)</td><td>yes (on the target)</td></tr>\n<tr><td>Conflicts</td><td>resolved once</td><td>possibly once per replayed commit</td><td>once</td></tr>\n<tr><td>Use</td><td>integrating shared branches</td><td>updating your private feature branch, cleaning history before a PR</td><td>clean one-commit-per-feature main</td></tr>\n</table></div>", "merge rebase merge --squash history true, non-linear, merge commits linear, rewritten (new hashes) one commit, the feature’s individual commits are lost from main safe on shared/pushed branches? yes no (rewrites published commits) yes (on the target) conflicts resolved once possibly once per replayed commit once use integrating shared branches updating your private feature branch, cleaning history before a pr clean one-commit-per-feature main"], ["<h4>Conflicts in detail</h4>", "conflicts in detail"], ["<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD                  <span class=\"c\"># \"ours\"</span>\ntimeout = 30\n=======\ntimeout = 60\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature               <span class=\"c\"># \"theirs\"</span></pre>", "<<<<<<< head # \"ours\" timeout = 30 ======= timeout = 60 >>>>>>> feature # \"theirs\""], ["<ol><li><code>git status</code> lists conflicted files (<code>UU</code>).</li><li>Edit each file to the final content and delete the markers (or <code>git checkout --ours file</code> / <code>--theirs file</code> to take one side entirely).</li><li><code>git add file</code> marks it resolved.</li><li><code>git commit</code> (merge) or <code>git rebase --continue</code> / <code>git cherry-pick --continue</code>. To give up: <code>--abort</code>.</li></ol>", "git status lists conflicted files ( uu ). edit each file to the final content and delete the markers (or git checkout --ours file / --theirs file to take one side entirely). git add file marks it resolved. git commit (merge) or git rebase --continue / git cherry-pick --continue . to give up: --abort ."], ["<div class=\"trap\">During a <b>rebase</b>, “ours” and “theirs” are <b>swapped</b>: “ours” is the branch you’re rebasing <i>onto</i> (main) and “theirs” is your own commit being replayed. During a merge, “ours” = your current branch.</div>", "during a rebase , “ours” and “theirs” are swapped : “ours” is the branch you’re rebasing onto (main) and “theirs” is your own commit being replayed. during a merge, “ours” = your current branch."]]}, {"h": "Undoing: reset, revert, restore, stash, reflog", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command</th><th>Moves branch/HEAD</th><th>Index</th><th>Working dir</th><th>Typical use</th></tr>\n<tr><td><code>git reset --soft HEAD~1</code></td><td>back 1</td><td>unchanged: changes stay <b>staged</b></td><td>unchanged</td><td>redo the last commit (new message, squash)</td></tr>\n<tr><td><code>git reset HEAD~1</code> (<code>--mixed</code>)</td><td>back 1</td><td>reset: changes become <b>unstaged</b></td><td>unchanged</td><td>undo the commit and re-pick what to stage</td></tr>\n<tr><td><code>git reset --hard HEAD~1</code></td><td>back 1</td><td>reset</td><td><b>reset: changes destroyed</b></td><td>throw away the last commit completely</td></tr>\n<tr><td><code>git reset --hard</code></td><td>stays</td><td>reset</td><td>reset</td><td>discard all uncommitted changes to tracked files</td></tr>\n<tr><td><code>git reset --hard origin/main</code></td><td>to the remote</td><td>reset</td><td>reset</td><td>make local exactly match the remote</td></tr>\n<tr><td><code>git reset file</code></td><td>—</td><td>file unstaged</td><td>unchanged</td><td>old way to unstage (= <code>restore --staged</code>)</td></tr>\n<tr><td><code>git reset --keep HEAD~1</code></td><td>back 1</td><td>reset</td><td>keeps your uncommitted changes, aborts if they conflict</td><td>safer hard reset</td></tr>\n</table></div>", "command moves branch/head index working dir typical use git reset --soft head~1 back 1 unchanged: changes stay staged unchanged redo the last commit (new message, squash) git reset head~1 ( --mixed ) back 1 reset: changes become unstaged unchanged undo the commit and re-pick what to stage git reset --hard head~1 back 1 reset reset: changes destroyed throw away the last commit completely git reset --hard stays reset reset discard all uncommitted changes to tracked files git reset --hard origin/main to the remote reset reset make local exactly match the remote git reset file — file unstaged unchanged old way to unstage (= restore --staged ) git reset --keep head~1 back 1 reset keeps your uncommitted changes, aborts if they conflict safer hard reset"], ["<ul>\n<li><b><code>git revert &lt;sha&gt;</code></b> creates a <b>new</b> commit that applies the inverse of that commit. History is preserved, so it’s <b>safe on pushed/shared branches</b>. <code>-n</code> = don’t commit yet; <code>git revert HEAD~3..HEAD</code> = revert several; <b><code>git revert -m 1 &lt;merge-sha&gt;</code></b> = revert a merge commit, keeping parent 1 (the main line).</li>\n<li><b>reset</b> rewrites history (moves the branch pointer back): fine for local commits, dangerous for pushed ones. <b>revert</b> adds history.</li>\n<li><b><code>git stash</code></b> (= <code>stash push</code>) saves tracked modifications (staged + unstaged) and cleans the working dir.\n  <code>-u</code> also untracked files · <code>-a</code> also ignored · <code>-m \"msg\"</code> label · <code>-p</code> pick hunks · <code>git stash push file</code> only that file.\n  <code>list</code> (stash@{0} = newest) · <code>show -p stash@{1}</code> view · <code>apply</code> re-apply and <b>keep</b> in the list · <code>pop</code> re-apply and <b>remove</b> (kept if it conflicts) · <code>drop</code> delete one · <code>clear</code> delete all · <code>git stash branch newb</code> create a branch from a stash.</li>\n<li><b><code>git reflog</code></b>: <code>HEAD@{0}</code> now, <code>HEAD@{1}</code> before the last move… Recover anything committed: <code>git reset --hard HEAD@{1}</code> or <code>git branch rescue &lt;sha&gt;</code>. Uncommitted changes destroyed by <code>reset --hard</code> or <code>restore</code> are <b>not</b> recoverable.</li>\n</ul>", "git revert <sha> creates a new commit that applies the inverse of that commit. history is preserved, so it’s safe on pushed/shared branches . -n = don’t commit yet; git revert head~3..head = revert several; git revert -m 1 <merge-sha> = revert a merge commit, keeping parent 1 (the main line). reset rewrites history (moves the branch pointer back): fine for local commits, dangerous for pushed ones. revert adds history. git stash (= stash push ) saves tracked modifications (staged + unstaged) and cleans the working dir. -u also untracked files · -a also ignored · -m \"msg\" label · -p pick hunks · git stash push file only that file. list (stash@{0} = newest) · show -p stash@{1} view · apply re-apply and keep in the list · pop re-apply and remove (kept if it conflicts) · drop delete one · clear delete all · git stash branch newb create a branch from a stash. git reflog : head@{0} now, head@{1} before the last move… recover anything committed: git reset --hard head@{1} or git branch rescue <sha> . uncommitted changes destroyed by reset --hard or restore are not recoverable."]]}, {"h": "Remotes, fetch, pull, push, tags: every flag", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Command + flag</th><th>What it does</th></tr>\n<tr><td><code>git remote -v</code></td><td>list remotes with fetch/push URLs</td></tr>\n<tr><td><code>git remote add origin url</code> / <code>remove</code> / <code>rename</code> / <code>set-url origin newurl</code></td><td>manage remotes</td></tr>\n<tr><td><code>git remote show origin</code></td><td>remote branches, tracking setup, stale branches</td></tr>\n<tr><td><code>git fetch</code> / <code>origin</code> / <code>--all</code></td><td>download new commits and update <code>origin/*</code>. <b>Never changes your branches or files</b></td></tr>\n<tr><td><code>git fetch --prune</code></td><td>also delete <code>origin/x</code> refs for branches deleted on the server</td></tr>\n<tr><td><code>git pull</code></td><td><code>fetch</code> + <code>merge</code> of the upstream into the current branch</td></tr>\n<tr><td><code>git pull --rebase</code> / <code>--ff-only</code></td><td>fetch + rebase your local commits on top / only if a fast-forward is possible</td></tr>\n<tr><td><code>git push</code></td><td>upload the current branch to its upstream</td></tr>\n<tr><td><code>git push -u origin feature</code></td><td>push and set the upstream, so later plain <code>git push</code>/<code>pull</code> work</td></tr>\n<tr><td><code>git push origin local:remote</code></td><td>push a local branch to a differently named remote branch</td></tr>\n<tr><td><code>git push origin --delete feature</code> (= <code>origin :feature</code>)</td><td>delete a remote branch</td></tr>\n<tr><td><code>git push --force</code> / <code>-f</code></td><td>overwrite the remote branch even if it has commits you don’t have (destroys others’ work)</td></tr>\n<tr><td><code>git push --force-with-lease</code></td><td>force only if the remote is still where you last saw it; refuses if someone pushed in the meantime</td></tr>\n<tr><td><code>git push --tags</code> / <code>origin v1.2</code></td><td>push all tags / one tag (tags are not pushed by default)</td></tr>\n<tr><td><code>git tag</code> / <code>-l \"v1.*\"</code></td><td>list tags</td></tr>\n<tr><td><code>git tag v1.0</code></td><td>lightweight tag (just a pointer)</td></tr>\n<tr><td><code>git tag -a v1.0 -m \"Release 1.0\"</code></td><td>annotated tag (its own object: tagger, date, message). Use for releases</td></tr>\n<tr><td><code>git tag -d v1.0</code> · <code>git push origin --delete v1.0</code></td><td>delete locally · remotely</td></tr>\n<tr><td><code>git describe --tags</code></td><td>nearest tag + commits since (<code>v1.0-5-g3a1b2c</code>)</td></tr>\n</table></div>", "command + flag what it does git remote -v list remotes with fetch/push urls git remote add origin url / remove / rename / set-url origin newurl manage remotes git remote show origin remote branches, tracking setup, stale branches git fetch / origin / --all download new commits and update origin/* . never changes your branches or files git fetch --prune also delete origin/x refs for branches deleted on the server git pull fetch + merge of the upstream into the current branch git pull --rebase / --ff-only fetch + rebase your local commits on top / only if a fast-forward is possible git push upload the current branch to its upstream git push -u origin feature push and set the upstream, so later plain git push / pull work git push origin local:remote push a local branch to a differently named remote branch git push origin --delete feature (= origin :feature ) delete a remote branch git push --force / -f overwrite the remote branch even if it has commits you don’t have (destroys others’ work) git push --force-with-lease force only if the remote is still where you last saw it; refuses if someone pushed in the meantime git push --tags / origin v1.2 push all tags / one tag (tags are not pushed by default) git tag / -l \"v1.*\" list tags git tag v1.0 lightweight tag (just a pointer) git tag -a v1.0 -m \"release 1.0\" annotated tag (its own object: tagger, date, message). use for releases git tag -d v1.0 · git push origin --delete v1.0 delete locally · remotely git describe --tags nearest tag + commits since ( v1.0-5-g3a1b2c )"], ["<p><b>“Rejected: non-fast-forward / fetch first”</b> means the remote has commits you don’t. Fix: <code>git pull --rebase</code> (or pull), resolve conflicts, then push. Don’t force-push a shared branch.</p>", "“rejected: non-fast-forward / fetch first” means the remote has commits you don’t. fix: git pull --rebase (or pull), resolve conflicts, then push. don’t force-push a shared branch."]]}, {"h": "Revision syntax", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Syntax</th><th>Meaning</th></tr>\n<tr><td><code>HEAD</code></td><td>the current commit</td></tr>\n<tr><td><code>HEAD~1</code> / <code>HEAD~</code> / <code>HEAD~3</code></td><td>1st parent / same / 3 generations back along first parents</td></tr>\n<tr><td><code>HEAD^</code> / <code>HEAD^2</code></td><td>first parent / <b>second</b> parent (only for merge commits: the branch that was merged in)</td></tr>\n<tr><td><code>main~2</code>, <code>v1.0^</code>, <code>a1b2c3d</code></td><td>works on any branch, tag or (abbreviated, ≥ 4 chars) hash</td></tr>\n<tr><td><code>HEAD@{1}</code> / <code>main@{yesterday}</code></td><td>reflog: where HEAD was 1 move ago / where main was yesterday</td></tr>\n<tr><td><code>@{u}</code> / <code>@{upstream}</code></td><td>the upstream of the current branch (<code>git log @{u}..</code> = unpushed commits)</td></tr>\n<tr><td><code>A..B</code></td><td>commits reachable from B but not from A</td></tr>\n<tr><td><code>A...B</code></td><td>log: commits in either but not both · diff: changes on B since the common ancestor</td></tr>\n<tr><td><code>sha:path</code></td><td>a file at a commit: <code>git show HEAD~2:pom.xml</code></td></tr>\n</table></div>", "syntax meaning head the current commit head~1 / head~ / head~3 1st parent / same / 3 generations back along first parents head^ / head^2 first parent / second parent (only for merge commits: the branch that was merged in) main~2 , v1.0^ , a1b2c3d works on any branch, tag or (abbreviated, ≥ 4 chars) hash head@{1} / main@{yesterday} reflog: where head was 1 move ago / where main was yesterday @{u} / @{upstream} the upstream of the current branch ( git log @{u}.. = unpushed commits) a..b commits reachable from b but not from a a...b log: commits in either but not both · diff: changes on b since the common ancestor sha:path a file at a commit: git show head~2:pom.xml"]]}, {"h": "23 real scenarios: situation → exact fix", "blocks": [["<div class=\"tw\"><table>\n<tr><th>#</th><th>Situation</th><th>Fix</th></tr>\n<tr><td>1</td><td>Typo in the last commit message (not pushed)</td><td><code>git commit --amend -m \"correct message\"</code></td></tr>\n<tr><td>2</td><td>Forgot to include a file in the last commit</td><td><code>git add forgotten.java</code> → <code>git commit --amend --no-edit</code></td></tr>\n<tr><td>3</td><td>Undo the last commit but keep the changes staged</td><td><code>git reset --soft HEAD~1</code></td></tr>\n<tr><td>4</td><td>Undo the last commit, keep the changes unstaged</td><td><code>git reset HEAD~1</code></td></tr>\n<tr><td>5</td><td>Throw away the last commit and its changes entirely</td><td><code>git reset --hard HEAD~1</code></td></tr>\n<tr><td>6</td><td>Discard all uncommitted changes (and new files)</td><td><code>git restore .</code> (or <code>git reset --hard</code>) + <code>git clean -fd</code> (preview with <code>-n</code> first)</td></tr>\n<tr><td>7</td><td>Discard changes in one file</td><td><code>git restore file</code></td></tr>\n<tr><td>8</td><td>Staged a file by mistake</td><td><code>git restore --staged file</code></td></tr>\n<tr><td>9</td><td>A bad commit is already pushed to a shared branch</td><td><code>git revert &lt;sha&gt;</code> → <code>git push</code> (no history rewrite)</td></tr>\n<tr><td>10</td><td>Did <code>reset --hard</code> and lost commits</td><td><code>git reflog</code> → find the hash → <code>git reset --hard HEAD@{n}</code> or <code>git branch rescue &lt;sha&gt;</code></td></tr>\n<tr><td>11</td><td>Committed to main instead of a feature branch (not pushed)</td><td><code>git branch feature</code> (keeps the commit there) → <code>git reset --hard HEAD~1</code> (main back) → <code>git switch feature</code></td></tr>\n<tr><td>12</td><td>Need to switch branches but have half-done work</td><td><code>git stash -u</code> → <code>git switch other</code> … → <code>git switch -</code> → <code>git stash pop</code> (or commit “WIP” and amend later)</td></tr>\n<tr><td>13</td><td>Committed a secret (<code>.env</code>)</td><td><code>git rm --cached .env</code>, add <code>.env</code> to .gitignore, commit. It is <b>still in history</b>: rotate the secret; purge with <code>git filter-repo</code>/BFG + force push if needed</td></tr>\n<tr><td>14</td><td>.gitignore doesn’t ignore a file</td><td>It was already tracked: <code>git rm --cached file</code> + commit</td></tr>\n<tr><td>15</td><td>Squash my last 3 commits before a PR</td><td><code>git rebase -i HEAD~3</code> (mark 2nd and 3rd as <code>squash</code>/<code>fixup</code>) or <code>git reset --soft HEAD~3 &amp;&amp; git commit -m \"feature X\"</code></td></tr>\n<tr><td>16</td><td>Push rejected (remote has new commits)</td><td><code>git pull --rebase</code> → resolve conflicts → <code>git push</code></td></tr>\n<tr><td>17</td><td>Need one hotfix commit from main in the release branch</td><td><code>git switch release-2.1</code> → <code>git cherry-pick -x &lt;sha&gt;</code></td></tr>\n<tr><td>18</td><td>Update my feature branch with the latest main</td><td>Private branch: <code>git fetch</code> → <code>git rebase origin/main</code>. Shared branch: <code>git merge origin/main</code></td></tr>\n<tr><td>19</td><td>Merge conflict, I want to stop</td><td><code>git merge --abort</code> (or <code>rebase --abort</code>)</td></tr>\n<tr><td>20</td><td>Made commits in detached HEAD</td><td><code>git switch -c save-work</code> before leaving (or find them later with reflog)</td></tr>\n<tr><td>21</td><td>Find which commit introduced a bug</td><td><code>git bisect start</code> → <code>git bisect bad</code> → <code>git bisect good v1.0</code> → test each checkout and answer good/bad (or <code>git bisect run ./test.sh</code>) → <code>git bisect reset</code>. A binary search over commits</td></tr>\n<tr><td>22</td><td>Delete a branch locally and remotely; rename a branch</td><td><code>git branch -d f</code> + <code>git push origin --delete f</code> · rename: <code>git branch -m old new</code> → <code>git push origin -u new</code> → <code>git push origin --delete old</code></td></tr>\n<tr><td>23</td><td>Revert a merge commit that broke main</td><td><code>git revert -m 1 &lt;merge-sha&gt;</code> (keep parent 1 = main’s side)</td></tr>\n</table></div>", "# situation fix 1 typo in the last commit message (not pushed) git commit --amend -m \"correct message\" 2 forgot to include a file in the last commit git add forgotten.java → git commit --amend --no-edit 3 undo the last commit but keep the changes staged git reset --soft head~1 4 undo the last commit, keep the changes unstaged git reset head~1 5 throw away the last commit and its changes entirely git reset --hard head~1 6 discard all uncommitted changes (and new files) git restore . (or git reset --hard ) + git clean -fd (preview with -n first) 7 discard changes in one file git restore file 8 staged a file by mistake git restore --staged file 9 a bad commit is already pushed to a shared branch git revert <sha> → git push (no history rewrite) 10 did reset --hard and lost commits git reflog → find the hash → git reset --hard head@{n} or git branch rescue <sha> 11 committed to main instead of a feature branch (not pushed) git branch feature (keeps the commit there) → git reset --hard head~1 (main back) → git switch feature 12 need to switch branches but have half-done work git stash -u → git switch other … → git switch - → git stash pop (or commit “wip” and amend later) 13 committed a secret ( .env ) git rm --cached .env , add .env to .gitignore, commit. it is still in history : rotate the secret; purge with git filter-repo /bfg + force push if needed 14 .gitignore doesn’t ignore a file it was already tracked: git rm --cached file + commit 15 squash my last 3 commits before a pr git rebase -i head~3 (mark 2nd and 3rd as squash / fixup ) or git reset --soft head~3 && git commit -m \"feature x\" 16 push rejected (remote has new commits) git pull --rebase → resolve conflicts → git push 17 need one hotfix commit from main in the release branch git switch release-2.1 → git cherry-pick -x <sha> 18 update my feature branch with the latest main private branch: git fetch → git rebase origin/main . shared branch: git merge origin/main 19 merge conflict, i want to stop git merge --abort (or rebase --abort ) 20 made commits in detached head git switch -c save-work before leaving (or find them later with reflog) 21 find which commit introduced a bug git bisect start → git bisect bad → git bisect good v1.0 → test each checkout and answer good/bad (or git bisect run ./test.sh ) → git bisect reset . a binary search over commits 22 delete a branch locally and remotely; rename a branch git branch -d f + git push origin --delete f · rename: git branch -m old new → git push origin -u new → git push origin --delete old 23 revert a merge commit that broke main git revert -m 1 <merge-sha> (keep parent 1 = main’s side)"]]}, {"h": "Trace drills (exam style), with answers", "blocks": [["<p>Method: keep a small table of <b>branch → commit → file content</b>, plus <b>index</b> and <b>working dir</b>. Update it after each command. Ask: is the file tracked? staged? committed? on which branch?</p>", "method: keep a small table of branch → commit → file content , plus index and working dir . update it after each command. ask: is the file tracked? staged? committed? on which branch?"], ["<h4>Drill 1: branch without switching</h4>", "drill 1: branch without switching"], ["<pre>git init; echo A &gt; f; git add f; git commit -m c1     <span class=\"c\"># master: c1 (f=A)</span>\ngit branch dev                                         <span class=\"c\"># dev → c1, still on master</span>\necho B &gt;&gt; f; git commit -am c2                         <span class=\"c\"># master: c2 (f=A,B); dev still c1</span>\ngit switch dev; cat f</pre>", "git init; echo a > f; git add f; git commit -m c1 # master: c1 (f=a) git branch dev # dev → c1, still on master echo b >> f; git commit -am c2 # master: c2 (f=a,b); dev still c1 git switch dev; cat f"], ["<p><b>Answer</b>: <code>A</code>. dev was created at c1, and c2 was committed on master.</p>", "answer : a . dev was created at c1, and c2 was committed on master."], ["<h4>Drill 2: <code>commit -a</code> and new files</h4>", "drill 2: commit -a and new files"], ["<pre>echo x &gt; new.txt            <span class=\"c\"># untracked</span>\necho y &gt;&gt; f                 <span class=\"c\"># tracked, modified</span>\ngit commit -am \"update\"</pre>", "echo x > new.txt # untracked echo y >> f # tracked, modified git commit -am \"update\""], ["<p><b>Answer</b>: only <code>f</code> is committed; <code>new.txt</code> stays untracked (<code>??</code>). <code>-a</code> stages tracked files only. If <code>new.txt</code> were the <i>only</i> change: “nothing added to commit but untracked files present”.</p>", "answer : only f is committed; new.txt stays untracked ( ?? ). -a stages tracked files only. if new.txt were the only change: “nothing added to commit but untracked files present”."], ["<h4>Drill 3: uncommitted changes travel across branches</h4>", "drill 3: uncommitted changes travel across branches"], ["<pre><span class=\"c\"># master and dev both at c1 (f=A), working dir clean</span>\necho B &gt;&gt; f                 <span class=\"c\"># modify, don't commit</span>\ngit switch dev; cat f</pre>", "# master and dev both at c1 (f=a), working dir clean echo b >> f # modify, don't commit git switch dev; cat f"], ["<p><b>Answer</b>: <code>A B</code>. f is identical in both branch snapshots, so Git keeps your modification in the working dir. If f differed between master and dev, the switch would be <b>refused</b> (“local changes would be overwritten”).</p>", "answer : a b . f is identical in both branch snapshots, so git keeps your modification in the working dir. if f differed between master and dev, the switch would be refused (“local changes would be overwritten”)."], ["<h4>Drill 4: a file committed only on one branch</h4>", "drill 4: a file committed only on one branch"], ["<pre>git switch -c feat\necho hi &gt; feat.txt; git add feat.txt; git commit -m feat\ngit switch master; ls</pre>", "git switch -c feat echo hi > feat.txt; git add feat.txt; git commit -m feat git switch master; ls"], ["<p><b>Answer</b>: <code>feat.txt</code> is <b>gone</b> from the working dir (master’s snapshot doesn’t have it). Switching back to feat brings it back.</p>", "answer : feat.txt is gone from the working dir (master’s snapshot doesn’t have it). switching back to feat brings it back."], ["<h4>Drill 5: the three resets</h4>", "drill 5: the three resets"], ["<pre><span class=\"c\"># commits: c1 (f=1) → c2 (f=2) → c3 (f=3), HEAD at c3, clean</span>\ngit reset --soft  HEAD~2   <span class=\"c\"># HEAD=c1 · index f=3 · working f=3 · status: f staged (modified)</span>\ngit reset --mixed HEAD~2   <span class=\"c\"># HEAD=c1 · index f=1 · working f=3 · status: f modified, not staged</span>\ngit reset --hard  HEAD~2   <span class=\"c\"># HEAD=c1 · index f=1 · working f=1 · status: clean; c2, c3 only in reflog</span></pre>", "# commits: c1 (f=1) → c2 (f=2) → c3 (f=3), head at c3, clean git reset --soft head~2 # head=c1 · index f=3 · working f=3 · status: f staged (modified) git reset --mixed head~2 # head=c1 · index f=1 · working f=3 · status: f modified, not staged git reset --hard head~2 # head=c1 · index f=1 · working f=1 · status: clean; c2, c3 only in reflog"], ["<h4>Drill 6: revert vs reset</h4>", "drill 6: revert vs reset"], ["<pre><span class=\"c\"># c1 (f=1) → c2 (f=2)</span>\ngit revert HEAD</pre>", "# c1 (f=1) → c2 (f=2) git revert head"], ["<p><b>Answer</b>: a new commit c3 is created with f=1. <code>git log --oneline</code> shows 3 commits (c3 “Revert …”, c2, c1). With <code>reset --hard HEAD~1</code> instead, the log would show only c1.</p>", "answer : a new commit c3 is created with f=1. git log --oneline shows 3 commits (c3 “revert …”, c2, c1). with reset --hard head~1 instead, the log would show only c1."], ["<h4>Drill 7: fast-forward or not?</h4>", "drill 7: fast-forward or not?"], ["<pre><span class=\"c\"># main at c1; feature has c2, c3 on top of c1</span>\ngit switch main; git merge feature        <span class=\"c\"># → \"Fast-forward\": main = c3, no merge commit</span>\n<span class=\"c\"># if main had its own commit c4 first → merge commit M(c4, c3); log --graph shows a diamond</span></pre>", "# main at c1; feature has c2, c3 on top of c1 git switch main; git merge feature # → \"fast-forward\": main = c3, no merge commit # if main had its own commit c4 first → merge commit m(c4, c3); log --graph shows a diamond"], ["<h4>Drill 8: stash round-trip</h4>", "drill 8: stash round-trip"], ["<pre>echo change &gt;&gt; f; git stash; cat f       <span class=\"c\"># original content (working dir clean)</span>\ngit stash list                            <span class=\"c\"># stash@{0}: WIP on main: …</span>\ngit stash pop; cat f                      <span class=\"c\"># \"change\" is back; stash list empty</span></pre>", "echo change >> f; git stash; cat f # original content (working dir clean) git stash list # stash@{0}: wip on main: … git stash pop; cat f # \"change\" is back; stash list empty"], ["<h4>Drill 9: delete an unmerged branch</h4>", "drill 9: delete an unmerged branch"], ["<pre>git switch -c exp; echo t &gt; t; git add t; git commit -m t\ngit switch main\ngit branch -d exp      <span class=\"c\"># error: The branch 'exp' is not fully merged</span>\ngit branch -D exp      <span class=\"c\"># deleted (commit only reachable via reflog now)</span>\ngit branch -D main     <span class=\"c\"># error if you're on main: cannot delete the branch you are on</span></pre>", "git switch -c exp; echo t > t; git add t; git commit -m t git switch main git branch -d exp # error: the branch 'exp' is not fully merged git branch -d exp # deleted (commit only reachable via reflog now) git branch -d main # error if you're on main: cannot delete the branch you are on"], ["<h4>Drill 10: the 2026 paper’s trap</h4>", "drill 10: the 2026 paper’s trap"], ["<pre>mkdir murex_test\ngit init murex_test               <span class=\"c\"># repo created INSIDE murex_test, you're still outside it</span>\ngit checkout -b murex             <span class=\"c\"># as written → \"not a git repository\" (assume cd murex_test for the rest)</span>\necho \"MUREX ROCKS\" &gt; mymurexfile   <span class=\"c\"># untracked</span>\ntouch mymurexfile                 <span class=\"c\"># only updates the timestamp</span>\ngit commit -am \"...\"              <span class=\"c\"># nothing committed: the file is untracked; no commits exist yet</span>\ngit add mymurexfile               <span class=\"c\"># staged (line 1)</span>\necho \"MUREX ALWAYS ROCKS\" &gt;&gt; mymurexfile   <span class=\"c\"># working dir has 2 lines, index has 1</span>\ngit branch                        <span class=\"c\"># prints nothing (unborn branch)</span>\ngit diff murex master             <span class=\"c\"># error: unknown revision</span>\ngit push origin master            <span class=\"c\"># error: no remote / src refspec master does not match any</span>\ngit branch -D murex               <span class=\"c\"># error: branch 'murex' not found</span></pre>", "mkdir murex_test git init murex_test # repo created inside murex_test, you're still outside it git checkout -b murex # as written → \"not a git repository\" (assume cd murex_test for the rest) echo \"murex rocks\" > mymurexfile # untracked touch mymurexfile # only updates the timestamp git commit -am \"...\" # nothing committed: the file is untracked; no commits exist yet git add mymurexfile # staged (line 1) echo \"murex always rocks\" >> mymurexfile # working dir has 2 lines, index has 1 git branch # prints nothing (unborn branch) git diff murex master # error: unknown revision git push origin master # error: no remote / src refspec master does not match any git branch -d murex # error: branch 'murex' not found"], ["<p><b>Answer</b>: the file is in <b>neither</b> branch (no commit was ever made). It exists only in the working dir; only the first line is staged.</p>", "answer : the file is in neither branch (no commit was ever made). it exists only in the working dir; only the first line is staged."]]}, {"h": "Tricks & good practice", "blocks": [["<ul>\n<li><code>git log --oneline --graph --all --decorate</code>: alias it (<code>git config --global alias.lg \"log --oneline --graph --all --decorate\"</code>).</li>\n<li>Always run <code>git diff --staged</code> before committing, and <code>git status</code> before and after anything risky.</li>\n<li><code>git add -p</code> to make small, focused commits; <code>git commit --fixup=&lt;sha&gt;</code> + <code>git rebase -i --autosquash</code> to fix older commits cleanly.</li>\n<li><code>git switch -</code> toggles between the last two branches.</li>\n<li><code>git stash -u</code> when untracked files must be saved too; name your stashes with <code>-m</code>.</li>\n<li><code>git push --force-with-lease</code>, never plain <code>--force</code>, and never on main/shared branches.</li>\n<li><code>git pull --rebase</code> (or <code>pull.rebase=true</code>) avoids pointless merge commits.</li>\n<li><code>git restore --source=&lt;sha&gt; file</code> recovers an old version of one file without moving branches.</li>\n<li><code>git reflog</code> before panicking: committed work is almost never truly lost.</li>\n<li><code>git clean -n</code> before <code>-f</code>; <code>git reset --hard</code> and <code>git restore</code> destroy uncommitted work for good.</li>\n<li>Good commit messages: imperative subject ≤ 50 chars (“Fix NPE in trade pricing”), a blank line, then why. Reference the ticket (JIRA-123).</li>\n<li><b>Workflows</b>: feature branches + pull requests with code review and CI checks · <b>GitFlow</b> (main = production, develop = integration, feature/*, release/*, hotfix/* merged into both main and develop) · <b>trunk-based</b> (short-lived branches, feature flags).</li>\n<li><code>git worktree add ../hotfix release-2.1</code>: a second working directory on another branch, without stashing.</li>\n<li><code>git rerere</code> (<code>rerere.enabled=true</code>) remembers how you resolved a conflict and reapplies it.</li>\n<li>Submodules (<code>git submodule update --init --recursive</code>) embed another repo at a fixed commit.</li>\n</ul>", "git log --oneline --graph --all --decorate : alias it ( git config --global alias.lg \"log --oneline --graph --all --decorate\" ). always run git diff --staged before committing, and git status before and after anything risky. git add -p to make small, focused commits; git commit --fixup=<sha> + git rebase -i --autosquash to fix older commits cleanly. git switch - toggles between the last two branches. git stash -u when untracked files must be saved too; name your stashes with -m . git push --force-with-lease , never plain --force , and never on main/shared branches. git pull --rebase (or pull.rebase=true ) avoids pointless merge commits. git restore --source=<sha> file recovers an old version of one file without moving branches. git reflog before panicking: committed work is almost never truly lost. git clean -n before -f ; git reset --hard and git restore destroy uncommitted work for good. good commit messages: imperative subject ≤ 50 chars (“fix npe in trade pricing”), a blank line, then why. reference the ticket (jira-123). workflows : feature branches + pull requests with code review and ci checks · gitflow (main = production, develop = integration, feature/*, release/*, hotfix/* merged into both main and develop) · trunk-based (short-lived branches, feature flags). git worktree add ../hotfix release-2.1 : a second working directory on another branch, without stashing. git rerere ( rerere.enabled=true ) remembers how you resolved a conflict and reapplies it. submodules ( git submodule update --init --recursive ) embed another repo at a fixed commit."]]}]}, {"title": "Networking", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">IP addressing and subnet math, the layers, protocols and ports, HTTP status codes, and how to read connection errors.</p>", "ip addressing and subnet math, the layers, protocols and ports, http status codes, and how to read connection errors."]]}, {"h": "OSI and TCP/IP models", "blocks": [["<div class=\"tw\"><table>\n<tr><th>#</th><th>OSI layer</th><th>Unit</th><th>Examples</th><th>TCP/IP layer</th></tr>\n<tr><td>7</td><td>Application</td><td rowspan=\"3\">Data</td><td>HTTP, HTTPS, FTP, SMTP, DNS, SSH</td><td rowspan=\"3\">Application</td></tr>\n<tr><td>6</td><td>Presentation</td><td>encoding, encryption (TLS), compression, JSON/XML</td></tr>\n<tr><td>5</td><td>Session</td><td>sessions, RPC</td></tr>\n<tr><td>4</td><td>Transport</td><td>Segment</td><td>TCP, UDP, ports</td><td>Transport</td></tr>\n<tr><td>3</td><td>Network</td><td>Packet</td><td>IP, ICMP (ping), routers</td><td>Internet</td></tr>\n<tr><td>2</td><td>Data link</td><td>Frame</td><td>Ethernet, MAC addresses, switches, ARP</td><td rowspan=\"2\">Network access</td></tr>\n<tr><td>1</td><td>Physical</td><td>Bits</td><td>cables, Wi-Fi radio, hubs</td></tr>\n</table></div>", "# osi layer unit examples tcp/ip layer 7 application data http, https, ftp, smtp, dns, ssh application 6 presentation encoding, encryption (tls), compression, json/xml 5 session sessions, rpc 4 transport segment tcp, udp, ports transport 3 network packet ip, icmp (ping), routers internet 2 data link frame ethernet, mac addresses, switches, arp network access 1 physical bits cables, wi-fi radio, hubs"], ["<p>Mnemonic (7→1): <i>All People Seem To Need Data Processing</i>. Devices: <b>hub</b> (L1, repeats to all) · <b>switch</b> (L2, forwards by MAC within a LAN) · <b>router</b> (L3, forwards by IP between networks) · <b>load balancer</b> (L4 or L7).</p>", "mnemonic (7→1): all people seem to need data processing . devices: hub (l1, repeats to all) · switch (l2, forwards by mac within a lan) · router (l3, forwards by ip between networks) · load balancer (l4 or l7)."]]}, {"h": "IPv4 addressing", "blocks": [["<ul>\n<li>IPv4 = 32 bits, written as 4 octets (0–255): <code>192.168.1.10</code>. IPv6 = 128 bits, hex: <code>2001
