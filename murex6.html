\"failed\", e); } finally { close(); // always runs (even after return), except system.exit() } try (bufferedreader r = new bufferedreader(new filereader(\"f\"))) { } // try-with-resources closes automatically"], ["<div class=\"trap\">If both <code>try</code> and <code>finally</code> contain <code>return</code>, the <b>finally’s return wins</b>. <code>throw</code> creates an exception; <code>throws</code> declares one in a method signature.</div>", "if both try and finally contain return , the finally’s return wins . throw creates an exception; throws declares one in a method signature."]]}, {"h": "Reading a Java stack trace", "blocks": [["<pre>Exception in thread \"main\" java.lang.NullPointerException     <span class=\"c\">← type + message</span>\n    at com.murex.trade.Trade.getNotional(Trade.java:42)        <span class=\"c\">← TOP frame = where it was thrown</span>\n    at com.murex.report.Report.total(Report.java:17)           <span class=\"c\">← caller</span>\n    at com.murex.Main.main(Main.java:8)                        <span class=\"c\">← entry point</span>\nCaused by: ...                                                  <span class=\"c\">← root cause (read the LAST \"Caused by\")</span></pre>", "exception in thread \"main\" java.lang.nullpointerexception ← type + message at com.murex.trade.trade.getnotional(trade.java:42) ← top frame = where it was thrown at com.murex.report.report.total(report.java:17) ← caller at com.murex.main.main(main.java:8) ← entry point caused by: ... ← root cause (read the last \"caused by\")"], ["<ul>\n<li>Read top-down for <i>where</i>; the first frame in <b>your</b> package is usually the bug; frames in <code>java.*</code>/<code>sun.*</code> are the library doing what you asked.</li>\n<li>“Native Method” frames = JVM calling OS code (e.g. socket connect).</li>\n<li>For hangs, not crashes: <b>thread dump</b> (<code>jstack PID</code> or <code>kill -3 PID</code>) → look for threads BLOCKED/WAITING, deadlocks are reported automatically.</li>\n</ul>", "read top-down for where ; the first frame in your package is usually the bug; frames in java.* / sun.* are the library doing what you asked. “native method” frames = jvm calling os code (e.g. socket connect). for hangs, not crashes: thread dump ( jstack pid or kill -3 pid ) → look for threads blocked/waiting, deadlocks are reported automatically."]]}, {"h": "Collections & concurrency essentials", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Type</th><th>Characteristics</th></tr>\n<tr><td><code>ArrayList</code></td><td>dynamic array: O(1) index access, O(n) insert in middle</td></tr>\n<tr><td><code>LinkedList</code></td><td>doubly linked: O(1) add/remove at ends, O(n) index</td></tr>\n<tr><td><code>HashSet</code> / <code>TreeSet</code> / <code>LinkedHashSet</code></td><td>no duplicates · unordered O(1) / sorted O(log n) / insertion order</td></tr>\n<tr><td><code>HashMap</code> / <code>TreeMap</code> / <code>LinkedHashMap</code></td><td>key→value · unordered, one null key / sorted keys / insertion order</td></tr>\n<tr><td><code>Hashtable</code>, <code>Vector</code></td><td>legacy synchronized; use <code>ConcurrentHashMap</code></td></tr>\n<tr><td><code>Queue</code>/<code>Deque</code>/<code>PriorityQueue</code>/<code>Stack</code></td><td>FIFO / both ends / heap ordered / LIFO</td></tr>\n</table></div>", "type characteristics arraylist dynamic array: o(1) index access, o(n) insert in middle linkedlist doubly linked: o(1) add/remove at ends, o(n) index hashset / treeset / linkedhashset no duplicates · unordered o(1) / sorted o(log n) / insertion order hashmap / treemap / linkedhashmap key→value · unordered, one null key / sorted keys / insertion order hashtable , vector legacy synchronized; use concurrenthashmap queue / deque / priorityqueue / stack fifo / both ends / heap ordered / lifo"], ["<p><b>Threads</b>: <code>extends Thread</code> or <code>implements Runnable</code>, start with <code>start()</code> (calling <code>run()</code> directly runs in the same thread). <b>Race condition</b> = shared data modified concurrently → use <code>synchronized</code>, locks, <code>AtomicInteger</code>. <b>Deadlock</b> = threads wait on each other’s locks forever (4 conditions: mutual exclusion, hold and wait, no preemption, circular wait). <code>volatile</code> = visibility across threads. ExecutorService = thread pools.</p>", "threads : extends thread or implements runnable , start with start() (calling run() directly runs in the same thread). race condition = shared data modified concurrently → use synchronized , locks, atomicinteger . deadlock = threads wait on each other’s locks forever (4 conditions: mutual exclusion, hold and wait, no preemption, circular wait). volatile = visibility across threads. executorservice = thread pools."]]}]}, {"title": "C — compilation & crash analysis", "chunks": [{"h": "From source to executable", "blocks": [["<pre>prog.c ──preprocessor──▶ prog.i ──compiler──▶ prog.s ──assembler──▶ prog.o ──linker──▶ prog (executable)\n          (#include,        (C → assembly)     (machine code,       (+ libraries: libc.so,\n           #define, macros)                     object file)          resolves symbols)</pre>", "prog.c ──preprocessor──▶ prog.i ──compiler──▶ prog.s ──assembler──▶ prog.o ──linker──▶ prog (executable) (#include, (c → assembly) (machine code, (+ libraries: libc.so, #define, macros) object file) resolves symbols)"], ["<pre>gcc prog.c -o prog          <span class=\"c\"># full build</span>\ngcc -c prog.c               <span class=\"c\"># compile only → prog.o</span>\ngcc -Wall -Wextra -g -O2    <span class=\"c\"># warnings, debug symbols, optimisation</span>\ngcc a.o b.o -lm -o app      <span class=\"c\"># link, with math library</span>\nldd ./app                   <span class=\"c\"># which shared libraries (.so) it needs</span></pre>", "gcc prog.c -o prog # full build gcc -c prog.c # compile only → prog.o gcc -wall -wextra -g -o2 # warnings, debug symbols, optimisation gcc a.o b.o -lm -o app # link, with math library ldd ./app # which shared libraries (.so) it needs"], ["<div class=\"key\"><b>Output of a C compiler</b>: native <b>machine code</b> — object files (<code>.o</code>) and, after linking, an executable (ELF on Linux, PE <code>.exe</code> on Windows, Mach-O on macOS). It is <b>not portable</b>: tied to the CPU architecture (x86-64 vs ARM instruction set), the OS (executable format, system calls, ABI) and library versions. Portability is at the <b>source</b> level: recompile (or cross-compile) for each target. Java bytecode, by contrast, runs on any JVM.</div>", "output of a c compiler : native machine code — object files ( .o ) and, after linking, an executable (elf on linux, pe .exe on windows, mach-o on macos). it is not portable : tied to the cpu architecture (x86-64 vs arm instruction set), the os (executable format, system calls, abi) and library versions. portability is at the source level: recompile (or cross-compile) for each target. java bytecode, by contrast, runs on any jvm."], ["<p><b>Static linking</b> (library copied into the binary, <code>.a</code>) vs <b>dynamic linking</b> (<code>.so</code>/<code>.dll</code> loaded at runtime; missing → “error while loading shared libraries”, fix <code>LD_LIBRARY_PATH</code>). Compile errors (syntax, undeclared identifier, type mismatch) vs <b>linker errors</b> (“undefined reference to `foo`” — function declared but not defined/linked).</p>", "static linking (library copied into the binary, .a ) vs dynamic linking ( .so / .dll loaded at runtime; missing → “error while loading shared libraries”, fix ld_library_path ). compile errors (syntax, undeclared identifier, type mismatch) vs linker errors (“undefined reference to `foo`” — function declared but not defined/linked)."]]}, {"h": "Pointers & memory bugs", "blocks": [["<pre>int x = 10;\nint *p = &amp;x;        <span class=\"c\">/* p holds the address of x */</span>\n*p = 20;            <span class=\"c\">/* dereference: x is now 20 */</span>\nint a[5];           <span class=\"c\">/* a decays to &amp;a[0]; a[i] == *(a + i) */</span>\nchar s[] = \"hi\";    <span class=\"c\">/* 3 bytes: 'h','i','\\0' — strings end with a null terminator */</span>\nint *buf = malloc(10 * sizeof(int));\nif (buf == NULL) { /* allocation failed */ }\nfree(buf); buf = NULL;</pre>", "int x = 10; int *p = &x; /* p holds the address of x */ *p = 20; /* dereference: x is now 20 */ int a[5]; /* a decays to &a[0]; a[i] == *(a + i) */ char s[] = \"hi\"; /* 3 bytes: 'h','i','\\0' — strings end with a null terminator */ int *buf = malloc(10 * sizeof(int)); if (buf == null) { /* allocation failed */ } free(buf); buf = null;"], ["<div class=\"tw\"><table>\n<tr><th>Bug</th><th>Example</th><th>Symptom</th></tr>\n<tr><td><b>NULL pointer dereference</b></td><td><code>char *p = NULL; *p</code></td><td>Segmentation fault (SIGSEGV)</td></tr>\n<tr><td><b>Buffer overflow</b> / off-by-one</td><td><code>for(i=0;i&lt;=5;i++) a[i]=0;</code> on <code>int a[5]</code>; <code>strcpy</code> into small buffer; <code>gets()</code></td><td>memory corruption, random crashes later, security hole</td></tr>\n<tr><td><b>Memory leak</b></td><td><code>malloc</code> without <code>free</code></td><td>memory grows until OOM</td></tr>\n<tr><td><b>Dangling pointer</b> / use-after-free</td><td>using <code>p</code> after <code>free(p)</code>; returning address of a local variable</td><td>garbage data, crash</td></tr>\n<tr><td><b>Double free</b></td><td><code>free(p); free(p);</code></td><td>abort: “double free or corruption”</td></tr>\n<tr><td><b>Uninitialised variable</b></td><td><code>int x; printf(\"%d\", x);</code></td><td>garbage value (undefined behaviour)</td></tr>\n<tr><td><b>Stack overflow</b></td><td>infinite recursion, huge local arrays</td><td>segfault</td></tr>\n<tr><td>Integer division by zero</td><td><code>x / 0</code></td><td>SIGFPE “Floating point exception”</td></tr>\n<tr><td>Wrong printf format</td><td><code>printf(\"%d\", 3.5)</code></td><td>garbage output</td></tr>\n<tr><td><code>=</code> vs <code>==</code></td><td><code>if (x = 0)</code></td><td>always false and x overwritten (compiles!)</td></tr>\n<tr><td>Missing <code>break</code> in <code>switch</code></td><td></td><td>fall-through into next case</td></tr>\n</table></div>", "bug example symptom null pointer dereference char *p = null; *p segmentation fault (sigsegv) buffer overflow / off-by-one for(i=0;i<=5;i++) a[i]=0; on int a[5] ; strcpy into small buffer; gets() memory corruption, random crashes later, security hole memory leak malloc without free memory grows until oom dangling pointer / use-after-free using p after free(p) ; returning address of a local variable garbage data, crash double free free(p); free(p); abort: “double free or corruption” uninitialised variable int x; printf(\"%d\", x); garbage value (undefined behaviour) stack overflow infinite recursion, huge local arrays segfault integer division by zero x / 0 sigfpe “floating point exception” wrong printf format printf(\"%d\", 3.5) garbage output = vs == if (x = 0) always false and x overwritten (compiles!) missing break in switch fall-through into next case"], ["<p>Signals on crash: <b>SIGSEGV (11)</b> invalid memory access · <b>SIGABRT (6)</b> <code>abort()</code>/assert/double free · <b>SIGFPE (8)</b> arithmetic · <b>SIGBUS</b> misaligned access · <b>SIGKILL (9)</b> killed (e.g. by OOM killer). Exit code 128+N = killed by signal N (139 = segfault).</p>", "signals on crash: sigsegv (11) invalid memory access · sigabrt (6) abort() /assert/double free · sigfpe (8) arithmetic · sigbus misaligned access · sigkill (9) killed (e.g. by oom killer). exit code 128+n = killed by signal n (139 = segfault)."]]}, {"h": "Debugging native crashes", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Tool</th><th>Use</th></tr>\n<tr><td><b>Core dump</b></td><td>memory image written at crash (<code>ulimit -c unlimited</code> to enable)</td></tr>\n<tr><td><code>gdb ./prog core</code> → <code>bt</code></td><td><b>backtrace</b>: the call stack at the crash. <code>frame n</code>, <code>print var</code>, <code>info locals</code>, <code>break</code>, <code>run</code>, <code>next</code>, <code>step</code></td></tr>\n<tr><td><code>pstack PID</code> / <code>gstack</code></td><td>stack of a <b>running</b> (hung/slow) process, without stopping it for long</td></tr>\n<tr><td><code>strace -p PID</code></td><td>system calls in real time (stuck on <code>read()</code> from a socket? <code>open()</code> failing?)</td></tr>\n<tr><td><code>valgrind ./prog</code></td><td>leaks, invalid reads/writes, use of uninitialised memory</td></tr>\n<tr><td>AddressSanitizer (<code>-fsanitize=address</code>)</td><td>catches overflows at runtime</td></tr>\n<tr><td><code>nm</code>, <code>objdump</code>, <code>ldd</code>, <code>file</code></td><td>symbols, disassembly, dependencies, binary type/architecture</td></tr>\n</table></div>", "tool use core dump memory image written at crash ( ulimit -c unlimited to enable) gdb ./prog core → bt backtrace : the call stack at the crash. frame n , print var , info locals , break , run , next , step pstack pid / gstack stack of a running (hung/slow) process, without stopping it for long strace -p pid system calls in real time (stuck on read() from a socket? open() failing?) valgrind ./prog leaks, invalid reads/writes, use of uninitialised memory addresssanitizer ( -fsanitize=address ) catches overflows at runtime nm , objdump , ldd , file symbols, disassembly, dependencies, binary type/architecture"], ["<h4>Reading a pstack (from the paper)</h4>", "reading a pstack (from the paper)"], ["<pre>kpuexec() + 0x2ca [libclntsh.so.18.1]          <span class=\"c\">← innermost: Oracle client library, executing</span>\nOCIStmtExecute() [libclntsh.so.18.1]           <span class=\"c\">← OCI = Oracle Call Interface</span>\nOCI_RequestExecuteWithParameters(...) [librdb_oci.so]\nSQLPrepareAndExecute(..., \"USERS_TABLE\", ...) [librdbms_dll.so]   <span class=\"c\">← the SQL being run</span>\nRDB_Read(...) / RDBPosition(...) / DBX_Position(...)              <span class=\"c\">← application asked to read data</span></pre>", "kpuexec() + 0x2ca [libclntsh.so.18.1] ← innermost: oracle client library, executing ocistmtexecute() [libclntsh.so.18.1] ← oci = oracle call interface oci_requestexecutewithparameters(...) [librdb_oci.so] sqlprepareandexecute(..., \"users_table\", ...) [librdbms_dll.so] ← the sql being run rdb_read(...) / rdbposition(...) / dbx_position(...) ← application asked to read data"], ["<p>Bottom = outermost caller, top = where it is <b>now</b>. The process is waiting inside the Oracle client for the <b>database to finish a query on USERS_TABLE</b> → the problem is on the DB side. Next: find the session (<code>v$session</code>), check for <b>locks/blocking</b>, get the <b>execution plan</b>, add indexes, refresh statistics, check DB load and network latency, add a query timeout. Take several pstacks a few seconds apart: same frame every time = genuinely stuck there.</p>", "bottom = outermost caller, top = where it is now . the process is waiting inside the oracle client for the database to finish a query on users_table → the problem is on the db side. next: find the session ( v$session ), check for locks/blocking , get the execution plan , add indexes, refresh statistics, check db load and network latency, add a query timeout. take several pstacks a few seconds apart: same frame every time = genuinely stuck there."]]}]}, {"title": "Troubleshooting & log analysis", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">Open questions like “the app is slow”, “checkout crashes”, “status 403 in logs”. Answer with a structured method and real commands.</p>", "open questions like “the app is slow”, “checkout crashes”, “status 403 in logs”. answer with a structured method and real commands."]]}, {"h": "The method", "blocks": [["<ol>\n<li><b>Scope</b>: who is affected (all users / one), what (all features / one page), since when, reproducible? Any recent <b>change</b> (deployment, config, patch, data volume)?</li>\n<li><b>Gather evidence</b>: error messages, timestamps, logs, screenshots, exact steps, environment/version.</li>\n<li><b>Isolate the layer</b>: client → network → load balancer/proxy → app server → database → external services. Measure time at each hop.</li>\n<li><b>Hypothesise &amp; test</b> one thing at a time; compare with a working environment.</li>\n<li><b>Fix, verify, document</b>; add monitoring so it’s caught earlier next time.</li>\n</ol>", "scope : who is affected (all users / one), what (all features / one page), since when, reproducible? any recent change (deployment, config, patch, data volume)? gather evidence : error messages, timestamps, logs, screenshots, exact steps, environment/version. isolate the layer : client → network → load balancer/proxy → app server → database → external services. measure time at each hop. hypothesise & test one thing at a time; compare with a working environment. fix, verify, document ; add monitoring so it’s caught earlier next time."]]}, {"h": "Slow application (app VM + separate DB VM)", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Layer</th><th>Check</th><th>Commands / tools</th></tr>\n<tr><td>App server CPU</td><td>a process at 100%? load average &gt; cores?</td><td><code>top</code>, <code>htop</code>, <code>uptime</code>, <code>ps aux --sort=-%cpu</code></td></tr>\n<tr><td>Memory</td><td>RAM full, swapping, long GC pauses</td><td><code>free -m</code>, <code>vmstat 1</code>, GC logs, <code>jstat</code></td></tr>\n<tr><td>Disk</td><td>full disk, high I/O wait</td><td><code>df -h</code>, <code>du -sh</code>, <code>iostat -x</code></td></tr>\n<tr><td>Application</td><td>errors, timeouts, thread pool / connection pool exhausted</td><td><code>tail -f</code>, <code>grep -i error</code>, <code>jstack</code>, APM traces</td></tr>\n<tr><td>Network</td><td>latency/packet loss user↔app and app↔DB</td><td><code>ping</code>, <code>traceroute</code>, <code>mtr</code>, <code>curl -w</code></td></tr>\n<tr><td>Database</td><td>slow queries, locks, missing indexes, stale stats, DB VM resources</td><td>slow-query log, <code>EXPLAIN</code>, <code>v$session</code>, AWR, <code>SHOW PROCESSLIST</code></td></tr>\n<tr><td>External</td><td>third-party API, DNS slow</td><td>logs, <code>dig</code></td></tr>\n</table></div>", "layer check commands / tools app server cpu a process at 100%? load average > cores? top , htop , uptime , ps aux --sort=-%cpu memory ram full, swapping, long gc pauses free -m , vmstat 1 , gc logs, jstat disk full disk, high i/o wait df -h , du -sh , iostat -x application errors, timeouts, thread pool / connection pool exhausted tail -f , grep -i error , jstack , apm traces network latency/packet loss user↔app and app↔db ping , traceroute , mtr , curl -w database slow queries, locks, missing indexes, stale stats, db vm resources slow-query log, explain , v$session , awr, show processlist external third-party api, dns slow logs, dig"], ["<h4>Alerting before users complain</h4>", "alerting before users complain"], ["<p>Monitoring + thresholds + notifications: collect metrics (CPU, memory, disk, response time p95/p99, error rate, DB latency, queue size) with <b>CloudWatch / Prometheus + Grafana / Datadog / Nagios / Zabbix / ELK</b>; <b>synthetic checks</b> (probe key URLs every minute); <b>health-check endpoints</b>; <b>log-based alerts</b> (e.g. &gt; 10 ERROR/min); alert on trends (disk at 80%, latency rising) via email/Slack/PagerDuty/SMS, with on-call rotation and runbooks. Define SLAs/SLOs.</p>", "monitoring + thresholds + notifications: collect metrics (cpu, memory, disk, response time p95/p99, error rate, db latency, queue size) with cloudwatch / prometheus + grafana / datadog / nagios / zabbix / elk ; synthetic checks (probe key urls every minute); health-check endpoints ; log-based alerts (e.g. > 10 error/min); alert on trends (disk at 80%, latency rising) via email/slack/pagerduty/sms, with on-call rotation and runbooks. define slas/slos."]]}, {"h": "Crash diagnostics checklist", "blocks": [["<ul>\n<li>Exact steps to reproduce + frequency (always / intermittent) + test data (item, user, payment, coupon).</li>\n<li>Error message, screenshot/recording, timestamp.</li>\n<li>Application &amp; server logs, <b>stack trace</b>, core dump.</li>\n<li>Browser console + network tab (which request failed, HTTP status, response body).</li>\n<li>Environment: build/version, browser/OS/device, test environment, configuration.</li>\n<li>Expected vs actual result; does it happen in other environments? what changed recently?</li>\n</ul>", "exact steps to reproduce + frequency (always / intermittent) + test data (item, user, payment, coupon). error message, screenshot/recording, timestamp. application & server logs, stack trace , core dump. browser console + network tab (which request failed, http status, response body). environment: build/version, browser/os/device, test environment, configuration. expected vs actual result; does it happen in other environments? what changed recently?"]]}, {"h": "Symptom → likely cause", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Symptom</th><th>Think about</th></tr>\n<tr><td>“No space left on device”</td><td><code>df -h</code> / <code>df -i</code>; clean logs/tmp, logrotate; deleted-but-open files (<code>lsof +L1</code>); environment issue, not a product bug — clean up or move to another machine</td></tr>\n<tr><td>“Permission denied”</td><td><code>ls -l</code>, owner/group, execute bit, running as wrong user, SELinux</td></tr>\n<tr><td>“Command not found”</td><td>typo, not installed, not in <code>$PATH</code></td></tr>\n<tr><td>Process killed suddenly</td><td>OOM killer (<code>dmesg | grep -i kill</code>), <code>ulimit</code></td></tr>\n<tr><td>“Too many open files”</td><td><code>ulimit -n</code>, file/socket leak (<code>lsof -p</code>)</td></tr>\n<tr><td>HTTP 401 / 403</td><td>authentication / authorization: credentials, token expiry, roles, whitelist, service account permissions</td></tr>\n<tr><td>HTTP 500 / 502 / 504</td><td>server exception in logs / backend down behind proxy / backend too slow</td></tr>\n<tr><td>Works on my machine only</td><td>environment differences: config, versions, data, network, permissions</td></tr>\n<tr><td>Intermittent failures</td><td>race conditions, resource exhaustion, timeouts, load balancer to one bad node, flaky test</td></tr>\n<tr><td>Process hung</td><td><code>pstack</code>/<code>jstack</code> several times, <code>strace</code>; waiting on DB lock, network, deadlock</td></tr>\n<tr><td>Slow after release</td><td>new query without index, N+1 queries, logging level DEBUG, config change</td></tr>\n</table></div>", "symptom think about “no space left on device” df -h / df -i ; clean logs/tmp, logrotate; deleted-but-open files ( lsof +l1 ); environment issue, not a product bug — clean up or move to another machine “permission denied” ls -l , owner/group, execute bit, running as wrong user, selinux “command not found” typo, not installed, not in $path process killed suddenly oom killer ( dmesg | grep -i kill ), ulimit “too many open files” ulimit -n , file/socket leak ( lsof -p ) http 401 / 403 authentication / authorization: credentials, token expiry, roles, whitelist, service account permissions http 500 / 502 / 504 server exception in logs / backend down behind proxy / backend too slow works on my machine only environment differences: config, versions, data, network, permissions intermittent failures race conditions, resource exhaustion, timeouts, load balancer to one bad node, flaky test process hung pstack / jstack several times, strace ; waiting on db lock, network, deadlock slow after release new query without index, n+1 queries, logging level debug, config change"], ["<p><b>Log levels</b>: TRACE &lt; DEBUG &lt; INFO &lt; WARN &lt; ERROR &lt; FATAL. Logs live in <code>/var/log/</code>, app dirs, or <code>journalctl</code>. Correlate by timestamp and request/trade ID across components.</p>", "log levels : trace < debug < info < warn < error < fatal. logs live in /var/log/ , app dirs, or journalctl . correlate by timestamp and request/trade id across components."]]}]}, {"title": "Software testing", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">One of the five official test areas — and core to Murex’s QA and Technical Analyst roles. Definitions, techniques, coverage math, bug handling.</p>", "one of the five official test areas — and core to murex’s qa and technical analyst roles. definitions, techniques, coverage math, bug handling."]]}, {"h": "Lifecycle & fundamentals", "blocks": [["<ul>\n<li><b>SDLC</b>: requirements → design → implementation → testing → deployment → maintenance. Models: <b>Waterfall</b> (sequential), <b>V-model</b> (each dev phase paired with a test level), <b>Agile/Scrum</b> (sprints, continuous testing), <b>DevOps</b> (CI/CD).</li>\n<li><b>STLC</b>: requirement analysis → test planning → test case design → environment setup → execution → closure/report.</li>\n<li><b>Error</b> (human mistake) → <b>defect/bug</b> (in code) → <b>failure</b> (observed wrong behaviour).</li>\n<li><b>Verification</b> = “are we building the product <b>right</b>?” — checks against specifications, often static (reviews, walkthroughs, inspections). <b>Validation</b> = “are we building the <b>right product</b>?” — checks it meets user needs, dynamic (executing the software, UAT).</li>\n<li><b>Static testing</b> (no execution: reviews, static analysis/linters) vs <b>dynamic testing</b> (running the code).</li>\n<li><b>QA</b> (process-oriented, prevent defects) vs <b>QC</b> (product-oriented, find defects) vs testing.</li>\n<li>Seven principles: testing shows presence of defects not absence · exhaustive testing is impossible · test early (shift left) · defects cluster · pesticide paradox (update tests) · context dependent · absence-of-errors fallacy.</li>\n</ul>", "sdlc : requirements → design → implementation → testing → deployment → maintenance. models: waterfall (sequential), v-model (each dev phase paired with a test level), agile/scrum (sprints, continuous testing), devops (ci/cd). stlc : requirement analysis → test planning → test case design → environment setup → execution → closure/report. error (human mistake) → defect/bug (in code) → failure (observed wrong behaviour). verification = “are we building the product right ?” — checks against specifications, often static (reviews, walkthroughs, inspections). validation = “are we building the right product ?” — checks it meets user needs, dynamic (executing the software, uat). static testing (no execution: reviews, static analysis/linters) vs dynamic testing (running the code). qa (process-oriented, prevent defects) vs qc (product-oriented, find defects) vs testing. seven principles: testing shows presence of defects not absence · exhaustive testing is impossible · test early (shift left) · defects cluster · pesticide paradox (update tests) · context dependent · absence-of-errors fallacy."], ["<div class=\"key\"><b>Cost of a bug rises the later it’s found</b>: developer testing own code (cheapest) → tester working with the developer right after development → internal system-test campaign → client/production (most expensive). Order: <b>(2, 4, 3, 1)</b>.</div>", "cost of a bug rises the later it’s found : developer testing own code (cheapest) → tester working with the developer right after development → internal system-test campaign → client/production (most expensive). order: (2, 4, 3, 1) ."]]}, {"h": "Test levels & approaches", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Level</th><th>What</th><th>Who</th></tr>\n<tr><td><b>Unit</b></td><td>individual components (function/class) in isolation, with mocks/stubs; finds bugs early, enables refactoring, documents behaviour</td><td>developers (JUnit, TestNG, pytest)</td></tr>\n<tr><td><b>Integration</b></td><td>interfaces between modules/services (big-bang, top-down with stubs, bottom-up with drivers)</td><td>dev/QA</td></tr>\n<tr><td><b>System</b></td><td>complete integrated system against requirements (end-to-end)</td><td>QA team</td></tr>\n<tr><td><b>Acceptance (UAT)</b></td><td>meets business needs; alpha (in-house) / beta (real users)</td><td>client/users</td></tr>\n</table></div>", "level what who unit individual components (function/class) in isolation, with mocks/stubs; finds bugs early, enables refactoring, documents behaviour developers (junit, testng, pytest) integration interfaces between modules/services (big-bang, top-down with stubs, bottom-up with drivers) dev/qa system complete integrated system against requirements (end-to-end) qa team acceptance (uat) meets business needs; alpha (in-house) / beta (real users) client/users"], ["<div class=\"tw\"><table>\n<tr><th>Approach</th><th>Meaning</th></tr>\n<tr><td><b>Black-box</b></td><td>based on inputs/outputs and specs, no knowledge of code (EP, BVA, decision tables)</td></tr>\n<tr><td><b>White-box</b> (glass/structural)</td><td>based on internal code (statement/branch/path coverage)</td></tr>\n<tr><td><b>Grey-box</b></td><td>partial knowledge (DB schema, architecture)</td></tr>\n<tr><td><b>Manual vs automated</b></td><td>automation for repetitive, regression, data-heavy tests; manual for exploratory, usability, one-off</td></tr>\n</table></div>", "approach meaning black-box based on inputs/outputs and specs, no knowledge of code (ep, bva, decision tables) white-box (glass/structural) based on internal code (statement/branch/path coverage) grey-box partial knowledge (db schema, architecture) manual vs automated automation for repetitive, regression, data-heavy tests; manual for exploratory, usability, one-off"]]}, {"h": "Test types", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Type</th><th>Definition</th></tr>\n<tr><td><b>Functional</b></td><td>does it do what it should (features, business rules)</td></tr>\n<tr><td><b>Non-functional</b></td><td>how well: performance, security, usability, reliability, compatibility</td></tr>\n<tr><td><b>Smoke</b></td><td>quick, broad check that a new build’s critical functions work (“build verification”) — decides whether deeper testing can start</td></tr>\n<tr><td><b>Sanity</b></td><td>narrow, focused check that a specific fix/change works</td></tr>\n<tr><td><b>Regression</b></td><td>re-run existing tests after a change to make sure nothing that worked is broken (usually automated, run in CI)</td></tr>\n<tr><td><b>Re-testing / confirmation</b></td><td>re-run the failed test to confirm the bug is fixed</td></tr>\n<tr><td><b>Exploratory</b></td><td>simultaneous learning, design and execution based on the <b>tester’s intuition and experience, without predefined test cases</b> (time-boxed sessions, charters)</td></tr>\n<tr><td><b>Ad-hoc / monkey</b></td><td>unplanned, random inputs</td></tr>\n<tr><td><b>Performance</b></td><td>response time and throughput under expected load</td></tr>\n<tr><td><b>Load</b> / <b>Stress</b> / <b>Spike</b> / <b>Soak (endurance)</b></td><td>expected load / beyond limits to find breaking point / sudden surge / long duration (memory leaks)</td></tr>\n<tr><td><b>Security</b> / penetration</td><td>vulnerabilities: injection, auth, XSS, access control</td></tr>\n<tr><td><b>Usability</b>, <b>Accessibility</b>, <b>Compatibility</b></td><td>ease of use / users with disabilities / browsers, OS, devices</td></tr>\n<tr><td><b>Happy path</b> (positive)</td><td>valid inputs, normal flow, expected success</td></tr>\n<tr><td><b>Negative</b></td><td>invalid inputs, errors handled gracefully</td></tr>\n<tr><td><b>End-to-end</b></td><td>a full business flow across systems (trade capture → risk → settlement)</td></tr>\n<tr><td><b>Non-regression on data / golden copy</b></td><td>compare outputs (reports, JSON/XML files) to a validated reference — common at Murex</td></tr>\n</table></div>", "type definition functional does it do what it should (features, business rules) non-functional how well: performance, security, usability, reliability, compatibility smoke quick, broad check that a new build’s critical functions work (“build verification”) — decides whether deeper testing can start sanity narrow, focused check that a specific fix/change works regression re-run existing tests after a change to make sure nothing that worked is broken (usually automated, run in ci) re-testing / confirmation re-run the failed test to confirm the bug is fixed exploratory simultaneous learning, design and execution based on the tester’s intuition and experience, without predefined test cases (time-boxed sessions, charters) ad-hoc / monkey unplanned, random inputs performance response time and throughput under expected load load / stress / spike / soak (endurance) expected load / beyond limits to find breaking point / sudden surge / long duration (memory leaks) security / penetration vulnerabilities: injection, auth, xss, access control usability , accessibility , compatibility ease of use / users with disabilities / browsers, os, devices happy path (positive) valid inputs, normal flow, expected success negative invalid inputs, errors handled gracefully end-to-end a full business flow across systems (trade capture → risk → settlement) non-regression on data / golden copy compare outputs (reports, json/xml files) to a validated reference — common at murex"]]}, {"h": "Test design techniques", "blocks": [["<h4>Equivalence partitioning (EP)</h4>", "equivalence partitioning (ep)"], ["<p>Split inputs into classes the system should treat the same; test one value per class. Age valid 18–60 → 3 partitions: &lt;18 (invalid), 18–60 (valid), &gt;60 (invalid) (+ non-numeric/empty).</p>", "split inputs into classes the system should treat the same; test one value per class. age valid 18–60 → 3 partitions: <18 (invalid), 18–60 (valid), >60 (invalid) (+ non-numeric/empty)."], ["<h4>Boundary value analysis (BVA)</h4>", "boundary value analysis (bva)"], ["<p>Bugs hide at edges. For a boundary B test <b>B−1, B, B+1</b> (3-value) or B−1, B (2-value). Range 18–60 → 17, 18, 19, 59, 60, 61.</p>", "bugs hide at edges. for a boundary b test b−1, b, b+1 (3-value) or b−1, b (2-value). range 18–60 → 17, 18, 19, 59, 60, 61."], ["<p>Book offer at multiples of 5 up to 20 (5→$25, 10→$40, 15→$50, 20→$60): each price point is a boundary → 4,5,6 · 9,10,11 · 14,15,16 · 19,20,21, plus the lower edge of the domain 0,1 → <b>0, 1, 4, 5, 6, 9, 10, 11, 14, 15, 16, 19, 20, 21</b> (the most complete option).</p>", "book offer at multiples of 5 up to 20 (5→$25, 10→$40, 15→$50, 20→$60): each price point is a boundary → 4,5,6 · 9,10,11 · 14,15,16 · 19,20,21, plus the lower edge of the domain 0,1 → 0, 1, 4, 5, 6, 9, 10, 11, 14, 15, 16, 19, 20, 21 (the most complete option)."], ["<h4>Decision table</h4>", "decision table"], ["<p>Conditions × actions; <b>n binary conditions → 2ⁿ rules</b>. Member (Y/N) × order &gt; $100 (Y/N) → 4 rules.</p>", "conditions × actions; n binary conditions → 2ⁿ rules . member (y/n) × order > $100 (y/n) → 4 rules."], ["<h4>Others</h4>", "others"], ["<ul>\n<li><b>State transition</b>: states + events (e.g. order: New → Paid → Shipped → Delivered; account locked after 3 failures).</li>\n<li><b>Use case / scenario</b> testing: main flow + alternate flows.</li>\n<li><b>Error guessing</b>: experience-based (empty, null, special characters, very long strings, 0, negative, leap year 29 Feb, time zones).</li>\n<li><b>Pairwise</b>: cover every pair of parameter values with few tests.</li>\n</ul>", "state transition : states + events (e.g. order: new → paid → shipped → delivered; account locked after 3 failures). use case / scenario testing: main flow + alternate flows. error guessing : experience-based (empty, null, special characters, very long strings, 0, negative, leap year 29 feb, time zones). pairwise : cover every pair of parameter values with few tests."]]}, {"h": "Code coverage & minimum test cases", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Coverage</th><th>Goal</th></tr>\n<tr><td><b>Statement (line)</b></td><td>every line executed at least once</td></tr>\n<tr><td><b>Branch / decision</b></td><td>every if/else outcome (true and false) taken</td></tr>\n<tr><td><b>Condition</b></td><td>every boolean sub-condition true and false</td></tr>\n<tr><td><b>Path</b></td><td>every possible route through the code (grows exponentially)</td></tr>\n</table></div>", "coverage goal statement (line) every line executed at least once branch / decision every if/else outcome (true and false) taken condition every boolean sub-condition true and false path every possible route through the code (grows exponentially)"], ["<p>Strength: path ⊃ branch ⊃ statement. 100% branch implies 100% statement, not the reverse. <b>Cyclomatic complexity</b> = decisions + 1 = number of independent paths (upper bound for basis path tests).</p>", "strength: path ⊃ branch ⊃ statement. 100% branch implies 100% statement, not the reverse. cyclomatic complexity = decisions + 1 = number of independent paths (upper bound for basis path tests)."], ["<div class=\"tip\">To count minimum tests for statement coverage: find the <b>leaf blocks that are mutually exclusive</b> (each run can reach only one). One test per leaf. Nested if/else with OUT1…OUT6 in six separate leaves → <b>6 tests</b>. A line that crashes (e.g. <code>c / 0</code>) still counts as executed.</div>", "to count minimum tests for statement coverage: find the leaf blocks that are mutually exclusive (each run can reach only one). one test per leaf. nested if/else with out1…out6 in six separate leaves → 6 tests . a line that crashes (e.g. c / 0 ) still counts as executed."], ["<pre>if (x &gt; 0) A();      <span class=\"c\">// two independent ifs:</span>\nif (y &gt; 0) B();      <span class=\"c\">// statement coverage: 1 test (x&gt;0, y&gt;0)</span>\n                     <span class=\"c\">// branch coverage:    2 tests (both true, both false)</span>\n                     <span class=\"c\">// path coverage:      4 tests (TT, TF, FT, FF)</span></pre>", "if (x > 0) a(); // two independent ifs: if (y > 0) b(); // statement coverage: 1 test (x>0, y>0) // branch coverage: 2 tests (both true, both false) // path coverage: 4 tests (tt, tf, ft, ff)"]]}, {"h": "Test cases, plans & bug reports", "blocks": [["<p><b>Test case fields</b>: ID · title · preconditions · test data · steps · expected result · actual result · status (pass/fail/blocked) · priority · requirement link (traceability matrix).</p>", "test case fields : id · title · preconditions · test data · steps · expected result · actual result · status (pass/fail/blocked) · priority · requirement link (traceability matrix)."], ["<pre>TC-01  Search returns matching products (happy path)\nPre:   site up, catalogue contains \"wireless mouse\" items\nSteps: 1. open home page  2. type \"wireless mouse\"  3. press Enter\nExpected: results page in &lt; 2 s; all results relevant; name/price/image shown;\n          result count displayed; clicking a result opens its product page</pre>", "tc-01 search returns matching products (happy path) pre: site up, catalogue contains \"wireless mouse\" items steps: 1. open home page 2. type \"wireless mouse\" 3. press enter expected: results page in < 2 s; all results relevant; name/price/image shown; result count displayed; clicking a result opens its product page"], ["<p><b>Test plan</b>: scope, objectives, approach, resources, schedule, environments, entry/exit criteria, risks, deliverables. <b>Test suite</b> = group of test cases. <b>Test scenario</b> = high-level “what to test”. <b>Test script</b> = automated or detailed steps.</p>", "test plan : scope, objectives, approach, resources, schedule, environments, entry/exit criteria, risks, deliverables. test suite = group of test cases. test scenario = high-level “what to test”. test script = automated or detailed steps."], ["<p><b>Bug report</b>: ID, title, steps to reproduce, expected vs actual, environment/build, severity, priority, logs/screenshots, test data, assignee. <b>Bug lifecycle</b>: New → Assigned → Open → Fixed → Retest → Verified → Closed (or Reopened / Rejected / Deferred / Duplicate).</p>", "bug report : id, title, steps to reproduce, expected vs actual, environment/build, severity, priority, logs/screenshots, test data, assignee. bug lifecycle : new → assigned → open → fixed → retest → verified → closed (or reopened / rejected / deferred / duplicate)."], ["<div class=\"tw\"><table>\n<tr><th></th><th>High priority</th><th>Low priority</th></tr>\n<tr><td><b>High severity</b></td><td>checkout crashes for all users</td><td>crash in a rarely used legacy report</td></tr>\n<tr><td><b>Low severity</b></td><td>company name/logo misspelled on homepage</td><td>typo in a help page</td></tr>\n</table></div>", "high priority low priority high severity checkout crashes for all users crash in a rarely used legacy report low severity company name/logo misspelled on homepage typo in a help page"], ["<p><b>Severity</b> = technical impact (set by tester). <b>Priority</b> = urgency to fix (set by business/PM).</p>", "severity = technical impact (set by tester). priority = urgency to fix (set by business/pm)."]]}, {"h": "Automation, frameworks, CI", "blocks": [["<ul>\n<li><b>Test automation framework</b> = a set of guidelines, libraries and tools for <b>creating and running automated tests</b> (structure, reusable components, data handling, reporting) → <b>efficiency, reusability, maintainability</b>. It does not auto-generate tests.</li>\n<li>Framework types: linear (record/playback) · modular · <b>data-driven</b> (same script, data from CSV/Excel/DB) · <b>keyword-driven</b> (actions as keywords) · hybrid · <b>BDD</b> (Gherkin: Given/When/Then — Cucumber).</li>\n<li>Tools: Selenium/Playwright/Cypress (web UI), JUnit/TestNG/pytest (unit), Postman/RestAssured (API), JMeter/Gatling (load), Appium (mobile), SonarQube (static analysis).</li>\n<li><b>TDD</b>: write a failing test → write code to pass → refactor (red/green/refactor). <b>BDD</b>: behaviour specs in business language.</li>\n<li><b>Mock</b> (verifies interactions) / <b>stub</b> (canned answers) / <b>fake</b> / <b>driver</b> (calls the unit under test).</li>\n<li>Tests run in <b>CI</b> on every commit; <b>flaky test</b> = passes/fails without code change (timing, environment, order dependency).</li>\n<li>Environment failures (disk full, machine down, network) are <b>not product defects</b>: fix the environment or move to a healthy machine, then re-run. Don’t descope a valid test or blindly re-run on the same broken machine.</li>\n</ul>", "test automation framework = a set of guidelines, libraries and tools for creating and running automated tests (structure, reusable components, data handling, reporting) → efficiency, reusability, maintainability . it does not auto-generate tests. framework types: linear (record/playback) · modular · data-driven (same script, data from csv/excel/db) · keyword-driven (actions as keywords) · hybrid · bdd (gherkin: given/when/then — cucumber). tools: selenium/playwright/cypress (web ui), junit/testng/pytest (unit), postman/restassured (api), jmeter/gatling (load), appium (mobile), sonarqube (static analysis). tdd : write a failing test → write code to pass → refactor (red/green/refactor). bdd : behaviour specs in business language. mock (verifies interactions) / stub (canned answers) / fake / driver (calls the unit under test). tests run in ci on every commit; flaky test = passes/fails without code change (timing, environment, order dependency). environment failures (disk full, machine down, network) are not product defects : fix the environment or move to a healthy machine, then re-run. don’t descope a valid test or blindly re-run on the same broken machine."]]}]}, {"title": "Problem analysis: pseudo-code, decision trees, algorithms", "chunks": [{"h": "Tracing pseudo-code & decision trees", "blocks": [["<div class=\"tip\">Make a table with one column per variable and one row per step/iteration. Never trace in your head. Watch for: loop bounds (<code>to 5</code> inclusive? <code>&lt; n</code> or <code>&lt;= n</code>?), integer division, <code>%</code>, operator precedence, variables updated before/after use.</div>", "make a table with one column per variable and one row per step/iteration. never trace in your head. watch for: loop bounds ( to 5 inclusive? < n or <= n ?), integer division, % , operator precedence, variables updated before/after use."], ["<pre>x = 0\nfor i = 1 to 5:\n    if i % 2 == 0: x = x + i\n    else:          x = x - 1\nprint x</pre>", "x = 0 for i = 1 to 5: if i % 2 == 0: x = x + i else: x = x - 1 print x"], ["<div class=\"tw\"><table><tr><th>i</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>x after</td><td>−1</td><td>1</td><td>0</td><td>4</td><td><b>3</b></td></tr></table></div>", "i 1 2 3 4 5 x after −1 1 0 4 3"], ["<p><b>Decision tree</b>: each internal node = a condition, branches = outcomes, leaves = actions/results. Order checks from the most fundamental blocker to the least; every path ends in a clear result. A <b>flowchart</b> uses ovals (start/end), rectangles (process), diamonds (decision), parallelograms (input/output).</p>", "decision tree : each internal node = a condition, branches = outcomes, leaves = actions/results. order checks from the most fundamental blocker to the least; every path ends in a clear result. a flowchart uses ovals (start/end), rectangles (process), diamonds (decision), parallelograms (input/output)."], ["<pre>if not allTestsPassed:          print \"Blocked: failing tests\"\nelse if criticalBugs &gt; 0:       print \"Blocked: critical bugs\"\nelse if day == FRIDAY and not approved: print \"Blocked: needs approval\"\nelse:                           deploy()</pre>", "if not alltestspassed: print \"blocked: failing tests\" else if criticalbugs > 0: print \"blocked: critical bugs\" else if day == friday and not approved: print \"blocked: needs approval\" else: deploy()"]]}, {"h": "Complexity (Big-O)", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Big-O</th><th>Name</th><th>Example</th></tr>\n<tr><td>O(1)</td><td>constant</td><td>array index, hash map get</td></tr>\n<tr><td>O(log n)</td><td>logarithmic</td><td>binary search, balanced BST lookup</td></tr>\n<tr><td>O(n)</td><td>linear</td><td>one loop over the data</td></tr>\n<tr><td>O(n log n)</td><td>linearithmic</td><td>merge sort, quick sort (avg), heap sort</td></tr>\n<tr><td>O(n²)</td><td>quadratic</td><td>nested loops: brute-force duplicates, bubble sort</td></tr>\n<tr><td>O(2ⁿ)</td><td>exponential</td><td>naive recursive Fibonacci, all subsets</td></tr>\n<tr><td>O(n!)</td><td>factorial</td><td>all permutations (travelling salesman brute force)</td></tr>\n</table></div>", "big-o name example o(1) constant array index, hash map get o(log n) logarithmic binary search, balanced bst lookup o(n) linear one loop over the data o(n log n) linearithmic merge sort, quick sort (avg), heap sort o(n²) quadratic nested loops: brute-force duplicates, bubble sort o(2ⁿ) exponential naive recursive fibonacci, all subsets o(n!) factorial all permutations (travelling salesman brute force)"]]}, {"h": "Data structures", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Structure</th><th>Key property</th><th>Access / search / insert</th></tr>\n<tr><td>Array</td><td>contiguous, fixed size, index</td><td>O(1) / O(n) / O(n)</td></tr>\n<tr><td>Linked list</td><td>nodes with next pointers</td><td>O(n) / O(n) / O(1) at head</td></tr>\n<tr><td><b>Stack</b></td><td><b>LIFO</b> — push/pop/peek (undo, call stack, bracket matching, DFS)</td><td>O(1) push/pop</td></tr>\n<tr><td><b>Queue</b></td><td><b>FIFO</b> — enqueue/dequeue (BFS, job scheduling)</td><td>O(1)</td></tr>\n<tr><td>Hash table / map</td><td>key → value via hash function; collisions (chaining)</td><td>O(1) average</td></tr>\n<tr><td>Binary search tree</td><td>left &lt; node &lt; right; in-order traversal gives sorted order</td><td>O(log n) balanced, O(n) worst</td></tr>\n<tr><td>Heap / priority queue</td><td>min or max at the root</td><td>O(1) peek, O(log n) insert/remove</td></tr>\n<tr><td>Graph</td><td>vertices + edges (directed/undirected, weighted); adjacency list or matrix</td><td></td></tr>\n<tr><td>Trie</td><td>prefix tree for strings</td><td>O(length)</td></tr>\n</table></div>", "structure key property access / search / insert array contiguous, fixed size, index o(1) / o(n) / o(n) linked list nodes with next pointers o(n) / o(n) / o(1) at head stack lifo — push/pop/peek (undo, call stack, bracket matching, dfs) o(1) push/pop queue fifo — enqueue/dequeue (bfs, job scheduling) o(1) hash table / map key → value via hash function; collisions (chaining) o(1) average binary search tree left < node < right; in-order traversal gives sorted order o(log n) balanced, o(n) worst heap / priority queue min or max at the root o(1) peek, o(log n) insert/remove graph vertices + edges (directed/undirected, weighted); adjacency list or matrix trie prefix tree for strings o(length)"], ["<p>Tree traversals: pre-order (root, left, right) · in-order (left, root, right) · post-order (left, right, root) · level-order (BFS).</p>", "tree traversals: pre-order (root, left, right) · in-order (left, root, right) · post-order (left, right, root) · level-order (bfs)."]]}, {"h": "Searching, sorting, graphs", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Algorithm</th><th>Best</th><th>Average</th><th>Worst</th><th>Space</th><th>Stable</th></tr>\n<tr><td>Bubble sort</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>yes</td></tr>\n<tr><td>Selection sort</td><td>O(n²)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>no</td></tr>\n<tr><td>Insertion sort</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>yes</td></tr>\n<tr><td>Merge sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n)</td><td>yes</td></tr>\n<tr><td>Quick sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n²)</td><td>O(log n)</td><td>no</td></tr>\n<tr><td>Heap sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(1)</td><td>no</td></tr>\n</table></div>", "algorithm best average worst space stable bubble sort o(n) o(n²) o(n²) o(1) yes selection sort o(n²) o(n²) o(n²) o(1) no insertion sort o(n) o(n²) o(n²) o(1) yes merge sort o(n log n) o(n log n) o(n log n) o(n) yes quick sort o(n log n) o(n log n) o(n²) o(log n) no heap sort o(n log n) o(n log n) o(n log n) o(1) no"], ["<p><b>Linear search</b> O(n), any list. <b>Binary search</b> O(log n), <b>sorted</b> list only: compare with the middle, discard half.</p>", "linear search o(n), any list. binary search o(log n), sorted list only: compare with the middle, discard half."], ["<div class=\"tw\"><table>\n<tr><th>Graph algorithm</th><th>Purpose</th><th>Notes</th></tr>\n<tr><td><b>BFS</b></td><td>level by level (queue); shortest path in <b>unweighted</b> graphs</td><td>O(V+E)</td></tr>\n<tr><td><b>DFS</b></td><td>go deep first (stack/recursion); cycle detection, topological sort</td><td>O(V+E)</td></tr>\n<tr><td><b>Dijkstra</b></td><td>shortest paths from one source, <b>non-negative</b> weights (greedy + priority queue)</td><td>O((V+E) log V). With a negative edge it is not guaranteed — it <b>might</b> still work on some graphs. With a negative <b>cycle</b> it does <b>not</b> work (shortest path undefined).</td></tr>\n<tr><td><b>Bellman-Ford</b></td><td>shortest paths with negative weights; <b>detects negative cycles</b></td><td>O(V·E)</td></tr>\n<tr><td>Floyd-Warshall</td><td>all pairs shortest paths</td><td>O(V³)</td></tr>\n<tr><td>Prim / Kruskal</td><td>minimum spanning tree</td><td></td></tr>\n<tr><td>Topological sort</td><td>order tasks with dependencies (DAG)</td><td></td></tr>\n</table></div>", "graph algorithm purpose notes bfs level by level (queue); shortest path in unweighted graphs o(v+e) dfs go deep first (stack/recursion); cycle detection, topological sort o(v+e) dijkstra shortest paths from one source, non-negative weights (greedy + priority queue) o((v+e) log v). with a negative edge it is not guaranteed — it might still work on some graphs. with a negative cycle it does not work (shortest path undefined). bellman-ford shortest paths with negative weights; detects negative cycles o(v·e) floyd-warshall all pairs shortest paths o(v³) prim / kruskal minimum spanning tree topological sort order tasks with dependencies (dag)"], ["<p>Paradigms: <b>brute force</b> (try everything), <b>divide &amp; conquer</b> (merge sort), <b>greedy</b> (best local choice: Dijkstra), <b>dynamic programming</b> (store sub-results: Fibonacci memo, knapsack), <b>recursion</b> (base case + recursive case; no base case → StackOverflowError), <b>backtracking</b>.</p>", "paradigms: brute force (try everything), divide & conquer (merge sort), greedy (best local choice: dijkstra), dynamic programming (store sub-results: fibonacci memo, knapsack), recursion (base case + recursive case; no base case → stackoverflowerror), backtracking ."]]}, {"h": "Classic snippets to write from memory", "blocks": [["<pre><span class=\"c\">// 1. duplicates — brute force O(n²)</span>\nstatic boolean hasDuplicates(String[] a) {\n    for (int i = 0; i &lt; a.length; i++)\n        for (int j = i + 1; j &lt; a.length; j++)\n            if (a[i].equals(a[j])) return true;     <span class=\"c\">// equals, not ==</span>\n    return false;\n}\n<span class=\"c\">// optimal O(n): Set&lt;String&gt; seen = new HashSet&lt;&gt;(); if (!seen.add(s)) return true;</span>\n\n<span class=\"c\">// 2. swap without temp</span>\na = a + b;  b = a - b;  a = a - b;         <span class=\"c\">// may overflow for big ints</span>\na = a ^ b;  b = a ^ b;  a = a ^ b;         <span class=\"c\">// XOR, no overflow</span>\n\n<span class=\"c\">// 3. first 100 Fibonacci numbers — F(100) ≈ 3.5e20 overflows long (max ≈ 9.2e18, after F(92))</span>\nBigInteger a = BigInteger.ONE, b = BigInteger.ONE;\nfor (int i = 0; i &lt; 100; i++) {\n    System.out.println(a);\n    BigInteger t = a.add(b); a = b; b = t;\n}\n\n<span class=\"c\">// 4. reverse a string</span>\nString rev = new StringBuilder(s).reverse().toString();     <span class=\"c\">// or loop from the end</span>\n\n<span class=\"c\">// 5. palindrome</span>\nboolean pal = true;\nfor (int i = 0, j = s.length() - 1; i &lt; j; i++, j--) if (s.charAt(i) != s.charAt(j)) { pal = false; break; }\n\n<span class=\"c\">// 6. prime check</span>\nstatic boolean isPrime(int n) { if (n &lt; 2) return false;\n    for (int i = 2; (long) i * i &lt;= n; i++) if (n % i == 0) return false; return true; }\n\n<span class=\"c\">// 7. factorial (iterative) / GCD (Euclid)</span>\nlong f = 1; for (int i = 2; i &lt;= n; i++) f *= i;           <span class=\"c\">// 21! overflows long</span>\nstatic int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); }\n\n<span class=\"c\">// 8. max and second max in one pass</span>\nint first = Integer.MIN_VALUE, second = Integer.MIN_VALUE;\nfor (int x : arr) { if (x &gt; first) { second = first; first = x; } else if (x &gt; second &amp;&amp; x != first) second = x; }\n\n<span class=\"c\">// 9. FizzBuzz</span>\nfor (int i = 1; i &lt;= 100; i++)\n    System.out.println(i % 15 == 0 ? \"FizzBuzz\" : i % 3 == 0 ? \"Fizz\" : i % 5 == 0 ? \"Buzz\" : String.valueOf(i));\n\n<span class=\"c\">// 10. count character frequency / first non-repeating char</span>\nMap&lt;Character,Integer&gt; m = new LinkedHashMap&lt;&gt;();\nfor (char c : s.toCharArray()) m.merge(c, 1, Integer::sum);\nfor (var e : m.entrySet()) if (e.getValue() == 1) return e.getKey();\n\n<span class=\"c\">// 11. anagram: sort both char arrays and compare, or count letters with int[26]</span>\n<span class=\"c\">// 12. binary search</span>\nint lo = 0, hi = a.length - 1;\nwhile (lo &lt;= hi) { int mid = lo + (hi - lo) / 2;   <span class=\"c\">// avoids overflow of (lo+hi)</span>\n    if (a[mid] == key) return mid; else if (a[mid] &lt; key) lo = mid + 1; else hi = mid - 1; }\nreturn -1;</pre>", "// 1. duplicates — brute force o(n²) static boolean hasduplicates(string[] a) { for (int i = 0; i < a.length; i++) for (int j = i + 1; j < a.length; j++) if (a[i].equals(a[j])) return true; // equals, not == return false; } // optimal o(n): set<string> seen = new hashset<>(); if (!seen.add(s)) return true; // 2. swap without temp a = a + b; b = a - b; a = a - b; // may overflow for big ints a = a ^ b; b = a ^ b; a = a ^ b; // xor, no overflow // 3. first 100 fibonacci numbers — f(100) ≈ 3.5e20 overflows long (max ≈ 9.2e18, after f(92)) biginteger a = biginteger.one, b = biginteger.one; for (int i = 0; i < 100; i++) { system.out.println(a); biginteger t = a.add(b); a = b; b = t; } // 4. reverse a string string rev = new stringbuilder(s).reverse().tostring(); // or loop from the end // 5. palindrome boolean pal = true; for (int i = 0, j = s.length() - 1; i < j; i++, j--) if (s.charat(i) != s.charat(j)) { pal = false; break; } // 6. prime check static boolean isprime(int n) { if (n < 2) return false; for (int i = 2; (long) i * i <= n; i++) if (n % i == 0) return false; return true; } // 7. factorial (iterative) / gcd (euclid) long f = 1; for (int i = 2; i <= n; i++) f *= i; // 21! overflows long static int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); } // 8. max and second max in one pass int first = integer.min_value, second = integer.min_value; for (int x : arr) { if (x > first) { second = first; first = x; } else if (x > second && x != first) second = x; } // 9. fizzbuzz for (int i = 1; i <= 100; i++) system.out.println(i % 15 == 0 ? \"fizzbuzz\" : i % 3 == 0 ? \"fizz\" : i % 5 == 0 ? \"buzz\" : string.valueof(i)); // 10. count character frequency / first non-repeating char map<character,integer> m = new linkedhashmap<>(); for (char c : s.tochararray()) m.merge(c, 1, integer::sum); for (var e : m.entryset()) if (e.getvalue() == 1) return e.getkey(); // 11. anagram: sort both char arrays and compare, or count letters with int[26] // 12. binary search int lo = 0, hi = a.length - 1; while (lo <= hi) { int mid = lo + (hi - lo) / 2; // avoids overflow of (lo+hi) if (a[mid] == key) return mid; else if (a[mid] < key) lo = mid + 1; else hi = mid - 1; } return -1;"], ["<div class=\"tip\">For coding answers: state the approach in one line, write clean code, mention complexity and edge cases (empty input, one element, duplicates, negatives, overflow, null).</div>", "for coding answers: state the approach in one line, write clean code, mention complexity and edge cases (empty input, one element, duplicates, negatives, overflow, null)."]]}]}, {"title": "Hardware, OS, virtualization, cloud & DevOps", "chunks": [{"h": "Hardware basics", "blocks": [["<ul>\n<li><b>CPU</b>: few powerful cores, general-purpose, sequential logic. Clock speed (GHz), cores, threads (hyper-threading), cache L1/L2/L3. 32-bit (max 4 GB addressable) vs 64-bit.</li>\n<li><b>GPU</b> (Graphics Processing Unit): thousands of small cores for <b>massively parallel</b> work (same operation on lots of data). Uses: 3D rendering/gaming, video encoding, <b>machine learning / AI training</b>, scientific simulation, <b>financial risk &amp; Monte Carlo pricing</b>, image processing, crypto mining.</li>\n<li><b>RAM</b>: volatile, fast working memory. <b>Storage</b>: non-volatile — <b>HDD</b> (spinning disk, cheap, slow) vs <b>SSD</b> (flash, fast, no moving parts) vs NVMe (SSD on PCIe, fastest). <b>ROM/BIOS/UEFI</b>: firmware that boots the machine.</li>\n<li>Storage types: <b>DAS</b> (direct attached) · <b>NAS</b> (file-level over network: NFS, SMB) · <b>SAN</b> (block-level storage network). Units: bit, byte = 8 bits, KB, MB, GB, TB (1024 or 1000).</li>\n</ul>", "cpu : few powerful cores, general-purpose, sequential logic. clock speed (ghz), cores, threads (hyper-threading), cache l1/l2/l3. 32-bit (max 4 gb addressable) vs 64-bit. gpu (graphics processing unit): thousands of small cores for massively parallel work (same operation on lots of data). uses: 3d rendering/gaming, video encoding, machine learning / ai training , scientific simulation, financial risk & monte carlo pricing , image processing, crypto mining. ram : volatile, fast working memory. storage : non-volatile — hdd (spinning disk, cheap, slow) vs ssd (flash, fast, no moving parts) vs nvme (ssd on pcie, fastest). rom/bios/uefi : firmware that boots the machine. storage types: das (direct attached) · nas (file-level over network: nfs, smb) · san (block-level storage network). units: bit, byte = 8 bits, kb, mb, gb, tb (1024 or 1000)."], ["<div class=\"tw\"><table>\n<tr><th>RAID</th><th>Technique</th><th>Min disks</th><th>Usable capacity</th><th>Survives</th><th>Use</th></tr>\n<tr><td><b>0</b></td><td>striping</td><td>2</td><td><b>100%</b> (0% loss)</td><td>no failure</td><td>speed, temp data</td></tr>\n<tr><td><b>1</b></td><td>mirroring</td><td>2</td><td>50%</td><td>1 disk (n−1)</td><td>OS disks, safety</td></tr>\n<tr><td><b>5</b></td><td>striping + distributed parity</td><td>3</td><td>(n−1)/n</td><td>1 disk</td><td>balance; slow writes, long rebuild</td></tr>\n<tr><td><b>6</b></td><td>striping + double parity</td><td>4</td><td>(n−2)/n</td><td>2 disks</td><td>large arrays</td></tr>\n<tr><td><b>10</b> (1+0)</td><td>mirrors, then striped</td><td>4</td><td>50%</td><td>1 per mirror pair</td><td>databases: speed + redundancy</td></tr>\n</table></div>", "raid technique min disks usable capacity survives use 0 striping 2 100% (0% loss) no failure speed, temp data 1 mirroring 2 50% 1 disk (n−1) os disks, safety 5 striping + distributed parity 3 (n−1)/n 1 disk balance; slow writes, long rebuild 6 striping + double parity 4 (n−2)/n 2 disks large arrays 10 (1+0) mirrors, then striped 4 50% 1 per mirror pair databases: speed + redundancy"], ["<div class=\"key\">RAID is <b>not a backup</b> — it protects against disk failure, not deletion, corruption or ransomware.</div>", "raid is not a backup — it protects against disk failure, not deletion, corruption or ransomware."]]}, {"h": "Operating system concepts", "blocks": [["<ul>\n<li><b>Kernel</b>: core of the OS — manages CPU scheduling, memory, devices, system calls. <b>User space</b> vs <b>kernel space</b>. Shell = command interpreter (bash).</li>\n<li><b>Process</b> = running program with its own memory space. <b>Thread</b> = unit of execution inside a process, shares its memory (lighter, but needs synchronization). Context switch = CPU switching between them.</li>\n<li><b>Virtual memory</b>: each process sees its own address space; pages mapped to RAM or <b>swap</b> on disk. Heavy swapping = “thrashing” = slow. <b>Page fault</b> = page not in RAM.</li>\n<li><b>Scheduling</b>: FCFS, round robin (time slices), priority, shortest job first.</li>\n<li><b>Deadlock</b> conditions (all four needed): mutual exclusion, hold and wait, no preemption, circular wait. <b>Race condition</b>: result depends on timing. Synchronization: mutex, semaphore, monitor.</li>\n<li><b>IPC</b>: pipes, sockets, shared memory, message queues, signals.</li>\n<li>File systems: ext4, XFS (Linux), NTFS (Windows). <b>Inode</b> = file metadata. Windows vs Linux: <code>\\</code> vs <code>/</code>, CRLF vs LF line endings, case-insensitive vs case-sensitive names.</li>\n</ul>", "kernel : core of the os — manages cpu scheduling, memory, devices, system calls. user space vs kernel space . shell = command interpreter (bash). process = running program with its own memory space. thread = unit of execution inside a process, shares its memory (lighter, but needs synchronization). context switch = cpu switching between them. virtual memory : each process sees its own address space; pages mapped to ram or swap on disk. heavy swapping = “thrashing” = slow. page fault = page not in ram. scheduling : fcfs, round robin (time slices), priority, shortest job first. deadlock conditions (all four needed): mutual exclusion, hold and wait, no preemption, circular wait. race condition : result depends on timing. synchronization: mutex, semaphore, monitor. ipc : pipes, sockets, shared memory, message queues, signals. file systems: ext4, xfs (linux), ntfs (windows). inode = file metadata. windows vs linux: \\ vs / , crlf vs lf line endings, case-insensitive vs case-sensitive names."]]}, {"h": "Virtualization & containers", "blocks": [["<div class=\"tw\"><table>\n<tr><th></th><th>Virtual machine</th><th>Container</th></tr>\n<tr><td>Isolation</td><td>full guest OS with <b>its own kernel</b>, on a hypervisor</td><td><b>shares the host kernel</b>; isolated process (namespaces + cgroups)</td></tr>\n<tr><td>Size / boot</td><td>GBs, minutes</td><td>MBs, seconds</td></tr>\n<tr><td>Examples</td><td>VMware, Hyper-V, KVM, VirtualBox, EC2</td><td>Docker, Podman, containerd</td></tr>\n<tr><td>Best for</td><td>different OSes, strong isolation</td><td>microservices, consistent deployments, density</td></tr>\n</table></div>", "virtual machine container isolation full guest os with its own kernel , on a hypervisor shares the host kernel ; isolated process (namespaces + cgroups) size / boot gbs, minutes mbs, seconds examples vmware, hyper-v, kvm, virtualbox, ec2 docker, podman, containerd best for different oses, strong isolation microservices, consistent deployments, density"], ["<p><b>Hypervisor type 1</b> (bare-metal: ESXi, Hyper-V, KVM) vs <b>type 2</b> (hosted on an OS: VirtualBox, VMware Workstation). <b>Docker</b>: <i>Dockerfile</i> (recipe) → <i>image</i> (read-only template, layers) → <i>container</i> (running instance); <i>registry</i> (Docker Hub, ECR); volumes for persistent data.</p>", "hypervisor type 1 (bare-metal: esxi, hyper-v, kvm) vs type 2 (hosted on an os: virtualbox, vmware workstation). docker : dockerfile (recipe) → image (read-only template, layers) → container (running instance); registry (docker hub, ecr); volumes for persistent data."], ["<pre>FROM eclipse-temurin:17-jre\nWORKDIR /app\nCOPY target/app.jar app.jar\nEXPOSE 8080\nCMD [\"java\", \"-jar\", \"app.jar\"]</pre>", "from eclipse-temurin:17-jre workdir /app copy target/app.jar app.jar expose 8080 cmd [\"java\", \"-jar\", \"app.jar\"]"], ["<p><b>Kubernetes</b> (K8s) <b>orchestrates</b> containers: <b>Pod</b> (smallest unit, 1+ containers sharing network/storage) · <b>Deployment</b> (desired replicas, rolling updates) · <b>ReplicaSet</b> · <b>Service</b> (stable network endpoint/load balancing) · <b>Ingress</b> (HTTP routing) · <b>Namespace</b> · <b>ConfigMap/Secret</b> · <b>Node</b> (worker machine) · control plane. Self-healing, auto-scaling. <code>kubectl get pods</code>, <code>kubectl logs</code>, <code>kubectl describe</code>, <code>kubectl apply -f</code>. <b>Docker + Kubernetes</b> = containerize + orchestrate.</p>", "kubernetes (k8s) orchestrates containers: pod (smallest unit, 1+ containers sharing network/storage) · deployment (desired replicas, rolling updates) · replicaset · service (stable network endpoint/load balancing) · ingress (http routing) · namespace · configmap/secret · node (worker machine) · control plane. self-healing, auto-scaling. kubectl get pods , kubectl logs , kubectl describe , kubectl apply -f . docker + kubernetes = containerize + orchestrate."]]}, {"h": "Cloud computing", "blocks": [["<div class=\"tw\"><table>\n<tr><th>Model</th><th>You manage</th><th>Examples</th></tr>\n<tr><td><b>IaaS</b></td><td>OS, runtime, apps, data</td><td>AWS EC2, Azure VMs, Google Compute Engine</td></tr>\n<tr><td><b>PaaS</b></td><td>apps, data</td><td>AWS Elastic Beanstalk, Azure App Service, Google App Engine, Heroku</td></tr>\n<tr><td><b>SaaS</b></td><td>just use it</td><td>Gmail, Office 365, Salesforce</td></tr>\n<tr><td><b>FaaS / serverless</b></td><td>functions only</td><td>AWS Lambda, Azure Functions, Cloud Functions</td></tr>\n</table></div>", "model you manage examples iaas os, runtime, apps, data aws ec2, azure vms, google compute engine paas apps, data aws elastic beanstalk, azure app service, google app engine, heroku saas just use it gmail, office 365, salesforce faas / serverless functions only aws lambda, azure functions, cloud functions"], ["<p>Deployment models: <b>public</b>, <b>private</b>, <b>hybrid</b>, multi-cloud. Benefits: pay-as-you-go, elasticity, global reach, managed services, no hardware purchase. Concepts: <b>regions</b> and <b>availability zones</b>, <b>auto-scaling</b>, <b>load balancer</b>, <b>VPC</b> (private network), security groups (firewall), IAM (permissions), shared responsibility model.</p>", "deployment models: public , private , hybrid , multi-cloud. benefits: pay-as-you-go, elasticity, global reach, managed services, no hardware purchase. concepts: regions and availability zones , auto-scaling , load balancer , vpc (private network), security groups (firewall), iam (permissions), shared responsibility model."], ["<div class=\"tw\"><table>\n<tr><th>Need</th><th>AWS</th><th>Azure</th><th>Google Cloud</th></tr>\n<tr><td>Virtual machines</td><td>EC2</td><td>Virtual Machines</td><td>Compute Engine</td></tr>\n<tr><td>Serverless</td><td>Lambda</td><td>Functions</td><td>Cloud Functions / Cloud Run</td></tr>\n<tr><td>Kubernetes</td><td>EKS</td><td>AKS</td><td>GKE</td></tr>\n<tr><td>Object storage</td><td>S3</td><td>Blob Storage</td><td>Cloud Storage</td></tr>\n<tr><td>Block storage</td><td>EBS</td><td>Managed Disks</td><td>Persistent Disk</td></tr>\n<tr><td>Managed SQL</td><td>RDS, Aurora</td><td>Azure SQL Database</td><td>Cloud SQL, Spanner</td></tr>\n<tr><td>NoSQL</td><td>DynamoDB</td><td>Cosmos DB</td><td>Firestore, Bigtable</td></tr>\n<tr><td>Data warehouse</td><td>Redshift</td><td>Synapse</td><td>BigQuery</td></tr>\n<tr><td>CI/CD</td><td>CodePipeline, CodeBuild, CodeDeploy</td><td>Azure DevOps Pipelines</td><td>Cloud Build, Cloud Deploy</td></tr>\n<tr><td>Monitoring</td><td>CloudWatch</td><td>Azure Monitor</td><td>Cloud Monitoring</td></tr>\n<tr><td>Identity</td><td>IAM</td><td>Entra ID (Azure AD)</td><td>Cloud IAM</td></tr>\n<tr><td>DNS / CDN</td><td>Route 53 / CloudFront</td><td>Azure DNS / Front Door</td><td>Cloud DNS / Cloud CDN</td></tr>\n<tr><td>Queue / messaging</td><td>SQS, SNS</td><td>Service Bus</td><td>Pub/Sub</td></tr>\n</table></div>", "need aws azure google cloud virtual machines ec2 virtual machines compute engine serverless lambda functions cloud functions / cloud run kubernetes eks aks gke object storage s3 blob storage cloud storage block storage ebs managed disks persistent disk managed sql rds, aurora azure sql database cloud sql, spanner nosql dynamodb cosmos db firestore, bigtable data warehouse redshift synapse bigquery ci/cd codepipeline, codebuild, codedeploy azure devops pipelines cloud build, cloud deploy monitoring cloudwatch azure monitor cloud monitoring identity iam entra id (azure ad) cloud iam dns / cdn route 53 / cloudfront azure dns / front door cloud dns / cloud cdn queue / messaging sqs, sns service bus pub/sub"], ["<p><b>Scaling</b>: <b>vertical</b> (scale up: bigger machine — simple, but limited and a single point of failure) vs <b>horizontal</b> (scale out: more machines behind a load balancer — near-unlimited and fault tolerant, needs stateless apps). <b>High availability</b> = redundancy across zones, failover. <b>Disaster recovery</b>: RPO (max data loss) and RTO (max downtime).</p>", "scaling : vertical (scale up: bigger machine — simple, but limited and a single point of failure) vs horizontal (scale out: more machines behind a load balancer — near-unlimited and fault tolerant, needs stateless apps). high availability = redundancy across zones, failover. disaster recovery : rpo (max data loss) and rto (max downtime)."]]}, {"h": "DevOps & CI/CD", "blocks": [["<ul>\n<li><b>CI</b> (continuous integration): every commit is built and tested automatically. <b>CD</b>: continuous <b>delivery</b> (always deployable, manual release) / continuous <b>deployment</b> (auto to production).</li>\n<li>Pipeline: commit → build → unit tests → static analysis → package (jar / Docker image) → deploy to test → integration/regression tests → deploy to production → monitor.</li>\n<li>Tools: <b>Jenkins</b> (CI server, Jenkinsfile), GitLab CI, GitHub Actions, Azure DevOps, TeamCity · build: <b>Maven</b>/<b>Gradle</b> (Java), npm · artifacts: Nexus, Artifactory · config management: <b>Ansible</b> (agentless, YAML playbooks), Puppet, Chef · <b>Infrastructure as Code</b>: <b>Terraform</b>, CloudFormation · monitoring: Prometheus, Grafana, ELK (Elasticsearch, Logstash, Kibana), Datadog, Splunk.</li>\n<li>Deployment strategies: rolling, <b>blue-green</b> (switch traffic between two environments), <b>canary</b> (small % of users first), feature flags.</li>\n<li><b>Agile/Scrum</b>: sprints (1–4 weeks), product backlog, sprint planning, daily stand-up, review, retrospective; roles: product owner, scrum master, dev team. Kanban: visual board, limit work in progress.</li>\n</ul>", "ci (continuous integration): every commit is built and tested automatically. cd : continuous delivery (always deployable, manual release) / continuous deployment (auto to production). pipeline: commit → build → unit tests → static analysis → package (jar / docker image) → deploy to test → integration/regression tests → deploy to production → monitor. tools: jenkins (ci server, jenkinsfile), gitlab ci, github actions, azure devops, teamcity · build: maven / gradle (java), npm · artifacts: nexus, artifactory · config management: ansible (agentless, yaml playbooks), puppet, chef · infrastructure as code : terraform , cloudformation · monitoring: prometheus, grafana, elk (elasticsearch, logstash, kibana), datadog, splunk. deployment strategies: rolling, blue-green (switch traffic between two environments), canary (small % of users first), feature flags. agile/scrum : sprints (1–4 weeks), product backlog, sprint planning, daily stand-up, review, retrospective; roles: product owner, scrum master, dev team. kanban: visual board, limit work in progress."]]}, {"h": "Data formats & APIs", "blocks": [["<div class=\"tw\"><table>\n<tr><th></th><th>JSON</th><th>XML</th><th>YAML</th></tr>\n<tr><td>Syntax</td><td><code>{\"id\": 1, \"tags\": [\"a\",\"b\"]}</code></td><td><code>&lt;trade id=\"1\"&gt;&lt;tag&gt;a&lt;/tag&gt;&lt;/trade&gt;</code></td><td><code>id: 1</code> (indentation)</td></tr>\n<tr><td>Size / speed</td><td>lighter, faster to parse</td><td>verbose (closing tags), slower</td><td>human-friendly</td></tr>\n<tr><td>Types</td><td>string, number, boolean, null, object, array — <b>no typed/custom object types</b></td><td>everything is text; types via schema (XSD); attributes, namespaces, comments</td><td>like JSON + comments</td></tr>\n<tr><td>Validation</td><td>JSON Schema</td><td>DTD / XSD; query with XPath, transform with XSLT</td><td></td></tr>\n<tr><td>Parsing</td><td>still needs parsing (<code>JSON.parse</code>, Jackson), simpler parser</td><td>XML parser (DOM, SAX)</td><td></td></tr>\n<tr><td>Used in</td><td>REST APIs, config</td><td>SOAP, legacy and finance messages (FpML!), config</td><td>Kubernetes, Ansible, CI files</td></tr>\n</table></div>", "json xml yaml syntax {\"id\": 1, \"tags\": [\"a\",\"b\"]} <trade id=\"1\"><tag>a</tag></trade> id: 1 (indentation) size / speed lighter, faster to parse verbose (closing tags), slower human-friendly types string, number, boolean, null, object, array — no typed/custom object types everything is text; types via schema (xsd); attributes, namespaces, comments like json + comments validation json schema dtd / xsd; query with xpath, transform with xslt parsing still needs parsing ( json.parse , jackson), simpler parser xml parser (dom, sax) used in rest apis, config soap, legacy and finance messages (fpml!), config kubernetes, ansible, ci files"], ["<p>JSON rules: double quotes for keys and strings, no trailing commas, no comments. Comparing two JSON files: key order doesn’t matter semantically — use a JSON-aware diff (<code>jq</code>). <b>REST</b> (HTTP + JSON, stateless, resources) vs <b>SOAP</b> (XML envelope, WSDL contract, stricter). <b>CSV</b> for tabular exchange. Encoding: <b>UTF-8</b>.</p>", "json rules: double quotes for keys and strings, no trailing commas, no comments. comparing two json files: key order doesn’t matter semantically — use a json-aware diff ( jq ). rest (http + json, stateless, resources) vs soap (xml envelope, wsdl contract, stricter). csv for tabular exchange. encoding: utf-8 ."]]}]}, {"title": "Extra concepts from the 2026 Assessment paper", "chunks": [{"h": "Overview", "blocks": [["<p class=\"lead\">Topics the second paper asks about that the first one didn’t: web storage, Python, JVM internals, security, hypervisors, ISTQB test theory, more SQL syntax, and algorithmic pseudo-code.</p>", "topics the second paper asks about that the first one didn’t: web storage, python, jvm internals, security, hypervisors, istqb test theory, more sql syntax, and algorithmic pseudo-code."]]}, {"h": "Web: localStorage, sessionStorage, cookies, JSON", "blocks": [["<div class=\"tw\"><table>\n<tr><th></th><th>localStorage</th><th>sessionStorage</th><th>Cookies</th></tr>\n<tr><td>Lifetime</td><td><b>Persistent</b>: survives closing the window or browser, until cleared</td><td>Until the <b>tab</b> closes (one session)</td><td>Until expiry date (or session cookie)</td></tr>\n<tr><td>Scope</td><td><b>Shared across all tabs/windows</b> of the same origin</td><td>Only that tab</td><td>Domain/path</td></tr>\n<tr><td>Size</td><td>~5–10 MB</td><td>~5 MB</td><td>~4 KB</td></tr>\n<tr><td>Sent to server?</td><td>No</td><td>No</td><td><b>Yes</b>, with every request</td></tr>\n<tr><td>API</td><td colspan=\"2\"><code>setItem(k, v)</code>, <code>getItem(k)</code>, <code>removeItem</code>, <code>clear()</code>. Strings only, so store objects with <code>JSON.stringify</code></td><td><code>document.cookie</code>, <code>HttpOnly</code>, <code>Secure</code>, <code>SameSite</code></td></tr>\n</table></div>", "localstorage sessionstorage cookies lifetime persistent : survives closing the window or browser, until cleared until the tab closes (one session) until expiry date (or session cookie) scope shared across all tabs/windows of the same origin only that tab domain/path size ~5–10 mb ~5 mb ~4 kb sent to server? no no yes , with every request api setitem(k, v) , getitem(k) , removeitem , clear() . strings only, so store objects with json.stringify document.cookie , httponly , secure , samesite"], ["<p><code>JSON.parse(text)</code> → object · <code>JSON.stringify(obj)</code> → text. <code>eval</code> also runs code, so never use it for parsing (security risk).</p>", "json.parse(text) → object · json.stringify(obj) → text. eval also runs code, so never use it for parsing (security risk)."]]}, {"h": "Python traps", "blocks": [["<pre>def f(x, y=[]):         <span class=\"c\"># default evaluated ONCE at definition → shared mutable list</span>\n    y.append(x); return y\nf(1) → [1]   f(2) → [1, 2]   f(3, []) → [3]   f(4) → [1, 2, 4]\n<span class=\"c\"># fix: def f(x, y=None): y = [] if y is None else y</span>\n\nb = a            <span class=\"c\"># same list object (alias); a.copy() / a[:] / list(a) = shallow copy</span>\n7 // 2 = 3   -7 // 2 = -4 (floor)   7 / 2 = 3.5 (always float)   2 ** 10 = 1024\n\"ab\" * 3 = \"ababab\"     [0] * 3 = [0, 0, 0]\nis  → same object         ==  → equal value\ns[::-1] reverses   len(), range(0, 5) → 0..4   for i, v in enumerate(lst)\nNone, 0, \"\", [], {} are falsy     int is unbounded (no overflow)\ntry / except ValueError as e / finally     with open(\"f\") as fh:  (auto-close)</pre>", "def f(x, y=[]): # default evaluated once at definition → shared mutable list y.append(x); return y f(1) → [1] f(2) → [1, 2] f(3, []) → [3] f(4) → [1, 2, 4] # fix: def f(x, y=none): y = [] if y is none else y b = a # same list object (alias); a.copy() / a[:] / list(a) = shallow copy 7 // 2 = 3 -7 // 2 = -4 (floor) 7 / 2 = 3.5 (always float) 2 ** 10 = 1024 \"ab\" * 3 = \"ababab\" [0] * 3 = [0, 0, 0] is → same object == → equal value s[::-1] reverses len(), range(0, 5) → 0..4 for i, v in enumerate(
