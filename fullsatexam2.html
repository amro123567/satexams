<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amro Academy – Full SAT Practice Test 2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* =========================================================
   THEME
   ========================================================= */
:root{
  --sky:#87CEEB; --sky-light:#e8f6fc; --sky-soft:#cdebf7; --sky-dark:#3a9fd1; --sky-deep:#1d6a96;
  --ink:#1b1b1b; --muted:#5f6b75; --line:#d5dde3; --bg:#ffffff;
  --green:#1e8e3e; --green-bg:#e6f4ea; --red:#c5221f; --red-bg:#fce8e6; --amber:#b06000;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}

/* ---------- Top bar ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 20px;background:var(--sky-light);border-bottom:1px solid var(--sky-soft)}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.tb-left img{height:44px;width:auto;border-radius:6px}
.brand{font-weight:700;font-size:15px;color:var(--sky-deep);white-space:nowrap}
.sec-label{font-size:14px;color:var(--ink);margin-top:2px}
.tb-center{display:flex;flex-direction:column;align-items:center}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.low{color:var(--red)}
.link-btn{background:none;border:1px solid var(--line);border-radius:14px;font-size:12px;padding:2px 12px;margin-top:3px;color:var(--ink)}
.link-btn:hover{border-color:var(--sky-dark)}
.tb-right{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tool-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.tool-btn:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.tool-btn.primary{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.tool-btn.primary:hover:not(:disabled){background:var(--sky-deep)}
.tool-btn.danger{color:var(--red)}
.tool-btn.success{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Module tabs ---------- */
.module-tabs{display:flex;align-items:center;gap:6px;padding:8px 20px 0}
.module-tabs .tab{border:1px solid var(--line);border-bottom:none;background:#f6f8fa;padding:8px 18px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px;color:var(--muted)}
.module-tabs .tab:disabled{opacity:1;cursor:default}
.module-tabs .tab.active{background:var(--sky);color:#0c3a52;border-color:var(--sky)}
.status-pill{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#f1f3f4;color:var(--muted)}
.status-pill.ok{background:var(--green-bg);color:var(--green)}
.dash-line{height:0;border-top:3px dashed var(--sky);margin:0 0 0}

/* ---------- Main ---------- */
main{flex:1;overflow:auto;padding:0 0 24px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.q-wrap{display:grid;grid-template-columns:1fr;gap:0;margin-top:20px}
.q-wrap.spr{grid-template-columns:minmax(260px,1fr) 1.3fr}
.spr-dir{padding:4px 28px 20px 4px;border-right:3px solid var(--sky-soft);font-size:14.5px;line-height:1.6}
.spr-dir h3{margin:4px 0 10px;font-size:16px}
.spr-dir ul{padding-left:18px;margin:0 0 12px}
.spr-dir li{margin-bottom:6px}
.ex-table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
.ex-table th,.ex-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ex-table th{background:var(--sky-light)}
.q-main{max-width:760px;width:100%;margin:0 auto;padding:0 4px}
.q-wrap.spr .q-main{padding-left:28px;margin:0}
.q-head{display:flex;align-items:center;gap:10px;background:#eef1f4;border-bottom:2px dashed #9aa5ad;padding:0 8px 0 0;margin-bottom:18px;min-height:40px}
.q-num{background:#111;color:#fff;font-weight:700;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:17px}
.flag-btn,.hint-btn{background:none;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;color:var(--ink)}
.flag-btn:hover,.hint-btn:hover{background:#e1e6ea}
.flag-btn.on{color:#b3261e}
.flag-icon{display:inline-block;width:14px;height:16px}
.hint-btn{color:var(--sky-deep);border:1px solid var(--sky);background:#fff}
.hint-btn:hover{background:var(--sky-light)}
.hint-btn.on{background:var(--sky);color:#0c3a52}
.spacer{flex:1}
.abc-btn{border:1px solid #444;background:#fff;border-radius:5px;padding:3px 6px;font-size:13px;font-weight:700;text-decoration:line-through}
.abc-btn.on{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
.q-text{font-size:17px;line-height:1.7;margin-bottom:20px}
.q-text .katex-display{margin:.6em 0}
.data-table{border-collapse:collapse;margin:12px auto;font-size:15px}
.data-table th,.data-table td{border:1px solid #8b959c;padding:6px 14px;text-align:center}
.data-table thead th{background:var(--sky-light)}

/* ---------- Choices ---------- */
.choices{display:flex;flex-direction:column;gap:12px}
.choice-row{display:flex;align-items:center;gap:10px}
.choice{flex:1;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid #5f6b75;border-radius:var(--radius);padding:12px 14px;font-size:16px;color:var(--ink);transition:background .12s,border-color .12s;position:relative}
.choice:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.choice .letter{flex:none;width:28px;height:28px;border:1.5px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.choice.selected{border:3px solid var(--sky-dark);background:var(--sky-light);padding:10.5px 12.5px}
.choice.selected .letter{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.choice:disabled{opacity:1;cursor:default}
.choice.eliminated,.choice.eliminated:disabled{opacity:.45}
.choice.eliminated::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:2px solid #222}
.choice.correct{border:3px solid var(--green);background:var(--green-bg);padding:10.5px 12.5px}
.choice.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong{border:3px solid var(--red);background:var(--red-bg);padding:10.5px 12.5px}
.choice.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag.g{background:var(--green);color:#fff}.tag.r{background:var(--red);color:#fff}
.elim-btn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #333;background:#fff;font-weight:700;font-size:13px;text-decoration:line-through;position:relative}
.elim-btn:hover{background:#f1f1f1}
.elim-undo{flex:none;background:none;border:none;text-decoration:underline;font-weight:700;font-size:13px;width:44px}

/* ---------- SPR ---------- */
.spr-input{width:200px;font-size:20px;padding:10px 12px;border:1.5px solid #5f6b75;border-radius:8px;border-bottom:3px solid #222;font-family:inherit}
.spr-input:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px var(--sky-soft)}
.spr-input:disabled{background:#f6f8fa}
.spr-input.correct{border-color:var(--green);background:var(--green-bg)}
.spr-input.wrong{border-color:var(--red);background:var(--red-bg)}
.preview{margin-top:12px;font-size:15px;color:var(--muted);min-height:34px}
.preview b{color:var(--ink)}
.preview .pv{font-size:20px;color:var(--ink);margin-left:6px}

/* ---------- Tools under question ---------- */
.q-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.timer-btn{background:#fff;border:1.5px solid var(--sky-dark);color:var(--sky-deep);border-radius:20px;padding:6px 16px;font-weight:600;font-size:14px}
.timer-btn.running{background:var(--sky-dark);color:#fff}
.q-clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.q-clock-label{font-size:13px;color:var(--muted)}
.hint-box{margin-top:16px;background:var(--sky-light);border:1px solid var(--sky);border-left:5px solid var(--sky-dark);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6}
.hint-box .hint{margin-bottom:8px}
.hint-box .hint b{color:var(--sky-deep)}
.small-btn{background:#fff;border:1px solid var(--sky-dark);color:var(--sky-deep);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.review-box{margin-top:16px;border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6;border:1px solid var(--line);background:#fafbfc}
.status-badge{display:inline-block;font-weight:700;padding:4px 12px;border-radius:14px;margin-bottom:8px}
.status-badge.correct{background:var(--green-bg);color:var(--green)}
.status-badge.wrong{background:var(--red-bg);color:var(--red)}
.status-badge.unanswered{background:#fef7e0;color:var(--amber)}
.ans-g{color:var(--green);font-weight:700}.ans-r{color:var(--red);font-weight:700}

/* ---------- Results panel ---------- */
.results{margin-top:18px;border:1px solid var(--sky);border-radius:12px;background:linear-gradient(180deg,var(--sky-light),#fff 120px);padding:16px 20px}
.results-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:20px;color:var(--sky-deep)}
.big-score{font-size:30px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.rtable th,.rtable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.rtable th{background:var(--sky-light)}
.rtable tr.clickable{cursor:pointer}
.rtable tr.clickable:hover td{background:var(--sky-light)}
.res-correct{color:var(--green);font-weight:700}.res-wrong{color:var(--red);font-weight:700}.res-unanswered{color:var(--amber);font-weight:700}
details summary{cursor:pointer;font-weight:600;margin:10px 0 8px;color:var(--sky-deep)}
.table-scroll{overflow-x:auto}

/* ---------- Bottom bar ---------- */
.bottombar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 20px;border-top:3px dashed var(--sky);background:var(--sky-light)}
.student{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-pill{background:#111;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:14px}
.nav-pill:hover{background:#333}
.bb-right{display:flex;gap:10px;justify-content:flex-end}
.nav-btn{background:var(--sky-dark);color:#fff;border:none;border-radius:22px;padding:10px 26px;font-weight:700;font-size:15px}
.nav-btn:hover:not(:disabled){background:var(--sky-deep)}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.overlay.lock{background:var(--sky-light)}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sky-light);position:sticky;top:0}
.modal-head h3{margin:0;font-size:18px}
.x-btn{background:none;border:none;font-size:24px;line-height:1;color:var(--muted)}
.modal-body{padding:18px 20px;font-size:15px;line-height:1.6}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.name-input{width:100%;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-top:8px}
.name-input:focus{outline:none;border-color:var(--sky-dark)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin:14px 0}
.nav-cell{position:relative;height:44px;border:2px dashed #555;background:#fff;font-weight:700;font-size:15px;border-radius:4px;color:var(--sky-deep)}
.nav-cell.answered{border:2px solid var(--sky-dark);background:var(--sky-dark);color:#fff}
.nav-cell.current{outline:3px solid #111;outline-offset:2px}
.nav-cell.flagged::after{content:"";position:absolute;top:-7px;right:-7px;width:14px;height:14px;background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)}
.nav-cell.c{background:var(--green);border:2px solid var(--green);color:#fff}
.nav-cell.w{background:var(--red);border:2px solid var(--red);color:#fff}
.nav-cell.u{background:#fef7e0;border:2px solid var(--amber);color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:3px;display:inline-block}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ref-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdfe}
.ref-item b{display:block;margin-bottom:4px;color:var(--sky-deep)}
.list-q{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px;font-weight:600}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.err{background:var(--red-bg);color:var(--red)}
.msg.info{background:var(--sky-light);color:var(--sky-deep)}
.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:10px;z-index:60;font-weight:600;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}

/* ---------- Reading and Writing passages ---------- */
.passage{font-size:16.5px;line-height:1.75}
.passage p{margin:0 0 12px}
.passage ul{margin:6px 0 0;padding-left:20px}
.passage li{margin-bottom:6px}
.passage .data-table{margin:4px 0 12px}
.passage caption{font-weight:700;font-size:14px;margin-bottom:6px;text-align:left}
.blank{letter-spacing:1px;font-weight:600}
.module-tabs{flex-wrap:wrap}

/* ---------- Question timer (top bar) ---------- */
.q-head{flex-wrap:wrap;row-gap:6px}
.qtimer{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:18px;padding:5px 12px;font-weight:700;font-size:13.5px;line-height:1}
.qtimer:hover:not(:disabled){background:var(--sky-light)}
.qtimer .qt-clock{font-variant-numeric:tabular-nums;font-size:14px;padding-left:7px;border-left:1.5px solid currentColor;opacity:.9}
.qtimer.running{background:var(--sky-dark);color:#fff}
.qtimer.running:hover{background:var(--sky-deep)}
.qtimer.running .qt-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:qtblink 1s steps(2) infinite}
.qtimer.idle{animation:qtpulse 1.8s ease-in-out infinite}
@keyframes qtpulse{0%,100%{box-shadow:0 0 0 0 rgba(58,159,209,.5)}50%{box-shadow:0 0 0 7px rgba(58,159,209,0)}}
@keyframes qtblink{50%{opacity:.2}}
.qtimer kbd{font:600 11px inherit;border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.7}
.qtimer.running kbd{display:none}

/* ---------- Freeze / overtime / review navigation ---------- */
.tool-btn.frozen{background:#dff3fb;border-color:var(--sky-dark);color:var(--sky-deep)}
.timer.frozen{color:var(--sky-dark)}
.timer.over{color:var(--red)}
.timer-sub{font-size:11px;font-weight:700;color:var(--sky-deep);letter-spacing:.4px;text-transform:uppercase;min-height:14px}
.late-badge{font-size:12px;font-weight:700;color:var(--amber);background:#fef7e0;border:1px solid #f3d27a;border-radius:12px;padding:2px 9px;white-space:nowrap}
.late-badge[hidden]{display:none}
.nav-cell.late::before{content:"⏰";position:absolute;bottom:-10px;left:-8px;font-size:12px}
.review-nav{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--sky);border-radius:12px;padding:10px 12px;margin-top:16px;box-shadow:0 4px 14px rgba(29,106,150,.10)}
.rv-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.rv-m{font-size:12px;font-weight:700;color:var(--muted);width:26px}
.rv-chip{width:30px;height:28px;border-radius:6px;border:none;font-size:12px;font-weight:700;color:#fff;position:relative;padding:0}
.rv-chip.c{background:var(--green)}.rv-chip.w{background:var(--red)}
.rv-chip.u{background:#fef7e0;color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber)}
.rv-chip.cur{outline:3px solid #111;outline-offset:1px}
.rv-chip.late::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 1px #8a5a00}
.rv-chip:hover{filter:brightness(1.1)}
.rv-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:14px}
.rv-actions label{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;color:var(--muted);cursor:pointer}
.rv-tip{font-size:12px;color:var(--muted);margin-top:4px}
.q-wrap{animation:qfade .18s ease}
@keyframes qfade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .topbar{grid-template-columns:1fr auto;grid-template-areas:"l c" "r r"}
  .tb-left{grid-area:l}.tb-center{grid-area:c}.tb-right{grid-area:r;justify-content:flex-start}
  .q-wrap.spr{grid-template-columns:1fr}
  .spr-dir{order:2;border-right:none;border-top:3px solid var(--sky-soft);padding:14px 0 0;margin-top:20px;font-size:13.5px}
  .q-wrap.spr .q-main{padding-left:4px}
}
@media (max-width:560px){
  .topbar,.bottombar,.module-tabs{padding-left:12px;padding-right:12px}
  .wrap{padding:0 12px}
  .brand{font-size:13px;white-space:normal}
  .tb-left img{height:36px}
  .timer{font-size:18px}
  .tool-btn{padding:6px 9px;font-size:12px}
  .bottombar{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "s r"}
  .student{grid-area:s}.nav-pill{grid-area:n;justify-self:center}.bb-right{grid-area:r}
  .nav-btn{padding:8px 18px}
  .q-text{font-size:16px}
  .choice{font-size:15px}
}
</style>
</head>
<body>

<!-- ============================ TOP BAR ============================ -->
<header class="topbar">
  <div class="tb-left">
    <img src="image.png" alt="Amro Academy logo" onerror="this.style.display='none'">
    <div>
      <div class="brand">Amro Academy – Full SAT Practice Test 2</div>
      <div class="sec-label" id="secLabel">Section 2, Module 1: Math</div>
    </div>
  </div>
  <div class="tb-center">
    <div class="timer" id="moduleTimer">35:00</div>
    <div class="timer-sub" id="timerSub"></div>
    <button class="link-btn" id="hideTimerBtn">Hide</button>
  </div>
  <div class="tb-right">
    <button class="tool-btn" id="directionsBtn">Directions</button>
    <button class="tool-btn" id="refBtn">Reference</button>
    <button class="tool-btn primary" id="submitBtn">Submit Exam</button>
    <button class="tool-btn danger" id="resetBtn">Reset Exam</button>
  </div>
</header>

<nav class="module-tabs">
  <button class="tab" data-module="1">Reading &amp; Writing 1</button>
  <button class="tab" data-module="2">Reading &amp; Writing 2</button>
  <button class="tab" data-module="3">Math 1</button>
  <button class="tab" data-module="4">Math 2</button>
  <span class="status-pill" id="statusPill">In progress</span>
</nav>
<div class="dash-line"></div>

<!-- ============================ MAIN ============================ -->
<main id="main">
  <div class="wrap">
    <div id="results"></div>
    <div id="questionArea"></div>
  </div>
</main>

const QUESTIONS = [{"id":"h_rw1q1","module":1,"number":1,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>In her study of medieval trade records, historian Leila Mansour found that merchants' account books were far from <span class=\"blank\">______<\/span>: rather than recording every transaction, many merchants noted only unusually large sales, leaving most everyday exchanges undocumented.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["ambiguous","exhaustive","conventional","obsolete"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw1q2","module":1,"number":2,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Because the two species of finch look nearly identical, early naturalists treated them as a single species. Only after researchers analyzed the birds' songs, which differ markedly in rhythm and pitch, did the distinction between the species become <span class=\"blank\">______<\/span>.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["arbitrary","apparent","obscured","negligible"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw1q3","module":1,"number":3,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Agronomist Tomás Ferreira found that the benefits of the new fertilizer were <span class=\"blank\">______<\/span> the type of soil in which it was used: it greatly increased crop yields in clay soils but had almost no measurable effect in sandy ones.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["contingent on","indifferent to","detrimental to","independent of"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw1q4","module":1,"number":4,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The following text is from a novel. Mr. Hale had long cultivated a reputation for frankness, but his letters to his sister reveal a man who <u>weighed<\/u> every word, afraid that a careless phrase might be repeated in town and used against him.<\/p>","question":"As used in the text, what does the word “weighed” most nearly mean?","choices":["outnumbered","carefully considered","placed a burden on","measured the heaviness of"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw1q5","module":1,"number":5,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>Mycologist Ana Ruiz and her colleagues found that fungal networks connecting the roots of neighboring trees can transfer small amounts of carbon from one tree to another. Some popular accounts have described these networks as a way for older trees to deliberately “nurture” their seedlings. <u>Ruiz cautions, however, that the transfers measured so far are small and that no study has shown that trees control where the carbon goes.<\/u><\/p>","question":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It explains the method Ruiz and her colleagues used to measure carbon transfers.","It argues that fungal networks provide no benefit to the trees they connect.","It presents new data that contradict Ruiz's finding that carbon moves between trees.","It qualifies a popular interpretation of the research by noting the limits of the existing evidence."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q6","module":1,"number":6,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>The following text is from a short story. For thirty years, Mrs. Okafor had kept the shop's ledger in pencil, so that every mistake could be erased. When her son brought her a laptop and proudly showed her the spreadsheet he had built, she watched politely and nodded at the neat columns of numbers. That evening, after he had gone home, she opened the ledger again and sharpened her pencil.<\/p>","question":"Which choice best states the main purpose of the text?","choices":["To explain why records kept in pencil are more accurate than digital records","To suggest that Mrs. Okafor is unable to understand how computers work","To portray Mrs. Okafor's quiet attachment to a familiar way of doing her work","To describe an argument between Mrs. Okafor and her son about the shop's finances"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q7","module":1,"number":7,"domain":"Craft and Structure","skill":"Cross-text connections","type":"mcq","passage":"<p><b>Text 1<\/b><br>For decades, conservation biologists attributed the decline of the meadow pipit, a small grassland bird, almost entirely to habitat loss. As farms expanded and meadows were plowed, the reasoning went, the birds simply had fewer places to nest and feed.<\/p><p><b>Text 2<\/b><br>In a ten-year study, ecologist Priya Nair found that pipit populations also fell sharply in protected meadows that had not lost any area, but only in meadows next to farmland treated with insecticides. Nair concludes that the loss of the insects pipits feed their chicks has contributed to the decline alongside habitat loss.<\/p>","question":"Based on the texts, how would Nair (Text 2) most likely respond to the view of the conservation biologists described in Text 1?","choices":["By claiming that pipits have adapted to feeding on farmland treated with insecticides","By arguing that habitat loss has had no effect on pipit populations","By agreeing that protected meadows are the only places where pipits remain safe from decline","By acknowledging that habitat loss has played a role while arguing that it does not fully explain the decline"],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q8","module":1,"number":8,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>Desert ants that forage far from their nest can return home in a nearly straight line, even across featureless sand. To test whether the ants judge distance by counting their steps, researchers attached tiny stilts to the legs of some ants after they had reached a food source, lengthening their stride. On the way home, ants on stilts walked past the nest, while ants whose legs had been shortened stopped well before reaching it.<\/p>","question":"Which choice best states the main idea of the text?","choices":["Desert ants rely mainly on landmarks to find their way back to the nest.","Researchers have found that desert ants cannot travel far from their nest without becoming lost.","An experiment suggests that desert ants keep track of the distance they travel by monitoring their steps.","Desert ants walk more slowly when their legs are made longer or shorter."],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q9","module":1,"number":9,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>Architect Sofia Lindqvist designs schools in which classrooms are arranged around a large shared space rather than along long corridors, with the goal of encouraging teachers to work together. In a three-year study of four of her schools, teachers reported collaborating far more often than teachers at nearby schools with traditional layouts. Students' test scores, however, did not differ significantly between the two groups of schools.<\/p>","question":"According to the text, what did the study of Lindqvist's schools find?","choices":["Teachers reported more collaboration, but students' test scores were not significantly different from those at traditional schools.","Teachers preferred traditional layouts because the shared spaces made collaboration more difficult.","Students' test scores improved even though teachers collaborated less than they did at traditional schools.","Both teacher collaboration and students' test scores increased compared with traditional schools."],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw1q10","module":1,"number":10,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>Urban red foxes tend to approach humans more readily than rural foxes do. Ecologist Daniel Osei hypothesizes that this boldness develops because urban foxes are regularly exposed to people as they grow up, rather than because naturally bold foxes are more likely to move into cities in the first place.<\/p>","question":"Which finding, if true, would most directly support Osei's hypothesis?","choices":["Urban foxes are bolder than rural foxes in every city where the two groups have been compared.","Urban foxes obtain a larger share of their food from human sources than rural foxes do.","Cubs born to cautious parents in the city become bolder as they mature, while their siblings raised in rural areas remain cautious.","Rural foxes that move into cities are already bolder than rural foxes that remain in the countryside."],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q11","module":1,"number":11,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>In a poem, the speaker describes walking through an orchard in the middle of winter. A student claims that the speaker sees the bare orchard as preparing for renewal rather than as lifeless.<\/p>","question":"Which quotation from the poem most effectively illustrates the student's claim?","choices":["“Each branch, though bare, holds fast its folded buds,”","“The frost lies white upon the silent rows,”","“No birds now sing where summer apples hung,”","“The wind moves slowly through the empty trees.”"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw1q12","module":1,"number":12,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<p><table class=\"data-table\"><caption>Average Reaction Time by Caffeine Dose<\/caption><thead><tr><th>Caffeine dose<\/th><th>Average reaction time (milliseconds)<\/th><\/tr><\/thead><tbody><tr><td>0 mg<\/td><td>312<\/td><\/tr><tr><td>100 mg<\/td><td>289<\/td><\/tr><tr><td>200 mg<\/td><td>284<\/td><\/tr><tr><td>400 mg<\/td><td>296<\/td><\/tr><\/tbody><\/table><\/p><p>Researchers concluded that moderate doses of caffeine shortened participants' reaction times but that the benefit did not continue to grow at the highest dose tested.<\/p>","question":"Which choice best describes data from the table that support the researchers' conclusion?","choices":["Average reaction time fell from 312 milliseconds with no caffeine to 284 milliseconds at 200 mg but rose to 296 milliseconds at 400 mg.","The longest average reaction time was recorded for participants who received no caffeine.","Participants who received 400 mg of caffeine had a shorter average reaction time than participants who received no caffeine.","Average reaction time was 289 milliseconds at 100 mg and 284 milliseconds at 200 mg."],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw1q13","module":1,"number":13,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<p><table class=\"data-table\"><caption>Percentage of Surveyed Adults Who Read Books in Each Format<\/caption><thead><tr><th>Year<\/th><th>Print books<\/th><th>E-books<\/th><\/tr><\/thead><tbody><tr><td>2014<\/td><td>65%<\/td><td>28%<\/td><\/tr><tr><td>2018<\/td><td>67%<\/td><td>25%<\/td><\/tr><tr><td>2022<\/td><td>64%<\/td><td>30%<\/td><\/tr><\/tbody><\/table><\/p><p>A student argues that the survey results do not show e-books steadily replacing print books over the period studied.<\/p>","question":"Which choice most effectively uses data from the table to support the student's argument?","choices":["From 2014 to 2018, the percentage of adults reading print books rose from 65% to 67%, while the percentage reading e-books fell from 28% to 25%.","In each year of the survey, a greater percentage of adults read print books than read e-books.","The percentage of adults reading e-books was highest in 2022, at 30%.","From 2018 to 2022, the percentage of adults reading print books fell from 67% to 64%, while the percentage reading e-books rose from 25% to 30%."],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw1q14","module":1,"number":14,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>Caterpillars of one moth species feed on a plant that produces a bitter toxin, which the caterpillars store in their bodies. In a laboratory study, adult moths that had fed on the plant as caterpillars were rarely eaten when offered to birds, whereas adult moths that had been raised on a toxin-free diet were frequently eaten. These results suggest that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["the plant's toxin harms the caterpillars that feed on it.","adult moths avoid laying their eggs on plants that produce the toxin.","birds are unable to see moths that fed on the plant as caterpillars.","the moths gain protection from predators as adults from the toxin they consume as caterpillars."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q15","module":1,"number":15,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>Scholars have long debated whether an anonymous eighteenth-century pamphlet was written by the essayist Thomas Reade, whose other works it closely resembles in style. A recently discovered letter shows that the pamphlet was first printed in March 1752. Reade's diary, however, records that he was at sea from January through June of that year and had no way of sending manuscripts to printers. If both the letter and the diary are accurate, it is most reasonable to conclude that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["Reade's diary is an unreliable record of where he traveled.","Reade could not have been the author of the pamphlet.","if Reade wrote the pamphlet, he completed it before his voyage began.","the pamphlet was printed without the knowledge of its author."],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q16","module":1,"number":16,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The research team spent three seasons mapping the canyon <span class=\"blank\">______<\/span> its deepest point, they found, lies nearly two kilometers below the rim.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["canyon,","canyon, which","canyon","canyon;"],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q17","module":1,"number":17,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>The decision by the city's transportation officials to extend the subway line, after years of debate among residents, business owners, and local planners, <span class=\"blank\">______<\/span> widely praised when it was announced.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["was","have been","are","were"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw1q18","module":1,"number":18,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Each of the beetle species in the museum's collection has <span class=\"blank\">______<\/span> own distinctive pattern of spots, which entomologists use to tell the species apart.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["it's","their","its","they're"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q19","module":1,"number":19,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The novelist's latest book, a story told entirely through <span class=\"blank\">______<\/span> has been praised for its inventive structure.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["letters—","letters,","letters;","letters"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw1q20","module":1,"number":20,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>According to current projections, by the end of the decade the observatory <span class=\"blank\">______<\/span> more than ten thousand previously unknown asteroids.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["had cataloged","has cataloged","catalogs","will have cataloged"],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q21","module":1,"number":21,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The expedition's supplies included rope, which was rated for heavy <span class=\"blank\">______<\/span> lanterns, which ran on oil; and detailed maps of the region's caves.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["loads,","loads;","loads:","loads"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw1q22","module":1,"number":22,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Early studies suggested that the drug lowered blood pressure in nearly all patients. <span class=\"blank\">______<\/span> later trials involving larger and more diverse groups found that it was effective mainly in patients under sixty.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Consequently,","Moreover,","Likewise,","However,"],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q23","module":1,"number":23,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Hummingbirds burn energy faster than almost any other bird, and a long, cold night without feeding could be fatal. <span class=\"blank\">______<\/span> many species enter torpor at night, a state in which their body temperature and heart rate fall sharply to conserve energy.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Similarly,","Thus,","Nevertheless,","Meanwhile,"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw1q24","module":1,"number":24,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>The museum's new exhibit was designed with young visitors in mind. Its labels are written in plain language, and many of its displays can be touched. <span class=\"blank\">______<\/span> the exhibit includes a reading corner stocked with picture books about each of the objects on display.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Regardless,","Instead,","Additionally,","Specifically,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q25","module":1,"number":25,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Astronomers have found two planets orbiting the same star.<\/li><li>Planet b completes one orbit around the star every 4 days.<\/li><li>Planet c completes one orbit around the star about every 300 days.<\/li><li>Both planets were detected by measuring the dimming of the star as each planet passed in front of it.<\/li><\/ul>","question":"The student wants to emphasize a difference between the two planets. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Planet c completes one orbit around its star about every 300 days.","Astronomers have found two planets, b and c, orbiting the same star.","Planet b completes an orbit around its star in just 4 days, whereas planet c takes about 300 days.","Both planets were detected by measuring how the star dimmed as each planet passed in front of it."],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw1q26","module":1,"number":26,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Researchers recorded about 1,200 hours of songs from humpback whale populations in the South Pacific.<\/li><li>They used software to divide each song into individual sound units and classify them.<\/li><li>They found that songs change gradually over time.<\/li><li>New song patterns often appeared first in one population and later in neighboring populations.<\/li><\/ul>","question":"The student wants to explain how the researchers analyzed their recordings. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["New song patterns often appeared in one whale population before spreading to neighboring ones.","Humpback whale songs change gradually over time, the researchers found.","The researchers recorded about 1,200 hours of humpback whale songs in the South Pacific.","The researchers used software to divide the songs in their 1,200 hours of recordings into individual sound units and classify them."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw1q27","module":1,"number":27,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Quipus are devices made of knotted cords.<\/li><li>They were used in the Inca Empire to keep records.<\/li><li>The position and type of each knot represented numbers in a base-ten system.<\/li><li>Researchers continue to debate whether some quipus recorded words as well as numbers.<\/li><\/ul>","question":"The student wants to introduce quipus to an audience unfamiliar with them. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Quipus—devices made of knotted cords—were used in the Inca Empire to keep records.","Researchers continue to debate whether some quipus recorded words as well as numbers.","Quipus used a base-ten system, and some may have recorded words.","The position and type of each knot on a quipu represented a number."],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q1","module":2,"number":1,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Microbiologists had assumed that the cave's bacterial community was <span class=\"blank\">______<\/span>, cut off from the outside world for millions of years. Genetic analysis, however, revealed several species closely related to bacteria found in the soil above the cave.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["diverse","fragile","isolated","dormant"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q2","module":2,"number":2,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Critics who expected the director's new film to be as <span class=\"blank\">______<\/span> as her earlier work were surprised by its restraint: the film is quiet and spare, built from long, nearly silent scenes in which little seems to happen.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["understated","flamboyant","contemplative","subtle"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q3","module":2,"number":3,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>Although the theory was admired for its elegance, it rested on assumptions that proved <span class=\"blank\">______<\/span> once researchers could test them directly: several of its central predictions were contradicted by the first precise measurements.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["corroborated","untenable","inconsequential","prescient"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q4","module":2,"number":4,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The diplomat's statement was notably <span class=\"blank\">______<\/span>: it expressed regret for the misunderstanding and promised further talks, but it was worded so as to avoid any admission that her government had acted wrongly.<\/p>","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":["circumspect","belligerent","impetuous","candid"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q5","module":2,"number":5,"domain":"Craft and Structure","skill":"Words in context","type":"mcq","passage":"<p>The following text is from a novel. The village had never trusted Mr. Ashby's schemes, but his latest proposal—a reservoir to supply the valley during dry years—was so plainly sensible that even his oldest critics could find no grounds on which to <u>arrest<\/u> it.<\/p>","question":"As used in the text, what does the word “arrest” most nearly mean?","choices":["seize","attract","imprison","halt"],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw2q6","module":2,"number":6,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>Researchers studying sleep in octopuses identified two distinct states: a quiet state, in which the animals are pale and still, and an “active” state, in which their skin rapidly changes color and pattern. Some observers have compared the active state to dreaming. The researchers note that this comparison is speculative, since octopus brains evolved independently of vertebrate brains. Still, they argue, studying the active state could reveal whether similar sleep patterns can arise in very different nervous systems.<\/p>","question":"Which choice best describes the overall structure of the text?","choices":["It proposes a hypothesis about dreaming and then describes an experiment that confirms it.","It presents a finding, notes that one interpretation of it is uncertain, and then explains why the finding is still worth investigating.","It describes a disagreement between two groups of researchers and then resolves it in favor of one group.","It compares octopus brains with vertebrate brains and concludes that they function in the same way."],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q7","module":2,"number":7,"domain":"Craft and Structure","skill":"Text structure and purpose","type":"mcq","passage":"<p>The following text is from a novel. The house was smaller than Imani remembered. The hallway that had once seemed endless could be crossed in six steps, and the window seat where she had read entire summers away barely held her now. <u>Yet when she pressed her palm to the cool glass, the view of the harbor was exactly as wide as it had always been.<\/u><\/p>","question":"Which choice best describes the function of the underlined sentence in the text as a whole?","choices":["It describes the first change that Imani notices when she enters the house.","It reveals that Imani's memories of the house were entirely inaccurate.","It introduces an exception to the pattern of diminished memories described earlier in the text.","It explains the reason that Imani has returned to the house after many years."],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q8","module":2,"number":8,"domain":"Craft and Structure","skill":"Cross-text connections","type":"mcq","passage":"<p><b>Text 1<\/b><br>Advocates of the four-day workweek argue that it raises productivity. Rested employees, they contend, accomplish more in each hour they work, and several trials have reported that companies maintained or even increased their output after reducing working hours.<\/p><p><b>Text 2<\/b><br>Most trials of the four-day workweek have involved companies that volunteered to participate. Such companies may have been unusually well suited to the change—or unusually motivated to make it succeed. Until trials are run with randomly selected firms, management researcher Hannah Cole argues, the reported gains cannot be assumed to apply broadly.<\/p>","question":"Based on the texts, how would Cole (Text 2) most likely respond to the advocates' argument in Text 1?","choices":["By suggesting that the evidence the advocates cite may not reflect what would happen at companies in general","By arguing that a company's productivity cannot be measured accurately","By claiming that rested employees accomplish less in each hour they work","By agreeing that all companies should adopt a four-day workweek as soon as possible"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q9","module":2,"number":9,"domain":"Information and Ideas","skill":"Central ideas and details","type":"mcq","passage":"<p>The following text is from a short story. Every winter, Grandfather repaired the fishing nets by the stove, his fingers moving faster than Lucía could follow. This year she sat beside him with a needle of her own. She was slow, her knots were uneven, and twice he reached over to undo one. But he never took the net from her hands, and when the light faded he said only, “Tomorrow we start where you stopped.”<\/p>","question":"Which choice best states the main idea of the text?","choices":["Lucía's grandfather is dissatisfied with her work and plans to repair the net himself.","Lucía's grandfather patiently allows her to learn his craft, quietly showing that he accepts her efforts.","Lucía becomes frustrated by her slow progress and decides to stop repairing nets.","Lucía discovers that she is already more skilled at repairing nets than her grandfather."],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q10","module":2,"number":10,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>A company claims that its new app improves sleep. As evidence, it cites a survey in which people who used the app every night for a month reported sleeping better than they had before they began using it.<\/p>","question":"Which finding, if true, would most directly weaken the company's claim?","choices":["The app costs more than most other sleep apps on the market.","People who were given a version of the app with all of its features disabled, but who were told it was the real app, reported the same improvement in sleep.","Most people who used the app said that they would recommend it to a friend.","People who used the app only a few nights a week reported smaller improvements in sleep than people who used it every night."],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q11","module":2,"number":11,"domain":"Information and Ideas","skill":"Command of evidence (textual)","type":"mcq","passage":"<p>In a short story, the narrator describes a neighbor named Pell. A student claims that Pell is portrayed as both proud and lonely.<\/p>","question":"Which quotation from the story most effectively illustrates the student's claim?","choices":["“He refused every invitation to dinner, then sat at his window each evening, watching the lights in his neighbors' houses.”","“His garden was the finest on the street, and he made sure that everyone knew it.”","“He laughed at his own jokes louder than anyone else in the room.”","“He had lived in the same narrow house for more than forty years.”"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q12","module":2,"number":12,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<p><table class=\"data-table\"><caption>How Commuters Travel to Work (percentage of commuters)<\/caption><thead><tr><th>City<\/th><th>Car<\/th><th>Public transit<\/th><th>Bicycle<\/th><th>Walking<\/th><\/tr><\/thead><tbody><tr><td>City A<\/td><td>58<\/td><td>27<\/td><td>9<\/td><td>6<\/td><\/tr><tr><td>City B<\/td><td>71<\/td><td>12<\/td><td>4<\/td><td>13<\/td><\/tr><\/tbody><\/table><\/p><p>A transportation analyst notes that although commuters in City B are more likely to drive than commuters in City A are, they are also more likely to walk.<\/p>","question":"Which choice most effectively uses data from the table to support the analyst's claim?","choices":["In City A, 27% of commuters use public transit, compared with 12% in City B.","In both cities, a larger percentage of commuters drive than use any other method.","In City B, a larger percentage of commuters walk than use public transit.","In City B, 71% of commuters drive and 13% walk, compared with 58% and 6%, respectively, in City A."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw2q13","module":2,"number":13,"domain":"Information and Ideas","skill":"Command of evidence (quantitative)","type":"mcq","passage":"<p><table class=\"data-table\"><caption>Average Plant Height After Six Weeks (centimeters)<\/caption><thead><tr><th>Light color<\/th><th>Normal soil<\/th><th>Low-nitrogen soil<\/th><\/tr><\/thead><tbody><tr><td>Red<\/td><td>14<\/td><td>9<\/td><\/tr><tr><td>Blue<\/td><td>11<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/p><p>A botanist concludes that the nitrogen level of the soil had a greater effect on plant growth under red light than under blue light.<\/p>","question":"Which choice most effectively uses data from the table to support the botanist's conclusion?","choices":["Under blue light, plants reached an average height of 11 centimeters in normal soil and 10 centimeters in low-nitrogen soil.","Plants grown under red light in normal soil reached the greatest average height, 14 centimeters.","Under both light colors, plants in low-nitrogen soil were shorter on average than plants in normal soil.","Under red light, plants in low-nitrogen soil grew 5 centimeters less than plants in normal soil, whereas under blue light the difference was only 1 centimeter."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw2q14","module":2,"number":14,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>Glaciologists who measured a mountain glacier found that it lost mass every year from 2010 to 2020. Over the same period, annual snowfall on the glacier's upper slopes increased. Because a glacier's mass depends on the balance between the snow it gains and the ice it loses, mainly through melting, these measurements suggest that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["the glacier gained mass overall on its upper slopes during the period.","the amount of ice the glacier lost increased by more than the amount of snow it gained.","melting on the glacier decreased from 2010 to 2020.","snowfall has little effect on the mass of mountain glaciers."],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q15","module":2,"number":15,"domain":"Information and Ideas","skill":"Inferences","type":"mcq","passage":"<p>In a memory study, participants studied a list of words, reading half of the words aloud and the other half silently. The next day, they recalled more of the words they had read aloud. When a different group of participants read every word on the list aloud, however, their recall was no better than that of participants who read every word silently. These results suggest that <span class=\"blank\">______<\/span><\/p>","question":"Which choice most logically completes the text?","choices":["participants who read words aloud spent more time studying the list than other participants did.","reading words silently is a more effective way to remember them than reading them aloud.","the benefit of reading words aloud disappears within a few minutes of studying.","reading words aloud aids memory mainly by making those words stand out from the other words on a list."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw2q16","module":2,"number":16,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The two statues, carved from a single block of marble over a period of nearly three <span class=\"blank\">______<\/span> are on public display for the first time since their restoration.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["years,","years;","years","years—"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q17","module":2,"number":17,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Neither the lead researcher nor her two assistants <span class=\"blank\">______<\/span> able to explain the sudden spike in the data until the instruments were recalibrated.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["were","has been","was","is"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q18","module":2,"number":18,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>Having analyzed thousands of satellite images taken over two decades, <span class=\"blank\">______<\/span><\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["the team concluded that the forest had shrunk by nearly a third.","nearly a third of the forest had been lost, the team concluded.","the team's conclusion was that the forest had shrunk by nearly a third.","the forest was found by the team to have shrunk by nearly a third."],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q19","module":2,"number":19,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The author's central argument is <span class=\"blank\">______<\/span> cities that invest steadily in public libraries see lasting gains in adult literacy.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["simple:","simple","simple, that","simple,"],"correctAnswer":"A","hints":[],"solution":""},{"id":"h_rw2q20","module":2,"number":20,"domain":"Standard English Conventions","skill":"Form, structure, and sense","type":"mcq","passage":"<p>When the bridge first opened to traffic, it <span class=\"blank\">______<\/span> the longest suspension bridge in the world, a title it held for nearly three decades.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["will be","is","was","has been"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q21","module":2,"number":21,"domain":"Standard English Conventions","skill":"Boundaries","type":"mcq","passage":"<p>The proposal to build a new community center had broad support among <span class=\"blank\">______<\/span> its high projected cost, though, led the council to postpone a final vote.<\/p>","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":["residents who","residents;","residents,","residents"],"correctAnswer":"B","hints":[],"solution":""},{"id":"h_rw2q22","module":2,"number":22,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Many plants depend on animals to disperse their seeds, offering fruit in exchange for transport. Some plants, <span class=\"blank\">______<\/span> rely on the wind: dandelion seeds, for example, drift on tiny parachutes that can carry them for kilometers.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["for instance,","similarly,","however,","therefore,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q23","module":2,"number":23,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>The town's first public library opened with only a few hundred books. Within a decade, it had become one of the busiest institutions in town. <span class=\"blank\">______<\/span> its trustees had to move it to a larger building twice to keep up with demand.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["Even so,","By contrast,","Indeed,","Nevertheless,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q24","module":2,"number":24,"domain":"Expression of Ideas","skill":"Transitions","type":"mcq","passage":"<p>Planners expected that widening the highway would reduce traffic congestion. <span class=\"blank\">______<\/span> congestion returned to its former levels within five years, as the added lanes attracted additional drivers.<\/p>","question":"Which choice completes the text with the most logical transition?","choices":["In other words,","Similarly,","Instead,","Furthermore,"],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q25","module":2,"number":25,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Monarch butterflies migrate as far as 4,800 kilometers each fall, from North America to central Mexico.<\/li><li>Arctic terns migrate between the Arctic and the Antarctic each year.<\/li><li>An arctic tern's round trip can exceed 70,000 kilometers.<\/li><li>Both species use the position of the sun to help them navigate.<\/li><\/ul>","question":"The student wants to emphasize a similarity between the two species. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Monarch butterflies migrate from North America to central Mexico, while arctic terns migrate between the Arctic and the Antarctic.","An arctic tern's yearly round trip can exceed 70,000 kilometers, far longer than a monarch's migration of up to 4,800 kilometers.","Monarch butterflies migrate as far as 4,800 kilometers each fall.","Though very different animals, monarch butterflies and arctic terns both use the sun's position to navigate during their long migrations."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_rw2q26","module":2,"number":26,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>Researchers surveyed 2,000 adults about how often they ate breakfast.<\/li><li>Adults who ate breakfast every day reported higher energy levels than those who did not.<\/li><li>The study measured self-reported energy, not physical activity.<\/li><li>The researchers noted that the study could not show that eating breakfast caused the higher energy levels.<\/li><\/ul>","question":"The student wants to present the study's main finding while acknowledging its limitation. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["Researchers surveyed 2,000 adults about how often they ate breakfast.","The study, which surveyed 2,000 adults, measured self-reported energy rather than physical activity.","Adults who ate breakfast daily reported higher energy levels, though the researchers noted that their study could not show that breakfast caused the difference.","Researchers surveyed 2,000 adults and found that eating breakfast every day increases energy levels."],"correctAnswer":"C","hints":[],"solution":""},{"id":"h_rw2q27","module":2,"number":27,"domain":"Expression of Ideas","skill":"Rhetorical synthesis","type":"mcq","passage":"<p>While researching a topic, a student has taken the following notes:<\/p><ul><li>The Rosetta Stone is a stone slab inscribed in 196 BCE.<\/li><li>It records the same decree in three scripts: Egyptian hieroglyphs, Demotic, and ancient Greek.<\/li><li>Scholars of the time could already read ancient Greek.<\/li><li>By comparing the texts, scholar Jean-François Champollion was able to decipher hieroglyphs in the 1820s.<\/li><\/ul>","question":"The student wants to explain why the Rosetta Stone was important for understanding ancient Egyptian writing. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":["The Rosetta Stone, a stone slab inscribed in 196 BCE, records a decree in three scripts.","Jean-François Champollion was a scholar who worked in the 1820s.","The Rosetta Stone includes text in Egyptian hieroglyphs, Demotic, and ancient Greek.","Because the Rosetta Stone records the same decree in hieroglyphs and in ancient Greek, a language scholars could already read, it enabled Champollion to decipher hieroglyphs."],"correctAnswer":"D","hints":[],"solution":""},{"id":"h_ma1q1","module":3,"number":1,"domain":"Algebra","skill":"Linear equations in one variable","type":"mcq","question":"\\[\\tfrac34x-2=7\\] What value of \\(x\\) is the solution to the equation above?","hints":[],"solution":"","choices":["\\(36\\)","\\(\\dfrac{27}{4}\\)","\\(12\\)","\\(9\\)"],"correctAnswer":"C"},{"id":"h_ma1q2","module":3,"number":2,"domain":"Problem-Solving and Data Analysis","skill":"Ratios and rates","type":"spr","question":"A store sells 3 notebooks for $7.20. At this rate, what is the cost, in dollars, of 8 notebooks?","hints":[],"solution":"","acceptedAnswers":["19.2","19.20"],"correctAnswer":"19.2"},{"id":"h_ma1q3","module":3,"number":3,"domain":"Advanced Math","skill":"Equivalent expressions","type":"mcq","question":"Which expression is equivalent to \\(2x(x-3)-(x^2-5x)\\)?","hints":[],"solution":"","choices":["\\(3x^2-11x\\)","\\(x^2-x\\)","\\(x^2-11x\\)","\\(x^2+x\\)"],"correctAnswer":"B"},{"id":"h_ma1q4","module":3,"number":4,"domain":"Algebra","skill":"Linear equations in one variable","type":"mcq","question":"If \\(5-2x=3x-20\\), what is the value of \\(x\\)?","hints":[],"solution":"","choices":["\\(-5\\)","\\(25\\)","\\(5\\)","\\(3\\)"],"correctAnswer":"C"},{"id":"h_ma1q5","module":3,"number":5,"domain":"Algebra","skill":"Linear equations in two variables","type":"spr","question":"A line in the \\(xy\\)-plane has a slope of \\(-\\frac23\\) and passes through the point \\((-3,\\,4)\\). What is the \\(y\\)-coordinate of the \\(y\\)-intercept of the line?","hints":[],"solution":"","acceptedAnswers":["2"],"correctAnswer":"2"},{"id":"h_ma1q6","module":3,"number":6,"domain":"Advanced Math","skill":"Function notation","type":"mcq","question":"The function \\(f\\) is defined by \\(f(x)=\\dfrac{x+3}{x-2}\\). What is the value of \\(f(f(3))\\)?","hints":[],"solution":"","choices":["\\(\\dfrac49\\)","\\(6\\)","\\(\\dfrac32\\)","\\(\\dfrac94\\)"],"correctAnswer":"D"},{"id":"h_ma1q7","module":3,"number":7,"domain":"Problem-Solving and Data Analysis","skill":"Mean and median","type":"mcq","question":"A data set consists of the five values \\(3,\\ 5,\\ 5,\\ 8,\\) and \\(x\\). The mean of the data set is 6, and the median is 5. What is the value of \\(x\\)?","hints":[],"solution":"","choices":["\\(9\\)","\\(14\\)","\\(5\\)","\\(6\\)"],"correctAnswer":"A"},{"id":"h_ma1q8","module":3,"number":8,"domain":"Algebra","skill":"Systems of two linear equations","type":"mcq","question":"\\[2x+3y=12\\]\\[x-y=1\\] If \\((x,\\,y)\\) is the solution to the system above, what is the value of \\(5x+2y\\)?","hints":[],"solution":"","choices":["\\(19\\)","\\(21\\)","\\(17\\)","\\(15\\)"],"correctAnswer":"A"},{"id":"h_ma1q9","module":3,"number":9,"domain":"Advanced Math","skill":"Equivalent expressions","type":"spr","question":"If \\(x^2-10x+c=(x-k)^2\\) for all values of \\(x\\), where \\(c\\) and \\(k\\) are constants, what is the value of \\(c+k\\)?","hints":[],"solution":"","acceptedAnswers":["30"],"correctAnswer":"30"},{"id":"h_ma1q10","module":3,"number":10,"domain":"Geometry and Trigonometry","skill":"Right triangle trigonometry","type":"mcq","question":"In right triangle \\(ABC\\), angle \\(C\\) is the right angle and \\(\\cos A=0.28\\). What is the value of \\(\\sin B\\)?","hints":[],"solution":"","choices":["\\(0.72\\)","\\(0.28\\)","\\(3.57\\)","\\(0.96\\)"],"correctAnswer":"B"},{"id":"h_ma1q11","module":3,"number":11,"domain":"Algebra","skill":"Interpreting linear models","type":"mcq","question":"The amount of water \\(W\\), in gallons, in a tank \\(t\\) minutes after it begins draining is given by \\(W=1{,}200-35t\\). What is the best interpretation of 35 in this context?","hints":[],"solution":"","choices":["The number of minutes it takes the tank to empty","The number of gallons remaining in the tank after 1 minute","The number of gallons in the tank when it begins draining","The number of gallons that drain from the tank each minute"],"correctAnswer":"D"},{"id":"h_ma1q12","module":3,"number":12,"domain":"Advanced Math","skill":"Exponential functions","type":"mcq","question":"A town's population is 2,500 and doubles every 8 years. Which function \\(P\\) gives the population \\(t\\) years from now?","hints":[],"solution":"","choices":["\\(P(t)=2500(2)^{8t}\\)","\\(P(t)=2500(2)^{t/8}\\)","\\(P(t)=2500(1.08)^t\\)","\\(P(t)=2500(8)^{t/2}\\)"],"correctAnswer":"B"},{"id":"h_ma1q13","module":3,"number":13,"domain":"Problem-Solving and Data Analysis","skill":"Percentages","type":"mcq","question":"The price of an item increased by 20% from 2023 to 2024, and then decreased by 20% from 2024 to 2025. The 2025 price is what percent of the 2023 price?","hints":[],"solution":"","choices":["96%","100%","104%","80%"],"correctAnswer":"A"},{"id":"h_ma1q14","module":3,"number":14,"domain":"Algebra","skill":"Linear equations in one variable","type":"spr","question":"\\[0.4(x+15)=0.25x+9\\] What value of \\(x\\) satisfies the equation above?","hints":[],"solution":"","acceptedAnswers":["20"],"correctAnswer":"20"},{"id":"h_ma1q15","module":3,"number":15,"domain":"Advanced Math","skill":"Quadratic functions","type":"mcq","question":"The graph of \\(y=(x-a)(x+5)\\), where \\(a\\) is a constant, passes through the point \\((1,\\,-18)\\). What is the value of \\(a\\)?","hints":[],"solution":"","choices":["\\(4\\)","\\(-4\\)","\\(-3\\)","\\(3\\)"],"correctAnswer":"A"},{"id":"h_ma1q16","module":3,"number":16,"domain":"Geometry and Trigonometry","skill":"Circles in the xy-plane","type":"spr","question":"\\[x^2+y^2-6x+8y=0\\] The graph of the equation above in the \\(xy\\)-plane is a circle. The area of the circle is \\(k\\pi\\). What is the value of \\(k\\)?","hints":[],"solution":"","acceptedAnswers":["25"],"correctAnswer":"25"},{"id":"h_ma1q17","module":3,"number":17,"domain":"Algebra","skill":"Linear inequalities in context","type":"mcq","question":"A caterer will make \\(x\\) sandwiches and \\(y\\) salads for an event. Each sandwich costs $4 to make and each salad costs $6 to make. The caterer can spend at most $300 and must make at least 60 items in total. Which system of inequalities represents these conditions?","hints":[],"solution":"","choices":["\\(4x+6y\\ge300\\) and \\(x+y\\le60\\)","\\(6x+4y\\le300\\) and \\(x+y\\ge60\\)","\\(4x+6y\\le300\\) and \\(x+y\\ge60\\)","\\(4x+6y\\le60\\) and \\(x+y\\ge300\\)"],"correctAnswer":"C"},{"id":"h_ma1q18","module":3,"number":18,"domain":"Problem-Solving and Data Analysis","skill":"Line of best fit — interpretation","type":"mcq","question":"For a group of days at a beach stand, the line of best fit relating the high temperature \\(x\\), in degrees Celsius, to the number of drinks sold \\(y\\) is \\(y=1.6x+12\\). Which statement is the best interpretation of 1.6 in this context?","hints":[],"solution":"","choices":["For each additional drink sold, the predicted high temperature increases by 1.6°C.","On every day, exactly 1.6 more drinks were sold than on the day before.","For each increase of 1°C in the high temperature, the predicted number of drinks sold increases by 1.6.","The predicted number of drinks sold on a day with a high temperature of 0°C is 1.6."]," function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    const base = freshState();
    return Object.assign(base, s, {
      currentIndex: Object.assign(base.currentIndex, s.currentIndex || {}),
      moduleTimers: Object.assign(base.moduleTimers, s.moduleTimers || {}),
      timeUpShown: Object.assign(base.timeUpShown, s.timeUpShown || {})
    });
  } catch (e) { return freshState(); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage full or blocked */ }
}

function fmt(ms) {
  ms = Math.max(0, ms);
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60), s = total % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

}

/* =========================================================
   5. TIMERS (module countdown + per-question stopwatch)
   ========================================================= */
function moduleElapsed(m) {
  const t = state.moduleTimers[m];
  return t.elapsed + (t.start ? Date.now() - t.start : 0);
}
function pauseModule(m) {
  const t = state.moduleTimers[m];
  if (t.start) { t.elapsed += Date.now() - t.start; t.start = null; }
}
function startModule(m) {
  const t = state.moduleTimers[m];
  if (!t.start && !isLocked() && state.studentName && !state.frozen) t.start = Date.now();
}
function qt(id) {
  if (!state.qTimers[id]) state.qTimers[id] = { acc: 0, start: null };
  return state.qTimers[id];
}
const qElapsed = (id) => { const t = qt(id); return t.acc + (t.start ? Date.now() - t.start : 0); };
function stopQ(id) { const t = qt(id); if (t.start) { t.acc += Date.now() - t.start; t.start = null; } }
function stopAllQ() { Object.keys(state.qTimers).forEach(stopQ); }
function startQ(id) { if (state.frozen) return; stopAllQ(); qt(id).start = Date.now(); }
const isOvertime = (m) => moduleElapsed(m) >= modTime(m);
function markTiming(q) {
  if (!hasAnswer(q)) delete state.lateAnswers[q.id];
  else if (isOvertime(q.module)) state.lateAnswers[q.id] = true;
}
function stopAllTimers() { stopAllQ(); MODULES.forEach(pauseModule); }

function tick() {
  if (state.onBreak) { tickBreak(); return; }
  const m = state.currentModule;
  const remaining = modTime(m) - moduleElapsed(m);
  const el = $("moduleTimer");
  const over = remaining <= 0;
  el.textContent = state.timerHidden ? "" : (over ? "00:00" : fmt(remaining));
  el.classList.toggle("low", !over && remaining < 5 * 60 * 1000);
  el.classList.toggle("over", over);
  el.classList.toggle("frozen", !!state.frozen);
  const sub = $("timerSub");
  if (sub) sub.textContent = state.frozen && !isLocked() ? "❄ Time frozen" : "";
  if (over && !isLocked() && state.studentName) {
    if (m === state.stage && m < 4) { closeModal(); finishModule(true); }   // time's up → next module (or break)
    else if (m === 4 && state.stage === 4 && !sending) {                     // time's up → test submits itself
      state.autoSubmitted = true; saveState(); closeModal(); openSubmitReview(); sendReport();
    }
  }
  const q = currentQ();
  const clock = $("qClock");
  if (q && clock) clock.textContent = fmt(qElapsed(q.id));
}

/* =========================================================
   6. GRADING
   ========================================================= */
function parseNum(str) {
  if (str === undefined || str === null) return NaN;
  const s = String(str).trim();
  if (/^-?(\d+\.?\d*|\.\d+)\/(\d+\.?\d*|\.\d+)$/.test(s)) {
    const [a, b] = s.split("/").map(Number);
    return b === 0 ? NaN : a / b;
  }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
function normalizeSpr(s) {
  let t = String(s).trim().replace(/\s+/g, "");
  if (/^-?0\.\d/.test(t)) t = t.replace("0.", ".");
  return t;
}
function isCorrect(q, ans) {
  if (ans === undefined || ans === null || String(ans).trim() === "") return false;
  if (q.type === "mcq") return ans === q.correctAnswer;
  const n = normalizeSpr(ans);
  if (q.acceptedAnswers.some(a => normalizeSpr(a) === n)) return true;
  const v = parseNum(ans), target = parseNum(q.correctAnswer);
  return !isNaN(v) && !isNaN(target) && Math.abs(v - target) < 1e-9;
}
function statusOf(q) {
  if (!hasAnswer(q)) return "unanswered";
  return isCorrect(q, state.answers[q.id]) ? "correct" : "wrong";
}
function buildStats() {
  const rows = QUESTIONS.map(q => ({
    q, status: statusOf(q), time: qElapsed(q.id), hints: state.hintLevel[q.id] || 0,
    late: hasAnswer(q) && !!state.lateAnswers[q.id],
    answer: hasAnswer(q) ? String(state.answers[q.id]) : "—"
  }));
  const total = rows.filter(r => r.status === "correct").length;
  const perModule = MODULES.map(m => {
    const rs = rows.filter(r => r.q.module === m);
    return { m, correct: rs.filter(r => r.status === "correct").length, onTime: rs.filter(r => r.status === "correct" && !r.late).length, late: rs.filter(r => r.late).length, total: rs.length, time: moduleElapsed(m) };
  });
  const perDomain = DOMAINS.filter(d => rows.some(r => r.q.domain === d)).map(d => {
    const rs = rows.filter(r => r.q.domain === d);
    const correct = rs.filter(r => r.status === "correct").length;
    const time = rs.reduce((s, r) => s + r.time, 0);
    return { d, correct, total: rs.length, pct: rs.length ? Math.round(correct / rs.length * 100) : 0, avg: rs.length ? time / rs.length : 0, hints: rs.reduce((s, r) => s + r.hints, 0) };
  });
  const totalTime = rows.reduce((s, r) => s + r.time, 0);
  const hintsUsed = rows.reduce((s, r) => s + r.hints, 0);
  const correctNoHint = rows.filter(r => r.status === "correct" && r.hints === 0).length;
  const onTime = rows.filter(r => r.status === "correct" && !r.late).length;
  const lateCount = rows.filter(r => r.late).length;
  return { rows, total, perModule, perDomain, totalTime, hintsUsed, correctNoHint, onTime, lateCount, count: rows.length };
}
const correctDisplay = (q) => q.type === "mcq" ? q.correctAnswer : q.acceptedAnswers.join(" or ");
const statusLabel = (s) => ({ correct: "Correct", wrong: "Wrong", unanswered: "Unanswered" }[s]);
