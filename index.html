<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amro Academy – SAT Math Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
/* =========================================================
   THEME
   ========================================================= */
:root{
  --sky:#87CEEB; --sky-light:#e8f6fc; --sky-soft:#cdebf7; --sky-dark:#3a9fd1; --sky-deep:#1d6a96;
  --ink:#1b1b1b; --muted:#5f6b75; --line:#d5dde3; --bg:#ffffff;
  --green:#1e8e3e; --green-bg:#e6f4ea; --red:#c5221f; --red-bg:#fce8e6; --amber:#b06000;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}

/* ---------- Top bar ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 20px;background:var(--sky-light);border-bottom:1px solid var(--sky-soft)}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.tb-left img{height:44px;width:auto;border-radius:6px}
.brand{font-weight:700;font-size:15px;color:var(--sky-deep);white-space:nowrap}
.sec-label{font-size:14px;color:var(--ink);margin-top:2px}
.tb-center{display:flex;flex-direction:column;align-items:center}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.low{color:var(--red)}
.link-btn{background:none;border:1px solid var(--line);border-radius:14px;font-size:12px;padding:2px 12px;margin-top:3px;color:var(--ink)}
.link-btn:hover{border-color:var(--sky-dark)}
.tb-right{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tool-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.tool-btn:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.tool-btn.primary{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.tool-btn.primary:hover:not(:disabled){background:var(--sky-deep)}
.tool-btn.danger{color:var(--red)}
.tool-btn.success{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Module tabs ---------- */
.module-tabs{display:flex;align-items:center;gap:6px;padding:8px 20px 0}
.module-tabs .tab{border:1px solid var(--line);border-bottom:none;background:#f6f8fa;padding:8px 18px;border-radius:8px 8px 0 0;font-weight:600;font-size:14px;color:var(--muted)}
.module-tabs .tab.active{background:var(--sky);color:#0c3a52;border-color:var(--sky)}
.status-pill{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#f1f3f4;color:var(--muted)}
.status-pill.ok{background:var(--green-bg);color:var(--green)}
.dash-line{height:0;border-top:3px dashed var(--sky);margin:0 0 0}

/* ---------- Main ---------- */
main{flex:1;overflow:auto;padding:0 0 24px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.q-wrap{display:grid;grid-template-columns:1fr;gap:0;margin-top:20px}
.q-wrap.spr{grid-template-columns:minmax(260px,1fr) 1.3fr}
.spr-dir{padding:4px 28px 20px 4px;border-right:3px solid var(--sky-soft);font-size:14.5px;line-height:1.6}
.spr-dir h3{margin:4px 0 10px;font-size:16px}
.spr-dir ul{padding-left:18px;margin:0 0 12px}
.spr-dir li{margin-bottom:6px}
.ex-table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
.ex-table th,.ex-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ex-table th{background:var(--sky-light)}
.q-main{max-width:760px;width:100%;margin:0 auto;padding:0 4px}
.q-wrap.spr .q-main{padding-left:28px;margin:0}
.q-head{display:flex;align-items:center;gap:10px;background:#eef1f4;border-bottom:2px dashed #9aa5ad;padding:0 8px 0 0;margin-bottom:18px;min-height:40px}
.q-num{background:#111;color:#fff;font-weight:700;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:17px}
.flag-btn,.hint-btn{background:none;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;color:var(--ink)}
.flag-btn:hover,.hint-btn:hover{background:#e1e6ea}
.flag-btn.on{color:#b3261e}
.flag-icon{display:inline-block;width:14px;height:16px}
.hint-btn{color:var(--sky-deep);border:1px solid var(--sky);background:#fff}
.hint-btn:hover{background:var(--sky-light)}
.hint-btn.on{background:var(--sky);color:#0c3a52}
.spacer{flex:1}
.abc-btn{border:1px solid #444;background:#fff;border-radius:5px;padding:3px 6px;font-size:13px;font-weight:700;text-decoration:line-through}
.abc-btn.on{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
.q-text{font-size:17px;line-height:1.7;margin-bottom:20px}
.q-text .katex-display{margin:.6em 0}
.data-table{border-collapse:collapse;margin:12px auto;font-size:15px}
.data-table th,.data-table td{border:1px solid #8b959c;padding:6px 14px;text-align:center}
.data-table thead th{background:var(--sky-light)}

/* ---------- Choices ---------- */
.choices{display:flex;flex-direction:column;gap:12px}
.choice-row{display:flex;align-items:center;gap:10px}
.choice{flex:1;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid #5f6b75;border-radius:var(--radius);padding:12px 14px;font-size:16px;color:var(--ink);transition:background .12s,border-color .12s;position:relative}
.choice:hover:not(:disabled){border-color:var(--sky-dark);background:var(--sky-light)}
.choice .letter{flex:none;width:28px;height:28px;border:1.5px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.choice.selected{border:3px solid var(--sky-dark);background:var(--sky-light);padding:10.5px 12.5px}
.choice.selected .letter{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff}
.choice:disabled{opacity:1;cursor:default}
.choice.eliminated,.choice.eliminated:disabled{opacity:.45}
.choice.eliminated::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:2px solid #222}
.choice.correct{border:3px solid var(--green);background:var(--green-bg);padding:10.5px 12.5px}
.choice.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong{border:3px solid var(--red);background:var(--red-bg);padding:10.5px 12.5px}
.choice.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag.g{background:var(--green);color:#fff}.tag.r{background:var(--red);color:#fff}
.elim-btn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #333;background:#fff;font-weight:700;font-size:13px;text-decoration:line-through;position:relative}
.elim-btn:hover{background:#f1f1f1}
.elim-undo{flex:none;background:none;border:none;text-decoration:underline;font-weight:700;font-size:13px;width:44px}

/* ---------- SPR ---------- */
.spr-input{width:200px;font-size:20px;padding:10px 12px;border:1.5px solid #5f6b75;border-radius:8px;border-bottom:3px solid #222;font-family:inherit}
.spr-input:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 3px var(--sky-soft)}
.spr-input:disabled{background:#f6f8fa}
.spr-input.correct{border-color:var(--green);background:var(--green-bg)}
.spr-input.wrong{border-color:var(--red);background:var(--red-bg)}
.preview{margin-top:12px;font-size:15px;color:var(--muted);min-height:34px}
.preview b{color:var(--ink)}
.preview .pv{font-size:20px;color:var(--ink);margin-left:6px}

/* ---------- Tools under question ---------- */
.q-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.timer-btn{background:#fff;border:1.5px solid var(--sky-dark);color:var(--sky-deep);border-radius:20px;padding:6px 16px;font-weight:600;font-size:14px}
.timer-btn.running{background:var(--sky-dark);color:#fff}
.q-clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.q-clock-label{font-size:13px;color:var(--muted)}
.hint-box{margin-top:16px;background:var(--sky-light);border:1px solid var(--sky);border-left:5px solid var(--sky-dark);border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6}
.hint-box .hint{margin-bottom:8px}
.hint-box .hint b{color:var(--sky-deep)}
.small-btn{background:#fff;border:1px solid var(--sky-dark);color:var(--sky-deep);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.review-box{margin-top:16px;border-radius:8px;padding:12px 16px;font-size:15px;line-height:1.6;border:1px solid var(--line);background:#fafbfc}
.status-badge{display:inline-block;font-weight:700;padding:4px 12px;border-radius:14px;margin-bottom:8px}
.status-badge.correct{background:var(--green-bg);color:var(--green)}
.status-badge.wrong{background:var(--red-bg);color:var(--red)}
.status-badge.unanswered{background:#fef7e0;color:var(--amber)}
.ans-g{color:var(--green);font-weight:700}.ans-r{color:var(--red);font-weight:700}

/* ---------- Results panel ---------- */
.results{margin-top:18px;border:1px solid var(--sky);border-radius:12px;background:linear-gradient(180deg,var(--sky-light),#fff 120px);padding:16px 20px}
.results-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:20px;color:var(--sky-deep)}
.big-score{font-size:30px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.rtable th,.rtable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.rtable th{background:var(--sky-light)}
.rtable tr.clickable{cursor:pointer}
.rtable tr.clickable:hover td{background:var(--sky-light)}
.res-correct{color:var(--green);font-weight:700}.res-wrong{color:var(--red);font-weight:700}.res-unanswered{color:var(--amber);font-weight:700}
details summary{cursor:pointer;font-weight:600;margin:10px 0 8px;color:var(--sky-deep)}
.table-scroll{overflow-x:auto}

/* ---------- Bottom bar ---------- */
.bottombar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 20px;border-top:3px dashed var(--sky);background:var(--sky-light)}
.student{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-pill{background:#111;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:14px}
.nav-pill:hover{background:#333}
.bb-right{display:flex;gap:10px;justify-content:flex-end}
.nav-btn{background:var(--sky-dark);color:#fff;border:none;border-radius:22px;padding:10px 26px;font-weight:700;font-size:15px}
.nav-btn:hover:not(:disabled){background:var(--sky-deep)}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sky-light);position:sticky;top:0}
.modal-head h3{margin:0;font-size:18px}
.x-btn{background:none;border:none;font-size:24px;line-height:1;color:var(--muted)}
.modal-body{padding:18px 20px;font-size:15px;line-height:1.6}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.name-input{width:100%;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-top:8px}
.name-input:focus{outline:none;border-color:var(--sky-dark)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin:14px 0}
.nav-cell{position:relative;height:44px;border:2px dashed #555;background:#fff;font-weight:700;font-size:15px;border-radius:4px;color:var(--sky-deep)}
.nav-cell.answered{border:2px solid var(--sky-dark);background:var(--sky-dark);color:#fff}
.nav-cell.current{outline:3px solid #111;outline-offset:2px}
.nav-cell.flagged::after{content:"";position:absolute;top:-7px;right:-7px;width:14px;height:14px;background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)}
.nav-cell.c{background:var(--green);border:2px solid var(--green);color:#fff}
.nav-cell.w{background:var(--red);border:2px solid var(--red);color:#fff}
.nav-cell.u{background:#fef7e0;border:2px solid var(--amber);color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:3px;display:inline-block}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ref-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdfe}
.ref-item b{display:block;margin-bottom:4px;color:var(--sky-deep)}
.list-q{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--sky-dark);background:#fff;color:var(--sky-deep);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600}
.msg{padding:10px 12px;border-radius:8px;margin-top:10px;font-weight:600}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.err{background:var(--red-bg);color:var(--red)}
.msg.info{background:var(--sky-light);color:var(--sky-deep)}
.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:10px;z-index:60;font-weight:600;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .topbar{grid-template-columns:1fr auto;grid-template-areas:"l c" "r r"}
  .tb-left{grid-area:l}.tb-center{grid-area:c}.tb-right{grid-area:r;justify-content:flex-start}
  .q-wrap.spr{grid-template-columns:1fr}
  .spr-dir{order:2;border-right:none;border-top:3px solid var(--sky-soft);padding:14px 0 0;margin-top:20px;font-size:13.5px}
  .q-wrap.spr .q-main{padding-left:4px}
}
@media (max-width:560px){
  .topbar,.bottombar,.module-tabs{padding-left:12px;padding-right:12px}
  .wrap{padding:0 12px}
  .brand{font-size:13px;white-space:normal}
  .tb-left img{height:36px}
  .timer{font-size:18px}
  .tool-btn{padding:6px 9px;font-size:12px}
  .bottombar{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "s r"}
  .student{grid-area:s}.nav-pill{grid-area:n;justify-self:center}.bb-right{grid-area:r}
  .nav-btn{padding:8px 18px}
  .q-text{font-size:16px}
  .choice{font-size:15px}
}
</style>
</head>
<body>

<!-- ============================ TOP BAR ============================ -->
<header class="topbar">
  <div class="tb-left">
    <img src="image.png" alt="Amro Academy logo" onerror="this.style.display='none'">
    <div>
      <div class="brand">Amro Academy – SAT Math Practice</div>
      <div class="sec-label" id="secLabel">Section 2, Module 1: Math</div>
    </div>
  </div>
  <div class="tb-center">
    <div class="timer" id="moduleTimer">35:00</div>
    <button class="link-btn" id="hideTimerBtn">Hide</button>
  </div>
  <div class="tb-right">
    <button class="tool-btn" id="directionsBtn">Directions</button>
    <button class="tool-btn" id="refBtn">Reference</button>
    <button class="tool-btn" id="correctBtn">Correct Exam</button>
    <button class="tool-btn primary" id="submitBtn">Submit Exam</button>
    <button class="tool-btn danger" id="resetBtn">Reset Exam</button>
  </div>
</header>

<nav class="module-tabs">
  <button class="tab" data-module="1">Module 1</button>
  <button class="tab" data-module="2">Module 2</button>
  <span class="status-pill" id="statusPill">In progress</span>
</nav>
<div class="dash-line"></div>

<!-- ============================ MAIN ============================ -->
<main id="main">
  <div class="wrap">
    <div id="results"></div>
    <div id="questionArea"></div>
  </div>
</main>

<!-- ============================ BOTTOM BAR ============================ -->
<footer class="bottombar">
  <div class="student" id="studentLabel"></div>
  <button class="nav-pill" id="navBtn">Question 1 of 22 ▲</button>
  <div class="bb-right">
    <button class="nav-btn" id="backBtn">Back</button>
    <button class="nav-btn" id="nextBtn">Next</button>
  </div>
</footer>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. DATA — question bank
   ========================================================= */
/* =========================================================
   QUESTION BANK — edit freely.
   type: "mcq" (choices + correctAnswer letter) or "spr" (fill-in, acceptedAnswers)
   ========================================================= */
const QUESTIONS = [
  /* ------------------------------ MODULE 1 ------------------------------ */
  {
    id: "m1q1", module: 1, number: 1, domain: "Algebra", skill: "Linear equations in one variable", type: "mcq",
    question: String.raw`\[\frac{3x-5}{4}-\frac{2x+1}{6}=\frac{x}{3}+2\] What value of \(x\) satisfies the equation above?`,
    choices: [String.raw`\(7\)`, String.raw`\(31\)`, String.raw`\(41\)`, String.raw`\(-41\)`],
    correctAnswer: "C",
    hints: [
      String.raw`Get rid of every fraction at once: multiply both sides by the least common denominator of 4, 6 and 3.`,
      String.raw`Multiplying by 12 gives \(3(3x-5)-2(2x+1)=4x+24\). Be careful: the minus sign must be distributed to both terms of \(2x+1\).`
    ],
    solution: String.raw`Multiply by 12: \(3(3x-5)-2(2x+1)=4x+24\). Expand: \(9x-15-4x-2=4x+24\), so \(5x-17=4x+24\) and \(x=41\).`
  },
  {
    id: "m1q2", module: 1, number: 2, domain: "Algebra", skill: "Systems of two linear equations", type: "mcq",
    question: String.raw`\[3x+ky=18\]\[kx+12y=36\] In the system of equations above, \(k\) is a constant. For which value of \(k\) does the system have <b>no</b> solution?`,
    choices: [String.raw`\(6\)`, String.raw`\(-6\)`, String.raw`\(4\)`, String.raw`\(-4\)`],
    correctAnswer: "B",
    hints: [
      String.raw`No solution means the two lines are parallel: the \(x\)- and \(y\)-coefficients are proportional, but the constants are not in the same ratio.`,
      String.raw`Set \(\frac{3}{k}=\frac{k}{12}\), which gives \(k^2=36\). Two values come out — test each one against the ratio of the constants, \(\frac{18}{36}\).`
    ],
    solution: String.raw`Proportional coefficients require \(\frac{3}{k}=\frac{k}{12}\Rightarrow k=\pm6\). If \(k=6\), every ratio equals \(\frac12\), including \(\frac{18}{36}\): the equations are the same line (infinitely many solutions). If \(k=-6\), the coefficient ratio is \(-\frac12\) while the constant ratio is \(\frac12\): parallel distinct lines, so no solution. \(k=-6\).`
  },
  {
    id: "m1q3", module: 1, number: 3, domain: "Algebra", skill: "Linear functions", type: "spr",
    question: String.raw`A line in the \(xy\)-plane passes through the points \((2,\,k)\) and \((k,\,18)\), and its slope is \(\frac{2}{3}\). What is the value of \(k\)?`,
    correctAnswer: "58/5", acceptedAnswers: ["58/5", "11.6"],
    hints: [
      String.raw`Write the slope formula using the two points, with \(k\) appearing in both the numerator and the denominator.`,
      String.raw`\(\frac{18-k}{k-2}=\frac{2}{3}\). Cross-multiply and solve the resulting linear equation.`
    ],
    solution: String.raw`\(\frac{18-k}{k-2}=\frac23\Rightarrow 3(18-k)=2(k-2)\Rightarrow 54-3k=2k-4\Rightarrow 5k=58\Rightarrow k=\frac{58}{5}=11.6\).`
  },
  {
    id: "m1q4", module: 1, number: 4, domain: "Advanced Math", skill: "Equivalent expressions (rational)", type: "mcq",
    question: String.raw`\[\frac{x^2-9}{x^2+x-6}\cdot\frac{x^2-4}{x^2-5x+6}\] Which of the following is equivalent to the expression above for \(x>3\)?`,
    choices: [String.raw`\(\dfrac{x-2}{x+2}\)`, String.raw`\(\dfrac{x+3}{x-3}\)`, String.raw`\(\dfrac{x+2}{x-2}\)`, String.raw`\(1\)`],
    correctAnswer: "C",
    hints: [
      String.raw`Factor all four polynomials completely before cancelling anything.`,

  {

    question: String.raw`\[2x^2-kx+18=0\] In the equation above, \(k\) is a positive constant. If the equation has exactly one real solution, what is that solution?`,

  {
    id: "m1q6", module: 1, number: 6, domain: "Problem-Solving and Data Analysis", skill: "Percentages", type: "mcq",
    question: String.raw`A store raises the original price of a jacket by 25%. Later, it offers a 20% discount on the raised price. At checkout, a 10% sales tax is added to the discounted price. The final amount paid is what percent of the jacket's original price?`,

  {

    question: String.raw`In triangle \(ABC\), point \(D\) lies on \(\overline{AB}\) and point \(E\) lies on \(\overline{AC}\) so that \(\overline{DE}\parallel\overline{BC}\). If \(AD=6\), \(DB=9\), and the area of triangle \(ADE\) is 24, what is the area of quadrilateral \(DBCE\)?`,

  {
    id: "m1q8", module: 1, number: 8, domain: "Algebra", skill: "Linear inequalities in context", type: "spr",
    question: String.raw`A school can spend at most $1,500 to rent vehicles for a trip. Each bus costs $250 to rent and carries 40 people. Each van costs $90 to rent and carries 12 people. Only whole vehicles can be rented. What is the greatest number of people the school can transport?`,
    correctAnswer: "240", acceptedAnswers: ["240"],

    solution: String.raw`Buses carry \(\frac{40}{250}=0.16\) people per dollar; vans \(\frac{12}{90}\approx0.133\). Testing: \(b=6,v=0\): 240 people ($1,500). \(b=5,v=2\): 224. \(b=4,v=5\): 220. \(b=3,v=8\): 216. \(b=0,v=16\): 192. The maximum is 240.`

    id: "m1q9", module: 1, number: 9, domain: "Advanced Math", skill: "Exponent rules", type: "mcq",
    question: String.raw`\[\frac{4^{x+2}\cdot 8^{x}}{2^{3x-1}}=2^{k}\] In the equation above, which expression is equal to \(k\)?`,

  {
    id: "m1q10", module: 1, number: 10, domain: "Advanced Math", skill: "Function composition", type: "spr",
    question: String.raw`The function \(f\) is defined by \(f(x)=3x+k\), where \(k\) is a constant. If \(f(f(2))=41\), what is the value of \(k\)?`,

    ],
    solution: String.raw`\(f(2)=6+k\); \(f(6+k)=18+3k+k=18+4k=41\Rightarrow 4k=23\Rightarrow k=\frac{23}{4}=5.75\).`

  {
    id: "m1q11", module: 1, number: 11, domain: "Algebra", skill: "Linear equations in context", type: "mcq",
    question: String.raw`Phone Plan A costs $30 per month plus $0.12 per minute of calls. Plan B costs $18 per month plus $0.20 per minute. For how many minutes of calls in a month will Plan B cost exactly $6 <b>more</b> than Plan A?`,

  {
    id: "m1q12", module: 1, number: 12, domain: "Advanced Math", skill: "Quadratic graphs and transformations", type: "mcq",
    question: String.raw`The graph of the quadratic function \(f\) has its vertex at \((3,\,-8)\) and passes through the point \((5,\,0)\). The function \(g\) is defined by \(g(x)=f(x+2)-4\). What is the product of the \(x\)-intercepts of the graph of \(g\)?`,

    hints: [
      String.raw`Use vertex form \(f(x)=a(x-3)^2-8\) and the point \((5,0)\) to find \(a\).`,
      String.raw`\(a=2\). Then \(g(x)=2(x+2-3)^2-8-4=2(x-1)^2-12\). Set \(g(x)=0\) and solve for the two intercepts.`
    ],
    solution: String.raw`\(0=a(2)^2-8\Rightarrow a=2\). \(g(x)=2(x-1)^2-12=0\Rightarrow(x-1)^2=6\Rightarrow x=1\pm\sqrt6\). Product \(=(1+\sqrt6)(1-\sqrt6)=1-6=-5\).`

    question: String.raw`\[x^2+y^2-10x+6y+18=0\] The graph of the equation above in the \(xy\)-plane is a circle. The circle intersects the \(x\)-axis at two points. What is the distance between these two points?`,

    question: String.raw`For the linear function \(f\), \(f(3)=7\) and \(f(-1)=-5\). The function \(g\) is defined by \(g(x)=f(2x)+1\). For what value of \(k\) is \(g(k)=k\)?`,

function loadState() {

    return Object.assign(base, s, {

      moduleTimers: Object.assign(base.moduleTimers, s.moduleTimers || {}),
      timeUpShown: Object.assign(base.timeUpShown, s.timeUpShown || {})
    });
  } catch (e) { return freshState(); }
}

function moduleElapsed(m) {
  const t = state.moduleTimers[m];
  return t.elapsed + (t.start ? Date.now() - t.start : 0);
}
function pauseModule(m) {
  const t = state.moduleTimers[m];
  if (t.start) { t.elapsed += Date.now() - t.start; t.start = null; }
}
function startModule(m) {
  const t = state.moduleTimers[m];
  if (!t.start && !isLocked() && state.studentName) t.start = Date.now();
}
function qt(id) {
  if (!state.qTimers[id]) state.qTimers[id] = { acc: 0, start: null };
  return state.qTimers[id];
}
const qElapsed = (id) => { const t = qt(id); return t.acc + (t.start ? Date.now() - t.start : 0); };
function stopQ(id) { const t = qt(id); if (t.start) { t.acc += Date.now() - t.start; t.start = null; } }
function stopAllQ() { Object.keys(state.qTimers).forEach(stopQ); }
function startQ(id) { stopAllQ(); qt(id).start = Date.now(); }
function stopAllTimers() { stopAllQ(); pauseModule(1); pauseModule(2); }

function tick() {
  const m = state.currentModule;
  const remaining = MODULE_TIME_MS - moduleElapsed(m);
  const el = $("moduleTimer");
  el.textContent = state.timerHidden ? "" : (remaining > 0 ? fmt(remaining) : "00:00");
  el.classList.toggle("low", remaining < 5 * 60 * 1000);
  if (remaining <= 0 && !state.timeUpShown[m] && !isLocked()) {
    state.timeUpShown[m] = true; saveState();
    toast("Time is up for Module " + m + ". Your answers are saved — you can still review and submit.", 7000);
  }
  const q = currentQ();
  const clock = $("qClock");
  if (q && clock) clock.textContent = fmt(qElapsed(q.id));
}

function parseNum(str) {
  if (str === undefined || str === null) return NaN;
  const s = String(str).trim();
  if (/^-?(\d+\.?\d*|\.\d+)\/(\d+\.?\d*|\.\d+)$/.test(s)) {
    const [a, b] = s.split("/").map(Number);
    return b === 0 ? NaN : a / b;
  }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
function normalizeSpr(s) {
  let t = String(s).trim().replace(/\s+/g, "");
  if (/^-?0\.\d/.test(t)) t = t.replace("0.", ".");
  return t;
}
function isCorrect(q, ans) {
  if (ans === undefined || ans === null || String(ans).trim() === "") return false;
  if (q.type === "mcq") return ans === q.correctAnswer;
  const n = normalizeSpr(ans);
  if (q.acceptedAnswers.some(a => normalizeSpr(a) === n)) return true;
  const v = parseNum(ans), target = parseNum(q.correctAnswer);
  return !isNaN(v) && !isNaN(target) && Math.abs(v - target) < 1e-9;
}
function statusOf(q) {
  if (!hasAnswer(q)) return "unanswered";
  return isCorrect(q, state.answers[q.id]) ? "correct" : "wrong";
}
function buildStats() {
  const rows = QUESTIONS.map(q => ({
    q, status: statusOf(q), time: qElapsed(q.id), hints: state.hintLevel[q.id] || 0,
    answer: hasAnswer(q) ? String(state.answers[q.id]) : "—"
  }));
  const total = rows.filter(r => r.status === "correct").length;
  const perModule = [1, 2].map(m => {
    const rs = rows.filter(r => r.q.module === m);
    return { m, correct: rs.filter(r => r.status === "correct").length, total: rs.length, time: moduleElapsed(m) };
  });
  const perDomain = DOMAINS.map(d => {
    const rs = rows.filter(r => r.q.domain === d);
    const correct = rs.filter(r => r.status === "correct").length;
    const time = rs.reduce((s, r) => s + r.time, 0);
    return { d, correct, total: rs.length, pct: rs.length ? Math.round(correct / rs.length * 100) : 0, avg: rs.length ? time / rs.length : 0, hints: rs.reduce((s, r) => s + r.hints, 0) };
  });
  const totalTime = rows.reduce((s, r) => s + r.time, 0);
  const hintsUsed = rows.reduce((s, r) => s + r.hints, 0);
  const correctNoHint = rows.filter(r => r.status === "correct" && r.hints === 0).length;
  return { rows, total, perModule, perDomain, totalTime, hintsUsed, correctNoHint, count: rows.length };
}

    <tbody><tr><td>3.5</td><td>3.5 &nbsp; 3.50 &nbsp; 7/2</td><td>31/2 &nbsp; 3 1/2</td></tr>
    <tr><td>2/3</td><td>2/3 &nbsp; .6666 &nbsp; .6667 &nbsp; 0.666 &nbsp; 0.667</td><td>0.66 &nbsp; .66 &nbsp; 0.67 &nbsp; .67</td></tr>
    <tr><td>−1/3</td><td>−1/3 &nbsp; −.3333 &nbsp; −0.333</td><td>−.33 &nbsp; −0.33</td></tr></tbody></table>
  </aside>`;
}

function flagSvg(on) {
  return `<svg class="flag-icon" viewBox="0 0 14 16"><path d="M2 1v14" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 1.5h9l-2.2 3 2.2 3h-9z" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.3"/></svg>`;
}

function renderQuestion() {
  const q = currentQ();
  const area = $("questionArea");
  const locked = isLocked();
  const corrected = state.corrected;
  const ans = state.answers[q.id];
  const elimOn = !!state.eliminatorOn[q.id] && !locked;
  const elim = state.eliminated[q.id] || [];
  const running = !!qt(q.id).start;
  const hintLevel = state.hintLevel[q.id] || 0;
  const hintOpen = !!state.hintOpen[q.id];

  let body = "";
  if (q.type === "mcq") {
    body = `<div class="choices">` + q.choices.map((c, i) => {
      const L = LETTERS[i];
      const isElim = elim.includes(L);
      let cls = "choice";
      let tag = "";
      if (corrected) {
        if (L === q.correctAnswer) { cls += " correct"; tag = `<span class="tag g">Correct answer</span>`; }
        if (ans === L && L !== q.correctAnswer) { cls += " wrong"; tag = `<span class="tag r">Your answer</span>`; }
        if (ans === L && L === q.correctAnswer) tag = `<span class="tag g">Your answer ✓</span>`;
      } else {
        if (ans === L) cls += " selected";
        if (isElim) cls += " eliminated";
      }
      let elimCtl = "";
      if (elimOn) {
        elimCtl = isElim
          ? `<button class="elim-undo" data-undo="${L}" aria-label="Undo eliminate ${L}">Undo</button>`
          : `<button class="elim-btn" data-elim="${L}" aria-label="Eliminate choice ${L}">${L}</button>`;
      }
      return `<div class="choice-row"><button class="${cls}" data-choice="${L}" ${locked || isElim ? "disabled" : ""}>
        <span class="letter">${L}</span><span class="ctext">${c}</span>${tag}</button>${elimCtl}</div>`;
    }).join("") + `</div>`;
  } else {
    const val = ans || "";
    let cls = "spr-input";
    if (corrected && hasAnswer(q)) cls += isCorrect(q, val) ? " correct" : " wrong";
    body = `<input class="${cls}" id="sprInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
              maxlength="${val.startsWith("-") ? 6 : 5}" value="${esc(val)}" ${locked ? "disabled" : ""} aria-label="Your answer">
            <div class="preview" id="sprPreview"></div>`;
  }

  // hints
  let hintHtml = "";
  if (hintOpen) {
    hintHtml = `<div class="hint-box">`;
    if (hintLevel === 0) hintHtml += `<div class="hint" style="color:var(--muted)">Hints are revealed one at a time.</div>`;
    for (let i = 0; i < hintLevel; i++) hintHtml += `<div class="hint"><b>Hint ${i + 1}:</b> ${q.hints[i]}</div>`;
    if (hintLevel < q.hints.length) hintHtml += `<button class="small-btn" id="nextHintBtn">${hintLevel === 0 ? "Reveal Hint 1" : "Reveal Hint 2"}</button>`;
    else hintHtml += `<div style="font-size:13px;color:var(--muted)">All hints revealed.</div>`;
    hintHtml += `</div>`;
  }

  // review (after correction)
  let reviewHtml = "";
  if (corrected) {
    const st = statusOf(q);
    reviewHtml = `<div class="review-box"><span class="status-badge ${st}">${st === "correct" ? "✓ Correct" : st === "wrong" ? "✗ Incorrect" : "Not answered"}</span>`;
    if (q.type === "spr") {
      reviewHtml += `<div>Your answer: ${hasAnswer(q) ? `<span class="${st === "correct" ? "ans-g" : "ans-r"}">${esc(ans)}</span>` : "<i>none</i>"}
        &nbsp;|&nbsp; Accepted answer(s): <span class="ans-g">${esc(q.acceptedAnswers.join(", "))}</span></div>`;
    } else if (st === "unanswered") {
      reviewHtml += `<div>Correct answer: <span class="ans-g">${q.correctAnswer}</span></div>`;
    }
    reviewHtml += `<div style="margin-top:8px"><b>Step-by-step solution:</b> ${q.solution}</div>
      <div style="margin-top:6px;font-size:13px;color:var(--muted)">${esc(q.domain)} · ${esc(q.skill)} · Time: ${fmt(qElapsed(q.id))} · Hints used: ${hintLevel}</div></div>`;
  }

  area.innerHTML = `
    <div class="q-wrap ${q.type === "spr" ? "spr" : ""}">
      ${q.type === "spr" ? sprDirections() : ""}
      <section class="q-main">
        <div class="q-head">
          <span class="q-num">${q.number}</span>
          <button class="flag-btn ${state.marked[q.id] ? "on" : ""}" id="flagBtn">${flagSvg(!!state.marked[q.id])} Mark for Review</button>
          <button class="hint-btn ${hintOpen ? "on" : ""}" id="hintBtn">💡 ${hintOpen ? "Hide Hint" : "Show Hint"}</button>
          <span class="spacer"></span>
          ${q.type === "mcq" && !locked ? `<button class="abc-btn ${elimOn ? "on" : ""}" id="abcBtn" title="Cross out answer choices">ABC</button>` : ""}
        </div>
        <div class="q-text">${q.question}</div>
        ${body}
        <div class="q-tools">
          <button class="timer-btn ${running ? "running" : ""}" id="timerBtn" ${locked ? "disabled" : ""}>
            ${running ? "⏸ Stop Timer" : (qElapsed(q.id) > 0 ? "▶ Resume Timer" : "▶ Start Timer")}</button>
          <span class="q-clock-label">Time on this question:</span>
          <span class="q-clock" id="qClock">${fmt(qElapsed(q.id))}</span>
        </div>
        ${hintHtml}
        ${reviewHtml}
      </section>
    </div>`;

  if (q.type === "spr") updatePreview();
  typeset(area);
  bindQuestionEvents(q);
}

function updatePreview() {
  const inp = $("sprInput"), pv = $("sprPreview");
  if (!inp || !pv) return;
  const v = inp.value.trim();
  if (!v) { pv.innerHTML = ""; return; }
  let tex = v.replace(/-/g, "-");
  const m = v.match(/^(-?)(.+)\/(.+)$/);
  if (m) tex = `${m[1]}\\dfrac{${m[2]}}{${m[3]}}`;
  let html = esc(v);
  if (window.katex) { try { html = katex.renderToString(tex, { throwOnError: false }); } catch (e) {} }
  const valid = !isNaN(parseNum(v));
  pv.innerHTML = `<b>Answer Preview:</b><span class="pv">${html}</span>${valid ? "" : ` <span style="color:var(--red);font-size:13px;margin-left:8px">Not a valid number yet</span>`}`;
}

function renderResults() {
  const box = $("results");
  if (!state.corrected) { box.innerHTML = ""; return; }
  const s = buildStats();
  const pct = Math.round(s.total / s.count * 100);
  const rowsHtml = s.rows.map(r => `<tr class="clickable" data-goto="${r.q.id}">
      <td>M${r.q.module} Q${r.q.number}</td><td>${esc(r.q.domain)}</td><td>${r.q.type.toUpperCase()}</td>
      <td class="res-${r.status}">${statusLabel(r.status)}</td><td>${esc(r.answer)}</td><td>${esc(correctDisplay(r.q))}</td>
      <td>${fmt(r.time)}</td><td>${r.hints}</td></tr>`).join("");
  box.innerHTML = `<div class="results">
    <div class="results-head"><h2>Your Results</h2><span class="big-score">${s.total} / ${s.count}</span>
      <span style="color:var(--muted)">(${pct}%)</span><span class="spacer"></span>
      <button class="small-btn" id="toggleResults">${state.resultsOpen ? "Hide details" : "Show details"}</button></div>
    ${state.resultsOpen ? `
    <div class="stat-grid">
      ${s.perModule.map(pm => `<div class="stat"><div class="k">Module ${pm.m}</div><div class="v">${pm.correct} / ${pm.total}</div><div style="font-size:12px;color:var(--muted)">Module time used: ${fmt(pm.time)}</div></div>`).join("")}
      <div class="stat"><div class="k">Time on questions</div><div class="v">${fmt(s.totalTime)}</div></div>
      <div class="stat"><div class="k">Hints used</div><div class="v">${s.hintsUsed}</div><div style="font-size:12px;color:var(--muted)">Correct without hints: ${s.correctNoHint}</div></div>
    </div>
    <div class="table-scroll"><table class="rtable"><thead><tr><th>Domain</th><th>Correct</th><th>%</th><th>Avg time / question</th><th>Hints</th></tr></thead><tbody>
      ${s.perDomain.map(d => `<tr><td>${esc(d.d)}</td><td>${d.correct} / ${d.total}</td><td>${d.pct}%</td><td>${fmt(d.avg)}</td><td>${d.hints}</td></tr>`).join("")}
    </tbody></table></div>
    <details><summary>Per-question breakdown (click a row to open that question)</summary>
      <div class="table-scroll"><table class="rtable"><thead><tr><th>Q</th><th>Domain</th><th>Type</th><th>Result</th><th>Your answer</th><th>Correct</th><th>Time</th><th>Hints</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div></details>` : ""}
  </div>`;
  const tg = $("toggleResults");
  if (tg) tg.onclick = () => { state.resultsOpen = !state.resultsOpen; saveState(); renderResults(); };
  box.querySelectorAll("[data-goto]").forEach(tr => tr.onclick = () => {
    const q = findQ(tr.dataset.goto); goTo(q.module, q.number - 1);
    $("questionArea").scrollIntoView({ behavior: "smooth" });
  });
}

/* =========================================================
   8. QUESTION EVENTS
   ========================================================= */
function bindQuestionEvents(q) {
  $("flagBtn").onclick = () => { state.marked[q.id] = !state.marked[q.id]; saveState(); renderQuestion(); };
  $("hintBtn").onclick = () => {
    state.hintOpen[q.id] = !state.hintOpen[q.id];
    if (state.hintOpen[q.id] && !state.hintLevel[q.id]) state.hintLevel[q.id] = 1; // first open reveals Hint 1
    saveState(); renderQuestion();
  };
  const nh = $("nextHintBtn");
  if (nh) nh.onclick = () => { state.hintLevel[q.id] = Math.min(2, (state.hintLevel[q.id] || 0) + 1); saveState(); renderQuestion(); };

  const abc = $("abcBtn");
  if (abc) abc.onclick = () => { state.eliminatorOn[q.id] = !state.eliminatorOn[q.id]; saveState(); renderQuestion(); };

  $("timerBtn").onclick = () => {
    if (isLocked()) return;
    if (qt(q.id).start) stopQ(q.id); else startQ(q.id);
    saveState(); renderQuestion();
  };

  document.querySelectorAll("[data-choice]").forEach(btn => btn.onclick = () => {
    if (isLocked()) return;
    const L = btn.dataset.choice;
    if ((state.eliminated[q.id] || []).includes(L)) return;
    state.answers[q.id] = L;
    stopQ(q.id);                 // answering stops the stopwatch
    saveState(); renderQuestion();
  });
  document.querySelectorAll("[data-elim]").forEach(btn => btn.onclick = () => {
    const L = btn.dataset.elim;
    const arr = state.eliminated[q.id] || (state.eliminated[q.id] = []);
    if (!arr.includes(L)) arr.push(L);
    if (state.answers[q.id] === L) delete state.answers[q.id]; // crossing out the selected choice clears it
    saveState(); renderQuestion();
  });
  document.querySelectorAll("[data-undo]").forEach(btn => btn.onclick = () => {
    state.eliminated[q.id] = (state.eliminated[q.id] || []).filter(x => x !== btn.dataset.undo);
    saveState(); renderQuestion();
  });

  const inp = $("sprInput");
  if (inp) {
    inp.oninput = () => {
      let v = inp.value.replace(/[^0-9.\/-]/g, "");
      v = v.replace(/(?!^)-/g, "");                 // minus only at the start
      const parts = v.split("/"); if (parts.length > 2) v = parts[0] + "/" + parts.slice(1).join("");
      const max = v.startsWith("-") ? 6 : 5;
      v = v.slice(0, max);
      inp.maxLength = max;
      if (inp.value !== v) inp.value = v;
      state.answers[q.id] = v;
      if (v.length) stopQ(q.id);                    // typing an answer stops the stopwatch
      saveState(); updatePreview(); refreshTimerUi(q);
    };
  }
}
function refreshTimerUi(q) {
  const b = $("timerBtn"); if (!b) return;
  const running = !!qt(q.id).start;
  b.classList.toggle("running", running);
  b.textContent = running ? "⏸ Stop Timer" : (qElapsed(q.id) > 0 ? "▶ Resume Timer" : "▶ Start Timer");
}

/* =========================================================
   9. NAVIGATION
   ========================================================= */
function goTo(m, idx) {
  const n = byModule(m).length;
  idx = Math.max(0, Math.min(n - 1, idx));
  stopAllQ();                                  // leaving a question pauses its stopwatch
  if (m !== state.currentModule) { pauseModule(state.currentModule); state.currentModule = m; startModule(m); }
  state.currentIndex[m] = idx;
  saveState(); render();
  $("main").scrollTop = 0;
}
function next() {
  const m = state.currentModule, i = state.currentIndex[m], n = byModule(m).length;
  if (i < n - 1) goTo(m, i + 1);
  else if (m === 1) goTo(2, 0);
  else openNavigator();
}
function back() {
  const m = state.currentModule, i = state.currentIndex[m];
  if (i > 0) goTo(m, i - 1);
  else if (m === 2) goTo(1, byModule(1).length - 1);
}

function openModal(html, wide = false, dismissable = true) {

  $("overlay").dataset.dismiss = dismissable ? "1" : "0";
  $("modal").querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  typeset($("modal"));
}
function closeModal() { $("overlay").classList.remove("open"); $("modal").innerHTML = ""; }
const head = (title, closable = true) => `<div class="modal-head"><h3>${title}</h3>${closable ? `<button class="x-btn" data-close aria-label="Close">×</button>` : ""}</div>`;

function openNavigator() {
  const m = state.currentModule;
  const cells = byModule(m).map((q, i) => {
    let cls = "nav-cell";
    if (state.corrected) cls += " " + ({ correct: "c", wrong: "w", unanswered: "u" }[statusOf(q)]);
    else if (hasAnswer(q)) cls += " answered";
    if (state.marked[q.id]) cls += " flagged";
    if (i === state.currentIndex[m]) cls += " current";
    return `<button class="${cls}" data-jump="${i}">${q.number}</button>`;
  }).join("");
  const legend = state.corrected
    ? `<span><i class="lg" style="background:var(--green)"></i>Correct</span><span><i class="lg" style="background:var(--red)"></i>Wrong</span><span><i class="lg" style="background:#fef7e0;border:2px solid var(--amber)"></i>Unanswered</span><span><i class="lg" style="background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)"></i>For Review</span>`
    : `<span><i class="lg" style="outline:2px solid #111"></i>Current</span><span><i class="lg" style="border:2px dashed #555"></i>Unanswered</span><span><i class="lg" style="background:var(--sky-dark)"></i>Answered</span><span><i class="lg" style="background:#b3261e;clip-path:polygon(0 0,100% 30%,0 60%)"></i>For Review</span>`;
  openModal(head("Section 2, Module " + m + ": Math Questions") + `<div class="modal-body">
    <div class="legend">${legend}</div>
    <div class="nav-grid">${cells}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="small-btn" data-mod="1" ${m === 1 ? "disabled" : ""}>Go to Module 1</button>
      <button class="small-btn" data-mod="2" ${m === 2 ? "disabled" : ""}>Go to Module 2</button>
    </div></div>`);
  $("modal").querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { closeModal(); goTo(m, Number(b.dataset.jump)); });
  $("modal").querySelectorAll("[data-mod]").forEach(b => b.onclick = () => { goTo(Number(b.dataset.mod), state.currentIndex[Number(b.dataset.mod)]); openNavigator(); });
}

/* =========================================================
   13. REPORT + EMAILJS
   ========================================================= */
function buildReport() {
  const s = buildStats();
  const date = new Date().toLocaleString();
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const mistakes = s.rows.filter(r => r.status !== "correct");

  let t = "";
  t += "AMRO ACADEMY – SAT MATH PRACTICE REPORT\n";
  t += "========================================\n";
  t += "Student: " + state.studentName + "\n";
  t += "Date: " + date + "\n";
  t += "Total score: " + s.total + "/" + s.count + " (" + pct(s.total, s.count) + "%)\n";
  s.perModule.forEach(pm => { t += "Module " + pm.m + ": " + pm.correct + "/" + pm.total + " (module time used " + fmt(pm.time) + ")\n"; });
  t += "Total time on questions (stopwatch): " + fmt(s.totalTime) + "\n";
  t += "Hints used: " + s.hintsUsed + " | Correct without hints: " + s.correctNoHint + "\n\n";
  t += "SCORE BY DOMAIN\n";
  s.perDomain.forEach(d => { t += "- " + d.d + ": " + d.correct + "/" + d.total + " (" + d.pct + "%) | avg time " + fmt(d.avg) + " | hints " + d.hints + "\n"; });
  t += "\nMISTAKES & UNANSWERED (" + mistakes.length + ")\n";
  if (!mistakes.length) t += "None — perfect score!\n";
  mistakes.forEach(r => {
    t += "- Module " + r.q.module + " Q" + r.q.number + " | " + r.q.domain + " – " + r.q.skill +
      " | Student: " + (r.status === "unanswered" ? "(no answer)" : r.answer) + " | Correct: " + correctDisplay(r.q) +
      " | Time: " + fmt(r.time) + " | Hints: " + r.hints + "\n";
  });
  t += "\nPER-QUESTION TABLE\n";
  s.rows.forEach(r => {
    t += "M" + r.q.module + " Q" + r.q.number + " | " + r.q.domain + " | " + r.q.type.toUpperCase() + " | " +
      statusLabel(r.status) + " | " + fmt(r.time) + " | Hints: " + r.hints + "\n";
  });

  const th = 'style="border:1px solid #cfd8de;padding:6px 8px;background:#e8f6fc;text-align:left"';
  const td = 'style="border:1px solid #cfd8de;padding:6px 8px"';
  const color = { correct: "#1e8e3e", wrong: "#c5221f", unanswered: "#b06000" };
  const tbl = (heads, rows) => `<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px;margin:8px 0 18px">
    <tr>${heads.map(h => `<th ${th}>${h}</th>`).join("")}</tr>${rows.join("")}</table>`;
  let h = `<div style="font-family:Arial,sans-serif;color:#1b1b1b">
    <h2 style="color:#1d6a96;margin:0 0 6px">Amro Academy – SAT Math Practice Report</h2>
    <p style="margin:0 0 12px"><b>Student:</b> ${esc(state.studentName)}<br><b>Date:</b> ${esc(date)}<br>
    <b>Total score:</b> ${s.total}/${s.count} (${pct(s.total, s.count)}%)<br>
    ${s.perModule.map(pm => `<b>Module ${pm.m}:</b> ${pm.correct}/${pm.total} (module time used ${fmt(pm.time)})`).join("<br>")}<br>
    <b>Total time on questions:</b> ${fmt(s.totalTime)}<br><b>Hints used:</b> ${s.hintsUsed} &nbsp;|&nbsp; <b>Correct without hints:</b> ${s.correctNoHint}</p>`;
  h += `<h3 style="color:#1d6a96">Score by domain</h3>` + tbl(["Domain", "Correct", "%", "Avg time/question", "Hints"],
    s.perDomain.map(d => `<tr><td ${td}>${d.d}</td><td ${td}>${d.correct}/${d.total}</td><td ${td}>${d.pct}%</td><td ${td}>${fmt(d.avg)}</td><td ${td}>${d.hints}</td></tr>`));
  h += `<h3 style="color:#1d6a96">Mistakes &amp; unanswered (${mistakes.length})</h3>` + (mistakes.length ? tbl(["Module", "Q", "Domain", "Skill", "Student answer", "Correct", "Time", "Hints"],
    mistakes.map(r => `<tr><td ${td}>${r.q.module}</td><td ${td}>${r.q.number}</td><td ${td}>${r.q.domain}</td><td ${td}>${esc(r.q.skill)}</td>
      <td style="border:1px solid #cfd8de;padding:6px 8px;color:${color[r.status]};font-weight:bold">${r.status === "unanswered" ? "(no answer)" : esc(r.answer)}</td>
      <td ${td}>${esc(correctDisplay(r.q))}</td><td ${td}>${fmt(r.time)}</td><td ${td}>${r.hints}</td></tr>`)) : "<p>None — perfect score!</p>");
  h += `<h3 style="color:#1d6a96">Per-question table</h3>` + tbl(["Q", "Domain", "Type", "Result", "Time", "Hints"],
    s.rows.map(r => `<tr><td ${td}>M${r.q.module} Q${r.q.number}</td><td ${td}>${r.q.domain}</td><td ${td}>${r.q.type.toUpperCase()}</td>
      <td style="border:1px solid #cfd8de;padding:6px 8px;color:${color[r.status]};font-weight:bold">${statusLabel(r.status)}</td><td ${td}>${fmt(r.time)}</td><td ${td}>${r.hints}</td></tr>`));
  h += `</div>`;
  return { text: t, html: h, stats: s, date };
}

function openSubmitReview() {
  if (state.emailSent) { toast("This exam has already been submitted."); return; }
  const un = QUESTIONS.filter(q => !hasAnswer(q));
  const mk = QUESTIONS.filter(q => state.marked[q.id]);
  const chips = (list) => list.length
    ? `<div class="list-q">${list.map(q => `<button class="chip" data-go="${q.id}">M${q.module} Q${q.number}</button>`).join("")}</div>`
    : `<p style="color:var(--green);font-weight:600">None</p>`;
  openModal(head("Check Your Work") + `<div class="modal-body">
    <p>Once you submit, your answers are locked and a report is sent to your teacher.</p>
    <b>Unanswered questions (${un.length})</b>${chips(un)}
    <b>Marked for review (${mk.length})</b>${chips(mk)}
    <div id="sendStatus"></div></div>
    <div class="modal-foot"><button class="tool-btn" data-close>Back to exam</button>
    <button class="tool-btn primary" id="confirmSubmit">Confirm Submit</button></div>`);
  $("modal").querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const q = findQ(b.dataset.go); closeModal(); goTo(q.module, q.number - 1); });
  $("confirmSubmit").onclick = sendReport;
}

async function sendReport() {
  if (sending || state.emailSent) return;            // prevent double sending
  const btn = $("confirmSubmit"), status = $("sendStatus");
  sending = true;
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  if (status) status.innerHTML = `<div class="msg info">Sending your report…</div>`;

  stopAllTimers();
  state.submitted = true; state.submittedAt = state.submittedAt || new Date().toISOString();
  saveState(); render();

  const rep = buildReport();
  const params = {
    to_email: RECIPIENT_EMAIL,
    student_name: state.studentName,
    submit_date: rep.date,
    score: rep.stats.total + "/" + rep.stats.count,
    total_time: fmt(rep.stats.totalTime),
    report: rep.text,
    report_html: rep.html
  };
  try {
    if (!window.emailjs) throw new Error("EmailJS could not be loaded. Check your internet connection.");
    await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params);
    state.emailSent = true; saveState(); render();
    if (status) status.innerHTML = `<div class="msg ok">✓ Your exam was submitted and the report was sent successfully.</div>`;
    if (btn) { btn.textContent = "Submitted ✓"; }
    const foot = $("modal").querySelector(".modal-foot");
    if (foot) foot.innerHTML = `<button class="tool-btn primary" data-close>Close</button>`, foot.querySelector("[data-close]").onclick = closeModal;
  } catch (err) {
    const reason = (err && (err.text || err.message)) || "Unknown error";
    if (status) status.innerHTML = `<div class="msg err">✗ The report could not be sent: ${esc(reason)}. Your answers are saved.
      <div style="margin-top:8px"><button class="small-btn" id="retryBtn">Retry</button></div></div>`;
    if (btn) { btn.disabled = false; btn.textContent = "Confirm Submit"; }
    const r = $("retryBtn"); if (r) r.onclick = sendReport;
  } finally {
    sending = false;
  }
}

/* =========================================================
   14. INIT
   ========================================================= */
function init() {
  try { if (window.emailjs) emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey }); } catch (e) {}

  document.querySelectorAll(".module-tabs .tab").forEach(b => b.onclick = () => { const m = Number(b.dataset.module); goTo(m, state.currentIndex[m]); });
  $("hideTimerBtn").onclick = () => { state.timerHidden = !state.timerHidden; saveState(); renderTop(); tick(); };
  $("refBtn").onclick = openReference;
  $("directionsBtn").onclick = openDirections;
  $("navBtn").onclick = openNavigator;
  $("nextBtn").onclick = next;
  $("backBtn").onclick = back;
  $("resetBtn").onclick = resetExam;
  $("correctBtn").onclick = correctExam;
  $("submitBtn").onclick = openSubmitReview;
  $("overlay").onclick = (e) => { if (e.target.id === "overlay" && $("overlay").dataset.dismiss === "1") closeModal(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("overlay").dataset.dismiss === "1") closeModal(); });

  // Persist running timers when leaving (timestamps already make them refresh-safe)
  window.addEventListener("beforeunload", saveState);

  if (state.studentName) startModule(state.currentModule);
  saveState();
  render();
  if (!state.studentName) openNameModal();
  setInterval(tick, 250);
}

// KaTeX scripts are deferred; wait for them so math renders on first paint.
if (document.readyState === "complete") init();
else window.addEventListener("load", init);
</script>
